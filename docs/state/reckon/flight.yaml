# Flight control — reckon project layer.
#
# Merges over the host layer; only the keys named here change. This layer
# adds the small-model lane backend. It is defined, not defaulted:
# default_backend is untouched and no role selects it, so nothing routes
# here except an explicit per-dispatch override, e.g.
#
#     reckon crew dispatch ... --set roles.implement.backend=codex-spark
#
# Eligibility for that override is gated — the lane takes only exactly
# specified nodes with a runnable named check. The gate and the routing
# policy live in the crew-effort-routing plan and in
# skills/reckon-ship/references/effort-routing.md.
#
# yaml-language-server: $schema=http://127.0.0.1:8765/_shared/flight.schema.json

version: 1

backends:
  codex-spark:
    launch: cli
    command: codex
    model: gpt-5.3-codex-spark
    sandbox: worktree-full
    session_reuse: true
    time_budget: 15m

  # clive: wraps `claude` with env vars pointing at the local H200 GPU server
  # serving deepseek-v4-flash. Registered as a dialect alias for _ClaudeDialect
  # in reckon/_backends.py — the flags and event stream are identical since
  # clive passes all args through via `exec claude "${ARGS[@]}"`.
  #
  # Route to this backend with --set default_backend=clive (or at the role
  # level: --set roles.<role>.backend=clive). The clive wrapper resolves auth
  # from /work/projects/imas_gpu/agents/.env and sets ANTHROPIC_BASE_URL,
  # ANTHROPIC_AUTH_TOKEN, and all ANTHROPIC_DEFAULT_*_MODEL vars internally.
  clive:
    launch: cli
    command: clive
    model: deepseek-v4-flash
    sandbox: worktree-full
    session_reuse: true
    time_budget: 25m

# One dial per dispatch: the declared --spec-level resolves routing here.
# The level overlay wins over the role overlay, so exact nodes get the spark
# backend's longer budget rather than the implement role's short one. A --set
# override still rewrites any of this per dispatch. Eligibility for the exact
# lane stays gated (size, runnable check, pilot audit) — see
# skills/reckon-ship/references/effort-routing.md.
roles:
  implement:
    by_spec_level:
      # effort is pinned here because layers deep-merge per key: the host
      # layer's exact overlay carries effort=medium for projects routing exact
      # to the default backend, and without this pin that value would merge in
      # and change the pilot lane's configuration mid-audit. xhigh is what the
      # audited pilot runs actually executed at — with no flag the codex CLI
      # inherits the user's interactive model_reasoning_effort (xhigh on this
      # host, proven from the rollout turn_context), so the pin converts an
      # accidental inheritance into declared config without forking the slice.
      exact:
        backend: codex-spark
        time_budget: 15m
        effort: xhigh
      guided:
        effort: medium
      open:
        effort: high
