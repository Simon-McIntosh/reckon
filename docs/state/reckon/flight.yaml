# Flight control — reckon project layer.
#
# Merges over the host layer; only the keys named here change. The small-model
# lane keeps its models declared in the host's lanes block, so shadow
# qualification remains possible, but no default, role or specification-level
# mapping routes work to it. The lane earns routing back only after at least
# ten usable shadow pairs
# show a gain on the same nodes, followed by a gated pilot and a slice lock.
# The qualification policy lives in
# skills/reckon-ship/references/effort-routing.md.
#
# yaml-language-server: $schema=http://127.0.0.1:8765/_shared/flight.schema.json

version: 1

# Default routing goes to the local lane, set 2026-09-09 by the lead.
#
# The metered account read 85% of its weekly window with a 3.95x burn multiple
# and a projected exhaustion of 2026-09-11T00:00Z against a reset of
# 2026-09-15T02:28Z - dry for roughly four days. The local lane is unmetered
# hardware, so routing there costs nothing but wall clock.
#
# It is a default, not a fence: a node that needs the metered lane still names
# it with --backend, and that choice lands on the run record where a reader can
# see it. Effort is deliberately NOT pinned down here - the measured argument
# for high is the competence horizon (local 40h at high against 16h at medium,
# n=125 and n=37), which is capability. The speed column favours medium and is
# estimated-over-actual, so it measures less deliberation per run rather than
# more throughput; read the horizon, not the speed.

# No dispatch resumes an earlier worker's session, set 2026-09-23 by the lead.
#
# A member's session is keyed by agent configuration, so with reuse on every
# dispatch to that member resumed the previous node's conversation. Measured the
# same day across 5,440 runs: 312 of 2,089 local runs resumed one, inheriting a
# median 81,957 tokens (max 494,189) on top of a ~60k fresh overhead, and 1,315
# of 3,105 codex runs resumed one. A reflex review resumed a session that had
# just died looping in compaction. New work gets a new session; continuing the
# SAME run (crew resume) does not read this key and is unaffected.

# Session reuse is set once on each lane, never on a per-model name: the lane's
# session_reuse rides onto every entry a lane expansion builds, so a combined
# <lane>-<model> name would restate it without changing the resolved value.
backends:
  claude:
    session_reuse: false
  clive:
    session_reuse: false
    lane_document: ~/public/imas-ambix/lane.json
    # Measured 2026-10-21 on the local lane itself, by the two probe runs
    # r-20261021T005536425849-clive-opens-probe-image-1 and
    # r-20261021T005833774995-clive-opens-probe-image-2 as read by
    # r-20261021T010543780105-clive-image-probe-is-matched: a worker opening a
    # figure PNG with its Read tool stated every counted claim the figure draws
    # (13 of 13), and a blank image of the same size drew the answer that it
    # showed nothing, so the delivery is the pixels rather than the filename.
    # The lane held one model when this was declared; a model added to it later
    # needs its own measurement.
    input_modalities: [text, image]
  codex:
    session_reuse: false
    # Measured 2026-10-16 by run
    # r-20261016T125551870973-a-codex-lane-describes-an-attached-figure on model
    # gpt-6-sol: shown a figure whose content it had not been told, it named the
    # titles, labels and every bar value correctly, so the lane declares image
    # input. The lane held one model when this was declared; a model added to it
    # later needs its own measurement.
    input_modalities: [text, image]

# Reviews never route to a metered lane, set 2026-09-23 by the lead. That
# lane runs this workstation's orchestrators; the review reflex fell back to it
# alphabetically four times in one sprint when the local lane dropped a review.
review_excluded_backends:
  # A lane name excludes every model of that lane, so one entry per lane stands
  # in for the per-model names that used to be listed beside it.
  - claude
  # codex is not excluded here: a review of work built on codex may follow it
  # onto codex, because those reviews catch defects the work itself missed and
  # a stronger reviewer finds them sooner. The host layer still excludes codex
  # for projects that do not opt in.
  # An in-harness backend runs only when a coordinator attaches it, so a review
  # the reflex routes there is recorded as dispatched and never executes.
  - native

default_backend: clive

# The project's own suite: run once at the merged head with the root
# environment's interpreter, eight workers, no cache, quiet, over tests/.
# Twenty minutes is the whole-run ceiling; the wave close is what runs it. The
# browser population is deselected by the `not browser` marker: it runs
# headless, takes far longer than the rest of the suite, and runs as its own
# population so its time and its failure ids stay separable from the standing
# suite's.
review:
  suite:
    command:
      - .venv/bin/python
      - -m
      - pytest
      - -n
      - "8"
      - -p
      - no:cacheprovider
      - -q
      - -m
      - not browser
      - tests/
    budget: 20m
