# Flight control — reckon project layer.
#
# Merges over the host layer; only the keys named here change. This layer
# keeps the small-model backend defined so shadow qualification remains
# possible, but no default, role or specification-level mapping routes work to
# it. The lane earns routing back only after at least ten usable shadow pairs
# show a gain on the same nodes, followed by a gated pilot and a slice lock.
# The qualification policy lives in
# skills/reckon-ship/references/effort-routing.md.
#
# yaml-language-server: $schema=http://127.0.0.1:8765/_shared/flight.schema.json

version: 1

backends:
  codex-spark:
    launch: cli
    command: codex
    model: gpt-5.3-codex-spark
    sandbox: worktree-full
    session_reuse: true
    time_budget: 15m
