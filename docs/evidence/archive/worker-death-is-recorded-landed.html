<main class="plan-doc">
  <header class="plan-header">
    <h1>A worker's death is recorded — landed evidence</h1>
    <p class="plan-summary">The launcher preserves how the process ended, every read
    re-derives whether that process is still the same live process, and the classifier
    now turns those facts into an interrupted run with an explicit recovery route.</p>
  </header>

  <section id="overview">
    <h2>Record scope</h2>
    <p>This node lands the second executable step of §5 alone: a pointer whose recorded
    pid has no process, or whose recorded start tick no longer matches the running
    process, is reported as not running rather than taken at face value. The
    <code>interrupted</code> phase that consumes this fact is §5.3 and a different
    node; the wait-status record is §5.1; the session-id gap is §5.4. Nothing here is an
    end-to-end proof that a killed worker reports <code>interrupted</code> — that is
    §5.6.</p>
  </section>

  <section id="s5-2-mechanism">
    <h2>&sect;5.2 &mdash; the read re-derives liveness, and the reuse check moves into the accessor</h2>
    <p>The measured gap was a duplicate: the start-time comparison that stops a reused
    pid reading as a survivor was written by hand at <code>list_live</code>, at
    <code>producer_live</code>, at <code>follower_state</code> and at
    <code>watch_state</code>, and absent everywhere else that decides liveness from a
    record. A pointer read through <code>drain</code>, <code>claims</code>,
    <code>node</code>, <code>directory</code>, <code>routing</code> or
    <code>promotion</code> re-derived only the bare pid answer, so a recycled pid read
    as a live worker on those paths. Moving the comparison into
    <code>record_process_alive</code> — the one accessor every path already goes
    through — makes the re-derivation unconditional and deletes the four hand-written
    copies.</p>
    <p><strong>The read path, after.</strong> The decision is:</p>
    <figure>
      <img src="/reckon/figures/worker-death-is-recorded/liveness-read-path.svg"
           alt="Flow: a record is read; if it names no process the answer is None; otherwise the caller's probe answers; if that probe is the module's own process table and the record carries a start tick and the process is running: keep the probe's answer only when the running start tick equals the recorded one, otherwise not running. A placed run is answered by its scheduler job first.">
      <figcaption>The accessor's decision. The reuse check is taken only when the
      module's own <code>process_alive</code> answered, so a caller that substitutes its
      own probe owns the whole read.</figcaption>
    </figure>
    <p><strong>Why the check is not taken on a substituted probe.</strong> The reuse
    check reads the process table, and a caller that hands in its own probe has already
    answered the liveness question with something that is not the process table.
    Substituting a probe and then consulting <code>/proc</code> behind it would answer
    liveness from two different instruments and can contradict the caller. The callers
    that pass this module's own <code>process_alive</code> through — dispatch,
    promotion, resumption — still get the check on every read, and the default path
    (<code>alive=None</code>) resolves to that same function. Measured: a fixture that
    fabricated liveness for a placeholder pid found the host had since handed
    <code>4242</code> to an unrelated process, and the check correctly read the record
    as not the registered one; the substitution rule is what keeps the fabricated probe
    authoritative.</p>
    <p><strong>One caller deliberately opts out.</strong> The seat guard asks whether
    the process <em>is running</em>, not whether it is the registered one — a
    <code>watcher_live</code> reading must not go false because the record's identity
    was damaged — so <code>_record_producer_running</code> and
    <code>_record_producer_dead</code> pass <code>match_start_time=False</code> rather
    than depending on the check being absent. That preserves the measured behaviour
    where a running producer with a rewritten start tick still reads live — which the
    seat-guard case asserts.</p>
  </section>

    <section id="s5-1">
      <h2>&sect;5.1 &mdash; The launcher keeps the wait status it already holds</h2>
      <p>Plan &sect;5.1. The reaper was the only place that ever observed a worker's end:
      it held <code>os.waitstatus_to_exitcode(status)</code> at the moment the child was
      reaped and threw it away whenever the stream was non-empty, so a worker ended by a
      signal kept its <code>working</code> phase and carried nothing about its process
      having gone. That is the whole of this node: the status is now kept.</p>

      <img src="/reckon/figures/worker-death-is-recorded/reap-wait-status.svg"
           alt="The reaper branches on whether the stream is empty: an empty stream records a launch failure and sets the phase; an unplaced run with a non-empty stream records the wait status and leaves the phase alone; a placed launch whose payload ran records nothing."
           style="max-width:100%">

      <table>
        <thead><tr><th>How the wait ended</th><th>Recorded on the run</th><th>Why</th></tr></thead>
        <tbody>
          <tr><td>process exited, code N</td><td><code>exit_code: N</code></td>
              <td>it chose to end</td></tr>
          <tr><td>process signalled, signal S</td>
              <td><code>signal: S</code>, <code>signal_name: SIGTERM</code></td>
              <td>it ended by nothing it chose, and the two cases want different responses</td></tr>
        </tbody>
      </table>
      <p>A signalled process chose nothing, so it records no exit code; a signal number
      outside the named set is still recorded by number, so an unfamiliar kill is legible
      rather than dropped. The record lives in the pointer's <code>wait_status</code> and
      in the same three fields on a run's launch-failure entry.</p>

      <h3>What was measured</h3>
      <p>Two cases in <code>tests/test_crew_launch_failure.py</code>, each spawning a stub
      backend through the real spawn and reaped on a real tick, each reading the run record
      rather than a log:</p>
      <ul>
        <li>a stub that writes one turn and then <code>kill -TERM $$</code> records
        <code>signal: 15</code> and <code>signal_name: SIGTERM</code>, with
        <code>exit_code</code> absent, its phase left <code>working</code> and no
        launch-failure entry;</li>
        <li>a stub that writes one turn and then <code>exit 3</code> records
        <code>exit_code: 3</code> with no signal.</li>
      </ul>
      <p>Both streams are non-empty, which is the case the launcher was discarding, so the
      record can only have come from the wait. The existing empty-stream cases are
      unchanged, and the focused gate runs 7 passed at <code>b0c8ff90</code>.</p>
      <p>The declared negative control restores the branch that discards the wait status
      when the stream is non-empty; the signal case is then observed to fail, and that log
      is <code>negative-control-discard-wait-status.log</code> in the node's run directory.
      Gate log: <code>gate-wait-status-focused.log</code>, same directory.</p>

      <h3>Corrected inside the node</h3>
      <p>The first cut recorded the wait status for a placed launch too. A scheduler
      client's wait status is the client's rather than the worker's, and a placed run whose
      payload log shows a turn ran must gain no record at all —
      <code>tests/test_crew_placed_liveness.py::test_the_payload_log_decides_that_the_work_ran</code>
      caught it, failing on a record it was
      never meant to see. The placement case now returns before any pointer write, and
      that file and this node's gate are green together (25 passed).</p>

      <h3>Boundary</h3>
      <p>A run already in a terminal phase is left untouched: the existing guard that never
      relabels a finished run is unchanged, so a straggler reap arriving after a promotion
      adds nothing. Classifying an interrupted run, and the phase that names it, are
      &sect;5.3 — a different node.</p>
    </section>

    <section id="s5-3">
      <h2>&sect;5.3 &mdash; An involuntary end is classified as interrupted</h2>
      <p>The pre-repair reproduction was direct: a pointer carried a dead pid and a
      launcher wait status naming <code>SIGTERM</code>, yet
      <code>classify_pointer</code> returned <code>abandoned</code>. The same reader
      called a working pointer with one committed change beyond its dispatch base
      <code>running</code>, even though its process was positively dead. Both readings
      hid the recovery decision.</p>

      <figure>
        <img src="/reckon/figures/worker-death-is-recorded/interrupted-classification.svg"
             alt="Classification flow. Completed, promoted, and deliberately stopped runs keep their state. A recorded signal, an orphaned dead process, or a dead process with retained commits becomes interrupted. A surviving session routes to resume; otherwise unfinished work routes to redispatch. A live matching process remains working.">
        <figcaption>The precedence is conservative: delivered and deliberate outcomes
        win first; positive interruption evidence wins next; a live pid with its matching
        start time remains working.</figcaption>
      </figure>

      <p><code>interrupted</code> is now a terminal run phase, so it releases a roster
      member rather than occupying a live seat. The classifier returns a structured
      <code>interruption</code> block containing the signal number and name where the
      launcher recorded one. On the live CLI path, a dead process with no terminal event
      is folded to <code>orphaned</code> by <code>dispatch.observe</code> before this
      classifier runs, and that phase becomes <code>interrupted</code>. Therefore
      <code>abandoned</code> is no longer reachable through the live observation path;
      it remains only as a compatibility reading for records that bypass that fold.</p>

      <p>Recovery is derived from durable session evidence. A pointer, stream, or ledger
      session id yields <code>recovery: resume</code> and the executable
      <code>reckon crew resume</code> action. If all three sources have no session id,
      the classifier yields <code>recovery: redispatch</code> and first names inspection
      of the retained worktree.</p>

      <h3>Measured controls</h3>
      <ul>
        <li>The repaired node gate ran on <code>all_debug</code> at
        <code>b16fa8e1</code>: <strong>53 passed, exit 0</strong>. It includes one fixture
        for each inventory shape — working with retained commits, orphaned, and stopped —
        plus the recorded-SIGTERM case, completed/promoted controls, and a genuinely live
        pid whose start time matches. It also asserts that <code>recover()</code> counts
        an interrupted row and exercises the live CLI fold from a dead unterminated
        process through <code>orphaned</code> to <code>interrupted</code>.</li>
        <li>The declared negative control removed only the interrupted arm from
        <code>classify_pointer</code>. The SIGTERM test then failed because the run read
        <code>abandoned</code> instead of <code>interrupted</code>
        (<strong>1 failed, 9 deselected</strong>).</li>
        <li>An independent review scored the first landing <strong>74</strong>. It found
        that the live fold makes abandoned unreachable, that interrupted was absent from
        the recovery tally, and that no test crossed the real fold boundary. The tally and
        both regressions are now repaired in <code>badc8f46</code> and
        <code>b16fa8e1</code>. A separate scoped node owns the two corresponding
        <code>tests/test_ledger.py</code> expectation changes.</li>
      </ul>
      <p>Implementation: <code>45eabfb6</code> (fixture census),
      <code>f84945eb</code> (classification and recovery), <code>badc8f46</code>
      (live-path and count regressions), and <code>b16fa8e1</code> (recovery tally).
      Original landing logs:
      <code>docs/figures/worker-death-is-recorded/interrupted-reproduction.log</code>,
      <code>interrupted-gate.log</code>, and
      <code>negative-control-interrupted.log</code>.</p>
    </section>

    <section id="s5-4">
      <h2>&sect;5.4 landed &mdash; a run records its session id or names its absence</h2>
      <p>The capture path now writes either the run's session id or a
      <code>session_id_absent</code> entry naming the point the capture reached.
      Observation records one of three points &mdash; a stream read and found without an
      id (<code>stream-without-id</code>), a recorded stream path that is not a readable
      file (<code>stream-unreadable</code>), or an in-harness launch that writes no stream
      (<code>harness-launch</code>). Dispatch records its own pending absence with the
      reuse point that produced it, so a newly created run is never a silent null either.
      A run that resolves a session records the id and drops any earlier absence.</p>
      <p>The gap is measured against real crew state by
      <code>docs/research/data/session-id-capture.json</code>
      (generator <code>session_id_capture_census.py</code>): of 50 live pointers in the
      seven-day window, <strong>44 carried no recorded session id</strong> and
      <strong>43 of those had one already present in the run's own stream</strong> &mdash;
      the pointer simply predated any observation. One was a cli run whose stream was
      read and carried none. The capture path is shown at
      <a href="/reckon/figures/worker-death-is-recorded/session-id-capture.svg">the
      capture-path figure</a>.</p>
      <p>Gate: <code>docs/figures/worker-death-is-recorded/session-id-capture.json</code>
      aside, the focused gate
      <code>docs/figures/worker-death-is-recorded/session-id-gate.log</code> reports
      <strong>6 failed, 13 passed</strong>; base comparator
      <code>session-id-base-gate.log</code> reports the <em>same</em> six failures at

    </section>

    <section id="s5-5-roadmap">
      <h2>&sect;5.5 &mdash; the roadmap names interrupted runs</h2>
      <p>Until this step every live pointer counted as work in progress, so a worker
      ended by a signal still read as in flight and the <code>interrupted</code> phase
      the classifier produces had no reader on the planning surfaces. The repair splits
      one fleet read into two lists: <code>in_flight_by_plan</code> groups the runs
      still in flight, and <code>interrupted_by_plan</code> groups the runs that
      stopped, each with its reason and its next action. Both lists come from a single
      partition, so the plan read, the roadmap and the sprint view cannot disagree
      about which runs have stopped.</p>

      <h3>Mechanism</h3>
      <p>Symbols below are named by what they do; commit
      <code>d4085104</code> carries them.</p>
      <ul>
        <li>A pointer is judged by <code>classify_pointer</code> &mdash; the same
        judgement <code>recover</code> acts on &mdash; so the views reuse one reading of
        what stopped rather than inventing a second. The pointer, the classifier and the
        two lists are shown in
        <a href="/reckon/figures/worker-death-is-recorded/interrupted-run-readers.svg">the
        reader-side figure</a>.</li>
        <li><code>partition_live_runs</code> reads the fleet once and returns the two
        lists keyed by plan; <code>in_flight_by_plan</code> and
        <code>interrupted_by_plan</code> are thin wrappers. A run whose liveness cannot
        be proven stays in flight, so an unproved death is never reported as an
        interrupted run.</li>
        <li><code>build_roadmap</code> calls the partition once and puts both lists on
        the pending row and on the sprint row, aggregating a sprint's runs from its
        member slugs.</li>
        <li><code>sprint_state_view</code> carries <code>in_flight</code> and
        <code>interrupted</code> on every sprint row, so a sprint with no interrupted
        runs reports an empty list rather than omitting the key.</li>
      </ul>

      <h3>Measured controls</h3>
      <ul>
        <li>Gate <code>docs/figures/worker-death-is-recorded/roadmap-gate.log</code>:
        <code>tests/test_roadmap_names_interrupted_runs.py</code> at commit
        <code>d4085104</code> &mdash; <strong>8 passed</strong>, exit 0. The gate builds
        a sprint whose plan has one running pointer and one pointer the classifier reads
        interrupted, and asserts both views count only the <em>running</em> pointer as
        in flight and list the interrupted one separately with its reason and next
        action.</li>
        <li>Declared negative control
        <code>docs/figures/worker-death-is-recorded/negative-control-roadmap.log</code>:
        counting interrupted pointers as in flight in <code>in_flight_by_plan</code>
        &mdash; <strong>4 failed, 4 passed</strong>. The four failures are exactly the
        four tests that assert the separation; the log's first line repeats the mutation
        verbatim.</li>
      </ul>

      <h3>Boundary</h3>
      <p>This gate measures only this node's change. A sprint with no live pointers
      reports both keys as empty lists, and a pointer from another project never carries
      an interrupted run into this project's rows. Failures outside the declared scope
      are reported under <code>follow_ons</code>, not triaged here.</p>
    </section>

    <section id="s5-newest-stream">
      <h2>&sect;5 &mdash; one newest-stream reader</h2>
      <p>A run that resumes or changes lane writes its output to a new file beside the
      <code>stream.jsonl</code> the pointer first named: <code>resume-N.jsonl</code> for
      each resumed turn, <code>lane-change-N.jsonl</code> for each lane change. Two
      readers asked the same question of the run's output and each answered it from the
      first file it knew by name: the stall classifier aged the run against
      <code>stream.jsonl</code>, so a healthy resumed run looked quiet since it started,
      and the session lookup read <code>record["log_path"]</code>, so a session id written
      to a later file was not found. The question is now answered in one place.
      <code>recovery.newest_stream(run_dir)</code> returns
      the newest non-empty stream across <code>stream.jsonl</code>,
      <code>resume-*.jsonl</code> and <code>lane-change-*.jsonl</code>, and its ordered
      sibling <code>recovery.stream_paths_newest_first</code> returns the same files
      newest-first. An empty file is not activity, so the reader skips it and falls back
      to the next-newest stream &mdash; the case a resumed turn produces in the interval
      before its first event lands. The pointer's own log path joins the candidates, so a
      record whose stream sits outside its run directory is still read. The relationship
      is drawn at
      <a href="/reckon/figures/worker-death-is-recorded/newest-stream-reader.svg">the
      newest-stream-reader figure</a>.</p>
      <p>The stall classifier (<code>_watch_snapshot</code>, and the compatibility
      follower's stall check) measures quiet time through
      <code>_run_stream_quiet_seconds</code>, and the <code>log_age_seconds</code> on the
      classified row is taken from the same stream. The session lookup
      (<code>resumption._stream_session</code>) reads the ordered streams newest-first
      and returns the first that carries an id, falling back to an earlier stream rather
      than answering an absence a newer, empty stream cannot support.</p>

      <h3>Measured controls</h3>
      <ul>
        <li>Gate <code>docs/figures/worker-death-is-recorded/newest-stream-gate-after.log</code>:
        <code>tests/test_newest_stream_is_read_everywhere.py</code> and eight focused
        recovery/resumption files &mdash; <strong>6 failed, 107 passed</strong>. The eight
        new tests pass; the six failures are present at the base revision.</li>
        <li>Base comparator
        <code>docs/figures/worker-death-is-recorded/newest-stream-gate-base.log</code> at
        <code>2721bdba</code>: the same nine files &mdash; <strong>6 failed,
        99 passed</strong>. The six failure ids are identical, so this node adds no
        failure; the 8-test difference is the new file.</li>
        <li>Declared negative control
        <code>docs/figures/worker-death-is-recorded/negative-control-newest-stream.log</code>,
        whose first line repeats the mutation verbatim: restricting the reader to
        <code>stream.jsonl</code> turns <strong>6 failed, 2 passed</strong> &mdash; the six
        tests that exercise the reader, including the stale-first-stream case.</li>
        <li>Reader inventory
        <code>docs/figures/worker-death-is-recorded/newest-stream-grep.log</code>:
        <code>stream.jsonl</code> appears in neither module except the reader's own

      <h3>Boundary</h3>
      <p>This gate measures only this node's change. The remaining
      <code>log_path</code> reads in the two modules answer from a stream's
      <em>content</em> &mdash; a provider refusal, a spend block, a retry loop, a
      background-wait message &mdash; not from its age, and read the stream the event
      was written to; they are out of this node's declared scope. The six pre-existing
      failures are environmental (a pytest temporary repository is not a git worktree,
      so promotion refuses) and are reported under <code>follow_ons</code>.</p>
    </section>

    <section id="s5-1-exit-record">
      <h2>&sect;5.1 &mdash; recovery reads the record of the end, not the absence of a process</h2>
      <p>Recovery classifies a finished worker from the account its supervisor wrote
      beside it. <code>recovery._run_exit_record</code> reads
      <code>exit.json</code> in the run directory the pointer names, refusing a record
      written for another run, an unreadable one and a missing one alike; where it reads
      one, the classification takes the end from it. A recorded signal names an
      <code>interrupted</code> run and the signal that ended it. An exit code with
      stream records behind it is an <code>abandoned</code> run, its detail carrying the
      code and the moment recorded. A record whose
      <code>stream_records_seen</code> is 0 is the <code>launch-failed</code> path, read
      from the count rather than from a phase that may never have been written. The
      dead-pid inferences survive only where no record exists, and a process the
      process table proves alive outranks the record, so a resumed attempt reusing a
      run directory is not called dead by the earlier attempt's record.</p>

      <h3>What was measured</h3>
      <ul>
        <li>Focused gate <code>tests/test_recovery_reads_the_exit_record.py</code>:
        <strong>9 passed</strong>, exit 0. Each case drives the real
        <code>dispatch.observe</code> fold over a run directory built in a temporary
        config home &mdash; signalled reads <code>interrupted</code> with
        <code>ended by SIGTERM</code>, exit 0 reads <code>abandoned</code> with
        <code>exited with code 0</code>, 0 stream records reads
        <code>launch-failed</code>.</li>
        <li>Review-repaired crash: a pointer holding the <code>launch-failed</code>
        phase with an empty failure list and no exit record raised
        <code>AttributeError: 'NoneType' object has no attribute 'get'</code> at
        <code>recovery.py:3727</code> instead of classifying. That pointer is now a
        test of its own, run red before the guard and green after it; the arm names an
        end only where a record was written, which is the guard the sibling reader
        <code>resumption._launch_failure_block</code> already applies. Logs
        <code>launch-failed-no-record-red.log</code> (1 failed, 8 passed) and
        <code>launch-failed-no-record-green.log</code> (9 passed).</li>
        <li>Delta gate re-run at the repaired head: <strong>922 passed</strong>, exit 0,
        over the same population file and against the same base set &mdash;
        <code>delta-head-after-guard.log</code>.</li>
        <li>Declared negative control (&ldquo;make recovery ignore
        <code>exit.json</code> so classification falls back to pid inference&rdquo;),
        executed in a scratch copy of this tree: <strong>4 failed, 4 passed</strong>,
        with all three declared cases reverted to the inference verdict. First line of
        <code>docs/figures/worker-death-is-recorded/negative-control.log</code> repeats
        the declared mutation verbatim.</li>
        <li>Delta gate over every test file importing <code>reckon.crew.recovery</code>,
        population held fixed at the base revision (61 files): <strong>2 failed, 920
        passed</strong> at base <code>2bf6587b</code> and <strong>922 passed</strong> at
        this head. Both base failures pass in isolation at the base, so they are
        order-sensitive within the combined run rather than defects, and no failure is a
        new one. Logs <code>delta-base.log</code> and <code>delta-head.log</code>, each
        naming its revision, tree, command and the module file the run resolved.</li>
        <li>Ordering proof: a pointer whose launching host is this host and whose pid is
        the live test process classifies <code>running</code> with
        <code>exit_record</code> null, so the record cannot call a live worker dead.</li>
      </ul>

      <h3>Mechanism</h3>
      <p>The reader asks three questions in order: is the launching host this host (then
      the process table answers and liveness is proven), did the supervisor record an
      exit here (then the record decides), and only otherwise is death inferred from the
      missing pid as before. Drawn at
      <a href="/reckon/figures/worker-death-is-recorded/exit-record-reader.svg">the
      exit-record reader figure</a>.</p>

      <h3>Boundary</h3>
      <p>This node reads the record; it does not widen what is recorded, and it does not
      change the exit-0 case into a completion &mdash; only the manifest's status says a
      node was delivered, which is why an exit-0 run with nothing delivered is reported
      as abandoned with its code in the detail rather than as finished. Items (2) and
      (3) of &sect;5 &mdash; the redispatch pointer refresh and the failed-resume session
      id &mdash; are other nodes', and the death-shape correlation in
      <code>a-review-dies-where-nobody-is-looking</code> &sect;1 depends on them.</p>
    </section>
