    <h1>The health sampler names a stall &mdash; evidence</h1>
    <section id="fleet-health-names-a-stall-landing">
      <h2>Landing record</h2>
      <ul>
        <li><strong>What changed.</strong> <code>bin/fleet-health</code> gains two triggers: the node-wide D-state count (<code>FLEET_DSTATE_ALERT</code>, default 50) and the one-minute load (<code>FLEET_LOAD_ALERT</code>, default 56), both overridable by environment variable like the existing three. The process table it writes beside the samples now carries every process's thread count and wait channel, and appends every node-wide D-state process whoever owns it. The reading paths (<code>FLEET_PROC_DIR</code>, <code>FLEET_CGROUP_DIR</code>) and a <code>--once</code> mode make one pass drivable from fixtures. The snapshot stays rate-limited to one per ten minutes.</li>
        <li><strong>Changed paths.</strong> <code>bin/fleet-health</code> (+58/&minus;19), <code>tests/test_fleet_health.py</code> (+300, new).</li>
        <li><strong>Measure.</strong> <code>/home/ITER/mcintos/Code/reckon/.venv/bin/python -m pytest -p no:cacheprovider tests/test_fleet_health.py</code> &mdash; <code>10 passed</code>, <code>EXIT=0</code> (<code>gate-head.log</code>). Ten cases: one pass per new trigger writes a snapshot carrying the thread-count and wait-channel columns and the D-state listing of a process another user owns; a pass below every threshold writes none; the three existing triggers fire as before; both new thresholds are shown honoured when overridden; two crossing passes inside the snapshot interval write one table and a third past it writes a second. Every case runs against a temporary <code>/proc</code>, a temporary cgroup directory, a temporary state directory and stub <code>ps</code>, so no case reads the real <code>/proc</code> or writes the real state directory.</li>
        <li><strong>Negative control.</strong> Remove the D-state trigger from <code>fleet-health</code> &mdash; <code>4 failed, 6 passed</code>, <code>EXIT=1</code> (<code>negative-control.log</code>), the four D-state cases failing where the gate's head arm passes all ten.</li>
      </ul>
    </section>
