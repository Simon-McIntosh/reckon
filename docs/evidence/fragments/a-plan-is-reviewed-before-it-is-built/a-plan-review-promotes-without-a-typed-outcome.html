<article class="r-note" data-node="a-plan-review-promotes-without-a-typed-outcome" data-reckon="landed" data-when="2026-10-22">
  <h2 id="a-plan-review-promotes-without-a-typed-outcome-landed">A plan review promotes without a hand-typed outcome</h2>

  <p id="a-plan-review-promotes-without-a-typed-outcome-mechanism">A review's promotion takes its outcome from the review the run delivered when no <code>--outcome</code> is given, so the operator never restates a figure the store holds. <code>_resolve_promotion_outcome</code> in <code>reckon/crew/promotion_checks.py</code> judged every review run by <code>review_delivery_refusal</code>, whose conditions describe a run review: a head-keyed record path, named at dispatch, for the head the review read. A plan review reads a plan, keyed by version and fingerprint, so it declares no such path, and the node id its dispatch mints (<code>plan-review-of-&lt;slug&gt;</code>) is not the run-review prefix either. The two kinds are now told apart by that node id. A plan review's default is composed from the record the plan-review store builds from its delivered report, naming the count of findings and the count of those whose <code>WOULD_CHANGE_THE_PLAN</code> verdict is yes — read from the record, not restated, and an unstated verdict is not counted as a yes. A report carrying no <code>RUBRIC</code> or <code>FINDING</code> line holds no review however well formed it is, and is refused naming the report; a report that carries them and that the store still refuses is refused with the store's own reason. A run review is judged by exactly the conditions it was judged by before.</p>

  <p id="a-plan-review-promotes-without-a-typed-outcome-second">The second refusal was an identity the record had lost rather than a condition it failed. A run review reaches promotion through the admission pass, and a run whose live pointer is gone has its record rebuilt from the surviving run directory by <code>_rebuild_record_from_run_directory</code>. That rebuild writes <code>"role": ""</code> and <code>"node": {}</code>, so <code>recovery._is_review_run</code> — which reads the role or the node id — saw no review at all, and the refusal was <em>a non-passing gate requires --outcome</em> while the run's own record sat in the review store. The store's index is keyed by the review run that produced each record, so a record naming this run is proof the run was a review and is the review the default is composed from. A run that stored no review still refuses with the same sentence, and a run review that declares a record path and no head-keyed one is refused exactly as before.</p>

  <p id="a-plan-review-promotes-without-a-typed-outcome-reuse">The join between a promoting run and the report it delivered is held once. Reading a report directory's <code>dispatch.json</code> and matching the crew run it names was written twice — inline in the record reader that commits a plan review, and again in the outcome path — so the two copies had to agree on how a delivery is matched, and the plan section that owns this join is about to change it. The record reader now resolves its delivery through <code>_delivered_plan_review_for_run</code>, the one helper the outcome path already used. The misdelivery reader keeps its own walk deliberately: it scans the plan's whole report root for a directory with no report, where the helper reads only the delivered reports carrying a sidecar and a report, so it asks a different question rather than a second copy of this one.</p>

  <p id="a-plan-review-promotes-without-a-typed-outcome-kind">The summary a stored record earns is chosen by which kind it is, and the plan slug is what the plan-review store writes and the run-review store never does — it is the tell that separates a plan review's findings from a run review's score. Only the run-review side of that choice had a case behind it; a repair round added the plan-review side, staging a stored review under the run id it was filed for and reaching the summary through the store's own index rather than through a node id a rebuilt record no longer carries.</p>

  <h3 id="a-plan-review-promotes-without-a-typed-outcome-causes">The two refusals, reproduced at the base revision</h3>
  <p id="a-plan-review-promotes-without-a-typed-outcome-base-arm">Both were reproduced by running this node's test file against a checkout of the base revision <code>adefd63bd</code>, under the run's own scratch directory, on the fleet node with <code>pytest -n 8</code> and the four follower variables unset: <code>6 failed, 2 passed in 5.95s</code>, <code>EXIT=1</code>, log <code>logs/repair-base-arm-new-test.log</code> under the run directory. The six are this node's own cases; the two that pass are the two that assert a refusal is unchanged.</p>
  <ul id="a-plan-review-promotes-without-a-typed-outcome-cause-list">
    <li id="a-plan-review-promotes-without-a-typed-outcome-plan-review">The plan review was refused <code>no head-keyed record path; declares no head-keyed record path, so the head it was dispatched to read is unnamed; re-dispatch the review so the record path it is granted carries the head it read</code>. The responsible lines, read from the base blob: <code>promotion_checks.py</code> line 1437 admits any review to <code>review_delivery_refusal</code> without asking which subject it read, and line 1443 takes its verdict; <code>recovery_review_delivery.py</code> line 375 returns that condition from <code>_declared_head_keyed_record</code> (line 103) when no declared path spells a head. The remedy names a dispatch change that composes the same plan review again, which is why the operator's only way through was the hand-typed <code>--outcome</code> the section exists to remove.</li>
    <li id="a-plan-review-promotes-without-a-typed-outcome-run-review">The queue-launched run review was refused <code>a non-passing gate requires --outcome</code>. The responsible lines: <code>promotion_checks.py</code> line 1437, whose <code>recovery._is_review_run</code> reads the role or the node id; <code>recovery_review_delivery.py</code> line 45, whose two clauses are exactly that role and that node id; and <code>promotion_records.py</code> lines 112 and 116, where the run-directory rebuild leaves both empty. The run's review was stored the whole time, filed under the reviewed run's directory with <code>review_run_id</code> naming this run.</li>
  </ul>

  <h2 id="a-plan-review-promotes-without-a-typed-outcome-measure-heading">Measure</h2>
  <p id="a-plan-review-promotes-without-a-typed-outcome-measure">This node's test file at the head: <code>8 passed in 43.15s</code>, <code>EXIT=0</code>, log <code>logs/repair-head-arm-new-test.log</code>. Its cases: a plan review composes its outcome naming <code>2 finding(s), 1 of which would change the plan</code> and lands through <code>crew complete --gate not-run</code> with no <code>--outcome</code>; a report that is prose only is refused naming the report and <code>carries no RUBRIC or FINDING line</code>; a report the store refuses is refused naming the store's reason (<code>unknown review rubric</code>); a stored review carrying a plan slug is summarised by its own figures through the store's index, naming <code>plan review stored with 2 finding(s)</code> and never a score; a queue-launched run review whose record was rebuilt with no role and no node id composes <code>review scored 109, 1 finding(s)</code> from its stored record, while the same shape with no stored record still refuses <code>a non-passing gate requires --outcome</code>; and a run review declaring a record path that is not head-keyed is still refused <code>no head-keyed record path</code>.</p>
  <p id="a-plan-review-promotes-without-a-typed-outcome-arms">Every test file importing <code>reckon/crew/promotion_checks.py</code> or <code>reckon/crew/recovery_review_delivery.py</code> (30 files, counted on the head tree), run in both arms with <code>pytest -n 8</code> and the four follower variables unset, the arms differing only in source and carrying the same test bytes (<code>diff -r</code> over the two <code>tests/</code> trees is empty): head <code>308 passed in 74.74s</code>, <code>EXIT=0</code> (<code>logs/repair-head-arm-population.log</code>); base <code>302 passed, 6 failed in 104.27s</code>, <code>EXIT=1</code> (<code>logs/repair-base-arm-population.log</code>). The base arm's six failures are this node's own cases, which are the defect reproducing — the other 302 pass in both arms, so no failure is added against the base arm. Each log opens with its revision, its tree and the literal command, then the module under test as imported and the resolved working directory, and ends in a bare <code>EXIT=</code> line.</p>
  <p id="a-plan-review-promotes-without-a-typed-outcome-lint">Ruff: <code>promotion_checks.py</code> reads 3 findings at the base blob and the same 3 at the head, on lines this node never touched, and its <code>ruff format --check --diff</code> output is 99 lines in both, with no hunk touching a line this node added (the repo carries a lint backlog, and only this node's own lines were formatted). The new test file is clean on both. No finding is added.</p>
  <p id="a-plan-review-promotes-without-a-typed-outcome-negative-control">The declared negative control routes the plan review through <code>review_delivery_refusal</code> again by removing the plan-review branch from <code>_resolve_promotion_outcome</code>. The plan-review case is then refused, and the run is <code>4 failed, 4 passed in 8.47s</code>, <code>EXIT=1</code>, log <code>logs/repair-negative-control.log</code>. The four that fail are the plan-review cases the head arm passes; the four that still pass are the three run-review cases the mutation does not touch and the stored-record case, which reaches its summary through the store's index rather than through the node id the mutation removed.</p>
