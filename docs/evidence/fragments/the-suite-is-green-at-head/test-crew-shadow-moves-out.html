  <h2>The crew shadow tests move to their own module</h2>
  <p>The fourteen <code>test_shadow_*</code> tests and the two candidate-config helpers only they
  use moved from <code>tests/test_crew.py</code> to <code>tests/test_crew_shadow.py</code>.
  Doing so brings <code>tests/test_crew.py</code> from <strong>50332</strong> to
  <strong>45087</strong> estimated tokens, and leaves <code>tests/test_crew_shadow.py</code> at
  <strong>5511</strong>, both under the 50000 worker-window bound.</p>
