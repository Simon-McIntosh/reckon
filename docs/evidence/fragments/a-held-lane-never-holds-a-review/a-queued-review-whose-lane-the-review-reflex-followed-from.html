  <h2>A review that followed its run onto a held lane is rebound to the local lane</h2>
  <p id="a-queued-review-whose-lane-the-review-reflex-followed-from-line" data-landing="the review reflex now records <code>named_route.set_by = review-follows-run</code> (<code>dispatch()</code> gains <code>lane_origin</code>, the run branch of <code>_dispatch_text_review_for_run</code> supplies it), and <code>_local_fallback</code> treats that origin as rebindable whatever the picker's action and with no <code>picker_selection</code> at all, while every caller-named route still returns <code>None</code>; a held metered lane now launches the review on the local lane with <code>route_fallback</code> naming the held lane — 3 passed at head, the reflex arm failing under the negative control that treats every <code>named_route</code> as authoritative."></p>
