<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>reckon · fleet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/_shared/foundation.css">
  <link rel="stylesheet" href="/_shared/dashboard.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="root">
  <div style="max-width:920px;margin:60px auto;padding:0 28px;font:14px/1.55 'Geist',system-ui,sans-serif;color:#6e7282">
    <p>Loading fleet rollup from <code>/_projects/index.json</code>…</p>
  </div>
</div>

<script>
  // Normalize the /_projects/index.json payload into a uniform shape
  // before React renders. Handles two data layouts:
  //   Shape A (per-doc, e.g. imas-ambix): data.projects[0] carries summary row
  //   Shape B (central-index, e.g. imas-efit): data.counts.status + data.plans[]
  window.MOCK_READY = (async function () {
    try {
      const r = await fetch("/_projects/index.json", { cache: "no-store" });
      const live = r.ok ? await r.json() : { projects: [] };
      window.MOCK = { projects: (live.projects || []).map(normalize) };
      window.MOCK_UPDATED = live.updated || null;
    } catch (e) {
      console.warn("/_projects/index.json fetch failed", e);
      window.MOCK = { projects: [] };
    }

    function normalize(p) {
      const d = (p && p.data) || {};

      // Shape A: per-doc layout — data.projects[0] carries the summary row
      if (Array.isArray(d.projects) && d.projects.length > 0) {
        const s = d.projects[0];
        return {
          project:       p.project,
          path:          p.path,
          published:     s.published     || "(local only)",
          owner:         s.owner         || "",
          plans_count:   s.plans_count   || 0,
          active:        s.active        || 0,
          blocked:       s.blocked       || 0,
          pending:       s.pending       || 0,
          shipped:       s.shipped       || 0,
          last_modified: s.last_modified || p.updated || "—",
          milestones:    Array.isArray(s.milestones) ? s.milestones : [],
          top:           Array.isArray(s.top)        ? s.top        : [],
          activity30:    Array.isArray(s.activity30) ? s.activity30 : new Array(30).fill(0),
          tests_30d:     s.tests_30d || { pass: 0, runs: 0 },
        };
      }

      // Shape B: central-index layout — data.counts + data.plans[]
      const counts = d.counts || {};
      const sb = counts.status || {};
      const plans = Array.isArray(d.plans) ? d.plans : [];
      const top = plans
        .slice()
        .sort((a, b) => {
          const pri = (x) => (x.status === "blocked" ? 0 : x.status === "active" ? 1 : 2);
          if (pri(a) !== pri(b)) return pri(a) - pri(b);
          return (b.implementation_fraction || 0) - (a.implementation_fraction || 0);
        })
        .slice(0, 5)
        .map((pl) => ({
          slug:     pl.slug,
          title:    pl.title || pl.slug,
          status:   pl.status || "pending",
          roi:      pl.roi    || "mid",
          effort:   pl.effort || "M",
          ms:       pl.milestone || "—",
          impl:     pl.implementation_fraction || 0,
          blockers: Array.isArray(pl.blocked_by) ? pl.blocked_by.length : 0,
          dec_open: pl.dec_open || 0,
        }));
      return {
        project:       p.project,
        path:          p.path,
        published:     d.published     || "(local only)",
        owner:         d.owner         || "",
        plans_count:   counts.total    || plans.length || 0,
        active:        sb.active       || 0,
        blocked:       sb.blocked      || 0,
        pending:       sb.pending      || 0,
        shipped:       sb.shipped      || 0,
        last_modified: d.audit_date    || p.updated || "—",
        milestones:    Array.isArray(d.milestones) ? d.milestones : [],
        top:           top,
        activity30:    Array.isArray(d.activity30) ? d.activity30 : new Array(30).fill(0),
        tests_30d:     d.tests_30d || { pass: 0, runs: 0 },
      };
    }
  })();
</script>

<script type="text/babel">
  const { useState, useMemo, useEffect } = React;

  // ── Tiny icon set ──────────────────────────────────────────────────────────
  function Icon({ name, size = 16 }) {
    const icons = {
      open: (
        <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5">
          <path d="M6 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3M9 2h5m0 0v5M14 2 8 8" />
        </svg>
      ),
    };
    return icons[name] || null;
  }

  // ── Topbar ─────────────────────────────────────────────────────────────────
  function Topbar() {
    return (
      <nav className="topbar">
        <span className="brand">
          <span style={{ fontWeight: 700, letterSpacing: "-0.5px" }}>R</span>
          {" reckon · fleet"}
        </span>
      </nav>
    );
  }

  // ── Status badge ──────────────────────────────────────────────────────────
  function Status({ s }) {
    const map = {
      active:      { cls: "badge-active",   label: "active" },
      "in-progress": { cls: "badge-active", label: "in-progress" },
      blocked:     { cls: "badge-blocked",  label: "blocked" },
      shipped:     { cls: "badge-shipped",  label: "shipped" },
      done:        { cls: "badge-shipped",  label: "done" },
      pending:     { cls: "badge-pending",  label: "pending" },
    };
    const { cls = "badge-pending", label = s } = map[s] || {};
    return <span className={`badge ${cls}`}>{label}</span>;
  }

  // ── ROI dot ────────────────────────────────────────────────────────────────
  function Roi({ v }) {
    const colors = { high: "var(--good)", mid: "var(--warn)", low: "var(--muted)" };
    return (
      <span style={{
        display: "inline-block", width: 8, height: 8, borderRadius: "50%",
        background: colors[v] || colors.mid, flexShrink: 0,
      }} />
    );
  }

  // ── Tag ───────────────────────────────────────────────────────────────────
  function Tag({ kind, children }) {
    return <span className={`tag tag-${kind}`}>{children}</span>;
  }

  // ── Progress bar ──────────────────────────────────────────────────────────
  function Bar({ v, width = 100 }) {
    const pct = Math.round(Math.min(1, Math.max(0, v || 0)) * 100);
    return (
      <span style={{ display: "inline-block", width, height: 6, borderRadius: 3,
                     background: "var(--border)", verticalAlign: "middle", flexShrink: 0 }}>
        <span style={{ display: "block", width: `${pct}%`, height: "100%",
                       borderRadius: 3, background: "var(--accent)" }} />
      </span>
    );
  }

  // ── Stacked progress bar (shipped / active / pending / blocked) ───────────
  function Stack({ s, a, p, b }) {
    const total = (s || 0) + (a || 0) + (p || 0) + (b || 0);
    if (!total) return <span style={{ display: "inline-block", width: 160, height: 8,
                                      borderRadius: 4, background: "var(--border)" }} />;
    const pct = (n) => `${Math.round((n / total) * 100)}%`;
    const segments = [
      { val: s, color: "var(--good)" },
      { val: a, color: "var(--accent)" },
      { val: p, color: "var(--border)" },
      { val: b, color: "var(--bad)" },
    ].filter((seg) => seg.val > 0);
    return (
      <span style={{ display: "inline-flex", width: 160, height: 8, borderRadius: 4, overflow: "hidden", flexShrink: 0 }}>
        {segments.map((seg, i) => (
          <span key={i} style={{ width: pct(seg.val), height: "100%", background: seg.color }} />
        ))}
      </span>
    );
  }

  // ── 30-day heat strip ────────────────────────────────────────────────────
  function Heat({ data }) {
    const vals = Array.isArray(data) ? data.slice(-30) : new Array(30).fill(0);
    const mx = Math.max(1, ...vals);
    return (
      <span style={{ display: "inline-flex", gap: 2, alignItems: "flex-end", height: 20 }}>
        {vals.map((v, i) => (
          <span key={i} style={{
            display: "inline-block", width: 4, borderRadius: 1,
            height: Math.max(2, Math.round((v / mx) * 18)),
            background: v === 0 ? "var(--border)" : "var(--accent)",
            opacity: v === 0 ? 0.4 : 0.6 + 0.4 * (v / mx),
          }} />
        ))}
      </span>
    );
  }

  // ── Fleet root component ──────────────────────────────────────────────────
  function Fleet() {
    const [ready, setReady] = useState(false);
    const [sortBy, setSortBy] = useState("roi");
    useEffect(() => { window.MOCK_READY.then(() => setReady(true)); }, []);

    if (!ready) {
      return (
        <div className="shell">
          <Topbar />
          <main className="page wide">
            <p className="dim" style={{ padding: "32px 0" }}>Loading…</p>
          </main>
        </div>
      );
    }

    const M = window.MOCK || { projects: [] };
    const projs = M.projects;

    if (!projs.length) {
      return (
        <div className="shell">
          <Topbar />
          <main className="page wide">
            <div className="page-head">
              <div className="title">
                <h1>Across projects.</h1>
                <div className="subtitle">
                  No mounted projects yet — edit <code>~/docs-server/mounts.json</code> to add one.
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const total   = projs.reduce((a, p) => a + p.plans_count, 0);
    const active  = projs.reduce((a, p) => a + p.active,      0);
    const blocked = projs.reduce((a, p) => a + p.blocked,     0);
    const shipped = projs.reduce((a, p) => a + p.shipped,     0);
    const pending = projs.reduce((a, p) => a + p.pending,     0);
    const impl    = total ? shipped / total : 0;

    const projects = useMemo(() => {
      const score = (p) => p.top.reduce(
        (a, t) => a + (t.roi === "high" ? 3 : t.roi === "mid" ? 2 : 1), 0
      );
      const sorters = {
        roi:      (a, b) => score(b) - score(a),
        blocked:  (a, b) => b.blocked - a.blocked,
        progress: (a, b) => (b.shipped / Math.max(1, b.plans_count)) - (a.shipped / Math.max(1, a.plans_count)),
        activity: (a, b) => b.activity30.slice(-7).reduce((x, y) => x + y, 0)
                          - a.activity30.slice(-7).reduce((x, y) => x + y, 0),
        modified: (a, b) => (b.last_modified || "").localeCompare(a.last_modified || ""),
      };
      return projs.slice().sort(sorters[sortBy] || sorters.roi);
    }, [sortBy, projs]);

    return (
      <div className="shell">
        <Topbar />

        <main className="page wide">
          <div className="page-head">
            <div className="title">
              <h1>Across projects.</h1>
              <div className="subtitle">
                across all projects on this docs-server
                {" · "}{projs.length} project{projs.length === 1 ? "" : "s"} mounted
                {" · "}{total} plan{total === 1 ? "" : "s"}
                {window.MOCK_UPDATED ? " · refreshed " + window.MOCK_UPDATED : ""}
              </div>
            </div>
          </div>

          <div className="stats">
            <div className="stat">
              <div className="l">total plans</div>
              <div className="n">{total}</div>
            </div>
            <div className="stat">
              <div className="l">active</div>
              <div className="n">
                {active}{total > 0 && <span className="of">/{total}</span>}
              </div>
              {total > 0 && (
                <div className="delta">{Math.round(active / total * 100)}% of fleet</div>
              )}
            </div>
            <div className="stat">
              <div className="l">blocked</div>
              <div className="n" style={{ color: blocked ? "var(--bad)" : undefined }}>
                {blocked}
              </div>
            </div>
            <div className="stat">
              <div className="l">shipped</div>
              <div className="n">{shipped}</div>
            </div>
            <div className="stat">
              <div className="l">fleet impl.</div>
              <div className="n">{Math.round(impl * 100)}<span className="of">%</span></div>
              <div className="mt-2"><Bar v={impl} width={110} /></div>
            </div>
            <div className="stat">
              <div className="l">pending</div>
              <div className="n">{pending}</div>
            </div>
          </div>

          <div className="filterbar" style={{ borderBottom: 0, marginTop: 22 }}>
            <h2 style={{ margin: 0 }}>Projects <span className="count">{projs.length}</span></h2>
            <span className="sp"></span>
            <label className="field">
              sort
              <select value={sortBy} onChange={(e) => setSortBy(e.target.value)}>
                <option value="roi">ROI weight</option>
                <option value="blocked">blockers</option>
                <option value="progress">progress</option>
                <option value="activity">7-day activity</option>
                <option value="modified">last modified</option>
              </select>
            </label>
          </div>

          {projects.map((p) => (
            <div className="proj" key={p.project}>
              <div className="proj-head">
                <div className="ident">
                  <div className="name">
                    <a href={`/${p.project}/`}>{p.project} <Icon name="open" size={14} /></a>
                  </div>
                  <div className="path">{p.path}</div>
                  <div className="meta">
                    {p.shipped + " shipped · " + p.active + " active · " + p.pending + " pending · " + p.blocked + " blocked"}
                  </div>
                  {p.published && p.published !== "(local only)" && (
                    <div className="meta" style={{ marginTop: 4 }}>
                      pages: <a className="link" href={`https://${p.published}`}>{p.published}</a>
                    </div>
                  )}
                </div>

                <div className="progress">
                  <div className="stack-row">
                    <Stack s={p.shipped} a={p.active} p={p.pending} b={p.blocked} />
                    <span className="pct">
                      {p.plans_count ? Math.round(p.shipped / p.plans_count * 100) : 0}%
                    </span>
                  </div>
                  <div className="stack-legend">
                    <span className="k shipped">shipped</span>
                    <span className="k active">active</span>
                    <span className="k pending">pending</span>
                    <span className="k blocked">blocked</span>
                  </div>
                </div>

                <div className="activity" style={{ flexDirection: "column", alignItems: "flex-end", gap: 8 }}>
                  <div className="heat-label">30-day writes</div>
                  <Heat data={p.activity30} />
                  {p.tests_30d.runs > 0 && (
                    <div className="dim" style={{ fontSize: 11.5 }}>
                      tests {Math.round(p.tests_30d.pass * 100)}% · {p.tests_30d.runs.toLocaleString()} runs
                    </div>
                  )}
                </div>
              </div>

              {p.top.length > 0 && (
                <div className="top">
                  <table className="t compact">
                    <thead>
                      <tr>
                        <th style={{ width: "40%" }}>Top items</th>
                        <th>Status</th>
                        <th>ROI</th>
                        <th>Milestone</th>
                        <th>Implementation</th>
                        <th className="num">Open dec.</th>
                        <th className="num">Blockers</th>
                      </tr>
                    </thead>
                    <tbody>
                      {p.top.map((t) => (
                        <tr key={t.slug}>
                          <td className="title">
                            <div className="cell-stack">
                              <a className="link" href={`/${p.project}/${encodeURIComponent(t.slug)}.html`}>{t.title}</a>
                              <span className="sub">/{t.slug}</span>
                            </div>
                          </td>
                          <td><Status s={t.status} /></td>
                          <td>
                            <span className="flex" style={{ gap: 8 }}>
                              <Roi v={t.roi} />
                              <span className="dim" style={{ fontSize: 12 }}>{t.roi}</span>
                            </span>
                          </td>
                          <td>
                            <Tag kind="ms">{t.ms}</Tag>
                            <span className="dim" style={{ marginLeft: 8, fontSize: 12, fontFamily: "var(--mono)" }}>{t.effort}</span>
                          </td>
                          <td>
                            <span className="flex" style={{ gap: 10 }}>
                              <Bar v={t.impl} width={90} />
                              <span className="num" style={{ color: "var(--muted)", fontSize: 12 }}>
                                {Math.round(t.impl * 100)}%
                              </span>
                            </span>
                          </td>
                          <td className="num">
                            {t.dec_open
                              ? <a className="link" href={`/${p.project}/${encodeURIComponent(t.slug)}.html`}>{t.dec_open}</a>
                              : <span className="dim">—</span>}
                          </td>
                          <td className="num">
                            {t.blockers
                              ? <span style={{ color: "var(--bad)" }}>{t.blockers}</span>
                              : <span className="dim">—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          ))}

          <div style={{ marginTop: 28, fontSize: 12.5, color: "var(--muted)" }}>
            Mount a new project: edit <code>~/docs-server/mounts.json</code>. No restart needed.
          </div>
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<Fleet />);
</script>
</body>
</html>
