<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>reckon · fleet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/_shared/foundation.css">
  <link rel="stylesheet" href="/_shared/dashboard.css">
</head>
<body>
<div class="shell">
  <nav class="topbar">
    <span class="brand">
      <span class="mark">R</span>
      reckon
    </span>
    <div class="right">
      <span id="js-time" style="font-family:var(--mono);font-size:12px;color:var(--muted)"></span>
    </div>
  </nav>
  <main class="page wide" id="main">
    <p class="dim" style="padding:32px 0">Loading fleet rollup…</p>
  </main>
</div>

<script>
(function () {
  'use strict';

  var sortBy = 'roi';
  var allProjects = [];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function normalize(p) {
    var d = (p && p.data) || {};

    // Shape A: data.projects[0] carries the per-project summary row
    if (Array.isArray(d.projects) && d.projects.length) {
      var s = d.projects[0];
      return {
        project:      p.project,
        path:         p.path || '',
        published:    s.published || '',
        owner:        s.owner || '',
        plans_count:  (s.plans_count | 0),
        active:       (s.active  | 0),
        blocked:      (s.blocked | 0),
        pending:      (s.pending | 0),
        shipped:      (s.shipped | 0),
        last_modified: s.last_modified || p.updated || '',
        milestones:   Array.isArray(s.milestones) ? s.milestones : [],
        top:          Array.isArray(s.top) ? s.top : [],
        activity30:   Array.isArray(s.activity30) ? s.activity30 : [],
        tests_30d:    s.tests_30d || { pass: 0, runs: 0 },
      };
    }

    // Shape B: data.counts.status + data.plans[]
    var cnts = d.counts || {};
    var sb   = cnts.status || {};
    var plans = Array.isArray(d.plans) ? d.plans : [];
    var top = plans.slice()
      .sort(function (a, b) {
        var pri = function (x) { return x.status === 'blocked' ? 0 : x.status === 'active' ? 1 : 2; };
        var dp  = pri(a) - pri(b);
        return dp || ((b.implementation_fraction || 0) - (a.implementation_fraction || 0));
      })
      .slice(0, 5)
      .map(function (pl) {
        return {
          slug:     pl.slug || (pl.path || '').replace(/^.*\//, '').replace(/\.[^.]+$/, ''),
          title:    pl.title || pl.slug,
          status:   pl.status || 'pending',
          roi:      pl.roi    || 'mid',
          effort:   pl.effort || 'M',
          ms:       pl.milestone || '—',
          impl:     pl.implementation_fraction || 0,
          blockers: Array.isArray(pl.blocked_by) ? pl.blocked_by.length : 0,
          dec_open: pl.dec_open || 0,
        };
      });

    return {
      project:      p.project,
      path:         p.path || '',
      published:    d.published || '',
      owner:        d.owner || '',
      plans_count:  cnts.total || plans.length || 0,
      active:       (sb.active  | 0),
      blocked:      (sb.blocked | 0),
      pending:      (sb.pending | 0),
      shipped:      (sb.shipped | 0),
      last_modified: d.audit_date || p.updated || '',
      milestones:   Array.isArray(d.milestones) ? d.milestones : [],
      top:          top,
      activity30:   Array.isArray(d.activity30) ? d.activity30 : [],
      tests_30d:    d.tests_30d || { pass: 0, runs: 0 },
    };
  }

  function score(p) {
    return p.top.reduce(function (a, t) {
      return a + (t.roi === 'high' ? 3 : t.roi === 'mid' ? 2 : 1);
    }, 0);
  }

  function sorted() {
    var sorters = {
      roi:      function (a, b) { return score(b) - score(a); },
      blocked:  function (a, b) { return b.blocked - a.blocked; },
      progress: function (a, b) {
        return (b.shipped / Math.max(1, b.plans_count)) - (a.shipped / Math.max(1, a.plans_count));
      },
      modified: function (a, b) { return (b.last_modified || '').localeCompare(a.last_modified || ''); },
    };
    return allProjects.slice().sort(sorters[sortBy] || sorters.roi);
  }

  function pctBar(v, w) {
    var pct = Math.round(Math.min(1, Math.max(0, v || 0)) * 100);
    return '<span style="display:inline-block;width:' + (w || 90) + 'px;height:5px;border-radius:3px;background:var(--line);vertical-align:middle">'
         + '<span style="display:block;width:' + pct + '%;height:100%;border-radius:3px;background:var(--accent)"></span>'
         + '</span>';
  }

  function stackBar(s, a, p, b) {
    var tot = (s | 0) + (a | 0) + (p | 0) + (b | 0);
    if (!tot) return '<div class="stack"></div>';
    var pct = function (n) { return Math.round((n / tot) * 100) + '%'; };
    return '<div class="stack">'
      + (s ? '<i class="shipped" style="width:' + pct(s) + '"></i>' : '')
      + (a ? '<i class="active"  style="width:' + pct(a) + '"></i>' : '')
      + (p ? '<i class="pending" style="width:' + pct(p) + '"></i>' : '')
      + (b ? '<i class="blocked" style="width:' + pct(b) + '"></i>' : '')
      + '</div>';
  }

  function heatStrip(data) {
    var vals = Array.isArray(data) ? data.slice(-30) : [];
    while (vals.length < 30) vals.unshift(0);
    var mx = Math.max.apply(null, [1].concat(vals));
    return vals.map(function (v) {
      var h   = Math.max(2, Math.round((v / mx) * 18));
      var bg  = v === 0 ? 'var(--line)' : 'var(--accent)';
      var op  = v === 0 ? 0.35 : (0.55 + 0.45 * (v / mx));
      return '<span style="display:inline-block;width:4px;border-radius:1px;height:' + h + 'px;'
           + 'background:' + bg + ';opacity:' + op.toFixed(2) + ';flex-shrink:0"></span>';
    }).join('');
  }

  function statusDot(s) {
    return '<span class="status ' + esc(s) + '"><span class="dot"></span>' + esc(s) + '</span>';
  }

  function roiDot(v) {
    var colors = { high: 'var(--ok)', mid: 'var(--warn)', low: 'var(--muted)' };
    var c = colors[v] || colors.mid;
    return '<span style="display:inline-flex;align-items:center;gap:6px">'
         + '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + c + '"></span>'
         + '<span style="color:var(--muted);font-size:12px">' + esc(v) + '</span>'
         + '</span>';
  }

  function projCard(p) {
    var topRows = p.top.map(function (t) {
      var decCell = t.dec_open
        ? '<a class="link" href="/' + esc(p.project) + '/' + esc(t.slug) + '.html">' + t.dec_open + '</a>'
        : '<span class="dim">—</span>';
      var blkCell = t.blockers
        ? '<span style="color:var(--bad)">' + t.blockers + '</span>'
        : '<span class="dim">—</span>';
      return '<tr>'
        + '<td class="title"><div class="cell-stack">'
        + '<a class="link" href="/' + esc(p.project) + '/' + esc(t.slug) + '.html">' + esc(t.title) + '</a>'
        + '<span class="sub">/' + esc(t.slug) + '</span>'
        + '</div></td>'
        + '<td>' + statusDot(t.status) + '</td>'
        + '<td>' + roiDot(t.roi) + '</td>'
        + '<td><span class="tag ms">' + esc(t.ms) + '</span>'
        + ' <span class="dim" style="font-size:12px;font-family:var(--mono)">' + esc(t.effort) + '</span></td>'
        + '<td><span class="flex" style="gap:10px">' + pctBar(t.impl, 90)
        + '<span style="color:var(--muted);font-size:12px;font-family:var(--mono)">' + Math.round(t.impl * 100) + '%</span></span></td>'
        + '<td class="num">' + decCell + '</td>'
        + '<td class="num">' + blkCell + '</td>'
        + '</tr>';
    }).join('');

    var pagesLine = p.published && p.published !== '(local only)'
      ? '<div class="meta" style="margin-top:4px">pages: <a class="link" href="https://' + esc(p.published) + '">' + esc(p.published) + '</a></div>'
      : '';

    var testsLine = p.tests_30d.runs > 0
      ? '<div class="dim" style="font-size:11.5px">tests ' + Math.round(p.tests_30d.pass * 100) + '% · ' + p.tests_30d.runs.toLocaleString() + ' runs</div>'
      : '';

    var pct = p.plans_count ? Math.round(p.shipped / p.plans_count * 100) : 0;

    return '<div class="proj">'
      + '<div class="proj-head">'
      + '<div class="ident">'
      + '<div class="name"><a href="/' + esc(p.project) + '/">' + esc(p.project) + '</a></div>'
      + '<div class="path">' + esc(p.path) + '</div>'
      + '<div class="meta">' + p.shipped + ' shipped · ' + p.active + ' active · ' + p.pending + ' pending · ' + p.blocked + ' blocked</div>'
      + pagesLine
      + '</div>'
      + '<div class="progress">'
      + '<div class="stack-row">' + stackBar(p.shipped, p.active, p.pending, p.blocked) + '<span class="pct">' + pct + '%</span></div>'
      + '<div class="stack-legend">'
      + '<span class="k shipped">shipped</span>'
      + '<span class="k active">active</span>'
      + '<span class="k pending">pending</span>'
      + '<span class="k blocked">blocked</span>'
      + '</div></div>'
      + '<div class="activity" style="flex-direction:column;align-items:flex-end;gap:8px">'
      + '<div class="heat-label">30-day writes</div>'
      + '<span style="display:inline-flex;gap:2px;align-items:flex-end;height:20px">' + heatStrip(p.activity30) + '</span>'
      + testsLine
      + '</div>'
      + '</div>'
      + (topRows
        ? '<div class="top"><table class="t compact"><thead><tr>'
          + '<th style="width:40%">Top items</th><th>Status</th><th>ROI</th>'
          + '<th>Milestone</th><th>Implementation</th><th class="num">Open dec.</th><th class="num">Blockers</th>'
          + '</tr></thead><tbody>' + topRows + '</tbody></table></div>'
        : '')
      + '</div>';
  }

  function render() {
    var main  = document.getElementById('main');
    var projs = sorted();

    if (!projs.length) {
      main.innerHTML = '<div class="page-head"><div class="title">'
        + '<h1>Across projects.</h1>'
        + '<div class="subtitle">No mounted projects yet — edit <code>~/docs-server/mounts.json</code> to add one.</div>'
        + '</div></div>';
      return;
    }

    var total   = allProjects.reduce(function (a, p) { return a + p.plans_count; }, 0);
    var active  = allProjects.reduce(function (a, p) { return a + p.active;  }, 0);
    var blocked = allProjects.reduce(function (a, p) { return a + p.blocked; }, 0);
    var shipped = allProjects.reduce(function (a, p) { return a + p.shipped; }, 0);
    var pending = allProjects.reduce(function (a, p) { return a + p.pending; }, 0);
    var impl    = total ? shipped / total : 0;

    var projCount  = allProjects.length;
    var sortSel = '<select id="sort-sel">'
      + '<option value="roi"'      + (sortBy === 'roi'      ? ' selected' : '') + '>ROI weight</option>'
      + '<option value="blocked"'  + (sortBy === 'blocked'  ? ' selected' : '') + '>blockers</option>'
      + '<option value="progress"' + (sortBy === 'progress' ? ' selected' : '') + '>progress</option>'
      + '<option value="modified"' + (sortBy === 'modified' ? ' selected' : '') + '>last modified</option>'
      + '</select>';

    main.innerHTML = '<div class="page-head"><div class="title">'
      + '<h1>Across projects.</h1>'
      + '<div class="subtitle">across all projects on this docs-server'
      + ' · ' + projCount + ' project' + (projCount === 1 ? '' : 's') + ' mounted'
      + ' · ' + total + ' plan' + (total === 1 ? '' : 's')
      + '</div></div></div>'

      + '<div class="stats">'
      + '<div class="stat"><div class="l">total plans</div><div class="n">' + total + '</div></div>'
      + '<div class="stat"><div class="l">active</div>'
      + '<div class="n">' + active + (total ? '<span class="of">/' + total + '</span>' : '') + '</div>'
      + (total ? '<div class="delta">' + Math.round(active / total * 100) + '% of fleet</div>' : '')
      + '</div>'
      + '<div class="stat"><div class="l">blocked</div>'
      + '<div class="n"' + (blocked ? ' style="color:var(--bad)"' : '') + '>' + blocked + '</div></div>'
      + '<div class="stat"><div class="l">shipped</div><div class="n">' + shipped + '</div></div>'
      + '<div class="stat"><div class="l">fleet impl.</div>'
      + '<div class="n">' + Math.round(impl * 100) + '<span class="of">%</span></div>'
      + '<div class="mt-2">' + pctBar(impl, 110) + '</div>'
      + '</div>'
      + '<div class="stat"><div class="l">pending</div><div class="n">' + pending + '</div></div>'
      + '</div>'

      + '<div class="filterbar" style="border-bottom:0;margin-top:22px">'
      + '<h2 style="margin:0">Projects <span class="count">' + projCount + '</span></h2>'
      + '<span class="sp"></span>'
      + '<label class="field">sort ' + sortSel + '</label>'
      + '</div>'

      + projs.map(projCard).join('')

      + '<div style="margin-top:28px;font-size:12.5px;color:var(--muted)">'
      + 'Mount a new project: edit <code>~/docs-server/mounts.json</code>. No restart needed.'
      + '</div>';

    var sel = document.getElementById('sort-sel');
    if (sel) {
      sel.addEventListener('change', function (e) {
        sortBy = e.target.value;
        render();
      });
    }
  }

  fetch('/_projects/index.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : { projects: [] }; })
    .then(function (data) {
      var t = document.getElementById('js-time');
      if (t && data.updated) t.textContent = 'refreshed ' + new Date(data.updated).toLocaleTimeString();
      allProjects = (data.projects || []).map(normalize);
      render();
    })
    .catch(function (e) {
      console.warn('fleet load failed:', e);
      allProjects = [];
      render();
    });
}());
</script>
</body>
</html>
