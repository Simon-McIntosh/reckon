  <style>
    /* ── Design tokens: prototype values (override legacy styles.css) ── */
    :root {
      --bg:#fbfaf7; --bg-2:#f5f3ee; --bg-3:#e8e6e0;
      --ink:#1d2230; --ink-2:#4a5366;
      --muted:#8a93a5; --faint:#b8bdc8; --line:#e7e5dd; --line-2:#cfccc2;
      --accent:#3654c8; --accent-3:oklch(0.95 0.04 260);
      --bad:oklch(0.55 0.16 25); --bad-2:oklch(0.96 0.03 25);
      --ok:oklch(0.55 0.14 145); --warn:oklch(0.65 0.13 65);
      --hair:var(--line); --hairline:1px solid var(--line);
      --good:var(--ok); --good-2:oklch(0.95 0.04 155);
      --topbar-h:52px;
      --card:#fff;
    }
    [data-theme="dark"]{
      --bg:#12141a; --bg-2:#1c1f28; --bg-3:#222533;
      --ink:#e8eaf0; --ink-2:#9aa3b8;
      --muted:#5a6378; --faint:#373d52; --line:#2a2e3e; --line-2:#353a4f;
      --accent:oklch(0.72 0.15 264); --accent-3:oklch(0.30 0.06 264);
      --card:var(--bg-2);
    }
    html,body{font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--ink)}
    .card{background:var(--card)}

    /* ── Topbar: white bg, 52px height, correct gap ── */
    .r-topbar{background:#fff;height:var(--topbar-h);gap:8px;padding:0 16px}
    [data-theme="dark"] .r-topbar{background:var(--bg-2)}

    /* ── ViewTabs: match prototype .tabs style (bg-2 container, #fff active) ── */
    .r-glyph-tabs{background:var(--bg-2) !important;border:var(--hairline) !important;border-radius:5px !important;padding:2px !important;gap:1px !important}
    .r-glyph{padding:4px 9px;font-size:12.5px;color:var(--ink-2);border-radius:4px;gap:5px;font-weight:400}
    .r-glyph.active{background:#fff !important;color:var(--ink) !important;font-weight:500;box-shadow:0 1px 2px rgba(15,20,35,0.04)}
    .r-glyph:hover:not(.active){background:var(--bg-3) !important;color:var(--ink)}
    [data-theme="dark"] .r-glyph.active{background:var(--bg-3) !important}

  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
