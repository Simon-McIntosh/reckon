<main class="reckon-resource" data-type="sprint" data-id="S15">
  <ol data-reckon="sprint-items">
  <li data-slug="clive-local-workers" data-item="{&quot;done_when&quot;: &quot;GLM 5.3 and DSv4 flash are declared backends with pinned effort; crew dispatch --local resolves a local_backend flight key and refuses when unset; investigate and review nodes on reckon run live on the local lane with at least ten promoted runs; at least ten usable shadow pairs per local model exist on implementation nodes; the default effort per specification level is locked from the ledger query with its counts recorded; the spark lane&#x27;s disposition is recorded; and a synthetic worker writing outside its worktree is refused at promotion by test.&quot;, &quot;slug&quot;: &quot;clive-local-workers&quot;, &quot;why_now&quot;: &quot;DSv4 flash is live on the cluster and passed four of six controlled pairs with two better diffs, but the lane is unreachable except by a per-call override, GLM 5.3 has no entry, and the only thing holding write access is a harness fence every backend needs. The sol ledger meanwhile holds 38 times the sample the current effort priors were set from.&quot;}">clive-local-workers</li>
  <li data-slug="crew-effort-routing" data-item="{&quot;done_when&quot;: &quot;The remaining checkpoint section lands against the same ledger query the clive plan locks its defaults from, and the plan reaches impl 1.0.&quot;, &quot;slug&quot;: &quot;crew-effort-routing&quot;, &quot;why_now&quot;: &quot;At 92% with its calibration checkpoint the one open item, and the checkpoint is exactly the ledger re-read the new plan performs; leaving it unscheduled would make two plans lock the same defaults from the same data.&quot;}">crew-effort-routing</li>
  <li data-slug="crew-observability-truth" data-item="{&quot;done_when&quot;: &quot;A liveness answer agrees with the process table in both directions of desync, asserted through the dispatch guard rather than a helper; a gc call whose named project and resolved repository disagree is refused or resolved from mounts per the locked decision, and every gc result names the repository it scanned; the working count excludes any run whose process is gone or whose manifest is terminal, across every phase a pointer can hold; and no liveness or stall judgement is derived from file mtime, asserted against a recorded stream that is byte-active and generation-idle.&quot;, &quot;slug&quot;: &quot;crew-observability-truth&quot;, &quot;why_now&quot;: &quot;Five distinct display defects were measured in one execution session, and in every case a person noticed before the tooling did — twice by looking at GPU utilisation, three times by stat-ing a manifest. Three were fixed inside the local-lane plan because that is where they surfaced; two have no owning plan at all, which by the project&#x27;s own rule makes them hidden work. One of those two is the field crew dispatch reads to decide whether a fleet is being heard, and the other silently reported 124 reclaimable worktrees as zero. Both are cheap to fix and both are load-bearing for every sprint that dispatches workers, not only this one.&quot;}">crew-observability-truth</li>
  <li data-slug="concurrency-and-schedule-visibility" data-item="{&quot;done_when&quot;: &quot;Two candidate nodes whose declared write scopes overlap by path containment are refused before any worktree exists, naming the owning run and the conflicting path, with a node claiming a declared source judged to conflict with one claiming its generated output; a lane planner returns a partition matching the hand-computed one for the three-node case; a plan whose sprint sits behind an earlier sprint holding open work reports schedule-deferred with a reason naming that sprint while staying dependency-ready and listed in the ordered roadmap; and two concurrently dispatched adjacent nodes exchange a question and an answer without coordinator involvement, with a peer read that goes unanswered degrading to a NEEDS-HELP report rather than expiring silently.&quot;, &quot;slug&quot;: &quot;concurrency-and-schedule-visibility&quot;, &quot;why_now&quot;: &quot;Measured while shipping this sprint&#x27;s own completion-is-not-silent: the session ran one worker against thirteen dependency-ready plans and fifteen idle roster members. Running at one was locally correct, because the three sections shipped all wrote the same four files and three contract tests bind the skill text to the CLI surface in both directions. It was reached by a coordinator reading test bodies by hand, and nothing in the system could have reached or contradicted it. Two agents have already contradicted each other in writing about whether a plan is ready, because readiness answers whether prerequisites are met and is read as whether work should start.&quot;}">concurrency-and-schedule-visibility</li>
  <li data-slug="native-agent-dispatch-guard" data-item="{&quot;done_when&quot;: &quot;A pre-tool-use hook refuses a new background-agent spawn in a synthetic crew-managed repo with a message naming the crew dispatch re-route, passes through a non-crew repo untouched, and honours both waivers (in-harness run awaiting attach; explicit environment override), each branch asserted by test; sync installs the wiring idempotently with a clean removal path; and the routing line is present in the status, roadmap, sprint and create skills, pinned by a contract test.&quot;, &quot;slug&quot;: &quot;native-agent-dispatch-guard&quot;, &quot;why_now&quot;: &quot;Two coordinator sessions in one morning launched harness-native background-agent fleets in crew-managed repositories against an explicit codex-worker directive, because the routing rule lives only in the ship skill and nothing checks it at the moment of spawn. Ten unledgered agent runs spent harness-model budget invisible to watch, drain, manifests and calibration. This sprint&#x27;s thesis is exactly this defect class: a binding rule with no bound check decays.&quot;}">native-agent-dispatch-guard</li>
  </ol>
