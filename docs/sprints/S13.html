<main class="reckon-resource" data-type="sprint" data-id="S13">
  <ol data-reckon="sprint-items">
  <li data-slug="derivable-dispatch-contract" data-item="{&quot;done_when&quot;: &quot;Two concurrent coordinators dispatching without naming a member never contend, asserted by a test running concurrent dispatches and requiring distinct members and zero refusals; a follow-up inside the reap window reuses the same session id while a reaped member&#x27;s session stays recoverable from the ledger; and a node whose measure names running a suite is refused against an execution-incapable role with a message naming both, overridable and recorded when overridden.&quot;, &quot;slug&quot;: &quot;derivable-dispatch-contract&quot;, &quot;why_now&quot;: &quot;Both defects were measured during S12 and both cost diagnosis time rather than blocking work, which is why they will keep costing it. Two coordinators collided over a member list that has add and list but no remove, and three suite runs were routed to a role declaring execution_capable false, producing 34 environmental failures that read as a product regression until the role was checked.&quot;}">derivable-dispatch-contract</li>
  <li data-slug="landed-record-at-closure" data-item="{&quot;done_when&quot;: &quot;The per-node write is one record rather than two, with narrative in the plan&#x27;s comments and measurements in the committed run ledger; a plan-terminal write is refused when no evidence record carries plan-evidence-for, with a test asserting the refusal fires rather than the plan closing silently; and every evidence record under an archive path belongs to a plan with a terminal status, verified over the live corpus.&quot;, &quot;slug&quot;: &quot;landed-record-at-closure&quot;, &quot;why_now&quot;: &quot;Execution evidence is written into a file whose suffix asserts it landed and whose directory asserts it is frozen, while the plan is at impl 0.33 and the file is rewritten twice inside twenty minutes. It also duplicates the section-anchored plan comment that already carries the same commit, gate verdict and artifacts, with nothing keeping the two equal.&quot;}">landed-record-at-closure</li>
  <li data-slug="completion-is-not-silent" data-item="{&quot;done_when&quot;: &quot;A dispatch into a project holding a run terminal-and-unpromoted past the threshold is refused with a message naming each such run and its resolving command; a dispatch made while a run finished moments ago is not refused; an explicit override dispatches and records itself on the run record; and the closing drain ledger reports an unreconciled-run count derived from the live view alongside foldable-remaining, with any deliberately-left run carrying a recorded reason.&quot;, &quot;slug&quot;: &quot;completion-is-not-silent&quot;, &quot;why_now&quot;: &quot;Two nodes finished and sat unpromoted for 55 minutes in the session that wrote this, discovered only when the lead asked what was running. Reckon had already classified both as completed_unpromoted, computed their budget overrun at 2009 and 1884 seconds, and printed the command that clears them. Nothing read any of it. The existing rule is prose and was followed on about eight dispatches and skipped on two, which is how the member-collision rule failed earlier in the same sprint.&quot;}">completion-is-not-silent</li>
  <li data-slug="concurrency-and-schedule-visibility" data-item="{&quot;done_when&quot;: &quot;Two candidate nodes whose declared write scopes overlap by path containment are refused before any worktree exists, naming the owning run and the conflicting path, with a node claiming a declared source judged to conflict with one claiming its generated output; a lane planner returns a partition matching the hand-computed one for the three-node case; a plan whose sprint sits behind an earlier sprint holding open work reports schedule-deferred with a reason naming that sprint while staying dependency-ready and listed in the ordered roadmap; and two concurrently dispatched adjacent nodes exchange a question and an answer without coordinator involvement, with a peer read that goes unanswered degrading to a NEEDS-HELP report rather than expiring silently.&quot;, &quot;slug&quot;: &quot;concurrency-and-schedule-visibility&quot;, &quot;why_now&quot;: &quot;Measured while shipping this sprint&#x27;s own completion-is-not-silent: the session ran one worker against thirteen dependency-ready plans and fifteen idle roster members. Running at one was locally correct, because the three sections shipped all wrote the same four files and three contract tests bind the skill text to the CLI surface in both directions. It was reached by a coordinator reading test bodies by hand, and nothing in the system could have reached or contradicted it. Two agents have already contradicted each other in writing about whether a plan is ready, because readiness answers whether prerequisites are met and is read as whether work should start.&quot;}">concurrency-and-schedule-visibility</li>
  <li data-slug="binding-rules-need-bound-checks" data-item="{&quot;done_when&quot;: &quot;A test enumerates every tool namespace configured in pyproject.toml, resolves each against the declared dependency sets and build-system requires, and fails on any resolving to nothing, shown failing before the ruff declaration and passing after, with uv run ruff check resolving; and the snapshot-detection decision is locked with either a mechanism shown to flag at least three of the four recorded instances against their pre-repair revisions while flagging none of the documented carve-outs, or a recorded negative result stating no mechanism was found.&quot;, &quot;slug&quot;: &quot;binding-rules-need-bound-checks&quot;, &quot;why_now&quot;: &quot;Two sessions shipping here on 2026-08-25 hit two unrelated defect classes and both were violations of rules already written, already binding and already argued, with nothing checking either. Four snapshot-as-contract assertions across four files, and a tool configured with a real [tool.ruff] block and never declared, so the documented pre-stage lint command could never resolve and every clean lint recorded here came through a user-level install by absolute path. This sprint&#x27;s own description is the thesis: defects invisible until they had already happened.&quot;}">binding-rules-need-bound-checks</li>
  <li data-slug="native-agent-dispatch-guard" data-item="{&quot;done_when&quot;: &quot;A pre-tool-use hook refuses a new background-agent spawn in a synthetic crew-managed repo with a message naming the crew dispatch re-route, passes through a non-crew repo untouched, and honours both waivers (in-harness run awaiting attach; explicit environment override), each branch asserted by test; sync installs the wiring idempotently with a clean removal path; and the routing line is present in the status, roadmap, sprint and create skills, pinned by a contract test.&quot;, &quot;slug&quot;: &quot;native-agent-dispatch-guard&quot;, &quot;why_now&quot;: &quot;Two coordinator sessions in one morning launched harness-native background-agent fleets in crew-managed repositories against an explicit codex-worker directive, because the routing rule lives only in the ship skill and nothing checks it at the moment of spawn. Ten unledgered agent runs spent harness-model budget invisible to watch, drain, manifests and calibration. This sprint&#x27;s thesis is exactly this defect class: a binding rule with no bound check decays.&quot;}">native-agent-dispatch-guard</li>
  <li data-slug="rendered-evidence-on-this-host" data-item="{&quot;done_when&quot;: &quot;A rendered probe on this host loads a page from the local server and returns a DOM, or the cause is named with the trace demonstrating it and the required host change stated to whoever can make it; and each of the six enumerated captures is either taken or retired with the reason its behaviour is adequately covered without one.&quot;, &quot;effort_hours&quot;: 6, &quot;roi&quot;: &quot;mid&quot;, &quot;slug&quot;: &quot;rendered-evidence-on-this-host&quot;, &quot;title&quot;: &quot;A Browser That Can Reach the Server It Is Testing&quot;, &quot;why_now&quot;: &quot;Seven sections of the sprint-surface rebuild landed on browser-free evidence because headless Chrome on this host completes no HTTP navigation - file and data URLs load in 0.4s, curl and node fetch return 200 in milliseconds, and a 507-byte static file over loopback hangs. Seven cause classes are eliminated with disproving evidence and the next discriminating test is specified. The captures owed cannot live as followups on a completed plan, because roadmap excludes those from pending work and the obligation would be invisible exactly where someone decides what to do next.&quot;}">rendered-evidence-on-this-host</li>
  </ol>
