  <li data-slug="sprint-horizon-surface" data-item="{&quot;done_when&quot;: &quot;No horizon longer than 48 hours and a now-line derived from the current instant that advances without a reload; every sprint present as a table row carrying status, implementation, derived sprint_order position and blocked/delayed/active flags, with the active-pointer conflict badged rather than resolved; full content reachable by scrolling at a viewport that previously truncated it; the kanban replaced by the derived ready set with per-row reasons and no rank column; a plan created while the page is open visible with no document navigation; and a served page load fetching zero third-party origins and performing zero in-browser JSX transformation, with before/after wall-clock on the same project and an edited component still visible on reload with no build command run.&quot;, &quot;effort_hours&quot;: 16, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;sprint-horizon-surface&quot;, &quot;title&quot;: &quot;Plan the Next Two Days, Not the Next Two Months&quot;, &quot;why_now&quot;: &quot;The lead reported the Sprints screen unusable with a screenshot, and reproducing all seven complaints against the live service confirmed each one plus a mis-attribution: the ten-second reload everybody read as discovery latency is 0.02s warm, while the client re-pays four remote origins, two React development bundles and a 240,579-byte in-browser JSX transform on every load. The screen also cannot show the all-sprints state the server began composing at d5d876f, so the data exists and only the view is missing.&quot;}">sprint-horizon-surface</li>
  <li data-slug="sprint-scope-and-surface" data-item="{&quot;done_when&quot;: &quot;A sprint holding items from two mounted projects resolves from either repository with the same membership; an unmounted member reports as an explicit unresolved row; tags exist and are backfilled so the layout migration runs with provable zero grouping loss; the 119 at-risk links are proven to still resolve; and the one-shot migration scripts are deleted in the commit that records completion.&quot;, &quot;slug&quot;: &quot;sprint-scope-and-surface&quot;, &quot;why_now&quot;: &quot;Sprint items carry a bare slug while every other ref already accepts a project qualifier, so the dependency graph spans repositories and the sprint that orders it cannot. Consumes the released version and the onboarding path.&quot;}">sprint-scope-and-surface</li>
