<main class="reckon-resource" data-type="sprint" data-id="S19">
  <ol data-reckon="sprint-items">
  <li data-slug="scoring-should-stop-a-promotion" data-item="{&quot;done_when&quot;: &quot;A promotion cannot land a run whose review is absent, stale, or composed on a lane that could not have formed it; every refusal in the promotion path names a discharge.&quot;, &quot;slug&quot;: &quot;scoring-should-stop-a-promotion&quot;, &quot;why_now&quot;: &quot;The review reflex now fires on the healthy path and six repairs landed with scored reviews, but the reviews themselves found capabilities that landed without callers \u2014 the revision key has no writer and is dropped at the promotion boundary, and the lane selection does not reach the command an operator copies.&quot;}">scoring-should-stop-a-promotion</li>
  <li data-slug="a-review-can-see-the-figure" data-item="{&quot;done_when&quot;: &quot;A backend declares whether it accepts image input, a figure profile dispatched to a lane declaring none is refused by name rather than falling through, and the lane&#x27;s ability to apply this repository&#x27;s visual rules is measured against known-bad figures rather than against the flag existing.&quot;, &quot;slug&quot;: &quot;a-review-can-see-the-figure&quot;, &quot;why_now&quot;: &quot;Poloidal-flux plots are the evidence in the physics repositories and every figure shipped here shipped unreviewed against its own visual rules. The metered lane has accepted attached images throughout; what is missing is any way to declare which lanes can, so a figure review would route by luck and answer from the filename.&quot;}">a-review-can-see-the-figure</li>
  <li data-slug="the-orchestrator-lane-is-not-a-worker-lane" data-item="{&quot;done_when&quot;: &quot;A background dispatch to a lane declaring the orchestrator role is refused with a named discharge, the override is explicit and recorded on the row, and the rule with its reason reaches the dispatch help, the skills and the tool descriptions.&quot;, &quot;slug&quot;: &quot;the-orchestrator-lane-is-not-a-worker-lane&quot;, &quot;why_now&quot;: &quot;Sessions moved their reviews onto the orchestrator lane because the locally served lane died mid-turn nine times in one day. That lane runs every orchestrator on this workstation, so saturating it does not slow one node, it stops the layer that dispatches, merges, promotes and records \u2014 leaving work in flight unreachable by the only processes that could reconcile it.&quot;}">the-orchestrator-lane-is-not-a-worker-lane</li>
  <li data-slug="a-review-dies-where-nobody-is-looking" data-item="{&quot;done_when&quot;: &quot;A dead worker carries the client&#x27;s exit status and signal as a terminal record written by the launcher rather than inferred by a reader; a run whose manifest and review record are complete is never classified abandoned on the strength of how its process ended; the sweep composes from the owning run&#x27;s backend and prints the composed argv; a rollback chains the cause it was rolling back instead of replacing it; and a duplicated plan-* meta scalar is an error rather than a silent last-wins read.&quot;, &quot;slug&quot;: &quot;a-review-dies-where-nobody-is-looking&quot;, &quot;why_now&quot;: &quot;Two coordinator sessions instrumented this independently on 2026-09-22: 34 of 36 mid-thinking deaths are review-role in the read-only sandbox and zero are implement-role, with no error text and thinking length irrelevant. A per-scope memory kill was the leading cause until the counter proposed as its acceptance test read unchanged across a fresh death, and the one exit-137 turned out to belong to a different failure. The runs carry no record of how they ended, which is why a plausible cause survived an afternoon and why that record is the first thing to build.&quot;}">a-review-dies-where-nobody-is-looking</li>
  </ol>
</main>
