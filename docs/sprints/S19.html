  <script type="application/json" id="reckon-resource-state">{"description":"Every item here exists because a surface reported something other than what happened. A review worker dies mid-thinking and the runs carry no record of how they ended, so every account of the cause has been inferred from what the run stopped doing — including one this coordinator published and one two sessions cross-confirmed, both refuted within the hour by the instrument their own authors proposed as the acceptance test. A project-wide sweep composes reviews on a lane neither the owning run nor the owning coordinator chose, and two competent readers instrumenting it reached incompatible conclusions, which means the composition is not observable rather than merely wrong. A rollback refuses on the pointer its own call just published and its error replaces the cause it was rolling back. A duplicated meta scalar parses last-wins while the guard returns OK, so two successful writes coexist with a promotion refusing that nothing moved. And a reviewer that cannot open a figure judges a filename, on a lane that has accepted attached images throughout while nothing could declare it. The test for every item is whether the surface says what it actually observed, and whether a claim carries the measurement that would refute it.","ends":"","id":"S19","items":[],"starts":"","status":"done","summary":"Opened 2026-09-22 as the review sprint. Four members. Sequencing is load-bearing: the orchestrator-lane fence holds refusal-by-default until the review deaths are explained, because reviews moved onto the lane that runs this workstation's orchestrators only after the locally served lane began killing them, and closing that hatch over an unrepaired lane costs the review loop entirely. ESTABLISHED: 34 of 36 mid-thinking deaths are review-role in the read-only sandbox, zero implement-role, no error text, thinking length irrelevant, record counts at death spanning 220 to 12,105, and resume continues a dead review in the same session so the cause is bounded to the run. CLOSED: the memory hypothesis, on three flat counter readings at 21:22, 21:28 and 21:52 across a wave containing a death, with one sub-case left as a single command rather than an open question — read the worker's own cgroup, since a flat counter cannot distinguish no kill from a kill in a scope nobody is watching. The single exit-137 belonged to a sixteen-second teardown on an uncommitted capture. CONFOUNDED: effort against role, since every review ran xhigh and every implement ran high — no fix may cite effort until one review is re-dispatched at high and compared. FIRST NODE is the terminal record itself: with no record of how a run ended, any hypothesis fits, which is why two were published and both fell.","theme":"A review reports what it could actually see","type":"sprint","version":11}</script>
