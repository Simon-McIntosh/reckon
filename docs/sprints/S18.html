  <ol data-reckon="sprint-items">
  <li data-slug="a-lane-can-say-where-it-stands" data-item="{&quot;done_when&quot;: &quot;The claude dialect returns a reading from the account surface rather than None, with transport owned by the dialect and every failure still funnelling into the single unknown-with-reason path; a reading whose age exceeds the declared shelf life fails to clear at any utilisation on any lane, asserted over synthetic lanes absent from the shipped configuration rather than over the nine currently configured; an unrecognised payload shape and an expired credential each return unknown rather than a low utilisation, proven by a payload missing the named window and one whose utilisation field is absent; the on-disk cache is used only as a fallback and every surface rendering it also renders its fetch age; a declared coordinator reserve is applied by crew preflight at the command a caller actually runs, with its reasoning recorded beside the key; and a fresh reading below the ceiling clears without re-reading inside the cadence.&quot;, &quot;effort_hours&quot;: 6, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;a-lane-can-say-where-it-stands&quot;, &quot;why_now&quot;: &quot;The subscription account publishes its own quota position over a free read that answers in 0.27s for zero model tokens, and reckon reads none of it: every claude lane&#x27;s recorded position is between 145 and 199 hours old against a declared five-minute shelf life, so the fence reports the lane clear while the account sits at 89 percent of its weekly window with a scoped window at 93 percent marked critical. This sprint replaces hand-written priors with figures read from evidence, and the budget fence is the one surface still inferring a figure it could read. It is also the position mark the burn meter renders and the input the coordinator-accounting item needs to fence a wave, so it precedes both.&quot;}">a-lane-can-say-where-it-stands</li>
  <li data-slug="crew-observability-truth" data-item="{&quot;done_when&quot;: &quot;A liveness answer agrees with the process table in both directions of desync, asserted through the dispatch guard rather than a helper; a gc call whose named project and resolved repository disagree is refused or resolved from mounts per the locked decision, and every gc result names the repository it scanned; the working count excludes any run whose process is gone or whose manifest is terminal, across every phase a pointer can hold; and no liveness or stall judgement is derived from file mtime, asserted against a recorded stream that is byte-active and generation-idle.&quot;, &quot;slug&quot;: &quot;crew-observability-truth&quot;, &quot;why_now&quot;: &quot;Five distinct display defects were measured in one execution session, and in every case a person noticed before the tooling did — twice by looking at GPU utilisation, three times by stat-ing a manifest. Three were fixed inside the local-lane plan because that is where they surfaced; two have no owning plan at all, which by the project&#x27;s own rule makes them hidden work. One of those two is the field crew dispatch reads to decide whether a fleet is being heard, and the other silently reported 124 reclaimable worktrees as zero. Both are cheap to fix and both are load-bearing for every sprint that dispatches workers, not only this one.&quot;}">crew-observability-truth</li>
  </ol>
  <script type="application/json" id="reckon-resource-state">{"description":"Every defect gathered here has one shape: a statement that is true and answers a question nobody asked, so the surface carrying it looks healthy while the fact a reader needed is absent. A budget reading 186 hours old reports its lane clear against a declared five-minute shelf life, because the position is inferred from worker streams that stop arriving when nobody dispatches to that lane - while the account publishes its own position over a free read that answers in 0.27 seconds. Eight runs killed by one lane swap report as eight independent worker deaths, each carrying a terminal record whose subtype is success while its own text says the configured model does not exist. Three different verbs - completing after a merge, discarding a dead pointer, stopping a live worker - all render as promoted, and a promoted row carries no spend at all in 90 of 90 cases because promotion deletes the pointer that the spend derivation reads from. A spend column shipped green against a done-when satisfied by rendering an absence marker, while being unmeasured in 98 percent of rows. The predecessor sprint replaced routing priors with figures read from evidence and largely succeeded; what it left behind is the class of figure that is read, rendered, and still not the one a reader needs. The test for every item here is not whether a figure is correct but whether the surface distinguishes measured, unmeasured, and not-yet-meaningful, and whether a reading that has gone stale says its own age rather than its last value.","ends":"","id":"S18","items":[{"done_when":"The claude dialect returns a reading from the account surface rather than None, with transport owned by the dialect and every failure still funnelling into the single unknown-with-reason path; a reading whose age exceeds the declared shelf life fails to clear at any utilisation on any lane, asserted over synthetic lanes absent from the shipped configur
