  <script type="application/json" id="reckon-resource-state">{"description":"Every defect gathered here has one shape: a statement that is true and answers a question nobody asked, so the surface carrying it looks healthy while the fact a reader needed is absent. A budget reading 186 hours old reports its lane clear against a declared five-minute shelf life, because the position is inferred from worker streams that stop arriving when nobody dispatches to that lane - while the account publishes its own position over a free read that answers in 0.27 seconds. Eight runs killed by one lane swap report as eight independent worker deaths, each carrying a terminal record whose subtype is success while its own text says the configured model does not exist. Three different verbs - completing after a merge, discarding a dead pointer, stopping a live worker - all render as promoted, and a promoted row carries no spend at all in 90 of 90 cases because promotion deletes the pointer that the spend derivation reads from. A spend column shipped green against a done-when satisfied by rendering an absence marker, while being unmeasured in 98 percent of rows. The predecessor sprint replaced routing priors with figures read from evidence and largely succeeded; what it left behind is the class of figure that is read, rendered, and still not the one a reader needs. The test for every item here is not whether a figure is correct but whether the surface distinguishes measured, unmeasured, and not-yet-meaningful, and whether a reading that has gone stale says its own age rather than its last value. The sprint's later additions carry the same shape one layer down, in the checks themselves: a guard that swallows its own exception, a reflex built and tested but called from no loop that runs, and a test that pins the caption rather than the mark it exists to hold are all green surfaces over an absent fact.","ends":"","id":"S18","items":[],"starts":"","status":"done","summary":"HANDOFF 2026-09-15T05:10Z, after one long session on crew-observability-truth. Resume with /reckon-ship crew-observability-truth. STATE: 24 promoted runs on that plan, 23 gates passed and one recorded failed deliberately because its headline measure was unmet though its tests were green; 76 tests added; 56 merges to main; every landing verified at the merged head by a marker the change introduced rather than by the merge's verdict, which caught one merge reporting 'Already up to date' while changing nothing. impl 0.40, derived from 8 sections complete of 20 executable and corrected downward twice - once from an inherited 0.97, once from this coordinator's own drift to 0.45 four hours after writing the derivation down. Drain closed at foldable-remaining 0 and unreconciled-runs 0; all 23 session worktrees removed after checking both required conditions. WHAT LANDED, four strands: manifest classification, where six finished runs were reported dead across three sessions by three mechanisms, now fixed at the parser (refuse rather than half-succeed), at the classifier (abandoned means the worker died; commits beyond base outrank any manifest format), and with a liveness precedence that stops strictness misreporting live work; the row and the ledger, where the grid is calibrated from a measured pane, dead cells are cut, the reason widened 57 to 76 columns, and review dimensions now reach the committed row queryable against the parent run; the landing contract, where workers author their own plan record and evidence anchor in their worktree, the fence grants those paths and exempts them from exclusivity, and promotion commits what it writes; and repairs that would otherwise have been walked past, including four routing-evidence failures that were source defects rather than stale tests. OUTSTANDING AND UNBLOCKED: one contract node is specified and undispatched, carrying two clauses that are prompt text in reckon/crew/prompts.py - a worker edits the plan and evidence files in its worktree and
