  <li data-slug="pypi-release" data-item="{&quot;done_when&quot;: &quot;A fresh environment installs reckon-plans from PyPI, the installed version matches the git tag exactly, and the console script runs reckon build on a scratch project with no checkout present - which proves the wheel ships its UI assets rather than reaching into a source tree.&quot;, &quot;slug&quot;: &quot;pypi-release&quot;, &quot;why_now&quot;: &quot;reckon-plans resolves to no distribution, so every consumer&#x27;s CI pins a git ref: unpinned a reckon change breaks their build with no signal, pinned there are N repositories to bump. This is the one genuine cost of the federated shape and it is removable.&quot;}">pypi-release</li>
  <li data-slug="project-onboarding" data-item="{&quot;done_when&quot;: &quot;Onboarding detects the existing Pages publisher and picks a non-destructive strategy per case, refusing rather than guessing when it cannot tell; the badge is idempotent with a locally committed mark and is omitted when there is no site to link; publication stays a separate explicit opt-in; every case asserted against a recorded Pages configuration rather than live GitHub.&quot;, &quot;slug&quot;: &quot;project-onboarding&quot;, &quot;why_now&quot;: &quot;A repository gets exactly one Pages site, and a measured example already serves one from a branch root under the legacy build type. A generated deploy-pages workflow switches that build type and REPLACES the existing site, so the destructive path is currently the default one.&quot;}">project-onboarding</li>
  <li data-slug="sprint-scope-and-surface" data-item="{&quot;done_when&quot;: &quot;A sprint holding items from two mounted projects resolves from either repository with the same membership; an unmounted member reports as an explicit unresolved row; tags exist and are backfilled so the layout migration runs with provable zero grouping loss; the 119 at-risk links are proven to still resolve; and the one-shot migration scripts are deleted in the commit that records completion.&quot;, &quot;slug&quot;: &quot;sprint-scope-and-surface&quot;, &quot;why_now&quot;: &quot;Sprint items carry a bare slug while every other ref already accepts a project qualifier, so the dependency graph spans repositories and the sprint that orders it cannot. Consumes the released version and the onboarding path.&quot;}">sprint-scope-and-surface</li>
  </ol>
