<main class="reckon-resource" data-type="sprint" data-id="S12">
  <ol data-reckon="sprint-items">
  <li data-slug="pypi-release" data-item="{&quot;done_when&quot;: &quot;A fresh environment installs reckon-plans from PyPI, the installed version matches the git tag exactly, and the console script runs reckon build on a scratch project with no checkout present - which proves the wheel ships its UI assets rather than reaching into a source tree.&quot;, &quot;slug&quot;: &quot;pypi-release&quot;, &quot;why_now&quot;: &quot;reckon-plans resolves to no distribution, so every consumer&#x27;s CI pins a git ref: unpinned a reckon change breaks their build with no signal, pinned there are N repositories to bump. This is the one genuine cost of the federated shape and it is removable.&quot;}">pypi-release</li>
  <li data-slug="project-onboarding" data-item="{&quot;done_when&quot;: &quot;Onboarding detects the existing Pages publisher and picks a non-destructive strategy per case, refusing rather than guessing when it cannot tell; the badge is idempotent with a locally committed mark and is omitted when there is no site to link; publication stays a separate explicit opt-in; every case asserted against a recorded Pages configuration rather than live GitHub.&quot;, &quot;slug&quot;: &quot;project-onboarding&quot;, &quot;why_now&quot;: &quot;A repository gets exactly one Pages site, and a measured example already serves one from a branch root under the legacy build type. A generated deploy-pages workflow switches that build type and REPLACES the existing site, so the destructive path is currently the default one.&quot;}">project-onboarding</li>
  <li data-slug="sprint-scope-and-surface" data-item="{&quot;done_when&quot;: &quot;A sprint holding items from two mounted projects resolves from either repository with the same membership; an unmounted member reports as an explicit unresolved row; tags exist and are backfilled so the layout migration runs with provable zero grouping loss; the 119 at-risk links are proven to still resolve; and the one-shot migration scripts are deleted in the commit that records completion.&quot;, &quot;slug&quot;: &quot;sprint-scope-and-surface&quot;, &quot;why_now&quot;: &quot;Sprint items carry a bare slug while every other ref already accepts a project qualifier, so the dependency graph spans repositories and the sprint that orders it cannot. Consumes the released version and the onboarding path.&quot;}">sprint-scope-and-surface</li>
  <li data-slug="project-state-fleet-migration" data-item="{&quot;done_when&quot;: &quot;A field-by-field harness proves relational, organisational, sprint-membership and nested-collection metadata survives migration on both already-migrated projects against their frozen snapshots, with the two measured false positives excluded by name; imas-ambix and nova are migrated and verified against that same harness; all twelve projects report distributed state; sync creates distributed state natively; and both migration commands are deleted.&quot;, &quot;slug&quot;: &quot;project-state-fleet-migration&quot;, &quot;why_now&quot;: &quot;Ten of twelve mounted projects still hold monolithic legacy state, and work is blocked in two of them. The lead wants imas-ambix and nova migrated first so that work can resume. This also carries the sync change that makes new projects born distributed, which is what turns the migration tools into genuine one-shots.&quot;}">project-state-fleet-migration</li>
  <li data-slug="resource-tagging-system" data-item="{&quot;done_when&quot;: &quot;Tag identity is normalised and reported at write with a reserved facet separator; every typed resource carries tags and a resource appears under all of them rather than only the first; the discovery envelope carries a live inventory with usage counts that reckon-create surfaces at authoring time; a rename rewrites the corpus in one version-safe pass and merges onto an existing tag; audit reports singletons and near-duplicate pairs; and the backfill from the saved pre-image proves zero grouping loss as a suite assertion.&quot;, &quot;slug&quot;: &quot;resource-tagging-system&quot;, &quot;why_now&quot;: &quot;Directories are the only topical grouping reckon has and the layout migration deletes them - 71 documents lose their programme irrecoverably. A bare comma-separated field is not enough: without one canonical identity per tag the corpus fragments into four spellings of the same word within a week, which is a failure already paid for twice in a consuming project.&quot;}">resource-tagging-system</li>
  <li data-slug="registered-repo-state-migration" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Runtime discovery gives every registered repository a terminal migration-ledger state, recoverable snapshot, fresh audit/build result and typed evidence.&quot;, &quot;slug&quot;: &quot;registered-repo-state-migration&quot;, &quot;why_now&quot;: &quot;After the new contracts stabilize, every host-registered repository must migrate or the fleet will retain contradictory state models.&quot;}">registered-repo-state-migration</li>
  </ol>
