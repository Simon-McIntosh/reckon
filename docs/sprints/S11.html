  <script type="application/json" id="reckon-resource-state">{"description":"Raise sustained worker concurrency from the measured 2.26 toward the demonstrated 13-wide peak without forcing parallelism plans do not expose: truthful admission gates, rolling wave refill, measured per-role time budgets, cheap fleet observation, and a garbage-collection story for the 12 GB worktree backlog.","ends":"2026-08-17","id":"S11","items":[{"done_when":"Codex preflight reports numeric utilisation via a once-per-wave probe; the competence gate's threshold equals the horizon it names; refusals carry typed exit codes","slug":"gate-signal-repair","why_now":"The budget gate has never held in 259 runs (codex publishes no headroom) and the competence gate compares mismatched units off a frozen cache"},{"done_when":"Rolling slot refill in the contract; narrowed landing freeze; per-role budgets near measured p75 with a watchdog; one-call fleet polling; concurrency config wired or deleted","slug":"fleet-throughput-contract","why_now":"~45% of purchased worker-time idles at the contract's wave barrier and per-node orchestrator cost is 15-18k tokens — both artificial"},{"done_when":"crew gc reclaims the integrated/promoted subset dry-run-first; every removal path consults live pointers","slug":"crew-workspace-hygiene","why_now":"27 leftover worktrees hold 12 GB, 270 run dirs are uncollected, and cleanup once deleted a worktree under a live run"}],"starts":"","status":"done","summary":"All three plans shipped at impl 1.0; final full suite 1941 passed / 0 failed / 0 skipped at 3e017f0. Both admission gates are now truthful: the competence threshold equals the horizon it names under either calibration direction with refusals as documented exit 5, and known budget headroom requires a numeric utilisation with a retained rate-limit window and one codex probe per wave reused across dispatches (gate-signal-repair, c7a372e + d074d3f). The contract no longer serialises artificially: rolling slot refill replaces the wave barrier under the rule that no dependent node builds on unverified work, the landing freeze narrowed to promotion and merge, and the mandatory per-session read fell from ~24k to 10,930 tokens. Time budgets came from the ledger - implement 8 m and review 4 m from p75 at n=79 and n=10, with cleanup and investigate left as documented fallbacks rather than derived from 2 and 0 samples - and the dead per-backend concurrency key was removed per the locked decision, legacy host values warned rather than fatal. Observation got cheap: version-only reads cost 126 B against 2,542 B raw, plus ledger and live-pointer filters. Reconciliation made surface parity mechanical - 5 tests pin 6 crew views, 14 CLI command paths, 6 dispatch exit outcomes and 3 refusal remedies (fleet-throughput-contract, 36e668a + 43ebf37 + 372c243 + d5d3c35 + 864fc0c + 9747555). Workspace hygiene shipped a dry-run-first crew gc with a live-pointer consult on every removal path, reclaiming 5 integrated unclaimed trees and 2.563 GiB while correctly refusing 17 unintegrated peer trees of ~94 GiB (crew-workspace-hygiene, 039dfaa). Four findings were produced by running the fleet on itself: the measured backlog was 109 GiB across 35 trees rather than the recorded 12 GB across 27; a literal identical-inventory gate is unmeasurable on a workstation peers mutate, so clearance asserts what it did not invoke; an exclusive scope can be exclusive yet insufficient, so a generated file must never be scoped without its source; and the new test role shipped read-only, caught when the sprint gate could not collect a single test, now fixed so an execution-capable role cannot ship without worktree-write. Evidence: docs/evidence/archive/{crew-workspace-hygiene,gate-signal-repair,fleet-throughput-contract}-landed.html.","theme":"Fleet throughput","type":"sprint","version":3}</script>
