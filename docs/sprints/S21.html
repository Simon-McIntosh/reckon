<main class="reckon-resource" data-type="sprint" data-id="S21">
  <ol data-reckon="sprint-items">
  <li data-slug="a-placement-with-no-reservation-mints-one-per-worker" data-item="{&quot;done_when&quot;: &quot;A dispatch declaring placement with no readable reservation holds the shared allocation, publishes it to the host-global record, and runs its worker as a step inside it. A second dispatch under a different project reads that same record, starts no allocation of its own, and runs its worker as a step in the allocation it found, asserted against a recording scheduler as exactly one allocation request across both. Concurrent dispatches racing from no record still produce one allocation, the hold being serialised across processes rather than within one. A live allocation is never replaced, a probe that could not complete reads as unknown rather than absent, and a backend declaring no placement is untouched. It lands with the keying retirement or not at all.&quot;, &quot;slug&quot;: &quot;a-placement-with-no-reservation-mints-one-per-worker&quot;, &quot;why_now&quot;: &quot;It is the precondition for everything else in the sprint, and the distinction it turns on is between minting and ensuring. Minting is per worker and is the defect: twenty workers ask for twenty allocations and most queue. Ensuring is per workstation and is the design: the first dispatch creates what is missing and the nineteenth finds it held. The current fallback looks like the second and behaves like the first, because a bare srun carries no job id and publishes nothing for the next worker to find.&quot;}">a-placement-with-no-reservation-mints-one-per-worker</li>
  <li data-slug="the-fleet-shares-one-allocation" data-item="{&quot;done_when&quot;: &quot;Placement is declared once in the host layer, the per-project reservation keying is retired so a project can read a record it did not publish, and a dispatch from a project that has never heard of it becomes a step in the one reservation. Two dispatches under two different projects reach the same published job id with exactly one allocation created across the pair, counting allocations rather than placement requests. The roster counts placed runs fleet-wide, asserted over a population on one backend holding both placed and unplaced runs, and a project whose runs are not placed is unbounded by it.&quot;, &quot;slug&quot;: &quot;the-fleet-shares-one-allocation&quot;, &quot;why_now&quot;: &quot;The goal is to move the fleet off the login node, and a per-project declaration solves it one repository at a time: five repositories would hold five allocations, well over a hundred cores, to escape a shared four-core ceiling. The design already describes one reservation held once with every session placing into it; what has never been done is declaring it where more than one project reads.&quot;}">the-fleet-shares-one-allocation</li>
  <li data-slug="a-cutover-is-measured-against-its-baseline" data-item="{&quot;done_when&quot;: &quot;Workers across at least two projects run as steps in the one reservation, proved by a live worker&#x27;s job id being the job id of the published reservation rather than by its host, since a per-worker allocation lands on the same node. The throttled fraction of the CPU time the agents themselves consume is measured over a working day from whichever cgroup is running them, the counter file named on each side, and reported beside the printed baseline of 0.3366 with the direction of the change named plainly. The allocation-death path is exercised once at a chosen moment and shows that the next dispatch re-holds the shared allocation and later workers join it, and a rollback is stated. Every background crew process moves in the order section 4 of the plan sets: srun --overlap --pty is first proven from a zellij pane, then producers move, proven by job id with none left on the login node, then all sessions move in one operation with a cross-session message delivered between two placed sessions, and a placed session runs uv run --no-sync through the launcher. The report claims login-node relief only, not reduced GPFS pressure.&quot;, &quot;slug&quot;: &quot;a-cutover-is-measured-against-its-baseline&quot;, &quot;why_now&quot;: &quot;Twenty-eight cores against roughly thirty concurrent sessions has never run under load, so the per-worker share after the move is a projection. A worse share than the login node would be a regression every cheap signal would miss. And a step created with srun --overlap dies with its allocation, unlike an ssh session, so losing the reservation kills every placed worker on the machine at once.&quot;}">a-cutover-is-measured-against-its-baseline</li>
  </ol>
