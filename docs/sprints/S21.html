<main class="reckon-resource" data-type="sprint" data-id="S21">
  <ol data-reckon="sprint-items">
  <li data-slug="a-placement-with-no-reservation-mints-one-per-worker" data-item="{&quot;done_when&quot;: &quot;A backend declaring placement with no readable reservation refuses, naming the reservation path, the project and the ensure line. No allocation is requested on that path, asserted as an empty request set against a recording scheduler. The test that currently pins the minting behaviour is replaced by one whose name states the refusal, and a backend declaring no placement is untouched.&quot;, &quot;slug&quot;: &quot;a-placement-with-no-reservation-mints-one-per-worker&quot;, &quot;why_now&quot;: &quot;It is the safety precondition for everything else in the sprint. Host-layer placement is what makes the fallback reachable: a project that has published no reservation of its own takes it on its first dispatch, and reservations became per-project keyed on 2026-09-23 so a named project deliberately does not inherit the host-global record.&quot;}">a-placement-with-no-reservation-mints-one-per-worker</li>
  <li data-slug="the-fleet-shares-one-allocation" data-item="{&quot;done_when&quot;: &quot;Placement is declared once in the host layer and a dispatch from a project that has never heard of it becomes a step in the one reservation. Two dispatches under two different projects reach the same published job id and request one allocation between them. The roster refusal counts placed runs only, asserted over a population mixing placed and unplaced runs on one backend, and a project whose runs are not placed is unbounded by it.&quot;, &quot;slug&quot;: &quot;the-fleet-shares-one-allocation&quot;, &quot;why_now&quot;: &quot;The goal is to move the fleet off the login node, and a per-project declaration solves it one repository at a time: five repositories would hold five allocations, well over a hundred cores, to escape a shared four-core ceiling. The design already describes one reservation held once with every session placing into it; what has never been done is declaring it where more than one project reads.&quot;}">the-fleet-shares-one-allocation</li>
  <li data-slug="a-cutover-is-measured-against-its-baseline" data-item="{&quot;done_when&quot;: &quot;Workers across at least two projects run as steps in the one reservation, proved by resolving a live worker&#x27;s host rather than by configuration. The throttled share is measured over a working day and reported beside the recorded baseline with the direction of the change named plainly. The allocation-death path is exercised once deliberately and its recovery written down, and a rollback is stated.&quot;, &quot;slug&quot;: &quot;a-cutover-is-measured-against-its-baseline&quot;, &quot;why_now&quot;: &quot;Twenty-eight cores against roughly thirty concurrent sessions has never run under load, so the per-worker share after the move is a projection. A worse share than the login node would be a regression every cheap signal would miss. And a step created with srun --overlap dies with its allocation, unlike an ssh session, so losing the reservation kills every placed worker on the machine at once.&quot;}">a-cutover-is-measured-against-its-baseline</li>
  </ol>
  <script type="application/json" id="reckon-resource-state">{"description": "Every agent on this workstation runs on the login node, inside one user slice capped at four cores, contending with editors, git and every interactive session. Reckon already has the mechanism to fix it: a reservation held once, published where every session reads it, and workers run as steps inside it. What has never been done is declaring the placement anywhere more than one project reads, so the fleet escapes the ceiling one repository at a time or not at all. Declaring it at the host layer exposes a fallback that inverts the design: a project with no published reservation gets a bare srun and takes an allocation per worker. On 2026-09-23 the neighbouring defect was measured live, a host-global reservation counted forty five runs across four repositories against a ceiling of twenty five while one step ran inside the allocation, refusing dispatch workstation-wide for four minutes. This sprint closes the fallback first, then declares the placement once for the whole fleet and counts the roster by what was actually placed, then rolls the fleet in and measures the throttled share over a working day against the baseline already recorded rather than declaring the move a success.", "ends": "", "id": "S21", "items": [{"done_when": "A backend declaring placement with no readable reservation refuses, naming the reservation path, the project and the ensure line. No allocation is requested on that path, asserted as an empty request set against a recording scheduler. The test that currently pins the minting behaviour is replaced by one whose name states the refusal, and a backend declaring no placement is untouched.", "slug": "a-placement-with-no-reservation-mints-one-per-worker", "why_now": "It is the safety precondition for everything else in the sprint. Host-layer placement is what makes the fallback reachable: a project that has published no reservation of its own takes it on its first dispatch,
