  <li data-slug="execution-orchestration-hardening" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Bounded sprint operations and a portable execution ledger pass interruption, conflict and worker-failure tests.&quot;, &quot;slug&quot;: &quot;execution-orchestration-hardening&quot;, &quot;why_now&quot;: &quot;Codex needs bounded, resumable, capability-aware execution rather than a Claude-specific fleet assumption.&quot;}">execution-orchestration-hardening</li>
  <li data-slug="plan-lifecycle-hygiene" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Lead-approved close/archive/write invariants land with audits and compatibility migration.&quot;, &quot;slug&quot;: &quot;plan-lifecycle-hygiene&quot;, &quot;why_now&quot;: &quot;Typed evidence enables lifecycle gates without treating research and evidence as incomplete plans.&quot;}">plan-lifecycle-hygiene</li>
  <li data-slug="agent-plan-authoring" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;general&quot;, &quot;requirements&quot;: {}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Canonical examples describe plan, research and evidence authoring on both agent surfaces.&quot;, &quot;slug&quot;: &quot;agent-plan-authoring&quot;, &quot;why_now&quot;: &quot;Refresh authoring guidance after the type and orchestration contracts are stable.&quot;}">agent-plan-authoring</li>
  <li data-slug="derived-gate-state" data-item="{&quot;done_when&quot;: &quot;A failed gate blocks downstream work and passing it unblocks with no status write; blocked and sprint-item status rejected on write and warned on read; portfolio sweep leaves zero orphaned-blocked findings and a listed residue with stated reasons.&quot;, &quot;slug&quot;: &quot;derived-gate-state&quot;, &quot;why_now&quot;: &quot;Gates are prose today so nothing enforces or reads them, and the same defect class has already rotted two plan statuses and at least one sprint item. One mechanism fixes both.&quot;}">derived-gate-state</li>
  <li data-slug="dependency-edge-semantics" data-item="{&quot;done_when&quot;: &quot;A plan depending on another plan&#x27;s named section reports its unanchored sections dispatchable while the anchored ones report blocked, with a test that fails against current behaviour and passes after, and with unstaged refs behaving unchanged; a staged ref naming a section absent from the target is a wiring finding rather than silently satisfied or silently blocking; the audit reports a followup whose target is a terminal foreign plan while leaving live foreign targets alone; and the transition-gate shape is either locked and implemented or recorded as a deliberate deferral.&quot;, &quot;slug&quot;: &quot;dependency-edge-semantics&quot;, &quot;why_now&quot;: &quot;A 67-plan portfolio measured against this model reported that its gaps are not persistence but edge expressiveness, and one gap is already causing wrong answers rather than missing ones: a dependency ref accepts a section anchor, the parser captures it, and the roadmap never reads it. Measured cost was roughly eight hours of dispatchable work reported as blocked, twice. The review resource that surfaced it landed in this sprint, so the discovery and the repair belong together.&quot;}">dependency-edge-semantics</li>
  <li data-slug="landed-record-at-closure" data-item="{&quot;done_when&quot;: &quot;The per-node write is one record rather than two, with narrative in the plan&#x27;s comments and measurements in the committed run ledger; a plan-terminal write is refused when no evidence record carries plan-evidence-for, with a test asserting the refusal fires rather than the plan closing silently; and every evidence record under an archive path belongs to a plan with a terminal status, verified over the live corpus.&quot;, &quot;slug&quot;: &quot;landed-record-at-closure&quot;, &quot;why_now&quot;: &quot;Execution evidence is written into a file whose suffix asserts it landed and whose directory asserts it is frozen, while the plan is at impl 0.33 and the file is rewritten twice inside twenty minutes. It also duplicates the section-anchored plan comment that already carries the same commit, gate verdict and artifacts, with nothing keeping the two equal.&quot;}">landed-record-at-closure</li>
  <li data-slug="binding-rules-need-bound-checks" data-item="{&quot;done_when&quot;: &quot;A test enumerates every tool namespace configured in pyproject.toml, resolves each against the declared dependency sets and build-system requires, and fails on any resolving to nothing, shown failing before the ruff declaration and passing after, with uv run ruff check resolving; and the snapshot-detection decision is locked with either a mechanism shown to flag at least three of the four recorded instances against their pre-repair revisions while flagging none of the documented carve-outs, or a recorded negative result stating no mechanism was found.&quot;, &quot;slug&quot;: &quot;binding-rules-need-bound-checks&quot;, &quot;why_now&quot;: &quot;Two sessions shipping here on 2026-08-25 hit two unrelated defect classes and both were violations of rules already written, already binding and already argued, with nothing checking either. Four snapshot-as-contract assertions across four files, and a tool configured with a real [tool.ruff] block and never declared, so the documented pre-stage lint command could never resolve and every clean lint recorded here came through a user-level install by absolute path. This sprint&#x27;s own description is the thesis: defects invisible until they had already happened.&quot;}">binding-rules-need-bound-checks</li>
  <li data-slug="rendered-evidence-on-this-host" data-item="{&quot;done_when&quot;: &quot;A rendered probe on this host loads a page from the local server and returns a DOM, or the cause is named with the trace demonstrating it and the required host change stated to whoever can make it; and each of the six enumerated captures is either taken or retired with the reason its behaviour is adequately covered without one.&quot;, &quot;effort_hours&quot;: 6, &quot;roi&quot;: &quot;mid&quot;, &quot;slug&quot;: &quot;rendered-evidence-on-this-host&quot;, &quot;title&quot;: &quot;A Browser That Can Reach the Server It Is Testing&quot;, &quot;why_now&quot;: &quot;Seven sections of the sprint-surface rebuild landed on browser-free evidence because headless Chrome on this host completes no HTTP navigation - file and data URLs load in 0.4s, curl and node fetch return 200 in milliseconds, and a 507-byte static file over loopback hangs. Seven cause classes are eliminated with disproving evidence and the next discriminating test is specified. The captures owed cannot live as followups on a completed plan, because roadmap excludes those from pending work and the obligation would be invisible exactly where someone decides what to do next.&quot;}">rendered-evidence-on-this-host</li>
  <li data-slug="blank-project-surface" data-item="{&quot;done_when&quot;: &quot;The render fault behind an empty project page is identified from the page&#x27;s own load, repaired, and covered by a check that fails when the surface renders nothing while its assets and payloads all return 200.&quot;, &quot;effort_hours&quot;: 4, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;blank-project-surface&quot;, &quot;why_now&quot;: &quot;A page that serves every asset successfully and still shows nothing gives a reader no signal to act on, and the plan carried no sprint at all, so nothing scheduled the repair.&quot;}">blank-project-surface</li>
  </ol>
