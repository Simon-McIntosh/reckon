  <li data-slug="spa-shell-scope-and-visibility" data-item="{&quot;done_when&quot;: &quot;On a rendered page a hidden project is absent from the picker, the last visible project&#x27;s switch is locked and labelled, the Crew list scrolls inside a 900px viewport at 1374 and shows only the selected project&#x27;s runs by default, the topbar renders brand, search, two tab groups, live receipt, project selector and gear in that order with a compass mark and no wordmark, and the light ground is #ffffff with the contrast test green; six captures at two widths recorded.&quot;, &quot;effort_hours&quot;: 9, &quot;slug&quot;: &quot;spa-shell-scope-and-visibility&quot;, &quot;why_now&quot;: &quot;Four of the seven measured defects are shell defects fixable against today&#x27;s data, and the two surface plans behind it need its topbar tab groups and its visibility predicate. It is the first plan to run and the only one with no prerequisite besides the design import.&quot;}">spa-shell-scope-and-visibility</li>
  <li data-slug="graph-derived-schedule" data-item="{&quot;done_when&quot;: &quot;An unnamed endpoint renders a populated closure identical in membership to the named case with a chip naming the missing handle instead of an invented command; a sprint detail draws out-of-sprint prerequisites as dashed ghosts with edges solid, dashed or red by rule; the derived flow places pending plans at max(prerequisite end, 0) and packs them into best-fit lanes on the Crew surface; the 48-hour constant is gone; eight captures at two widths recorded.&quot;, &quot;effort_hours&quot;: 15, &quot;slug&quot;: &quot;graph-derived-schedule&quot;, &quot;why_now&quot;: &quot;The Graph tab blanks for every endpoint without a handle, a sprint cannot open its own graph, and the 48-hour strip is empty for any sprint without dispatched runs. All three are one layout helper and one schedule away from the canvas, and the plan needs no server change, so it runs in parallel with the shell plan from the first wave.&quot;}">graph-derived-schedule</li>
  <li data-slug="artifact-feeds-and-reader" data-item="{&quot;done_when&quot;: &quot;Four artifact indexes render rows with created and edited stamps and an Edited/Created toggle that changes the sort key, a figure opens in the shared reader with a navigating source trail and its docs/figures path, full screen drapes the whole shell, prev and next read the one rendered list, the dependency cone is an opt-in toggle showing plan edges only, and a discovery change with new rows leaves the rendered order untouched until shown; eight captures at two widths recorded.&quot;, &quot;effort_hours&quot;: 16, &quot;slug&quot;: &quot;artifact-feeds-and-reader&quot;, &quot;why_now&quot;: &quot;Research and evidence can only be found by knowing which plan they hang off and figures cannot be found at all, so a document a worker just wrote is invisible to the lead watching the page. This is the longest chain in the sprint and starts as soon as the shell topbar and the server contracts have merged.&quot;}">artifact-feeds-and-reader</li>
  <li data-slug="fleet-home" data-item="{&quot;done_when&quot;: &quot;The home renders at the default route over the visible set with a six-figure stat band, one row per moving project with a streakline or the no-activity text, a dormant strip absent at zero, and in-flight beside just-landed; the root URL redirects to the first mounted project&#x27;s home, the standalone page and the cockpit module are deleted with no module defining CockpitBody; four captures at two widths recorded.&quot;, &quot;effort_hours&quot;: 9, &quot;slug&quot;: &quot;fleet-home&quot;, &quot;why_now&quot;: &quot;The standalone home lists nine dead projects above four real ones with flat sparklines, and the shell&#x27;s default view is a per-project cockpit the canvas replaces. Once the live fleet index and the visibility predicate exist, one read-only dashboard inside the shell can replace both.&quot;}">fleet-home</li>
  <li data-slug="derived-state-parity" data-item="{&quot;done_when&quot;: &quot;Each derivation is computed in Python with the surface as consumer, and one test compares rendered values against returned ones so a drifting copy fails rather than telling two stories.&quot;, &quot;slug&quot;: &quot;derived-state-parity&quot;, &quot;why_now&quot;: &quot;The surface nodes just landed four derivations that exist only in JSX, so an agent reading the CLI or MCP cannot see the sprint completion, endpoints, rollup or schedule a human sees; the gap is widest the moment it is created.&quot;}">derived-state-parity</li>
