<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="16cm" viewBox="0 0 900 420" role="img" aria-label="How a landing pass decides whether a reviewed head is already carried by the primary branch">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#929292"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f9e"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0472b"/>
    </marker>
  </defs>
  <g font-family="DejaVu Sans, sans-serif" font-size="13" fill="#1f1f1f">
    <rect x="290" y="16" width="320" height="56" rx="4" fill="none" stroke="#1f1f1f" stroke-width="1.2"/>
    <text x="450" y="40" text-anchor="middle">the run's reviewed head is an ancestor</text>
    <text x="450" y="58" text-anchor="middle">of the primary branch?</text>

    <line x1="450" y1="72" x2="450" y2="100" stroke="#929292" stroke-width="2.6" marker-end="url(#g)"/>
    <text x="460" y="92" fill="#5b5b5b">yes</text>

    <line x1="290" y1="44" x2="150" y2="44" stroke="#929292" stroke-width="2.6"/>
    <line x1="150" y1="44" x2="150" y2="112" stroke="#929292" stroke-width="2.6" marker-end="url(#g)"/>
    <text x="160" y="38" fill="#5b5b5b">no</text>
    <rect x="30" y="116" width="240" height="56" rx="4" fill="none" stroke="#929292" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="150" y="140" text-anchor="middle">ordinary landing path</text>
    <text x="150" y="158" text-anchor="middle" fill="#5b5b5b">measure, request promotion</text>

    <rect x="290" y="104" width="320" height="56" rx="4" fill="none" stroke="#1f1f1f" stroke-width="1.2"/>
    <text x="450" y="128" text-anchor="middle">it is strictly behind the tip and the run</text>
    <text x="450" y="146" text-anchor="middle">added a change of its own?</text>

    <line x1="610" y1="132" x2="648" y2="132" stroke="#929292" stroke-width="2.6" marker-end="url(#g)"/>
    <text x="617" y="124" fill="#5b5b5b">no</text>
    <rect x="652" y="104" width="220" height="56" rx="4" fill="none" stroke="#929292" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="762" y="128" text-anchor="middle">ordinary landing path</text>
    <text x="762" y="146" text-anchor="middle" fill="#5b5b5b">unreadable ancestry too</text>

    <line x1="450" y1="160" x2="450" y2="180" stroke="#1f6f9e" stroke-width="2.6"/>
    <line x1="450" y1="180" x2="215" y2="180" stroke="#1f6f9e" stroke-width="2.6"/>
    <line x1="215" y1="180" x2="215" y2="204" stroke="#1f6f9e" stroke-width="2.6" marker-end="url(#b)"/>
    <text x="438" y="174" text-anchor="end" fill="#1f6f9e">yes</text>

    <rect x="75" y="208" width="280" height="50" rx="4" fill="none" stroke="#1f6f9e" stroke-width="1.6"/>
    <text x="215" y="238" text-anchor="middle">is every changed path still present?</text>

    <line x1="215" y1="258" x2="215" y2="292" stroke="#1f6f9e" stroke-width="3" marker-end="url(#b)"/>
    <text x="225" y="282" fill="#1f6f9e">yes</text>
    <rect x="75" y="296" width="280" height="60" rx="4" fill="none" stroke="#1f6f9e" stroke-width="2.4"/>
    <text x="215" y="320" text-anchor="middle" fill="#1f6f9e">settled as already landed</text>
    <text x="215" y="340" text-anchor="middle" fill="#1f6f9e">released, no promotion, no replay</text>

    <line x1="355" y1="233" x2="418" y2="233" stroke="#b0472b" stroke-width="3" marker-end="url(#r)"/>
    <text x="386" y="225" text-anchor="middle" fill="#b0472b">no</text>
    <rect x="422" y="208" width="300" height="50" rx="4" fill="none" stroke="#b0472b" stroke-width="1.6"/>
    <text x="572" y="230" text-anchor="middle">reported: the branch dropped the change</text>
    <text x="572" y="248" text-anchor="middle" fill="#5b5b5b">pointer held, not settled</text>
  </g>
</svg>