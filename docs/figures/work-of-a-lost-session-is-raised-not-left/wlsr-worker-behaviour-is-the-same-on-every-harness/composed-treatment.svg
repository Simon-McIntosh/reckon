<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="16cm"
     viewBox="0 0 1400 720" font-family="DejaVu Sans, sans-serif">
  <rect width="1400" height="720" fill="#ffffff"/>

  <text x="60" y="70" font-size="16" fill="#333333">one lane · one model server · three harnesses</text>

  <!-- the harnesses of one lane -->
  <g fill="none" stroke="#929292" stroke-width="2.6">
    <rect x="60" y="130" width="260" height="64" rx="6"/>
    <rect x="60" y="300" width="260" height="64" rx="6"/>
    <rect x="60" y="470" width="260" height="64" rx="6"/>
  </g>
  <g font-size="14" fill="#333333">
    <text x="80" y="158">claude-shaped wrapper</text>
    <text x="80" y="180" fill="#666666">home_interface = claude</text>
    <text x="80" y="328">claude</text>
    <text x="80" y="350" fill="#666666">settings_file = settings.json</text>
    <text x="80" y="498">oh-my-pi</text>
    <text x="80" y="520" fill="#666666">mcp_config_file = agent/mcp.json</text>
  </g>

  <!-- composition point -->
  <rect x="470" y="228" width="360" height="230" rx="8" fill="#eaf1f7" stroke="#2a6f9e" stroke-width="2.6"/>
  <text x="500" y="264" font-size="16" fill="#1c4f73">compose_worker_behaviour</text>
  <text x="500" y="290" font-size="12" fill="#444444">keyed on the lane and the role</text>
  <g font-size="14" fill="#1c4f73">
    <text x="500" y="326">lane identity (lane document)</text>
    <text x="500" y="354">inbox in the run directory</text>
    <text x="500" y="382">MCP server allowlist</text>
    <text x="500" y="410">fence write roots and protections</text>
    <text x="500" y="438">review duty from the role</text>
  </g>

  <!-- each harness feeds the one composition point -->
  <g fill="none" stroke="#2a6f9e" stroke-width="2.6">
    <line x1="320" y1="162" x2="470" y2="290"/>
    <line x1="320" y1="332" x2="470" y2="343"/>
    <line x1="320" y1="502" x2="470" y2="396"/>
  </g>

  <!-- the four permitted differences, named clear of the connectors -->
  <text x="60" y="600" font-size="14" fill="#666666">the harness interface's own four things may differ:</text>
  <text x="60" y="626" font-size="14" fill="#666666">launch argv · home layout · stream format · model identifier</text>

  <!-- the comparison -->
  <rect x="920" y="250" width="420" height="186" rx="8" fill="none" stroke="#2a6f9e" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="944" y="286" font-size="16" fill="#333333">facts compared across backends</text>
  <g font-size="14" fill="#333333">
    <text x="944" y="322">same lane, same inbox, same allowlist,</text>
    <text x="944" y="348">same write roots, same duty, same route</text>
    <text x="944" y="388">a difference here is a defect:</text>
    <text x="944" y="414">the lane moved and the worker should not have</text>
  </g>
  <line x1="830" y1="343" x2="920" y2="343" stroke="#2a6f9e" stroke-width="2.6"/>

  <text x="60" y="690" font-size="12" fill="#666666">A worker launched for one node is given one treatment however its lane is named.</text>
</svg>