<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#fbfbfd"/>
  <text x="28" y="34" font-size="19" font-weight="700" fill="#182230">One boundary keeps every MCP read inside the transport ceiling</text>
  <text x="28" y="58" fill="#667085">The deadline produces a receipt or an answer; the budget boundary then measures exactly what the transport would serialise.</text>

  <g fill="#ffffff" stroke="#98a2b3" stroke-width="1.5">
    <rect x="28" y="100" width="170" height="76" rx="8"/>
    <rect x="250" y="100" width="170" height="76" rx="8"/>
    <rect x="472" y="100" width="206" height="76" rx="8"/>
  </g>
  <g fill="#182230" text-anchor="middle">
    <text x="113" y="129" font-weight="700">Read body</text>
    <text x="113" y="151" fill="#475467">roadmap · read_plan</text>
    <text x="113" y="169" fill="#475467">crew · audit</text>
    <text x="335" y="129" font-weight="700">Deadline boundary</text>
    <text x="335" y="151" fill="#475467">answer or typed</text>
    <text x="335" y="169" fill="#475467">storage-slow receipt</text>
    <text x="575" y="129" font-weight="700">Response budget</text>
    <text x="575" y="151" fill="#475467">compact JSON characters</text>
    <text x="575" y="169" fill="#475467">default 80,000 · configurable</text>
  </g>
  <g stroke="#667085" stroke-width="2" marker-end="url(#arrow)">
    <line x1="198" y1="138" x2="240" y2="138"/>
    <line x1="420" y1="138" x2="462" y2="138"/>
  </g>

  <path d="M575 176 L575 217 L260 217 L260 247" fill="none" stroke="#16803a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M575 176 L575 217 L735 217 L735 247" fill="none" stroke="#b54708" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="397" y="208" fill="#16803a" font-weight="700">fits</text>
  <text x="649" y="208" fill="#b54708" font-weight="700">over ceiling</text>

  <rect x="90" y="252" width="340" height="112" rx="10" fill="#ecfdf3" stroke="#6ce9a6" stroke-width="1.5"/>
  <text x="260" y="282" text-anchor="middle" fill="#05603a" font-weight="700">Return the exact pre-boundary value</text>
  <text x="112" y="310" fill="#344054">No wrapper, preview or reordered fields</text>
  <text x="112" y="334" fill="#344054">Under-budget identity test: byte-for-byte equal</text>
  <text x="112" y="350" fill="#667085" font-size="12">Write actions on the mixed crew surface bypass this branch.</text>

  <rect x="522" y="252" width="410" height="112" rx="10" fill="#fff7ed" stroke="#f7b27a" stroke-width="1.5"/>
  <text x="727" y="282" text-anchor="middle" fill="#93370d" font-weight="700">Return a bounded truncation receipt</text>
  <text x="544" y="310" fill="#344054">Original and omitted character counts</text>
  <text x="544" y="334" fill="#344054">Structural counts plus non-empty narrow_with</text>
  <text x="544" y="350" fill="#667085" font-size="12">The receipt itself is measured and compacted again if necessary.</text>

  <rect x="28" y="390" width="904" height="25" rx="5" fill="#eef2f6"/>
  <text x="480" y="408" text-anchor="middle" fill="#344054">Measured S22 roadmap detail: 307,123 original characters → 322-character receipt, safely below 80,000.</text>
</svg>
