<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img"
     aria-labelledby="title description">
  <title id="title">Authored section insertion boundary</title>
  <desc id="description">An authored heading and body are inserted after existing authored sections and their adjacent typed records, immediately before gates and other structured state collections.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; }
    .label { font-size: 17px; font-weight: 650; }
    .detail { font-size: 14px; }
    .record-label { font-size: 12px; }
    .rule { stroke: #2563a6; stroke-width: 3; }
    .arrow { stroke: #2563a6; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .group { fill: #f7fafc; stroke: #50647a; stroke-width: 1.5; }
    .record { fill: #e8f1fb; stroke: #2563a6; stroke-width: 1.5; }
  </style>

  <rect class="group" x="25" y="42" width="250" height="150" rx="5"/>
  <text class="label" x="45" y="72">Existing authored section</text>
  <text class="detail" x="45" y="103">h2 + prose</text>
  <rect class="record" x="45" y="124" width="210" height="44" rx="3"/>
  <text class="record-label" x="60" y="151">typed record remains adjacent</text>

  <line class="arrow" x1="288" y1="117" x2="348" y2="117"/>
  <line class="rule" x1="365" y1="25" x2="365" y2="218"/>
  <text class="detail" x="380" y="34">insertion boundary</text>

  <rect class="record" x="390" y="72" width="220" height="92" rx="5"/>
  <text class="label" x="410" y="104">New authored section</text>
  <text class="detail" x="410" y="133">h2 id + escaped title</text>
  <text class="detail" x="410" y="153">authored HTML body</text>

  <line class="arrow" x1="625" y1="117" x2="685" y2="117"/>
  <rect class="group" x="705" y="42" width="190" height="150" rx="5"/>
  <text class="label" x="725" y="73">Structured state</text>
  <text class="detail" x="725" y="106">gates</text>
  <text class="detail" x="725" y="133">followups</text>
  <text class="detail" x="725" y="160">comments</text>

  <text class="detail" x="25" y="232">The position is derived from the first structured collection, never from unrelated prose.</text>
</svg>
