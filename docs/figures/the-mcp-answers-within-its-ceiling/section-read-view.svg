<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">One authored section becomes one bounded MCP response</title>
  <desc id="desc">The selected heading and authored siblings are combined with the matching declaration, typed record, and anchored comments. Neighbouring sections and unrelated structured state remain outside the response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#506784"/>
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #506784; stroke-width: 2; rx: 12; }
      .selected { fill: #e8f3ff; stroke: #1769aa; stroke-width: 2.5; rx: 10; }
      .context { fill: #eef8ef; stroke: #3d7a43; stroke-width: 2; rx: 10; }
      .muted { fill: #f3f3f3; stroke: #aaa; stroke-width: 1.5; rx: 8; }
      .label { font: 700 17px system-ui, sans-serif; fill: #172235; }
      .text { font: 14px system-ui, sans-serif; fill: #26374d; }
      .small { font: 12px system-ui, sans-serif; fill: #53657b; }
      .arrow { stroke: #506784; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="20" y="28" width="275" height="270"/>
  <text class="label" x="42" y="58">Canonical plan HTML</text>
  <rect class="muted" x="42" y="78" width="230" height="48"/>
  <text class="text" x="58" y="107">Neighbouring h2 section</text>
  <rect class="selected" x="42" y="138" width="230" height="82"/>
  <text class="text" x="58" y="168">h2 id="s3" + authored body</text>
  <text class="small" x="58" y="194">HTML and plain text boundary</text>
  <rect class="muted" x="42" y="232" width="230" height="48"/>
  <text class="text" x="58" y="261">Later h2 / structured state</text>

  <rect class="box" x="360" y="28" width="230" height="270"/>
  <text class="label" x="382" y="58">Matching typed context</text>
  <rect class="context" x="382" y="82" width="186" height="48"/>
  <text class="text" x="398" y="112">declaration[s3]</text>
  <rect class="context" x="382" y="144" width="186" height="48"/>
  <text class="text" x="398" y="174">section record s3</text>
  <rect class="context" x="382" y="206" width="186" height="48"/>
  <text class="text" x="398" y="236">comments[s3]</text>

  <rect class="selected" x="660" y="74" width="275" height="180"/>
  <text class="label" x="684" y="108">read_plan section response</text>
  <text class="text" x="684" y="140">heading · text · HTML</text>
  <text class="text" x="684" y="170">declaration · record</text>
  <text class="text" x="684" y="200">anchored comments</text>
  <text class="small" x="684" y="228">one identity, one bounded payload</text>

  <path class="arrow" d="M295 178 L350 178"/>
  <path class="arrow" d="M590 164 L650 164"/>
</svg>
