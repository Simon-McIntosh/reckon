<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
  <title id="title">Cross-agent context chain</title>
  <desc id="desc">Canonical user policy feeds Codex and Claude entrypoints, project and target path instructions, and a verifiable manifest.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
  <g font-family="system-ui" fill="#0f172a">
    <rect x="20" y="80" width="205" height="85" rx="4" fill="#fff" stroke="#0f766e"/><text x="122" y="112" text-anchor="middle" font-size="15">Canonical user policy</text><text x="122" y="139" text-anchor="middle" font-size="13">~/.agents/AGENTS.md</text>
    <rect x="285" y="35" width="180" height="70" rx="4" fill="#fff" stroke="#2563eb"/><text x="375" y="65" text-anchor="middle" font-size="14">Codex entrypoint</text><text x="375" y="88" text-anchor="middle" font-size="13">~/.codex/AGENTS.md</text>
    <rect x="285" y="140" width="180" height="70" rx="4" fill="#fff" stroke="#7c3aed"/><text x="375" y="171" text-anchor="middle" font-size="14">Claude entrypoint</text><text x="375" y="194" text-anchor="middle" font-size="13">compatible discovery</text>
    <rect x="535" y="80" width="190" height="85" rx="4" fill="#fff" stroke="#c2410c"/><text x="630" y="111" text-anchor="middle" font-size="15">Target-path chain</text><text x="630" y="138" text-anchor="middle" font-size="13">repo → nested AGENTS</text>
    <rect x="790" y="80" width="170" height="85" rx="4" fill="#fff" stroke="#475569"/><text x="875" y="111" text-anchor="middle" font-size="15">Context manifest</text><text x="875" y="138" text-anchor="middle" font-size="13">paths · bytes · SHA</text>
  </g>
  <path d="M225 115 L280 72" stroke="#334155" fill="none" marker-end="url(#a)"/><path d="M225 132 L280 174" stroke="#334155" fill="none" marker-end="url(#a)"/>
  <path d="M465 70 L530 111" stroke="#334155" fill="none" marker-end="url(#a)"/><path d="M465 175 L530 135" stroke="#334155" fill="none" marker-end="url(#a)"/><line x1="725" y1="122" x2="785" y2="122" stroke="#334155" marker-end="url(#a)"/>
</svg>
