<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="100%" role="img"
     aria-label="Two monitor rows drawn against a column ruler. The waiting counter reads 3q at base, where the reason begins at column 136; after the change it reads 3queued and the reason begins at column 141. Both rows are 180 columns wide, so the wider cell takes its five columns from the reason.">
  <style>
    .t { font-family: system-ui, -apple-system, sans-serif; }
    .m { font-family: ui-monospace, Menlo, monospace; }
    .lab { font-size: 12px; fill: #555; }
    .hd { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .ro { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
    .blu { font-size: 12px; fill: #2f6fb5; }
    .red { font-size: 13px; font-weight: 600; fill: #8d1d17; }
    .grn { font-size: 13px; font-weight: 600; fill: #1a6b3c; }
  </style>
  <text class="t hd" x="30" y="24">The waiting counter spells its bucket word; its five columns come out of the reason</text>
  <line x1="30" y1="44" x2="910" y2="44" stroke="#bbb"/>
  <g class="t lab">
    <text x="30" y="62">0</text>
    <text x="225.6" y="62" text-anchor="middle">40</text>
    <text x="421.1" y="62" text-anchor="middle">80</text>
    <text x="518.9" y="62" text-anchor="middle">100</text>
    <text x="616.7" y="62" text-anchor="middle">120</text>
    <text x="714.4" y="62" text-anchor="middle">140</text>
    <text x="812.2" y="62" text-anchor="middle">160</text>
    <text x="910" y="62" text-anchor="end">180</text>
  </g>
  <line x1="30" y1="70" x2="30" y2="278" stroke="#ddd"/>
  <line x1="910" y1="70" x2="910" y2="278" stroke="#1a1a1a"/>
  <text class="blu" x="698.9" y="88">reason begins, col 136</text>
  <line x1="694.9" y1="78" x2="694.9" y2="136" stroke="#2f6fb5" stroke-dasharray="4 3"/>
  <rect x="30.0" y="96.0" width="518.2" height="26" fill="#efefef"/>
  <rect x="548.2" y="96.0" width="73.3" height="26" fill="#f6d9d6"/>
  <rect x="606.9" y="96.0" width="14.7" height="26" fill="#e2a49e"/>
  <rect x="621.6" y="96.0" width="73.3" height="26" fill="#e9e9e9"/>
  <rect x="694.9" y="96.0" width="215.1" height="26" fill="#eaf1fa"/>
  <text class="t lab" x="36" y="113"><tspan class="ro">base</tspan> — clock · role · node · state pair · model · effort</text>
  <text class="t lab" x="577.6" y="113" text-anchor="middle">counters</text>
  <text class="t lab" x="658.2" y="113" text-anchor="middle">measures</text>
  <text class="t lab" x="802.4" y="113" text-anchor="middle">the reason — free text</text>
  <text class="m red" x="610.9" y="140">3q</text>
  <text class="t lab" x="640.9" y="140">the letter no column teaches</text>
  <line x1="694.9" y1="166" x2="719.3" y2="166" stroke="#1a6b3c"/>
  <text class="t" x="906" y="176" font-size="11" fill="#1a6b3c" text-anchor="end">+5 columns, taken from the reason, not from the row</text>
  <text class="blu" x="723.3" y="192">reason begins, col 141</text>
  <line x1="719.3" y1="182" x2="719.3" y2="240" stroke="#2f6fb5" stroke-dasharray="4 3"/>
  <rect x="30.0" y="200.0" width="518.2" height="26" fill="#efefef"/>
  <rect x="548.2" y="200.0" width="97.8" height="26" fill="#f6d9d6"/>
  <rect x="606.9" y="200.0" width="39.1" height="26" fill="#e2a49e"/>
  <rect x="646.0" y="200.0" width="73.3" height="26" fill="#e9e9e9"/>
  <rect x="719.3" y="200.0" width="190.7" height="26" fill="#eaf1fa"/>
  <text class="t lab" x="36" y="217"><tspan class="ro">head</tspan> — clock · role · node · state pair · model · effort</text>
  <text class="t lab" x="577.6" y="217" text-anchor="middle">counters</text>
  <text class="t lab" x="682.7" y="217" text-anchor="middle">measures</text>
  <text class="t lab" x="814.7" y="217" text-anchor="middle">the reason — free text</text>
  <text class="m grn" x="610.9" y="244">3queued</text>
  <text class="t lab" x="30" y="292">Both rows are exactly 180 columns wide; the block holds one width across counts — zero, nine, ten and ninety-nine</text>
  <text class="t lab" x="30" y="310">occupy the same columns, so the right edge never moves — and a zero still renders in the cell, dimmed rather than dropped.</text>
</svg>
