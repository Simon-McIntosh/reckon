<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
<title id="title">Rollback uses HEAD membership; errors retain the append receipt</title>
<desc id="desc">After ledger append, a staging failure leads to rollback. If restore fails, query HEAD directly. Keep a path present in HEAD and remove only an absent path. Every subsequent failure reports the completed append and warns against re-promotion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<g font-family="sans-serif" font-size="18" fill="#172033">
<text x="24" y="30" font-weight="bold">A failed restore cannot authorize deletion</text>
<g fill="#f8fafc" stroke="#64748b"><rect x="24" y="62" width="196" height="62" rx="4"/><rect x="284" y="62" width="222" height="62" rx="4"/><rect x="570" y="62" width="230" height="62" rx="4"/></g>
<text x="43" y="88">Ledger append</text><text x="43" y="111">succeeds</text>
<text x="303" y="88">Stage fails: exit 128</text><text x="303" y="111">index.lock held</text>
<text x="589" y="88">Restore fails: exit 128</text><text x="589" y="111">same index.lock</text>
<g fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"><path d="M220 93 H282"/><path d="M506 93 H568"/><path d="M685 124 V169"/></g>
<rect x="505" y="171" width="360" height="55" rx="4" fill="#e0f2fe" stroke="#0369a1"/>
<text x="525" y="204">git cat-file -e HEAD:relative-path</text>
<g fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"><path d="M585 226 V266 H404"/><path d="M777 226 V266 H865 V301"/></g>
<text x="461" y="250">present</text><text x="791" y="250">absent</text>
<text x="232" y="271" font-weight="bold" fill="#0369a1">Keep path on disk</text>
<text x="695" y="325">Remove created path</text>
<path d="M24 354 H915" stroke="#94a3b8"/>
<text x="24" y="383" font-weight="bold">Every failure after the append carries its receipt:</text>
<text x="24" y="412">“The ledger row for the run is already written; do not re-promote.”</text>
</g></svg>