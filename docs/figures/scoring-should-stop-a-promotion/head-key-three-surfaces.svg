<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1040" height="640" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="600" fill="#111827">One head key, three surfaces that must agree on it</text>
  <text x="30" y="66" font-size="13" fill="#4b5563">The store keys a review by the head revision it read. Each surface below decides part of that key; a surface that disagrees reads or refuses the wrong record while every one of them stays correct on its own.</text>

  <!-- the head -->
  <rect x="30" y="112" width="250" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="48" y="146" font-size="14" font-weight="600" fill="#312e81">The run's head</text>
  <text x="48" y="172" font-size="12.5" fill="#3730a3">resolved from the run's tree,</text>
  <text x="48" y="190" font-size="12.5" fill="#3730a3">never guessed and never read</text>
  <text x="48" y="208" font-size="12.5" fill="#3730a3">from a passed-in argument alone</text>

  <line x1="280" y1="150" x2="520" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="280" y1="180" x2="520" y2="330" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="280" y1="205" x2="520" y2="510" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- surface 1: dispatch grants -->
  <rect x="528" y="96" width="486" height="108" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <text x="548" y="128" font-size="14" font-weight="600" fill="#065f46">1. The dispatch grants it</text>
  <text x="548" y="152" font-size="12.5" fill="#065f46">The reflex hands the reviewer the head-keyed path beside the legacy one.</text>
  <text x="548" y="170" font-size="12.5" fill="#065f46">Granting the legacy path alone refuses the very path the store reads back:</text>
  <text x="548" y="188" font-size="12.5" fill="#b91c1c">the head key is unusable from the reflex.</text>

  <!-- surface 2: classifier reads -->
  <rect x="528" y="276" width="486" height="108" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <text x="548" y="308" font-size="14" fill="#065f46">2. The classifier reads it</text>
  <text x="548" y="332" font-size="12.5" fill="#065f46">Classification reads the review of the head it is classifying, so a record of</text>
  <text x="548" y="350" font-size="12.5" fill="#065f46">an earlier revision is not this run's review and the run is not promotable yet.</text>

  <!-- surface 3: promotion fences -->
  <rect x="528" y="456" width="486" height="120" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="548" y="488" font-size="14" font-weight="600" fill="#7f1d1d">3. The promotion fences by it</text>
  <text x="548" y="512" font-size="12.5" fill="#7f1d1d">It accepts a legacy record naming no revision when the head that record</text>
  <text x="548" y="530" font-size="12.5" fill="#7f1d1d">describes (reconstructed by timestamp) equals the asserted head — no waiver.</text>
  <text x="548" y="552" font-size="12.5" fill="#7f1d1d">A refusal names two revisions as a disagreement, never one revision twice.</text>

  <!-- bottom note -->
  <rect x="30" y="560" width="440" height="60" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="48" y="584" font-size="12.5" fill="#374151">A timestamp comparison alone answers which record was</text>
  <text x="48" y="602" font-size="12.5" fill="#374151">written first, not which revision was read.</text>
</svg>