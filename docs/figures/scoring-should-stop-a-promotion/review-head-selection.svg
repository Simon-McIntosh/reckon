<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="620" viewBox="0 0 1020 620" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1020" height="620" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="600" fill="#111827">Which stored review a promotion reads</text>
  <text x="30" y="66" font-size="13" fill="#4b5563">The store is queried naming the revision the promotion asserts: the run's own worktree head, resolved from its tree so the gate and the promoted row agree by construction.</text>

  <rect x="30" y="110" width="330" height="110" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="48" y="142" font-size="14" font-weight="600" fill="#312e81">read_review(project, run, head)</text>
  <text x="48" y="168" font-size="12.5" fill="#3730a3">matched against the head each record</text>
  <text x="48" y="186" font-size="12.5" fill="#3730a3">recorded reading, prefix either way —</text>
  <text x="48" y="204" font-size="12.5" fill="#3730a3">never the newest file by mtime</text>

  <line x1="360" y1="150" x2="612" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="165" x2="612" y2="285" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="185" x2="612" y2="445" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="360" y1="200" x2="612" y2="565" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="620" y="80" width="370" height="96" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <text x="638" y="112" font-size="14" font-weight="600" fill="#065f46">Accepted — a record at this head</text>
  <text x="638" y="136" font-size="12.5" fill="#065f46">Its own comment says it read this revision, so</text>
  <text x="638" y="154" font-size="12.5" fill="#065f46">it is the run's review and the promotion proceeds.</text>

  <rect x="620" y="240" width="370" height="96" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <text x="638" y="272" font-size="14" font-weight="600" fill="#065f46">Accepted — a record naming no head</text>
  <text x="638" y="296" font-size="12.5" fill="#065f46">It predates the field and cannot be compared;</text>
  <text x="638" y="314" font-size="12.5" fill="#065f46">refusing it would reject every review already stored.</text>

  <rect x="620" y="400" width="370" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="638" y="432" font-size="14" font-weight="600" fill="#991b1b">Refused — a record at another head</text>
  <text x="638" y="456" font-size="12.5" fill="#991b1b">The refusal names both revisions: the one the stored</text>
  <text x="638" y="474" font-size="12.5" fill="#991b1b">record read, and the one this promotion asserts.</text>

  <rect x="620" y="520" width="370" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="638" y="552" font-size="14" font-weight="600" fill="#991b1b">Refused — no record at any head</text>
  <text x="638" y="576" font-size="12.5" fill="#991b1b">No complete independent review is stored; the</text>
  <text x="638" y="594" font-size="12.5" fill="#991b1b">refusal names the review dispatch that produces one.</text>
</svg>