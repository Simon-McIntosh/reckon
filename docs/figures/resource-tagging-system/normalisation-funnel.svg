<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 232" role="img"
     aria-label="Four divergent tag spellings collapse to one canonical identity at write time; a fifth, semantically distinct, stays separate and is surfaced as a singleton.">
  <g fill="none" stroke="currentColor" stroke-width="1" font-family="system-ui, sans-serif">

    <text x="8" y="16" font-size="13" font-weight="600" fill="currentColor" stroke="none">Authored</text>
    <text x="252" y="16" font-size="13" font-weight="600" fill="currentColor" stroke="none">Normalised at write</text>
    <text x="486" y="16" font-size="13" font-weight="600" fill="currentColor" stroke="none">Stored identity</text>

    <text x="8" y="46" font-size="13" fill="currentColor" stroke="none" font-family="ui-monospace, monospace">standard-names</text>
    <text x="8" y="74" font-size="13" fill="currentColor" stroke="none" font-family="ui-monospace, monospace">Standard_Names</text>
    <text x="8" y="102" font-size="13" fill="currentColor" stroke="none" font-family="ui-monospace, monospace">standard names</text>
    <text x="8" y="130" font-size="13" fill="currentColor" stroke="none" font-family="ui-monospace, monospace">standardnames</text>

    <path d="M150 42 L246 80" opacity="0.5"/>
    <path d="M154 70 L246 82" opacity="0.5"/>
    <path d="M150 98 L246 86" opacity="0.5"/>
    <path d="M146 126 L246 90" opacity="0.5"/>

    <rect x="250" y="62" width="164" height="44" rx="3"/>
    <text x="262" y="80" font-size="12" fill="currentColor" stroke="none">casefold · trim</text>
    <text x="262" y="97" font-size="12" fill="currentColor" stroke="none">separators → hyphen</text>

    <path d="M414 84 L474 84"/>
    <path d="M466 80 L474 84 L466 88" stroke-linejoin="round"/>

    <rect x="478" y="68" width="174" height="32" rx="3" stroke="#2563eb" stroke-width="1.5"/>
    <text x="490" y="88" font-size="13" fill="#2563eb" stroke="none" font-family="ui-monospace, monospace">standard-names</text>
    <text x="490" y="116" font-size="12" fill="currentColor" stroke="none" opacity="0.75">4 documents</text>

    <text x="8" y="182" font-size="13" fill="currentColor" stroke="none" font-family="ui-monospace, monospace">sn</text>
    <path d="M34 178 L474 178" opacity="0.5" stroke-dasharray="3 3"/>
    <path d="M466 174 L474 178 L466 182" stroke-linejoin="round" opacity="0.5"/>
    <rect x="478" y="162" width="174" height="32" rx="3" stroke-dasharray="3 3"/>
    <text x="490" y="182" font-size="13" fill="currentColor" stroke="none" font-family="ui-monospace, monospace">sn</text>
    <text x="490" y="210" font-size="12" fill="currentColor" stroke="none" opacity="0.75">1 document — audit flags a singleton</text>

  </g>
</svg>
