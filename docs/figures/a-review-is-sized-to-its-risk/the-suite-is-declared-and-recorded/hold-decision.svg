<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="600" fill="#111827">When a tier none or light promotion waits</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">hold_reason(project_root, tier) — every no leaves the hold unset</text>

  <!-- entry -->
  <rect x="30" y="86" width="240" height="46" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="150" y="107" font-size="13" text-anchor="middle" fill="#312e81">a promotion asks to proceed</text>
  <text x="150" y="123" font-size="12" text-anchor="middle" fill="#4338ca">tier ∈ {none, light}</text>

  <line x1="150" y1="132" x2="150" y2="160" stroke="#6366f1" stroke-width="2" marker-end="url(#a)"/>

  <!-- q1 -->
  <rect x="30" y="160" width="240" height="46" rx="8" fill="#ffffff" stroke="#111827"/>
  <text x="150" y="188" font-size="13" text-anchor="middle" fill="#111827">is the tier none or light?</text>
  <line x1="150" y1="206" x2="150" y2="234" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="225" font-size="12" fill="#059669">yes</text>

  <!-- q2 -->
  <rect x="30" y="234" width="240" height="46" rx="8" fill="#ffffff" stroke="#111827"/>
  <text x="150" y="255" font-size="13" text-anchor="middle" fill="#111827">does a latest record exist,</text>
  <text x="150" y="271" font-size="13" text-anchor="middle" fill="#111827">and is it a run?</text>
  <line x1="150" y1="280" x2="150" y2="308" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="299" font-size="12" fill="#059669">yes</text>

  <!-- q3 -->
  <rect x="30" y="308" width="240" height="60" rx="8" fill="#ffffff" stroke="#111827"/>
  <text x="150" y="331" font-size="13" text-anchor="middle" fill="#111827">did that run fail to collect,</text>
  <text x="150" y="348" font-size="13" text-anchor="middle" fill="#111827">or overrun its budget?</text>
  <line x1="150" y1="368" x2="150" y2="396" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="387" font-size="12" fill="#059669">yes</text>

  <!-- q4 -->
  <rect x="30" y="396" width="240" height="46" rx="8" fill="#ffffff" stroke="#111827"/>
  <text x="150" y="424" font-size="13" text-anchor="middle" fill="#111827">has a later waiver excused it?</text>
  <line x1="150" y1="442" x2="150" y2="470" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="461" font-size="12" fill="#b91c1c">no</text>

  <!-- hold -->
  <rect x="30" y="470" width="240" height="52" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="150" y="492" font-size="13" text-anchor="middle" fill="#991b1b">HOLD</text>
  <text x="150" y="510" font-size="11" text-anchor="middle" fill="#b91c1c">names revision, observed_at, which failure</text>

  <!-- release column -->
  <rect x="430" y="86" width="440" height="436" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="5 4"/>
  <text x="650" y="116" font-size="14" font-weight="600" text-anchor="middle" fill="#166534">no hold — the promotion proceeds</text>
  <g font-size="13" fill="#15803d">
    <text x="460" y="152">tier is full — a full review reads the run itself</text>
    <text x="460" y="192">no record yet, or the latest record is a waiver</text>
    <text x="460" y="232">the latest run collected and ran a test, even if a test failed</text>
    <text x="460" y="272">the latest run passed</text>
    <text x="460" y="312">a waiver was written after the failing run</text>
    <text x="460" y="352">no mounted project resolves for this checkout root</text>
  </g>
  <line x1="270" y1="183" x2="430" y2="183" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="270" y1="257" x2="430" y2="257" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="270" y1="338" x2="430" y2="338" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="270" y1="419" x2="430" y2="419" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="300" y="176" font-size="11" fill="#059669">no</text>
  <text x="300" y="250" font-size="11" fill="#059669">no</text>
  <text x="300" y="331" font-size="11" fill="#059669">no</text>
  <text x="300" y="412" font-size="11" fill="#059669">yes</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>
</svg>