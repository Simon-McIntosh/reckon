<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .h { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .lbl { font-size: 12.5px; fill: #1e293b; }
    .sm { font-size: 11px; fill: #475569; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; fill: #0f172a; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 0; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
    .old { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1; rx: 8; }
    .new { fill: #f0fdf4; stroke: #86efac; stroke-width: 1; rx: 8; }
    .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
    .arrow { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .arrowR { stroke: #dc2626; stroke-width: 1.6; fill: none; marker-end: url(#ar); }
    .arrowG { stroke: #16a34a; stroke-width: 1.6; fill: none; marker-end: url(#ag); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#dc2626"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#16a34a"/></marker>
  </defs>

  <text x="20" y="30" class="h">Promotion's review gate: the role check gives way to the run's tier</text>

  <!-- OLD -->
  <rect x="20" y="52" width="440" height="150" class="old"/>
  <text x="36" y="76" class="h" fill="#991b1b">Before — the gate read the role name</text>
  <text x="36" y="100" class="code">role != "review" and ( role == "implement"</text>
  <text x="36" y="118" class="code">                       or changed_any_repository_path )</text>
  <text x="36" y="144" class="sm">An implement run was always gated.</text>
  <text x="36" y="160" class="sm">Any other role was gated the moment it</text>
  <text x="36" y="176" class="sm">wrote a tracked path — a test file, a plan,</text>
  <text x="36" y="192" class="sm">a figure — so documentation and evidence</text>
  <text x="36" y="192" class="sm"></text>

  <!-- NEW -->
  <rect x="520" y="52" width="440" height="150" class="new"/>
  <text x="536" y="76" class="h" fill="#166534">After — the gate reads the run's tier</text>
  <text x="536" y="100" class="code">tier != "none"   # tier resolved first</text>
  <text x="536" y="126" class="sm">Runs that changed runtime source still owe</text>
  <text x="536" y="142" class="sm">a review; runs that changed only tests,</text>
  <text x="536" y="158" class="sm">plans, evidence, research data or figures</text>
  <text x="536" y="174" class="sm">promote with the tier recorded as the reason</text>
  <text x="536" y="190" class="sm">no review exists.</text>

  <!-- INPUTS -->
  <text x="20" y="238" class="h">The tier's four inputs, read from the run at completion</text>
  <rect x="20" y="252" width="215" height="46" class="chip"/>
  <text x="32" y="272" class="lbl">changed paths</text>
  <text x="32" y="289" class="sm">runtime source or not</text>

  <rect x="248" y="252" width="215" height="46" class="chip"/>
  <text x="260" y="272" class="lbl">changed-line count</text>
  <text x="260" y="289" class="sm">added + deleted at the head</text>

  <!-- a small rendering of the empty chip -->
  <rect x="476" y="252" width="215" height="46" class="chip"/>
  <text x="488" y="272" class="lbl">specification level</text>
  <text x="488" y="289" class="sm">node's declared spec level</text>

  <rect x="704" y="252" width="256" height="46" class="chip"/>
  <text x="716" y="272" class="lbl">declared capability risk</text>
  <text x="716" y="289" class="sm">plan or section; elevated forces full</text>

  <!-- RESOLVER -->
  <rect x="20" y="322" width="460" height="120" class="panel"/>
  <text x="36" y="346" class="h">Resolver — first match wins</text>
  <text x="36" y="370" class="code">risk elevated/critical  ->  full</text>
  <text x="36" y="390" class="code">no runtime source         ->  none</text>
  <text x="36" y="410" class="code">lines &lt; ceiling and spec  ->  light</text>
  <text x="36" y="430" class="code">otherwise                 ->  full</text>

  <!-- OUTCOMES -->
  <rect x="520" y="322" width="440" height="120" class="panel"/>
  <text x="536" y="346" class="h">Ledger row and gate</text>
  <text x="536" y="370" class="sm"><tspan fill="#166534">none</tspan>  — promotes; row records the tier; no review stored.</text>
  <text x="536" y="392" class="sm"><tspan fill="#b45309">light</tspan> / <tspan fill="#991b1b">full</tspan>  — refused until a review of the promoted</text>
  <text x="548" y="408" class="sm">head is stored, or a waiver says why it may land.</text>
  <text x="536" y="430" class="sm">review role  — exempt; it wrote another run's review.</text>

  <path class="arrow" d="M240,300 L240,318"/>
  <path class="arrow" d="M355,300 L355,318"/>
  <path class="arrow" d="M583,300 L583,318"/>

  <!-- side note -->
  <rect x="20" y="454" width="0" height="0" class="box"/>
</svg>