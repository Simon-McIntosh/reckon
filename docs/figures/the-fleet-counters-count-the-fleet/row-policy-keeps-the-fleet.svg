<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect width="880" height="440" fill="#ffffff"/>
<text x="32" y="34" font-size="17" font-weight="700" fill="#1c1e21">The row policy keeps the fleet, drops the counters and holds the noise pairs</text>
<text x="32" y="56" font-size="12" fill="#6b7280">2026-09-25 watch stream replayed through the follower's own row path: 3540 rows fed, 1680 printed, half is 1770</text>
<text x="32" y="92" font-size="13" font-weight="700" fill="#1c1e21">Rows by class</text>
<text x="32" y="108" font-size="11" fill="#1c1e21">coordinator (prints with its reason) : </text>
<rect x="32" y="114" width="210" height="11" fill="#c7d2fe"/>
<rect x="32" y="127" width="136" height="11" fill="#4338ca"/>
<text x="248" y="123" font-size="10" fill="#6b7280">1239 fed</text>
<text x="174" y="136" font-size="10" fill="#4338ca">804 printed</text>
<text x="32" y="148" font-size="11" fill="#1c1e21">observer (prints unmarked) : </text>
<rect x="32" y="154" width="330" height="11" fill="#c7d2fe"/>
<rect x="32" y="167" width="148" height="11" fill="#4338ca"/>
<text x="368" y="163" font-size="10" fill="#6b7280">1942 fed</text>
<text x="186" y="176" font-size="10" fill="#4338ca">876 printed</text>
<text x="32" y="188" font-size="11" fill="#1c1e21">counter (moves the block, no row) : </text>
<rect x="32" y="194" width="61" height="11" fill="#c7d2fe"/>
<rect x="32" y="207" width="0" height="11" fill="#4338ca"/>
<text x="99" y="203" font-size="10" fill="#6b7280">359 fed</text>
<text x="38" y="216" font-size="10" fill="#4338ca">0 printed</text>
<text x="470" y="92" font-size="13" font-weight="700" fill="#1c1e21">Held noise pairs, opener fed vs printed</text>
<text x="470" y="108" font-size="11" fill="#1c1e21">dispatched → abandoned (90 s)</text>
<rect x="470" y="114" width="300" height="11" fill="#c7d2fe"/>
<rect x="470" y="127" width="281" height="11" fill="#4338ca"/>
<text x="776" y="123" font-size="10" fill="#6b7280">263</text>
<text x="757" y="136" font-size="10" fill="#4338ca">247 — 16 held away</text>
<text x="470" y="148" font-size="11" fill="#1c1e21">working → blocked (300 s)</text>
<rect x="470" y="154" width="164" height="11" fill="#c7d2fe"/>
<rect x="470" y="167" width="118" height="11" fill="#4338ca"/>
<text x="640" y="163" font-size="10" fill="#6b7280">144</text>
<text x="594" y="176" font-size="10" fill="#4338ca">104 — 40 held away</text>
<text x="470" y="188" font-size="11" fill="#1c1e21">working → stalled (300 s)</text>
<rect x="470" y="194" width="27" height="11" fill="#c7d2fe"/>
<rect x="470" y="207" width="15" height="11" fill="#4338ca"/>
<text x="503" y="203" font-size="10" fill="#6b7280">24</text>
<text x="491" y="216" font-size="10" fill="#4338ca">14 — 10 held away</text>
<text x="470" y="238" font-size="11" fill="#6b7280">The printed share of each opener is the real event the pair resembles:</text>
<text x="470" y="256" font-size="11" fill="#6b7280">an abandonment that does not revert, a stall that does not recover, a block</text>
<text x="470" y="274" font-size="11" fill="#6b7280">whose worker did not survive. Each prints about one window late.</text>
<rect x="32" y="300" width="14" height="11" fill="#c7d2fe"/>
<text x="52" y="310" font-size="11" fill="#1c1e21">fed by the stream</text>
<rect x="180" y="300" width="14" height="11" fill="#4338ca"/>
<text x="200" y="310" font-size="11" fill="#1c1e21">printed to the pane</text>
<line x1="32" y1="336" x2="848" y2="336" stroke="#d0d5dd" stroke-width="1"/>
<text x="32" y="360" font-size="11" fill="#6b7280">Every counter row is silent: a same-state rewrite moves the counter block alone. Observer rows</text>
<text x="32" y="378" font-size="11" fill="#6b7280">still print, unmarked, so a reader loses no transition the audit keeps. All 23 coordinator kinds</text>
<text x="32" y="396" font-size="11" fill="#6b7280">in this stream appear among the printed rows.</text>
</svg>
