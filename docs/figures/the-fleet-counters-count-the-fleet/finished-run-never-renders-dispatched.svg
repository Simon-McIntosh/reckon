<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="A finished run renders working then dispatched before the phase arbiter fix, and working then complete after.">
  <style>
    .t { font: 13px/1.4 system-ui, sans-serif; fill: #d8dee6; }
    .h { font: 600 15px system-ui, sans-serif; fill: #e8eef6; }
    .m { font: 11px system-ui, sans-serif; fill: #8b96a5; }
    .box { fill: #1b2230; stroke: #3a4658; stroke-width: 1; }
    .bad { fill: #3a1f24; stroke: #a34a58; }
    .good { fill: #17321f; stroke: #3f7a52; }
    .a { stroke: #8b96a5; stroke-width: 1.5; fill: none; }
    .note { font: 12px system-ui, sans-serif; fill: #a9b4c2; }
  </style>
  <rect width="900" height="320" fill="#0e131b"/>

  <text class="h" x="24" y="34">A delivered run's rendered phase sequence</text>
  <text class="m" x="24" y="54">run r-20260926T193548240312 &#183; exit recorded 19:58:32Z &#183; manifest status complete</text>

  <text class="t" x="24" y="100">before the fix</text>
  <g>
    <rect class="box" x="24" y="112" width="120" height="38" rx="6"/>
    <text class="t" x="48" y="136">dispatched</text>
    <path class="a" d="M144 131 H184"/>
    <path class="a" d="M176 125 l8 6 -8 6"/>
    <rect class="box" x="192" y="112" width="120" height="38" rx="6"/>
    <text class="t" x="228" y="136">working</text>
    <path class="a" d="M312 131 H352"/>
    <path class="a" d="M344 125 l8 6 -8 6"/>
    <rect class="bad" x="360" y="112" width="120" height="38" rx="6"/>
    <text class="t" x="388" y="136">dispatched</text>
    <path class="a" d="M480 131 H520"/>
    <path class="a" d="M512 125 l8 0" />
    <rect class="box" x="528" y="112" width="120" height="38" rx="6"/>
    <text class="t" x="568" y="136">complete</text>
    <text class="m" x="400" y="170">backwards at 19:58:33Z, one second after the exit record</text>
  </g>

  <text class="t" x="24" y="222">after the fix</text>
  <g>
    <rect class="box" x="24" y="234" width="120" height="38" rx="6"/>
    <text class="t" x="48" y="258">dispatched</text>
    <path class="a" d="M144 253 H184"/>
    <path class="a" d="M176 247 l8 6 -8 6"/>
    <rect class="box" x="192" y="234" width="120" height="38" rx="6"/>
    <text class="t" x="228" y="258">working</text>
    <path class="a" d="M312 253 H352"/>
    <path class="a" d="M344 247 l8 6 -8 6"/>
    <rect class="good" x="360" y="234" width="120" height="38" rx="6"/>
    <text class="t" x="400" y="258">complete</text>
    <text class="m" x="510" y="258">a delivered report is itself evidence the launch advanced</text>
  </g>

  <text class="note" x="24" y="300">The delivered report and the worker record are each read as evidence the launch got past starting, so a run observed working never falls back to the pre-spawn label.</text>
</svg>