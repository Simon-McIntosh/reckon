<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" font-family="monospace" font-size="15">
  <rect x="0" y="0" width="1120" height="360" fill="#fbf7ee"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#2b2b2b">The follower row drops the attention mark</text>
  <text x="24" y="58" fill="#555">One transition per line, read down a column. The retired mark spent a column the reason clause now keeps.</text>

  <text x="24" y="104" font-size="14" font-weight="bold" fill="#a33">Before</text>
  <rect x="20" y="116" width="96" height="26" fill="#f3d9d9"/>
  <text x="24" y="135" fill="#333">14:25:01  !  dsv4.1-flash  high   implement  ticker-fixture  dispatched &#8594; abandoned     &#8211;   4w&#183; 0b&#183; 7u&#183; 0q  the process is gone&#8230;</text>
  <text x="80" y="162" font-size="13" fill="#a33">!  attention mark (retired)</text>

  <text x="24" y="212" font-size="14" font-weight="bold" fill="#286">After</text>
  <rect x="176" y="224" width="120" height="26" fill="#e5f0e5"/>
  <text x="24" y="243" fill="#333">14:25:01  dsv4.1-flash  high   implement  ticker-fixture  dispatched &#8594; abandoned     &#8211;   4w&#183; 0b&#183; 7u&#183; 0q  the process is gone without a&#8230;</text>
  <text x="176" y="270" font-size="13" fill="#286">model cell follows the time's gutter directly</text>

  <line x1="20" y1="300" x2="1100" y2="300" stroke="#999" stroke-width="1"/>
  <text x="24" y="322" fill="#555" font-size="13">time</text>
  <text x="120" y="322" fill="#555" font-size="13">model</text>
  <text x="248" y="322" fill="#555" font-size="13">effort</text>
  <text x="322" y="322" fill="#555" font-size="13">role</text>
  <text x="430" y="322" fill="#555" font-size="13">node</text>
  <text x="560" y="322" fill="#555" font-size="13">transition</text>
  <text x="760" y="322" fill="#555" font-size="13">elapsed</text>
  <text x="836" y="322" fill="#555" font-size="13">counters</text>
  <text x="950" y="322" fill="#555" font-size="13">reason (gains 3 columns)</text>

  <line x1="884" y1="286" x2="884" y2="300" stroke="#286" stroke-width="2"/>
  <line x1="884" y1="278" x2="1096" y2="278" stroke="#286" stroke-width="2"/>
  <line x1="1096" y1="278" x2="1096" y2="300" stroke="#286" stroke-width="2"/>
  <text x="900" y="272" fill="#286" font-size="13">the clause reaches one word further before its cut</text>
</svg>