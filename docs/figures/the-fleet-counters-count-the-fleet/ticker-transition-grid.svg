<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 260" role="img" aria-labelledby="title desc">
  <title id="title">Two ticker rows form one aligned transition chain</title>
  <desc id="desc">The arrow stays on one vertical guide. The second row begins from the first row's destination, attention changes from exclamation to blank, and the long node-name cell retains a two-space gutter.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #17202a; font-size: 14px; }
    .label { fill: #4b5563; font-size: 13px; }
    .state { font-size: 17px; font-weight: 600; }
    .accent { fill: #075985; }
    .attention { fill: #a61b1b; font-size: 18px; font-weight: 700; }
    .guide { stroke: #075985; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .chain { stroke: #64748b; stroke-width: 1.25; fill: none; }
    .gutter { stroke: #64748b; stroke-width: 1; }
  </style>
  <text class="label" x="24" y="30">time</text>
  <text class="label" x="104" y="30">attention</text>
  <text class="label" x="190" y="30">model · effort · role</text>
  <text class="label" x="392" y="30">node name</text>
  <text class="label" x="738" y="30" text-anchor="end">previous</text>
  <text class="label accent" x="760" y="14" text-anchor="middle">fixed arrow</text>
  <text class="label" x="782" y="30">new state</text>
  <text class="label" x="925" y="30">elapsed · fleet</text>

  <line class="guide" x1="760" y1="42" x2="760" y2="222"/>

  <text x="24" y="86">14:00:00</text>
  <text class="attention" x="128" y="86">!</text>
  <text x="174" y="86">gpt-sol · high · review</text>
  <text x="392" y="86">review-of-hook-st…t-without-follower</text>
  <text class="state" x="738" y="86" text-anchor="end">dispatched</text>
  <text class="state accent" x="760" y="86" text-anchor="middle">→</text>
  <text class="state" x="782" y="86">abandoned</text>
  <text x="925" y="86">0m · 1w·0b·0u·0q</text>

  <text x="24" y="168">14:00:12</text>
  <text x="174" y="168">gpt-sol · high · review</text>
  <text x="392" y="168">review-of-obligat…a-derived-view</text>
  <text class="state" x="738" y="168" text-anchor="end">abandoned</text>
  <text class="state accent" x="760" y="168" text-anchor="middle">→</text>
  <text class="state" x="782" y="168">working</text>
  <text x="925" y="168">0m · 1w·0b·0u·0q</text>

  <path class="chain" d="M 842 94 C 870 122, 704 128, 704 151"/>
  <path class="chain" d="M 700 146 L 704 153 L 708 146"/>
  <text class="label" x="805" y="124">pane carries the shown state</text>

  <line class="gutter" x1="650" y1="196" x2="650" y2="218"/>
  <line class="gutter" x1="650" y1="207" x2="674" y2="207"/>
  <line class="gutter" x1="674" y1="196" x2="674" y2="218"/>
  <text class="label" x="662" y="238" text-anchor="middle">at least two spaces after the node cell</text>
</svg>
