<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">Emitted and reconstructed fleet counters across fifty observations</title>
  <desc id="desc">The reconstructed working count rises steadily from zero to nine while the emitted count repeatedly falls toward zero and the emitted blocked count rises by the same amount. The counts converge by observation forty-six. Three later genuine interruptions move both readings together.</desc>
