<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="system-ui, sans-serif" font-size="13">
  <title>Sprint close carries held work forward</title>
  <desc>A closing sprint is allowed only when every incomplete item is held; held items move to the advancing sprint with their blocker, completed items stay on the closed sprint.</desc>

  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="600">Closing a sprint: the held-work rule</text>

  <!-- Before: closing sprint -->
  <rect x="20" y="48" width="250" height="270" rx="8" fill="#f2f5f9" stroke="#5b6b82" stroke-width="1.5"/>
  <rect x="20" y="48" width="250" height="30" rx="8" fill="#5b6b82"/>
  <text x="145" y="68" text-anchor="middle" fill="#ffffff" font-weight="600">Closing sprint · active</text>

  <rect x="34" y="90" width="222" height="46" rx="5" fill="#ffffff" stroke="#c49a2b" stroke-width="1.2"/>
  <text x="44" y="109" font-weight="600">held-work (incomplete)</text>
  <rect x="44" y="116" width="196" height="14" rx="3" fill="#fbeecb"/>
  <text x="142" y="126" text-anchor="middle" font-size="11">blocked by reservation · kind=held</text>

  <rect x="34" y="146" width="222" height="30" rx="5" fill="#ffffff" stroke="#4a7d4c" stroke-width="1.2"/>
  <text x="145" y="165" text-anchor="middle" font-weight="600">done-work (completed)</text>

  <text x="145" y="200" text-anchor="middle" font-size="11" fill="#5b6b82">every incomplete item must be held</text>

  <!-- Close operation -->
  <rect x="300" y="110" width="150" height="86" rx="8" fill="#eef6ff" stroke="#2f6fb2" stroke-width="1.5"/>
  <text x="375" y="134" text-anchor="middle" font-weight="600">close</text>
  <text x="375" y="152" text-anchor="middle" font-size="11">set status → done</text>
  <text x="375" y="170" text-anchor="middle" font-size="11">on the sprint resource</text>

  <path d="M270 130 L298 130" marker-end="url(#ar)" stroke="#2f6fb2" stroke-width="2"/>

  <!-- Refusal branch -->
  <rect x="300" y="258" width="150" height="52" rx="8" fill="#fdeeee" stroke="#b23a3a" stroke-width="1.5"/>
  <text x="375" y="278" text-anchor="middle" font-weight="600">refused</text>
  <text x="375" y="296" text-anchor="middle" font-size="11">names the un-held item</text>
  <path d="M340 196 C 330 226, 344 254, 362 258" fill="none" stroke="#b23a3a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="262" y="228" text-anchor="middle" font-size="11" fill="#b23a3a" transform="rotate(-64 262 228)">incomplete &amp; not held?</text>

  <!-- After: closing sprint done -->
  <rect x="490" y="48" width="190" height="120" rx="8" fill="#f2f5f9" stroke="#5b6b82" stroke-width="1.5"/>
  <rect x="490" y="48" width="190" height="30" rx="8" fill="#5b6b82"/>
  <text x="585" y="68" text-anchor="middle" fill="#ffffff" font-weight="600">Closing sprint · done</text>
  <rect x="504" y="88" width="162" height="30" rx="5" fill="#ffffff" stroke="#4a7d4c" stroke-width="1.2"/>
  <text x="585" y="107" text-anchor="middle" font-weight="600">done-work (stays)</text>

  <!-- After: advancing sprint -->
  <rect x="700" y="48" width="180" height="120" rx="8" fill="#f2f5f9" stroke="#5b6b82" stroke-width="1.5"/>
  <rect x="700" y="48" width="180" height="30" rx="8" fill="#5b6b82"/>
  <text x="790" y="68" text-anchor="middle" fill="#ffffff" font-weight="600">Advancing sprint · planned</text>
  <rect x="714" y="88" width="152" height="46" rx="5" fill="#ffffff" stroke="#c49a2b" stroke-width="1.2"/>
  <text x="790" y="107" text-anchor="middle" font-weight="600">held-work (moves)</text>
  <text x="790" y="124" text-anchor="middle" font-size="11">blocker rides along</text>

  <path d="M450 153 L488 153 M488 80 L714 80" fill="none" stroke="#2f6fb2" stroke-width="2" marker-end="url(#ar)"/>
  <text x="470" y="120" font-size="11" fill="#2f6fb2" transform="rotate(90 470 120)">all incomplete items held</text>

  <!-- Legend -->
  <rect x="20" y="336" width="12" height="12" fill="#fbeecb" stroke="#c49a2b" stroke-width="1"/>
  <text x="38" y="346" font-size="11">held (incomplete, waits outside the sprint)</text>
  <rect x="300" y="336" width="12" height="12" fill="#ffffff" stroke="#4a7d4c" stroke-width="1.2"/>
  <text x="318" y="346" font-size="11">completed</text>
  <rect x="700" y="336" width="12" height="12" fill="#eef6ff" stroke="#2f6fb2" stroke-width="1.2"/>
  <text x="718" y="346" font-size="11">after a successful close, roadmap carries the moved work in pending_work</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2f6fb2"/>
    </marker>
  </defs>
</svg>
