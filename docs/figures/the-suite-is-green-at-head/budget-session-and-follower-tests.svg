<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 380" width="990" height="380" font-family="sans-serif" font-size="13">
  <rect width="990" height="380" fill="#ffffff"/>
  <text x="16" y="24" font-size="15" font-weight="bold">Red node ids per owned file — base revision vs after this node</text>
  <text x="16" y="44" fill="#555">One pytest process per file, its own basetemp. Left bar base, right bar at head d00f351f.</text>

  <g transform="translate(300,60)">
    <line x1="0" y1="0" x2="0" y2="240" stroke="#999"/>
    <g font-size="11">
      <line x1="0" y1="0" x2="-4" y2="0" stroke="#999"/><text x="-8" y="4" text-anchor="end">4</text>
      <line x1="0" y1="60" x2="-4" y2="60" stroke="#999"/><text x="-8" y="64" text-anchor="end">3</text>
      <line x1="0" y1="120" x2="-4" y2="120" stroke="#999"/><text x="-8" y="124" text-anchor="end">2</text>
      <line x1="0" y1="180" x2="-4" y2="180" stroke="#999"/><text x="-8" y="184" text-anchor="end">1</text>
      <line x1="0" y1="240" y2="240" x2="-4" stroke="#999"/><text x="-8" y="244" text-anchor="end">0</text>
    </g>
    <!-- scale: 60 px per failure -->
    <g>
      <!-- test_backends 3 -> 0 -->
      <rect x="18" y="60" width="26" height="180" fill="#c0392b"/><rect x="48" y="240" width="26" height="1" fill="#27ae60"/>
      <!-- test_budget 4 -> 1 -->
      <rect x="94" y="0" width="26" height="240" fill="#c0392b"/><rect x="124" y="180" width="26" height="60" fill="#e67e22"/>
      <!-- served_turn 1 -> 0 -->
      <rect x="170" y="180" width="26" height="60" fill="#c0392b"/><rect x="200" y="240" width="26" height="1" fill="#27ae60"/>
      <!-- mcp_recovery 1 -> 0 -->
      <rect x="246" y="180" width="26" height="60" fill="#c0392b"/><rect x="276" y="240" width="26" height="1" fill="#27ae60"/>
      <!-- session_delivery 1 -> 0 -->
      <rect x="312" y="180" width="26" height="60" fill="#c0392b"/><rect x="342" y="240" width="26" height="1" fill="#27ae60"/>
      <!-- crew_recovery 3 -> 0 -->
      <rect x="370" y="60" width="26" height="180" fill="#c0392b"/><rect x="400" y="240" width="26" height="1" fill="#27ae60"/>
      <!-- follower_freshness 1 -> 1 (load-only) -->
      <rect x="446" y="180" width="26" height="60" fill="#c0392b"/><rect x="476" y="180" width="26" height="60" fill="#8e44ad"/>
      <!-- follower_checks_owner 0 -> 1 (load-only, not listed) -->
      <rect x="522" y="240" width="26" height="1" fill="#27ae60"/><rect x="552" y="180" width="26" height="60" fill="#8e44ad"/>
      <!-- reexec 2 -> 1 -->
      <rect x="598" y="120" width="26" height="120" fill="#c0392b"/><rect x="628" y="180" width="26" height="60" fill="#e67e22"/>
    </g>
  </g>

  <g font-size="10" fill="#333">
    <text x="318" y="314" text-anchor="start">backends</text>
    <text x="394" y="314" text-anchor="start">budget</text>
    <text x="470" y="314" text-anchor="start">served</text>
    <text x="546" y="314" text-anchor="start">mcp</text>
    <text x="622" y="314" text-anchor="start">session</text>
    <text x="670" y="314" text-anchor="start">crew_rec</text>
    <text x="746" y="314" text-anchor="start">fresh</text>
    <text x="822" y="314" text-anchor="start">owner</text>
    <text x="898" y="314" text-anchor="start">reexec</text>
  </g>

  <g transform="translate(16,300)" font-size="12">
    <rect x="0" y="-12" width="12" height="12" fill="#c0392b"/><text x="18" y="-1">red at base</text>
    <rect x="110" y="-12" width="12" height="12" fill="#27ae60"/><text x="128" y="-1">green at head</text>
    <rect x="230" y="-12" width="12" height="12" fill="#e67e22"/><text x="248" y="-1">product defect (follow-on)</text>
    <rect x="440" y="-12" width="12" height="12" fill="#8e44ad"/><text x="458" y="-1">load-only</text>
  </g>

  <text x="16" y="344" fill="#555" font-size="11">Base: 16 listed red ids. At head: 13 green, 2 product defects and 1 load-only among the listed set.</text>
  <text x="16" y="360" fill="#555" font-size="11">One further owned id (owner) is load-only and is not among the listed set. No listed id moved from pass to fail.</text>
</svg>