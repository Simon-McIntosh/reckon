<svg xmlns="http://www.w3.org/2000/svg" width="35.56cm" height="18.29cm" viewBox="0 0 1400 720" role="image" aria-label="four roster states showing which waiting request takes a seat when one frees">
  <rect width="1400" height="720" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- row 1: full roster, three queued requests -->
    <text x="60" y="76" font-size="16" fill="#1a1a1a">roster at its cap</text>
    <g>
      <rect x="60" y="92" width="60" height="46" fill="#929292"/>
      <rect x="132" y="92" width="60" height="46" fill="#929292"/>
      <rect x="204" y="92" width="60" height="46" fill="#929292"/>
      <rect x="276" y="92" width="60" height="46" fill="#929292"/>
      <rect x="348" y="92" width="60" height="46" fill="#929292"/>
      <rect x="420" y="92" width="60" height="46" fill="#929292"/>
      <rect x="492" y="92" width="60" height="46" fill="#929292"/>
      <rect x="564" y="92" width="60" height="46" fill="#929292"/>
      <rect x="66" y="162" width="14" height="14" fill="#2f6fa8"/>
    </g>
    <text x="90" y="175" font-size="14" fill="#2f6fa8">named lane request</text>
    <text x="270" y="175" font-size="14" fill="#5f5f5f">local request a</text>
    <text x="430" y="175" font-size="14" fill="#5f5f5f">local request b</text>
    <text x="700" y="126" font-size="14" fill="#5f5f5f">all three wait queued; no run id is printed without a pointer</text>

    <!-- row 2: one seat frees, the named request takes it -->
    <text x="60" y="256" font-size="16" fill="#1a1a1a">one seat frees</text>
    <g>
      <rect x="60" y="272" width="60" height="46" fill="#929292"/>
      <rect x="132" y="272" width="60" height="46" fill="#929292"/>
      <rect x="204" y="272" width="60" height="46" fill="#929292"/>
      <rect x="276" y="272" width="60" height="46" fill="#929292"/>
      <rect x="348" y="272" width="60" height="46" fill="#929292"/>
      <rect x="420" y="272" width="60" height="46" fill="#929292"/>
      <rect x="492" y="272" width="60" height="46" fill="#929292"/>
      <rect x="564" y="272" width="60" height="46" fill="#2f6fa8"/>
      <path d="M 594 342 L 594 322" stroke="#2f6fa8" stroke-width="3"/>
      <path d="M 587 330 L 594 320 L 601 330" fill="none" stroke="#2f6fa8" stroke-width="3"/>
    </g>
    <text x="90" y="342" font-size="14" fill="#2f6fa8">named lane request launches</text>
    <text x="330" y="342" font-size="14" fill="#5f5f5f">local requests hold the queue</text>

    <!-- row 3: local lane alone fills the cap -->
    <text x="60" y="436" font-size="16" fill="#1a1a1a">one seat free, nothing on another lane waiting</text>
    <g>
      <rect x="60" y="452" width="60" height="46" fill="#929292"/>
      <rect x="132" y="452" width="60" height="46" fill="#929292"/>
      <rect x="204" y="452" width="60" height="46" fill="#929292"/>
      <rect x="276" y="452" width="60" height="46" fill="#929292"/>
      <rect x="348" y="452" width="60" height="46" fill="#929292"/>
      <rect x="420" y="452" width="60" height="46" fill="#929292"/>
      <rect x="492" y="452" width="60" height="46" fill="#929292"/>
      <rect x="564" y="452" width="60" height="46" fill="#929292"/>
      <rect x="564" y="452" width="60" height="46" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    </g>
    <text x="700" y="480" font-size="14" fill="#5f5f5f">the local lane takes the last seat: no reserve stands while</text>
    <text x="700" y="502" font-size="14" fill="#5f5f5f">nothing waits on another lane</text>

    <!-- row 4: local lane stops at the reserve when a named request waits -->
    <text x="60" y="600" font-size="16" fill="#1a1a1a">one seat free, a named request waiting</text>
    <g>
      <rect x="60" y="616" width="60" height="46" fill="#929292"/>
      <rect x="132" y="616" width="60" height="46" fill="#929292"/>
      <rect x="204" y="616" width="60" height="46" fill="#929292"/>
      <rect x="276" y="616" width="60" height="46" fill="#929292"/>
      <rect x="348" y="616" width="60" height="46" fill="#929292"/>
      <rect x="420" y="616" width="60" height="46" fill="#929292"/>
      <rect x="492" y="616" width="60" height="46" fill="#929292"/>
      <rect x="564" y="616" width="60" height="46" fill="none" stroke="#2f6fa8" stroke-width="2"/>
      <rect x="66" y="666" width="14" height="14" fill="#2f6fa8"/>
    </g>
    <text x="90" y="678" font-size="14" fill="#2f6fa8">named lane request waiting</text>
    <text x="700" y="644" font-size="14" fill="#5f5f5f">the last seat stays free for the request that named</text>
    <text x="700" y="666" font-size="14" fill="#5f5f5f">another lane; local work queues one seat short of the cap</text>
  </g>
</svg>