<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Finding and repair rates by node class</title>
  <desc id="desc">Source-change reviews have an 86.1 percent finding share and 13.0 percent repair share among finding reviews. Documentation and evidence reviews have an 86.6 percent finding share and 2.4 percent repair share. No test-only review was present in the classified corpus.</desc>
  <rect width="1000" height="470" fill="#fff"/>
  <text x="48" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#18202a">Findings and repairs by node class</text>
  <text x="48" y="69" font-family="sans-serif" font-size="14" fill="#59636e">Bars are shares; repair is conditional on a review carrying a finding</text>
  <line x1="180" y1="360" x2="930" y2="360" stroke="#52606d" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#59636e">
    <text x="180" y="382" text-anchor="middle">0%</text><text x="368" y="382" text-anchor="middle">25%</text>
    <text x="555" y="382" text-anchor="middle">50%</text><text x="743" y="382" text-anchor="middle">75%</text>
    <text x="930" y="382" text-anchor="middle">100%</text>
    <text x="170" y="155" text-anchor="end">docs / evidence</text><text x="170" y="255" text-anchor="end">test-only</text><text x="170" y="355" text-anchor="end">source</text>
  </g>
  <g stroke="#d5dce2" stroke-width="1" stroke-dasharray="3 3"><line x1="368" y1="95" x2="368" y2="360"/><line x1="555" y1="95" x2="555" y2="360"/><line x1="743" y1="95" x2="743" y2="360"/></g>
  <rect x="180" y="124" width="650" height="26" rx="4" fill="#4f8cc9"/><rect x="180" y="155" width="18" height="26" rx="4" fill="#d7833f"/>
  <rect x="180" y="324" width="646" height="26" rx="4" fill="#4f8cc9"/><rect x="180" y="355" width="98" height="26" rx="4" fill="#d7833f"/>
  <g font-family="sans-serif" font-size="13" fill="#18202a"><text x="842" y="143">86.6% findings (n=97)</text><text x="205" y="174">2.4% repaired</text><text x="840" y="343">86.1% findings (n=502)</text><text x="289" y="374">13.0% repaired</text><text x="180" y="274">no classified sample</text></g>
  <g font-family="sans-serif" font-size="13"><rect x="720" y="410" width="14" height="14" fill="#4f8cc9"/><text x="741" y="422" fill="#59636e">reviews with findings</text><rect x="890" y="410" width="14" height="14" fill="#d7833f"/><text x="911" y="422" fill="#59636e">finding reviews repaired</text></g>
</svg>
