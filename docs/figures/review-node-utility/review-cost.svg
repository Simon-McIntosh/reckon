<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Median review cost against median implement cost</title>
  <desc id="desc">The measured review sample takes 1743 seconds and 100 assistant turns, against 3510 seconds and 158 turns for the implement runs it reviews.</desc>
  <rect width="900" height="420" fill="#fff"/>
  <text x="48" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#18202a">Review cost against the implement run</text>
  <text x="48" y="69" font-family="sans-serif" font-size="14" fill="#59636e">Joined stream sample: 161 implement walls, 183 review walls, 207 implement/reviewer joins</text>
  <line x1="95" y1="345" x2="845" y2="345" stroke="#52606d" stroke-width="2"/>
  <line x1="95" y1="95" x2="95" y2="345" stroke="#52606d" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#59636e">
    <text x="79" y="349" text-anchor="end">0</text><text x="79" y="287" text-anchor="end">1,000 s</text>
    <text x="79" y="224" text-anchor="end">2,000 s</text><text x="79" y="162" text-anchor="end">3,000 s</text>
    <text x="79" y="100" text-anchor="end">4,000 s</text>
    <text x="260" y="372" text-anchor="middle">review</text><text x="590" y="372" text-anchor="middle">implement</text>
  </g>
  <rect x="170" y="236" width="180" height="109" rx="5" fill="#4f8cc9"/>
  <rect x="500" y="125" width="180" height="220" rx="5" fill="#d7833f"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="260" y="220" font-size="20" font-weight="700" fill="#18202a">1,743 s</text>
    <text x="260" y="255" font-size="15" fill="#fff">100 turns</text>
    <text x="590" y="110" font-size="20" font-weight="700" fill="#18202a">3,510 s</text>
    <text x="590" y="255" font-size="15" fill="#fff">158 turns</text>
  </g>
  <text x="48" y="405" font-family="sans-serif" font-size="13" fill="#59636e">Median review wall is 49.7% of the implement wall; review turns are 63.3% of implement turns.</text>
</svg>
