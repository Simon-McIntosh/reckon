<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Time from first sighting to noisy follower transitions</title>
  <desc id="desc">Median elapsed time from a run's first record on 25 September 2026 to each noisy transition. A vertical line marks five minutes. Launch flicker occurs at five seconds; the other noisy transitions occur after roughly twenty-three to forty-two minutes.</desc>
  <rect width="960" height="430" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#243447">
    <text x="52" y="34" font-size="20" font-weight="700">Noise transitions arrive on two different clocks</text>
    <text x="52" y="56" font-size="13" fill="#5f6b76">Median seconds from the run's first 2026-09-25 sighting; capture ends 12:55:21Z</text>
    <g stroke="#d9e0e6" stroke-width="1">
      <line x1="300" y1="92" x2="300" y2="356"/>
      <line x1="400" y1="92" x2="400" y2="356"/>
      <line x1="500" y1="92" x2="500" y2="356"/>
      <line x1="600" y1="92" x2="600" y2="356"/>
      <line x1="700" y1="92" x2="700" y2="356"/>
      <line x1="800" y1="92" x2="800" y2="356"/>
      <line x1="900" y1="92" x2="900" y2="356"/>
    </g>
    <line x1="308" y1="84" x2="308" y2="356" stroke="#b23a48" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="314" y="78" font-size="12" fill="#b23a48">5 min</text>
    <g font-size="12" fill="#5f6b76">
      <text x="296" y="376">0</text><text x="392" y="376">600</text><text x="488" y="376">1200</text>
      <text x="586" y="376">1800</text><text x="682" y="376">2400</text><text x="778" y="376">3000</text><text x="874" y="376">3600 s</text>
    </g>
    <g font-size="13">
      <text x="52" y="120">dispatched → abandoned</text>
      <text x="52" y="164">abandoned → working</text>
      <text x="52" y="208">working → blocked</text>
      <text x="52" y="252">blocked → completed_unpromoted</text>
      <text x="52" y="296">working → stalled</text>
      <text x="52" y="340">stalled → working</text>
    </g>
    <g stroke="#4878a8" stroke-width="8" stroke-linecap="round">
      <line x1="300" y1="116" x2="301" y2="116"/>
      <line x1="300" y1="160" x2="328" y2="160"/>
      <line x1="300" y1="204" x2="516" y2="204"/>
      <line x1="300" y1="248" x2="628" y2="248"/>
      <line x1="300" y1="292" x2="644" y2="292"/>
      <line x1="300" y1="336" x2="702" y2="336"/>
    </g>
    <g fill="#243447" font-size="12">
      <text x="314" y="121">5 s · n=230 · 77.4% resolved to working ≤5 min</text>
      <text x="338" y="165">178 s · n=219</text>
      <text x="526" y="209">1,349 s · n=106 · 22.6% resolved to completed_unpromoted ≤5 min</text>
      <text x="638" y="253">2,045.5 s · n=96</text>
      <text x="654" y="297">2,151 s · n=24 · 83.3% returned to working ≤5 min</text>
      <text x="712" y="341">2,510.5 s · n=24</text>
    </g>
    <text x="52" y="408" font-size="12" fill="#5f6b76">The short launch pair is an admission/liveness flicker; the later clusters are exit and stall classifier noise, not one timing population.</text>
  </g>
</svg>
