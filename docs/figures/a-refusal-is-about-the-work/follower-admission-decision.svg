<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .head { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .accept { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .warn { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; }
    .refuse { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
    .t { font-size: 12.5px; fill: #0f172a; }
    .h { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 11px; fill: #475569; }
    .edge { stroke: #334155; stroke-width: 1.5px; fill: none; marker-end: url(#a); }
    .lab { font-size: 11px; font-weight: 700; fill: #334155; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="30" y="34" class="h">Admitting a dispatch while a watcher is required — three questions, two refusals</text>
  <text x="30" y="54" class="s">Wake delivery is session-local even though the watcher seat is project-global, so the seat answers a stricter question than a session's own delivery does.</text>

  <rect x="40" y="78" width="320" height="54" rx="8" class="head"/>
  <text x="60" y="102" class="t">dispatch with watcher arming required</text>
  <text x="60" y="120" class="s">the cli launcher path</text>

  <path d="M200,132 L200,166" class="edge"/>

  <rect x="40" y="170" width="360" height="92" rx="8" class="box"/>
  <text x="60" y="196" class="h">1. The watcher process is live?</text>
  <text x="60" y="218" class="t">the project seat holds a running pid</text>
  <text x="60" y="238" class="s">nothing about the seat says who it delivers to</text>

  <path d="M400,216 L540,216" class="edge"/>
  <text x="452" y="208" class="lab">no</text>
  <rect x="540" y="176" width="380" height="80" rx="8" class="refuse"/>
  <text x="560" y="204" class="h">Refused — watcher-required (exit 8)</text>
  <text x="560" y="226" class="t">a project with no live seat is still refused</text>
  <text x="560" y="244" class="s">unchanged by this narrowing</text>

  <path d="M220,262 L220,300" class="edge"/>
  <text x="228" y="286" class="lab">yes</text>

  <rect x="40" y="304" width="360" height="92" rx="8" class="box"/>
  <text x="60" y="330" class="h">2. This session is already attached?</text>
  <text x="60" y="352" class="t">its own live follower holds the delivery lock</text>
  <text x="60" y="372" class="s">an attached session is delivered to already</text>

  <path d="M400,350 L540,350" class="edge"/>
  <text x="452" y="342" class="lab">yes</text>
  <rect x="540" y="310" width="380" height="80" rx="8" class="accept"/>
  <text x="560" y="338" class="h">Proceeds — no warning</text>
  <text x="560" y="360" class="t">this run's completion wakes the session</text>
  <text x="560" y="378" class="s">nothing to re-arm</text>

  <path d="M220,396 L220,434" class="edge"/>
  <text x="228" y="420" class="lab">no</text>

  <rect x="40" y="438" width="360" height="94" rx="8" class="box"/>
  <text x="60" y="464" class="h">3. Its registration was released?</text>
  <text x="60" y="486" class="t">the registration file remains after its lock frees</text>
  <text x="60" y="506" class="s">a session that never armed one leaves no file at all</text>

  <path d="M400,485 L540,485" class="edge"/>
  <text x="452" y="477" class="lab">yes</text>
  <rect x="540" y="438" width="380" height="94" rx="8" class="warn"/>
  <text x="560" y="466" class="h">Proceeds — warning names the re-arm</text>
  <text x="560" y="488" class="t">the warning carries the exact attach command,</text>
  <text x="560" y="506" class="t">&#8220;reckon crew follow &#8230;&#8221;, so delivery can be restored</text>
  <text x="560" y="524" class="s">the run is created; the operator is told what it costs</text>

  <path d="M220,532 L220,572" class="edge"/>
  <text x="228" y="558" class="lab">no</text>

  <rect x="40" y="576" width="360" height="86" rx="8" class="refuse"/>
  <text x="60" y="602" class="h">Refused — nothing to distinguish it from</text>
  <text x="60" y="624" class="t">never registered, so no release can be inferred</text>
  <text x="60" y="644" class="s">the refusal keeps its exit 8 and names the session</text>
</svg>