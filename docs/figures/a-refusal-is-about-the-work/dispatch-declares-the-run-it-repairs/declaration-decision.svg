<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="system-ui, sans-serif" font-size="13">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#111">A dispatch that declares --repairs RUN_ID</text>

  <rect x="24" y="60" width="220" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="134" y="86" text-anchor="middle" fill="#1e1b4b">crew dispatch --repairs R</text>
  <text x="134" y="106" text-anchor="middle" fill="#4338ca" font-size="11">R must be a promoted run here</text>

  <polygon points="360,58 470,90 360,122 250,90" fill="#fff7ed" stroke="#ea580c"/>
  <text x="360" y="86" text-anchor="middle" fill="#7c2d12">R in this project's</text>
  <text x="360" y="102" text-anchor="middle" fill="#7c2d12">ledger?</text>

  <line x1="244" y1="90" x2="249" y2="90" stroke="#4f46e5" stroke-width="2"/>
  <line x1="470" y1="90" x2="536" y2="90" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/>
  <text x="497" y="82" text-anchor="middle" fill="#166534" font-size="11">yes</text>

  <line x1="360" y1="122" x2="360" y2="150" stroke="#b91c1c" stroke-width="2"/>
  <text x="372" y="142" fill="#b91c1c" font-size="11">no</text>
  <rect x="180" y="152" width="360" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="360" y="176" text-anchor="middle" fill="#7f1d1d" font-weight="600">refused before launch, reason named</text>
  <rect x="196" y="188" width="328" height="26" rx="5" fill="#fee2e2"/>
  <text x="206" y="206" fill="#7f1d1d">unknown run &#8212; names no run in the ledger</text>
  <rect x="196" y="216" width="328" height="26" rx="5" fill="#fee2e2"/>
  <text x="206" y="234" fill="#7f1d1d">not yet promoted &#8212; live pointer, no ledger row</text>
  <rect x="196" y="244" width="328" height="26" rx="5" fill="#fee2e2"/>
  <text x="206" y="262" fill="#7f1d1d">another project &#8212; pointer names a foreign project</text>

  <rect x="540" y="58" width="396" height="64" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="738" y="82" text-anchor="middle" fill="#064e3b">record: repairs: R  &#8212;  beside attempt_kind</text>
  <text x="738" y="102" text-anchor="middle" fill="#047857" font-size="11">written on the new run's pointer</text>

  <line x1="738" y1="122" x2="738" y2="298" stroke="#10b981" stroke-width="2" marker-end="url(#b)"/>

  <rect x="540" y="302" width="396" height="120" rx="8" fill="#f0fdf4" stroke="#34d399"/>
  <text x="738" y="326" text-anchor="middle" fill="#064e3b" font-weight="600">promotion: _require_impl_moved</text>
  <text x="738" y="350" text-anchor="middle" fill="#14532d">existing corrective-attempt check</text>
  <text x="738" y="370" text-anchor="middle" fill="#14532d">reads repairs beside attempt_kind</text>
  <rect x="556" y="382" width="364" height="28" rx="5" fill="#dcfce7"/>
  <text x="738" y="400" text-anchor="middle" fill="#14532d">impl_move: exempt / corrective-run:repairs:R</text>

  <defs>
    <marker id="a" markerWidth="9" fill="#ea580c" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/>
    </marker>
    <marker id="b" markerWidth="9" fill="#10b981" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#10b981"/>
    </marker>
  </defs>
</svg>