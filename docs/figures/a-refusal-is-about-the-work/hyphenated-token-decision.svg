<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .head { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .accept { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .refuse { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
    .t { font-size: 12.5px; fill: #0f172a; }
    .h { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 11px; fill: #475569; }
    .edge { stroke: #334155; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="30" y="34" class="h">The leading token is read whole — a hyphen joins it before the verb test</text>
  <text x="30" y="54" class="s">The clause after a separator opens a second deliverable only when that token is an action verb.</text>

  <rect x="30" y="84" width="300" height="80" rx="8" class="head"/>
  <text x="46" y="110" class="h">Clause after a separator</text>
  <text x="46" y="134" class="t">… and verify-gate refusals</text>
  <text x="46" y="152" class="t">to the run they judge</text>

  <rect x="386" y="84" width="220" height="80" rx="8" class="box"/>
  <text x="402" y="110" class="h">Leading token</text>
  <text x="402" y="136" class="t" font-weight="700">verify-gate</text>
  <text x="402" y="154" class="s">hyphen joins it to a word</text>

  <rect x="662" y="84" width="228" height="80" rx="8" class="accept"/>
  <text x="678" y="110" class="h">a noun, not a verb</text>
  <text x="678" y="134" class="t">→ one deliverable</text>
  <text x="678" y="152" class="s">accepted: single-goal holds</text>

  <rect x="30" y="206" width="300" height="80" rx="8" class="head"/>
  <text x="46" y="232" class="h">Clause after a separator</text>
  <text x="46" y="256" class="t">… ; verify the node</text>
  <text x="46" y="274" class="t">validator</text>

  <rect x="386" y="206" width="220" height="80" rx="8" class="box"/>
  <text x="402" y="232" class="h">Leading token</text>
  <text x="402" y="258" class="t" font-weight="700">verify</text>
  <text x="402" y="276" class="s">a bare action verb</text>

  <rect x="662" y="206" width="228" height="80" rx="8" class="refuse"/>
  <text x="678" y="232" class="h">an action verb</text>
  <text x="678" y="256" class="t">→ a second deliverable</text>
  <text x="678" y="274" class="s">refused: single-goal</text>

  <line x1="330" y1="124" x2="380" y2="124" class="edge"/>
  <line x1="606" y1="124" x2="656" y2="124" class="edge"/>
  <line x1="330" y1="246" x2="380" y2="246" class="edge"/>
  <line x1="606" y1="246" x2="656" y2="246" class="edge"/>

  <text x="30" y="330" class="s">Before this change the token was read as its first word alone ("verify"), so the accepted clause split in two.</text>
  <text x="30" y="350" class="s">The declared negative control restores that reading and makes the accepted verify-gate row fail single-goal.</text>
</svg>