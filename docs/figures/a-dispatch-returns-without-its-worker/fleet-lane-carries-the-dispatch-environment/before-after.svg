<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="system-ui, sans-serif" font-size="13">
  <rect width="860" height="380" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="600">Before — the batch step's own crew home</text>
  <g>
    <rect x="20" y="46" width="150" height="46" rx="6" fill="#eef2f7" stroke="#9aa7b8"/>
    <text x="95" y="66" text-anchor="middle">dispatcher</text>
    <text x="95" y="82" text-anchor="middle" font-size="11" fill="#5a6675">RECKON_HOME=/scratch</text>

    <rect x="215" y="46" width="150" height="46" rx="6" fill="#eef2f7" stroke="#9aa7b8"/>
    <text x="290" y="66" text-anchor="middle">batch step</text>
    <text x="290" y="82" text-anchor="middle" font-size="11" fill="#5a6675">RECKON_HOME=~/.config</text>

    <rect x="410" y="46" width="170" height="46" rx="6" fill="#fdecea" stroke="#e0b4ae"/>
    <text x="495" y="66" text-anchor="middle">supervisor</text>
    <text x="495" y="82" text-anchor="middle" font-size="11" fill="#8a3b31">starts under batch home</text>

    <rect x="625" y="46" width="215" height="46" rx="6" fill="#fdecea" stroke="#e0b4ae"/>
    <text x="732" y="66" text-anchor="middle" font-size="12">no run in ~/.config/crew/live</text>
    <text x="732" y="82" text-anchor="middle" font-size="12" fill="#8a3b31">exits at once — worker never starts</text>

    <line x1="170" y1="69" x2="215" y2="69" stroke="#9aa7b8"/>
    <line x1="365" y1="69" x2="410" y2="69" stroke="#9aa7b8"/>
    <line x1="580" y1="69" x2="625" y2="69" stroke="#9aa7b8"/>

    <text x="20" y="118" font-size="12" fill="#b03a2e">dispatch acked pid 1550131 and returned success — a live worker that never started</text>
  </g>

  <line x1="20" y1="140" x2="840" y2="140" stroke="#e3e7ec"/>

  <text x="20" y="170" font-size="15" font-weight="600">After — the spec carries the dispatcher's crew home</text>
  <g>
    <rect x="20" y="188" width="150" height="46" rx="6" fill="#eef2f7" stroke="#9aa7b8"/>
    <text x="95" y="208" text-anchor="middle">dispatcher</text>
    <text x="95" y="224" text-anchor="middle" font-size="11" fill="#5a6675">RECKON_HOME=/scratch</text>

    <rect x="215" y="188" width="150" height="46" rx="6" fill="#eef7ee" stroke="#9ec89e"/>
    <text x="290" y="208" text-anchor="middle">batch step</text>
    <text x="290" y="224" text-anchor="middle" font-size="11" fill="#5a6675">applies spec.environment</text>

    <rect x="410" y="188" width="170" height="46" rx="6" fill="#eef7ee" stroke="#9ec89e"/>
    <text x="495" y="208" text-anchor="middle">supervisor</text>
    <text x="495" y="224" text-anchor="middle" font-size="11" fill="#3f6b3f">RECKON_HOME=/scratch</text>

    <rect x="625" y="188" width="215" height="46" rx="6" fill="#eef7ee" stroke="#9ec89e"/>
    <text x="732" y="208" text-anchor="middle" font-size="12">finds the run, spawns the worker</text>
    <text x="732" y="224" text-anchor="middle" font-size="12" fill="#3f6b3f">dispatch confirms it survived 2 s</text>

    <line x1="170" y1="211" x2="215" y2="211" stroke="#9aa7b8"/>
    <line x1="365" y1="211" x2="410" y2="211" stroke="#9aa7b8"/>
    <line x1="580" y1="211" x2="625" y2="211" stroke="#9aa7b8"/>

    <text x="20" y="262" font-size="12" fill="#3f6b3f">the environment travels with the spec; a supervisor that cannot find its run fails the dispatch</text>
  </g>

  <line x1="20" y1="286" x2="840" y2="286" stroke="#e3e7ec"/>

  <g font-size="12">
    <text x="20" y="312" font-weight="600">Negative control</text>
    <text x="20" y="332" fill="#5a6675">spawn_supervisor started the argv with the batch step's environment only.</text>
    <text x="20" y="350" fill="#b03a2e">The new dispatch case raised CrewError — exit record: "worker did not spawn: CrewError: no live run".</text>
  </g>
</svg>