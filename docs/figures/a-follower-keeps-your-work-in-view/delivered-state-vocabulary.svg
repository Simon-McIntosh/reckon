<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-monospace, Menlo, Consolas, monospace">
  <rect width="900" height="400" fill="#0f1115"/>
  <text x="24" y="34" fill="#e6e6e6" font-size="18">The follower delivers three states; one is named completed_unpromoted, not complete</text>
  <text x="24" y="58" fill="#8b93a1" font-size="13">Fixture: r-one phase=starting, r-two phase=working; then r-one's manifest is written with status: complete. The real follower over the real feed is read.</text>

  <!-- timeline axis -->
  <line x1="60" y1="130" x2="860" y2="130" stroke="#39404d" stroke-width="2"/>
  <text x="60" y="118" fill="#8b93a1" font-size="12">t0 attach</text>
  <text x="470" y="118" fill="#8b93a1" font-size="12">manifest: complete</text>
  <text x="760" y="118" fill="#8b93a1" font-size="12">t1</text>

  <!-- emitted rows -->
  <g font-size="13">
    <circle cx="150" cy="130" r="5" fill="#4f9dff"/>
    <text x="120" y="160" fill="#4f9dff">dispatched</text>
    <text x="120" y="176" fill="#8b93a1" font-size="11">r-one baseline</text>

    <circle cx="300" cy="130" r="5" fill="#4f9dff"/>
    <text x="285" y="160" fill="#4f9dff">working</text>
    <text x="285" y="176" fill="#8b93a1" font-size="11">r-two baseline</text>

    <circle cx="600" cy="130" r="5" fill="#7d5cff"/>
    <text x="520" y="160" fill="#7d5cff">completed_unpromoted</text>
    <text x="520" y="176" fill="#8b93a1" font-size="11">r-one transition out of working</text>
  </g>

  <!-- delivered set -->
  <rect x="60" y="215" width="360" height="140" rx="8" fill="#16211a" stroke="#2f6b45"/>
  <text x="80" y="243" fill="#5ed08a" font-size="14">follower delivered (measured)</text>
  <text x="80" y="272" fill="#d7e4dc" font-size="13">["dispatched",</text>
  <text x="80" y="292" fill="#d7e4dc" font-size="13"> "working",</text>
  <text x="80" y="312" fill="#5ed08a" font-size="13"> "completed_unpromoted"]</text>
  <text x="80" y="340" fill="#8b93a1" font-size="11">every state the run passed through — no filter</text>

  <!-- stale assertion -->
  <rect x="470" y="215" width="370" height="140" rx="8" fill="#2a1717" stroke="#7a2f2f"/>
  <text x="490" y="243" fill="#ff7b7b" font-size="14">stale assertion (red at base)</text>
  <text x="490" y="272" fill="#f0d6d6" font-size="13">waits for to_state == "complete"</text>
  <text x="490" y="292" fill="#f0d6d6" font-size="13">got: ["completed_unpromoted", …]</text>
  <text x="490" y="312" fill="#ff7b7b" font-size="13">-&gt; _wait_for timed out at _wait_for:363</text>
  <text x="490" y="340" fill="#8b93a1" font-size="11">the source is right; the expectation was the old word</text>
</svg>