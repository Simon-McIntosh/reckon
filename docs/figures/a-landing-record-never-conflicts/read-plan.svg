<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Three readers — the serve file route, doccheck audit_file and the read_plan text path — all call the one resolver evidence_record_plan, which decides from the document's own metas whether it is a record and which plan it composes for; a record reads composed, anything else reads as its own bytes.">
  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 6; }
    .reader { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
    .resolver { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 6; }
    .composer { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; rx: 6; }
    .out { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 6; }
    .meta { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.2; stroke-dasharray: 5 3; rx: 6; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12px; fill: #475569; }
    .lbl { font-size: 12px; fill: #334155; }
    line, path { stroke: #334155; stroke-width: 1.5; fill: none; }
  </style>

  <rect class="reader" x="20" y="30" width="210" height="64"/>
  <text class="t" x="125" y="58" text-anchor="middle">serve file route</text>
  <text class="s" x="125" y="78" text-anchor="middle">_send_evidence_record</text>

  <rect class="reader" x="20" y="138" width="210" height="64"/>
  <text class="t" x="125" y="166" text-anchor="middle">audit-doc</text>
  <text class="s" x="125" y="186" text-anchor="middle">doccheck.audit_file</text>

  <rect class="reader" x="20" y="246" width="210" height="64"/>
  <text class="t" x="125" y="274" text-anchor="middle">read_plan</text>
  <text class="s" x="125" y="294" text-anchor="middle">_typed_resource_text</text>

  <rect class="resolver" x="300" y="138" width="200" height="64"/>
  <text class="t" x="400" y="166" text-anchor="middle">evidence_record_plan</text>
  <text class="s" x="400" y="186" text-anchor="middle">one resolver, in evidence.py</text>

  <rect class="meta" x="300" y="246" width="200" height="64"/>
  <text class="lbl" x="400" y="272" text-anchor="middle">reckon-type: evidence</text>
  <text class="lbl" x="400" y="292" text-anchor="middle">plan-evidence-for: &lt;plan&gt;</text>

  <rect class="composer" x="560" y="138" width="180" height="64"/>
  <text class="t" x="650" y="166" text-anchor="middle">compose_landed_record</text>
  <text class="s" x="650" y="186" text-anchor="middle">record + fragments</text>

  <rect class="out" x="560" y="30" width="180" height="64"/>
  <text class="t" x="650" y="58" text-anchor="middle">composed text</text>
  <text class="s" x="650" y="78" text-anchor="middle">record's own bytes</text>

  <line x1="230" y1="62" x2="300" y2="158"/>
  <line x1="230" y1="170" x2="300" y2="170"/>
  <line x1="230" y1="278" x2="300" y2="182"/>
  <line x1="400" y1="246" x2="400" y2="202"/>
  <line x1="500" y1="170" x2="560" y2="170"/>
  <line x1="650" y1="138" x2="650" y2="94"/>
  <text class="lbl" x="430" y="228" text-anchor="middle">metas decide</text>
  <text class="lbl" x="528" y="160" text-anchor="middle">is a record</text>
  <text class="lbl" x="662" y="120" text-anchor="middle">not a record</text>
</svg>