<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Two readers, the serve file route and doccheck audit_file, both call compose_landed_record, which returns the record's bytes followed by its fragments; each falls back to the record's own bytes when the ledger or record cannot be read.">
  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 6; }
    .reader { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
    .composer { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; rx: 6; }
    .out { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 6; }
    .fb { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.2; stroke-dasharray: 5 3; rx: 6; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 12px; fill: #475569; }
    .lbl { font-size: 12px; fill: #334155; }
    line, path { stroke: #334155; stroke-width: 1.5; fill: none; }
  </style>
  <rect class="reader" x="20" y="40" width="200" height="70"/>
  <text class="t" x="120" y="70" text-anchor="middle">serve file route</text>
  <text class="s" x="120" y="90" text-anchor="middle">_send_evidence_record</text>

  <rect class="reader" x="20" y="190" width="200" height="70"/>
  <text class="t" x="120" y="220" text-anchor="middle">audit-doc</text>
  <text class="s" x="120" y="240" text-anchor="middle">doccheck.audit_file</text>

  <rect class="composer" x="300" y="115" width="200" height="70"/>
  <text class="t" x="400" y="145" text-anchor="middle">compose_landed_record</text>
  <text class="s" x="400" y="165" text-anchor="middle">record + fragments</text>

  <rect class="out" x="560" y="115" width="140" height="70"/>
  <text class="t" x="630" y="145" text-anchor="middle">composed bytes</text>
  <text class="s" x="630" y="165" text-anchor="middle">ETag = hash(body)</text>

  <line x1="220" y1="75" x2="300" y2="140"/>
  <line x1="220" y1="225" x2="300" y2="160"/>
  <line x1="500" y1="150" x2="560" y2="150"/>

  <path class="fb" d="M560 250 L400 250 L400 185" />
  <rect class="fb" x="470" y="264" width="230" height="28"/>
  <text class="lbl" x="585" y="283" text-anchor="middle">no fragments / ledger unreadable</text>
  <text class="lbl" x="352" y="243" text-anchor="middle">raw record bytes</text>
</svg>