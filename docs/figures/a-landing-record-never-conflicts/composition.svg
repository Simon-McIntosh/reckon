<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" fill="#111827" font-weight="600">Read-time composition of a plan's cumulative evidence record</text>
  <text x="24" y="52" font-size="12" fill="#4b5563">compose_landed_record() returns bytes: the record file's own bytes, then its fragments in ledger promotion order.</text>
  <rect x="24" y="78" width="260" height="96" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="40" y="102" font-size="13" fill="#312e81" font-weight="600">record file's own bytes</text>
  <text x="40" y="122" font-size="11" fill="#3730a3">docs/evidence/.. /&lt;plan&gt;-landed.html</text>
  <text x="40" y="139" font-size="11" fill="#3730a3">archive/ or live spelling</text>
  <text x="40" y="160" font-size="11" fill="#6b7280">read as bytes, never re-rendered</text>
  <text x="296" y="130" font-size="22" fill="#6b7280">+</text>
  <rect x="326" y="78" width="288" height="96" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="342" y="102" font-size="13" fill="#065f46" font-weight="600">fragments in promotion order</text>
  <rect x="342" y="112" width="122" height="22" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.0"/>
  <text x="350" y="128" font-size="11" fill="#064e3b">1  zeta.html</text>
  <rect x="472" y="112" width="122" height="22" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.0"/>
  <text x="480" y="128" font-size="11" fill="#064e3b">2  mid.html</text>
  <rect x="342" y="140" width="122" height="22" rx="4" fill="#a7f3d0" stroke="#059669" stroke-width="1.0"/>
  <text x="350" y="156" font-size="11" fill="#064e3b">3  alpha.html</text>
  <text x="472" y="156" font-size="11" fill="#6b7280">docs/evidence/fragments/&lt;plan&gt;/</text>
  <text x="632" y="130" font-size="22" fill="#6b7280">=</text>
  <rect x="662" y="78" width="274" height="96" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="678" y="102" font-size="13" fill="#92400e" font-weight="600">composed bytes (returned)</text>
  <rect x="678" y="112" width="96" height="22" rx="4" fill="#fcd34d" stroke="#d97706" stroke-width="1.0"/>
  <text x="686" y="128" font-size="11" fill="#78350f">record</text>
  <rect x="780" y="112" width="62" height="22" rx="4" fill="#bbf7d0" stroke="#059669" stroke-width="1.0"/>
  <text x="788" y="128" font-size="11" fill="#064e3b">zeta</text>
  <rect x="848" y="112" width="62" height="22" rx="4" fill="#bbf7d0" stroke="#059669" stroke-width="1.0"/>
  <text x="856" y="128" font-size="11" fill="#064e3b">mid</text>
  <text x="678" y="156" font-size="11" fill="#92400e">order is the ledger's, not the filename's</text>
  <rect x="24" y="200" width="912" height="74" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="40" y="226" font-size="13" fill="#991b1b" font-weight="600">Negative control - order by filename instead</text>
  <text x="40" y="246" font-size="11" fill="#7f1d1d">filename order (alpha, mid, zeta) is a permutation of promotion order (zeta, mid, alpha).</text>
  <text x="40" y="263" font-size="11" fill="#7f1d1d">The ordering case then fails on both record spellings, so the assertion can fail.</text>
  <rect x="24" y="294" width="912" height="180" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="40" y="320" font-size="13" fill="#111827" font-weight="600">Identity case - a record with no fragments</text>
  <rect x="40" y="336" width="240" height="58" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="56" y="360" font-size="11" fill="#312e81">no fragments/&lt;plan&gt;/ directory</text>
  <text x="56" y="380" font-size="11" fill="#6b7280">the file's bytes, read as bytes</text>
  <text x="300" y="372" font-size="20" fill="#6b7280">=</text>
  <rect x="336" y="336" width="250" height="58" rx="6" fill="#f3fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="352" y="360" font-size="11" fill="#312e81">composed bytes are byte-identical</text>
  <text x="352" y="380" font-size="11" fill="#6b7280">the record is never rewritten</text>
  <text x="612" y="352" font-size="11" fill="#374151">Asserted over every existing</text>
  <text x="612" y="370" font-size="11" fill="#374151">docs/evidence/*-landed.html and</text>
  <text x="612" y="388" font-size="11" fill="#374151">docs/evidence/archive/*-landed.html</text>
  <text x="612" y="406" font-size="11" fill="#374151">with no fragments.</text>
</svg>
