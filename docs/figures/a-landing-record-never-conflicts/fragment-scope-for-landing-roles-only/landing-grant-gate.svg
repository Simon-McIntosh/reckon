<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" fill="#111827" font-weight="600">The landing grant: one gate before, two gates after</text>
  <text x="24" y="52" font-size="12" fill="#4b5566">Dispatch grants a node its own evidence fragment and figure directory. The grant must reach only roles that land work in the tree.</text>

  <!-- BEFORE -->
  <text x="24" y="88" font-size="14" fill="#991b1b" font-weight="600">before — the sandbox alone decides</text>

  <rect x="24" y="104" width="190" height="40" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="38" y="128" font-size="12" fill="#312e81">role resolves a sandbox</text>

  <rect x="270" y="104" width="210" height="40" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="284" y="121" font-size="11" fill="#312e81">sandbox can write</text>
  <text x="284" y="136" font-size="11" fill="#312e81">the worktree?</text>

  <path d="M214 124 L 264 124" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="540" y="104" width="200" height="40" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="556" y="129" font-size="12" fill="#065f46">grant fragment + figures</text>
  <path d="M480 124 L 534 124" fill="none" stroke="#10b981" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="486" y="116" font-size="10" fill="#065f46">yes</text>

  <rect x="540" y="164" width="200" height="40" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="556" y="189" font-size="12" fill="#374151">no landing paths</text>
  <path d="M410 144 L 470 183 L 534 183" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="486" y="176" font-size="10" fill="#6b7280">no</text>

  <rect x="24" y="230" width="716" height="58" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="254" font-size="12" fill="#991b1b" font-weight="600">a verifier escapes: the test role is worktree-full</text>
  <text x="40" y="274" font-size="11" fill="#7f1d1d">its sandbox can write the worktree, so it is handed a repository write path — yet promotion refuses any verifier commit touching one.</text>

  <!-- AFTER -->
  <text x="24" y="330" font-size="14" fill="#065f46" font-weight="600">after — the role predicate is the second gate</text>

  <rect x="24" y="346" width="190" height="40" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="38" y="370" font-size="12" fill="#312e81">role resolves a sandbox</text>

  <rect x="270" y="340" width="210" height="52" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="284" y="359" font-size="11" fill="#312e81">role may write</text>
  <text x="284" y="373" font-size="11" fill="#312e81">repository paths?</text>
  <text x="284" y="387" font-size="10" fill="#6b7280">(implement, cleanup, …)</text>

  <rect x="544" y="340" width="200" height="52" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="558" y="359" font-size="11" fill="#312e81">sandbox can write</text>
  <text x="558" y="373" font-size="11" fill="#312e81">the worktree?</text>
  <text x="558" y="387" font-size="10" fill="#6b7280">(worktree-full, workspace-write)</text>

  <path d="M214 366 L 264 366" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M480 366 L 538 366" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="544" y="430" width="200" height="40" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="560" y="455" font-size="12" fill="#065f46">grant fragment + figures</text>
  <path d="M644 392 L 644 424" fill="none" stroke="#10b981" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="650" y="412" font-size="10" fill="#065f46">yes / yes</text>

  <rect x="270" y="430" width="240" height="40" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="286" y="455" font-size="12" fill="#374151">no landing paths</text>
  <path d="M375 392 L 375 424" fill="none" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="381" y="412" font-size="10" fill="#6b7280">otherwise</text>

  <!-- after: verifier closed -->
  <rect x="24" y="496" width="716" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="40" y="518" font-size="12" fill="#065f46" font-weight="600">a verifier is closed out</text>
  <text x="40" y="536" font-size="11" fill="#065f46">its sandbox may write the worktree, but the role predicate withholds the fragment and figure paths — the grant and the promotion refusal read one authority.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>