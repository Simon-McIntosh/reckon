<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img"
     aria-label="Conflicted paths under docs/plans and docs/evidence after folding the six study commits: 1 as-is, 0 once each anchor is a fragment">
  <style>
    .t  { font: 600 15px system-ui, sans-serif; fill: #1a2233; }
    .s  { font: 400 12px system-ui, sans-serif; fill: #5a6478; }
    .v  { font: 700 16px system-ui, sans-serif; fill: #1a2233; }
    .ax { stroke: #c7cede; stroke-width: 1; }
  </style>
  <rect width="560" height="320" fill="#ffffff"/>
  <text class="t" x="28" y="34">Conflicted paths in the fold (docs/plans + docs/evidence)</text>
  <text class="s" x="28" y="54">six study commits folded with git merge-tree, base 457bbec7</text>

  <!-- bars: scale so 1 conflict = 120px -->
  <g>
    <rect x="120" y="120" width="120" height="56" fill="#c0392b" opacity="0.85"/>
    <text class="v" x="248" y="154">1</text>
    <text class="t" x="120" y="200">before — as they are</text>
    <text class="s" x="120" y="216">the one shared cumulative record, add/add</text>
  </g>
  <g>
    <rect x="120" y="248" width="0" height="0" fill="none"/>
    <line x1="120" y1="262" x2="140" y2="262" stroke="#20603a" stroke-width="4"/>
    <text class="v" x="150" y="268" fill="#20603a">0</text>
    <text class="t" x="120" y="288" fill="#20603a">after — fragment + landing line</text>
  </g>

  <!-- baseline -->
  <line class="ax" x1="118" y1="90" x2="118" y2="276"/>
  <line class="ax" x1="118" y1="276" x2="530" y2="276"/>
  <text class="s" x="118" y="298" transform="translate(0,0)">0</text>
  <g stroke="#c7cede" stroke-width="1" stroke-dasharray="3 4">
    <line x1="238" y1="90" x2="238" y2="276"/>
  </g>
  <text class="s" x="232" y="86">1</text>
  <text class="s" x="410" y="110" text-anchor="middle">expected count: 0</text>
</svg>