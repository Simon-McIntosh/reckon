<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" fill="#111827" font-weight="600">A node's default landing scope: three shared paths, or its own fragment</text>
  <text x="24" y="52" font-size="12" fill="#4b5563">Dispatch adds the same paths to every node on a plan today; the fragment default keys them by node id, so no two scopes overlap.</text>

  <!-- BEFORE -->
  <text x="24" y="88" font-size="14" fill="#991b1b" font-weight="600">before — three paths shared by every node</text>
  <rect x="24" y="100" width="120" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="40" y="122" font-size="12" fill="#312e81">node A</text>
  <rect x="24" y="146" width="120" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="40" y="168" font-size="12" fill="#312e81">node B</text>

  <rect x="220" y="100" width="230" height="34" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="234" y="122" font-size="12" fill="#7f1d1d">plan HTML</text>
  <rect x="220" y="146" width="230" height="34" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="234" y="168" font-size="12" fill="#7f1d1d">docs/evidence/archive/&lt;plan&gt;-landed.html</text>
  <rect x="220" y="192" width="230" height="34" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="234" y="214" font-size="12" fill="#7f1d1d">docs/figures/&lt;plan&gt;/</text>

  <path d="M144 117 C 180 117, 190 140, 216 145" fill="none" stroke="#ef4444" stroke-width="1.4"/>
  <path d="M144 163 C 180 163, 190 140, 216 145" fill="none" stroke="#ef4444" stroke-width="1.4"/>
  <path d="M144 117 C 190 117, 200 200, 216 209" fill="none" stroke="#ef4444" stroke-width="1.4"/>
  <path d="M144 163 C 190 163, 200 200, 216 209" fill="none" stroke="#ef4444" stroke-width="1.4"/>

  <rect x="500" y="124" width="436" height="76" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="516" y="148" font-size="13" fill="#991b1b" font-weight="600">add/add conflict on every merge</text>
  <text x="516" y="170" font-size="11" fill="#7f1d1d">both nodes append their anchor to the same record and</text>
  <text x="516" y="187" font-size="11" fill="#7f1d1d">their comment to the same plan file</text>

  <!-- AFTER -->
  <text x="24" y="272" font-size="14" fill="#065f46" font-weight="600">after — each node writes its own fragment</text>
  <rect x="24" y="286" width="120" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="40" y="308" font-size="12" fill="#312e81">node A</text>
  <rect x="24" y="332" width="120" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="40" y="354" font-size="12" fill="#312e81">node B</text>

  <rect x="220" y="286" width="300" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="234" y="308" font-size="12" fill="#065f46">docs/evidence/fragments/&lt;plan&gt;/node-A.html</text>
  <rect x="220" y="332" width="300" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="234" y="354" font-size="12" fill="#065f46">docs/evidence/fragments/&lt;plan&gt;/node-B.html</text>

  <rect x="220" y="384" width="300" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="234" y="406" font-size="12" fill="#065f46">docs/figures/&lt;plan&gt;/node-A/</text>
  <rect x="220" y="430" width="300" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="234" y="452" font-size="12" fill="#065f46">docs/figures/&lt;plan&gt;/node-B/</text>

  <path d="M144 303 L 216 303" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M144 349 L 216 349" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M144 303 C 190 303, 200 395, 216 401" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M144 349 C 190 349, 200 440, 216 447" fill="none" stroke="#10b981" stroke-width="1.4"/>

  <rect x="560" y="300" width="376" height="120" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="576" y="324" font-size="13" fill="#065f46" font-weight="600">disjoint scopes, no conflict on merge</text>
  <text x="576" y="348" font-size="11" fill="#065f46">no path of one scope is another's, and no</text>
  <text x="576" y="365" font-size="11" fill="#065f46">scope is nested inside another</text>
  <text x="576" y="390" font-size="11" fill="#065f46">a redispatch of a node writes the same</text>
  <text x="576" y="407" font-size="11" fill="#065f46">fragment, replacing its predecessor's</text>

  <rect x="24" y="480" width="912" height="28" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="38" y="499" font-size="11" fill="#92400e">A coordinator may still declare the shared record explicitly; dispatch then grants it with a warning that it reintroduces the conflict.</text>
</svg>