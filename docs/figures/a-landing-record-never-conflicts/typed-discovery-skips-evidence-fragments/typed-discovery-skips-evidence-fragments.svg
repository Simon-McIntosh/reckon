<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" fill="#111827" font-weight="600">Typed discovery passes over the evidence fragment subtree</text>
  <text x="24" y="52" font-size="12" fill="#4b5563">A full-tree walk skips docs/evidence/fragments/&lt;plan&gt;/&lt;node&gt;.html; a mis-shaped document elsewhere under a typed root is still refused.</text>

  <!-- LEFT: the walk, with the skip -->
  <text x="24" y="88" font-size="14" fill="#065f46" font-weight="600">walk with the skip — a fragment is not a typed resource</text>

  <rect x="24" y="104" width="330" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="38" y="126" font-size="12" fill="#312e81">docs/plans/owner-plan.html</text>
  <text x="286" y="126" font-size="11" fill="#065f46">discovered</text>

  <rect x="24" y="146" width="330" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="38" y="168" font-size="12" fill="#312e81">docs/plans/unrelated-plan.html</text>
  <text x="286" y="168" font-size="11" fill="#065f46">discovered</text>

  <rect x="24" y="188" width="330" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="38" y="210" font-size="12" fill="#312e81">docs/evidence/archive/owner-plan-landed.html</text>
  <text x="286" y="210" font-size="11" fill="#065f46">discovered</text>

  <rect x="24" y="230" width="330" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="38" y="252" font-size="12" fill="#065f46">docs/evidence/fragments/owner-plan/node.html</text>
  <text x="286" y="252" font-size="11" fill="#065f46" font-weight="600">skipped</text>

  <rect x="380" y="140" width="196" height="86" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="396" y="164" font-size="13" fill="#065f46" font-weight="600">read_plan, every plan</text>
  <text x="396" y="186" font-size="11" fill="#065f46">both plans read; the walk</text>
  <text x="396" y="203" font-size="11" fill="#065f46">behind them does not refuse</text>

  <path d="M354 121 L 378 168" fill="none" stroke="#6366f1" stroke-width="1.4"/>
  <path d="M354 163 L 378 170" fill="none" stroke="#6366f1" stroke-width="1.4"/>
  <path d="M354 205 L 378 186" fill="none" stroke="#6366f1" stroke-width="1.4"/>

  <!-- RIGHT: a mis-shaped document outside the subtree -->
  <text x="596" y="88" font-size="14" fill="#991b1b" font-weight="600">a mis-shaped path elsewhere is refused</text>

  <rect x="596" y="104" width="340" height="34" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="610" y="126" font-size="12" fill="#7f1d1d">docs/evidence/extra/x.html</text>

  <rect x="596" y="150" width="340" height="76" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="610" y="174" font-size="12" fill="#991b1b" font-weight="600">ResourceCollision</text>
  <text x="610" y="196" font-size="11" fill="#7f1d1d">typed resource path must be</text>
  <text x="610" y="213" font-size="11" fill="#7f1d1d">&lt;root&gt;/&lt;slug&gt;.html or &lt;root&gt;/archive/&lt;slug&gt;.html</text>

  <path d="M636 138 L 636 150" fill="none" stroke="#ef4444" stroke-width="1.4"/>

  <text x="596" y="250" font-size="11" fill="#4b5563">The skip is the fragment subtree, not every nested path under a typed root.</text>

  <!-- LOWER: the composer still reads the fragment -->
  <line x1="24" y1="286" x2="936" y2="286" stroke="#e5e7eb" stroke-width="1"/>

  <text x="24" y="314" font-size="14" fill="#065f46" font-weight="600">the composer keeps its reader — discovery is not the only path to a fragment</text>

  <rect x="24" y="330" width="230" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="38" y="352" font-size="12" fill="#312e81">archive/owner-plan-landed.html</text>
  <rect x="278" y="330" width="230" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="292" y="352" font-size="12" fill="#065f46">fragments/owner-plan/node.html</text>
  <rect x="532" y="330" width="240" height="34" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="546" y="352" font-size="12" fill="#312e81">composed record</text>
  <rect x="796" y="330" width="140" height="34" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="810" y="352" font-size="12" fill="#065f46">fragment anchor</text>

  <path d="M254 347 L 278 347" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M508 347 L 532 347" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M772 347 L 796 347" fill="none" stroke="#10b981" stroke-width="1.4"/>
  <path d="M254 347 C 380 347, 420 372, 532 372 L 532 364" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text x="24" y="396" font-size="11" fill="#4b5563">compose_landed_record reads the fragment directory directly, so the skip cannot hide an anchor from the record a reader sees.</text>

  <!-- Negative control band -->
  <rect x="24" y="424" width="912" height="112" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="40" y="448" font-size="13" fill="#92400e" font-weight="600">Declared negative control</text>
  <text x="40" y="470" font-size="11" fill="#92400e">Remove the evidence/fragments skip from reckon/resources.py: the discovery walk then refuses the fragment, and</text>
  <text x="40" y="487" font-size="11" fill="#92400e">test_read_plan_of_the_unrelated_plan_is_not_refused fails at base — the read_plan case the done-when names.</text>
  <text x="40" y="509" font-size="11" fill="#92400e">The mutation arm is 2 failed / 2 passed, EXIT=1, the failure id above; the head arm is 43 passed, EXIT=0.</text>
  <text x="40" y="527" font-size="11" fill="#92400e">The worker neither resolves the driving followup nor changes terminal plan state.</text>
</svg>