<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="16cm" viewBox="0 0 1400 720" role="img" aria-labelledby="title description">
  <title id="title">A symlink leaves a protected checkout; a scheduler job leaves a mount namespace</title>
  <desc id="description">The worker's Python path resolves through the read-only checkout into uv's unsealed install directory. Adding a seal there refuses direct writes. Slurm launches the batch or step task outside the submitter's mount namespace, so the task must enter its own fence. A PATH shim can arrange this but an absolute scheduler command bypasses the shim.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#626262" stroke-width="1.3"/></marker>
  </defs>
  <g font-family="sans-serif" fill="#333333" font-size="22">
    <text x="55" y="48" font-size="26">Direct write: a seal applies to the resolved destination</text>
    <rect x="55" y="78" width="1290" height="227" fill="none" stroke="#929292" stroke-width="1.6" stroke-dasharray="6 6"/>
    <text x="78" y="113" fill="#626262">Worker mount namespace</text>
    <text x="90" y="170">worktree/.venv</text>
    <path d="M310,161 H425" fill="none" stroke="#626262" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="170">checkout/.venv/bin/python</text>
    <path d="M780,161 H895" fill="none" stroke="#626262" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="920" y="170">uv/…/bin/python3.14</text>
    <text x="450" y="218" fill="#626262">Checkout is read-only</text>
    <text x="920" y="218">Current: target is writable</text>
    <text x="920" y="266" fill="#286da8">Added uv seal: write refused</text>
    <text x="55" y="370" font-size="26">Submitted work: the task needs a fence of its own</text>
    <rect x="55" y="402" width="355" height="150" fill="none" stroke="#929292" stroke-width="1.6" stroke-dasharray="6 6"/>
    <text x="80" y="446">Fenced submitter</text>
    <text x="80" y="495">sbatch or srun client</text>
    <path d="M430,475 H655" fill="none" stroke="#626262" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="455" y="444" fill="#626262">Slurm RPC</text>
    <text x="685" y="446">slurmd starts a task</text>
    <text x="685" y="495">outside the client's mounts</text>
    <path d="M1025,475 H1120" fill="none" stroke="#626262" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1143" y="446">Shared file</text>
    <text x="1143" y="495">Writable</text>
    <text x="685" y="585" fill="#286da8">Task enters bwrap: write refused</text>
    <text x="55" y="660">A PATH wrapper can arrange re-entry; /usr/bin/sbatch can bypass that wrapper.</text>
  </g>
</svg>
