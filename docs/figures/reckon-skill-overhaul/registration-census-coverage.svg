<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="940" height="560" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="600" fill="#111827">The registration census reads the whole fixed read set</text>
  <text x="20" y="52" fill="#4b5563">test_no_build_skill_file_instructs_member_registration · tests/test_skill_contracts.py</text>

  <!-- Panel A: scanned surface -->
  <rect x="20" y="72" width="420" height="290" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="36" y="96" font-weight="600" fill="#111827">Scanned surface — 11 files</text>
  <text x="36" y="114" font-size="11" fill="#6b7280">whitespace-normalised, so a phrasing wrapped across a line break is still seen</text>

  <g fill="#ffffff" stroke="#9ca3af">
    <rect x="36" y="126" width="240" height="26" rx="4"/>
    <rect x="36" y="158" width="240" height="26" rx="4"/>
    <rect x="36" y="190" width="240" height="26" rx="4"/>
    <rect x="36" y="222" width="240" height="26" rx="4"/>
    <rect x="36" y="254" width="240" height="26" rx="4"/>
    <rect x="36" y="286" width="240" height="26" rx="4"/>
    <rect x="36" y="318" width="240" height="26" rx="4"/>
  </g>
  <g fill="#111827" font-size="12">
    <text x="46" y="143">SKILL.md</text>
    <text x="46" y="175">references/sprint-orchestration.md</text>
    <text x="46" y="207">references/conditional-guidance.md</text>
    <text x="46" y="239">references/effort-routing.md</text>
    <text x="46" y="271">references/lane-routing.md</text>
    <text x="46" y="303">references/outage-recovery.md</text>
    <text x="46" y="335">references/worker-*.md (3) + orchestrator-harness/*.md (2)</text>
  </g>
  <rect x="36" y="126" width="240" height="26" rx="4" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="36" y="158" width="240" height="26" rx="4" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="288" y="143" font-size="11" fill="#92400e">carried the instruction</text>
  <text x="288" y="157" font-size="11" fill="#92400e">at base 59a62004</text>

  <!-- Panel B: pattern -->
  <rect x="460" y="72" width="460" height="290" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="476" y="96" font-weight="600" fill="#111827">Pattern — four branches, six phrasings</text>

  <g font-size="12">
    <rect x="476" y="110" width="200" height="34" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="486" y="124" font-family="ui-monospace, monospace" font-size="11" fill="#312e81">register(ing|ed)? + object</text>
    <text x="486" y="139" font-size="11" fill="#4338ca">register one · another · a fresh…</text>
    <text x="686" y="124" font-size="11" fill="#374151">catches the base verb and the</text>
    <text x="686" y="139" font-size="11" fill="#374151">participle forms</text>

    <rect x="476" y="156" width="200" height="34" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="486" y="170" font-family="ui-monospace, monospace" font-size="11" fill="#312e81">registers + object (no "a")</text>
    <text x="486" y="185" font-size="11" fill="#4338ca">registers enough members</text>
    <text x="686" y="170" font-size="11" fill="#374151">third person; "registers a" is a</text>
    <text x="686" y="185" font-size="11" fill="#374151">CLI-descriptor sentence, not this</text>

    <rect x="476" y="202" width="200" height="34" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="486" y="216" font-family="ui-monospace, monospace" font-size="11" fill="#312e81">register(s|ing)? + members?</text>
    <text x="486" y="231" font-size="11" fill="#4338ca">registering members</text>
    <text x="686" y="216" font-size="11" fill="#374151">plural object; excludes the</text>
    <text x="686" y="231" font-size="11" fill="#374151">roster tally "registered members"</text>

    <rect x="476" y="248" width="200" height="34" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="486" y="262" font-family="ui-monospace, monospace" font-size="11" fill="#312e81">registered on demand</text>
    <text x="486" y="277" font-size="11" fill="#4338ca">members are registered on demand</text>
    <text x="686" y="262" font-size="11" fill="#374151">passive idiom; the declared</text>
    <text x="686" y="277" font-size="11" fill="#374151">negative-control phrasing</text>
  </g>

  <rect x="476" y="292" width="428" height="58" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="490" y="312" font-size="12" font-weight="600" fill="#065f46">Self-check before the census runs</text>
  <text x="490" y="330" font-size="12" fill="#065f46">each phrasing must match the pattern, so a weakened pattern fails loudly</text>
  <text x="490" y="345" font-size="12" fill="#065f46">instead of passing the census by matching nothing</text>

  <!-- Bottom: result -->
  <rect x="20" y="380" width="900" height="76" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="36" y="404" font-weight="600" fill="#111827">Gate at ff3fc8dd</text>
  <text x="36" y="424" fill="#374151">tests/test_skill_contracts.py — 56 passed, exit 0 (55 at base 81d0c364) · census over 11 files finds nothing to trip on</text>
  <text x="36" y="442" fill="#374151">Declared negative control: "members are registered on demand" re-added to sprint-orchestration.md → census fails naming the file; restored to SHA-256 96827ed3…, green again</text>

  <text x="20" y="486" font-size="11" fill="#6b7280">One file read alone left an instruction in references/ unseen; the census now reads the same set the orchestrator loads.</text>
  <text x="20" y="504" font-size="11" fill="#6b7280">Highlighted files carried the member-registration instruction at base 59a62004, before the disposable-worker rule replaced it.</text>
</svg>