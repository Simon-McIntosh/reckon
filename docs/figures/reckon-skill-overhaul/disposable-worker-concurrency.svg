<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A ready node goes to a free existing member; when every member is busy the wave waits, and adding a member to raise the ceiling is retired"
     style="max-width:100%;height:auto;font-family:system-ui,sans-serif">
  <style>
    .box{fill:#fff;stroke:#374151;stroke-width:1}
    .ok{fill:#fff;stroke:#16a34a;stroke-width:1.4}
    .gone{fill:#f9fafb;stroke:#9ca3af;stroke-width:1;stroke-dasharray:5 3}
    .t{fill:#111827;font-size:13px}
    .c{fill:#374151;font-size:11.5px}
    .x{fill:#9ca3af;font-size:11.5px}
    .lbl{fill:#374151;font-size:11px}
  </style>

  <rect class="box" x="14" y="96" width="150" height="46"/>
  <text x="26" y="115" class="t">ready node</text>
  <text x="26" y="132" class="c">independence + scope checked</text>

  <rect class="box" x="212" y="96" width="150" height="46"/>
  <text x="224" y="115" class="t">a free member?</text>
  <text x="224" y="132" class="c">one live run per member</text>

  <rect class="ok" x="410" y="30" width="180" height="46"/>
  <text x="422" y="49" class="t">dispatch on that member</text>
  <text x="422" y="66" class="c">existing roster, disposable worker</text>

  <rect class="ok" x="410" y="162" width="180" height="46"/>
  <text x="422" y="181" class="t">the wave waits</text>
  <text x="422" y="198" class="c">dispatch resumes as one frees</text>

  <rect class="gone" x="410" y="108" width="180" height="40"/>
  <text x="422" y="126" class="x">add a member to raise</text>
  <text x="422" y="141" class="x">the ceiling — retired</text>
  <line x1="414" y1="110" x2="586" y2="146" stroke="#9ca3af" stroke-width="1.2"/>

  <g stroke="#6b7280" stroke-width="1.1" fill="none">
    <line x1="164" y1="119" x2="210" y2="119"/>
    <line x1="362" y1="112" x2="408" y2="56"/>
    <line x1="362" y1="126" x2="408" y2="182"/>
  </g>
  <text x="368" y="76" class="lbl">yes</text>
  <text x="368" y="166" class="lbl">no</text>
  <polygon points="210,119 202,115 202,123" fill="#6b7280"/>
  <polygon points="408,56 400,58 404,64" fill="#6b7280"/>
  <polygon points="408,182 400,178 404,174" fill="#6b7280"/>

  <text x="14" y="236" class="c">Concurrency is the free members a project already has: a busy roster holds ready work, it never justifies adding a member.</text>
</svg>