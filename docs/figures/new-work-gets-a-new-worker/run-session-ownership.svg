<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
<title id="title">Session capture follows the run and its harness</title>
<desc id="desc">A worker stream captures its session on the live run. Promotion copies the session and harness into the ledger row. The next dispatch checks task and harness identity before resuming. A harness change starts a fresh session and subsequent resumes use that harness's session.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176a78"/></marker></defs>
<g font-family="sans-serif" fill="#172b35" font-size="17">
<text x="24" y="28" font-weight="600">Capture and durable reuse</text>
<g fill="#edf7f8" stroke="#176a78" stroke-width="1">
<rect x="24" y="54" width="164" height="70" rx="3"/>
<rect x="238" y="54" width="190" height="70" rx="3"/>
<rect x="478" y="54" width="190" height="70" rx="3"/>
<rect x="718" y="54" width="178" height="70" rx="3"/>
</g>
<text x="40" y="82">Worker stream</text><text x="40" y="107" font-size="15">session announced</text>
<text x="254" y="82">Live run</text><text x="254" y="107" font-size="15">session + harness</text>
<text x="494" y="82">Promoted row</text><text x="494" y="107" font-size="15">session + harness</text>
<text x="734" y="82">Next dispatch</text><text x="734" y="107" font-size="15">same task + harness</text>
<g fill="none" stroke="#176a78" stroke-width="1.5" marker-end="url(#arrow)"><path d="M188 89H231"/><path d="M428 89H471"/><path d="M668 89H711"/></g>
<text x="24" y="157" font-size="15">Roster members retain their identity fields; capture does not write to them.</text>
<text x="24" y="210" font-weight="600">A run changes harness</text>
<g fill="none" stroke="#176a78" stroke-width="1.5" marker-end="url(#arrow)"><path d="M42 261H885"/></g>
<g fill="#176a78"><circle cx="80" cy="261" r="4"/><circle cx="335" cy="261" r="4"/><circle cx="600" cy="261" r="4"/><circle cx="849" cy="261" r="4"/></g>
<text x="25" y="243">Harness A</text><text x="24" y="291" font-size="15">captures session A</text>
<text x="263" y="243">Move to B</text><text x="240" y="291" font-size="15">command changes; start fresh</text>
<text x="544" y="243">Harness B</text><text x="530" y="291" font-size="15">captures session B</text>
<text x="800" y="243">Resume</text><text x="764" y="291" font-size="15">uses session B</text>
<text x="240" y="321" font-size="15">If B has not captured a session, resume starts fresh and records why.</text>
</g></svg>
