<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">A captured session and an unchanged roster are checked together</title>
<desc id="desc">Snapshot the roster, dispatch a task, write a stream session and observe it. The live run must carry the session, harness and model. Roster bytes must equal the snapshot. Restoring the roster write in a scratch copy keeps run capture working but fails the roster assertions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#27616d"/></marker></defs>
<rect width="960" height="380" fill="#fafcfd"/>
<g font-family="sans-serif" fill="#172b35" font-size="17">
<text x="24" y="32" font-size="22" font-weight="600">Capture has two observable obligations</text>
<g fill="#edf7f8" stroke="#27616d">
<rect x="24" y="66" width="205" height="80" rx="5"/>
<rect x="282" y="66" width="190" height="80" rx="5"/>
<rect x="525" y="66" width="195" height="80" rx="5"/>
<rect x="773" y="66" width="165" height="80" rx="5"/>
</g>
<text x="39" y="97">Snapshot roster bytes</text><text x="39" y="123" font-size="15">member fields preserved</text>
<text x="298" y="97">Dispatch task</text><text x="298" y="123" font-size="15">real launch path</text>
<text x="541" y="97">Stream session</text><text x="541" y="123" font-size="15">then observe run</text>
<text x="789" y="97">Read pointer</text><text x="789" y="123" font-size="15">session + owner</text>
<g fill="none" stroke="#27616d" stroke-width="2" marker-end="url(#arrow)"><path d="M229 106H275"/><path d="M472 106H518"/><path d="M720 106H766"/><path d="M855 146V190H270V217"/></g>
<rect x="24" y="224" width="437" height="120" rx="5" fill="#edf7ee" stroke="#347443"/>
<text x="42" y="251" font-weight="600">Unmodified capture: three cases pass</text>
<text x="42" y="281">Pointer contains session, harness and model.</text>
<text x="42" y="309">Roster bytes equal the snapshot.</text>
<rect x="499" y="224" width="439" height="120" rx="5" fill="#fff0eb" stroke="#a64125"/>
<text x="517" y="251" font-weight="600">Scratch mutation: three cases fail</text>
<text x="517" y="281">Restore member session write at capture.</text>
<text x="517" y="309">Run capture survives; roster equality fails.</text>
</g></svg>
