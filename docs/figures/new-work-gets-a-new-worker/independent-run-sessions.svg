<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" role="img" aria-labelledby="title desc">
  <title id="title">A later capture preserves the first run and the roster</title>
  <desc id="desc">The first task's observed session is stored on its own live run. A later task starts fresh and stores a different session on another live run, even when its model changes. The first pointer and roster bytes remain unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176a78"/></marker>
  </defs>
  <g font-family="sans-serif" font-size="17" fill="#172b35">
    <text x="20" y="28" font-size="21" font-weight="600">Each run keeps its own session</text>
    <text x="20" y="83">Observe first task</text>
    <text x="20" y="173">Observe later task</text>
    <text x="20" y="198" font-size="14">Fresh launch; model may change</text>
    <g stroke="#176a78" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <path d="M210 78H310"/>
      <path d="M250 168H310"/>
    </g>
    <g fill="#edf7f8" stroke="#176a78">
      <rect x="320" y="49" width="290" height="61" rx="3"/>
      <rect x="320" y="139" width="290" height="61" rx="3"/>
    </g>
    <text x="337" y="74">First run: session, harness, model</text>
    <text x="337" y="97" font-size="14">Still identical after the later capture</text>
    <text x="337" y="164">Later run: its own session</text>
    <text x="337" y="187" font-size="14">Its own harness and resolved model</text>
    <path d="M635 49H646V200H635" fill="none" stroke="#176a78"/>
    <text x="668" y="116">Roster snapshot</text>
    <text x="668" y="141" font-size="15">unchanged after both</text>
    <text x="20" y="249" font-size="15">Mutation control: restoring the member write preserves run capture but breaks roster equality.</text>
  </g>
</svg>
