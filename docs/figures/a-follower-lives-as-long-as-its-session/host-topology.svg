<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1d1d1f">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/>
    </marker>
  </defs>

  <!-- the session -->
  <rect x="20" y="20" width="300" height="44" fill="none" stroke="#1d1d1f" stroke-width="1"/>
  <text x="34" y="47">Claude Code session (CLAUDE_PID)</text>

  <!-- plugin monitor, exec'd into the host -->
  <rect x="20" y="120" width="300" height="56" fill="none" stroke="#1d1d1f" stroke-width="1"/>
  <text x="34" y="143">plugin monitor: bin/crew-host</text>
  <text x="34" y="164" fill="#555" font-size="13">exec on first request: reckon crew host</text>
  <line x1="170" y1="64" x2="170" y2="118" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="178" y="96" fill="#555" font-size="13">starts at session start, no deadline</text>

  <!-- followers -->
  <rect x="20" y="236" width="140" height="56" fill="none" stroke="#1d1d1f" stroke-width="1"/>
  <text x="32" y="259">crew follow</text>
  <text x="32" y="280" fill="#555" font-size="13">project A, session S</text>
  <rect x="180" y="236" width="140" height="56" fill="none" stroke="#1d1d1f" stroke-width="1"/>
  <text x="192" y="259">crew follow</text>
  <text x="192" y="280" fill="#555" font-size="13">project B, session S</text>
  <line x1="90" y1="176" x2="90" y2="234" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="250" y1="176" x2="250" y2="234" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ticker lines back to the session -->
  <path d="M 330 264 C 470 264, 470 42, 330 42" fill="none" stroke="#2f6f9f" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="444" y="236" fill="#2f6f9f">ticker lines on the shared stdout</text>
  <text x="444" y="256" fill="#2f6f9f" font-size="13">(reads as delivering)</text>

  <!-- dispatch path -->
  <rect x="560" y="20" width="180" height="44" fill="none" stroke="#1d1d1f" stroke-width="1"/>
  <text x="574" y="47">reckon crew dispatch</text>
  <rect x="560" y="120" width="180" height="56" fill="none" stroke="#1d1d1f" stroke-width="1"/>
  <text x="574" y="143">FIFO, node-local</text>
  <text x="574" y="164" fill="#555" font-size="13">one per CLAUDE_PID</text>
  <line x1="650" y1="64" x2="650" y2="118" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="658" y="96" fill="#555" font-size="13">request</text>
  <line x1="560" y1="148" x2="324" y2="148" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
