<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320"
     font-family="system-ui, sans-serif" font-size="13">
  <title>A resumed run's stall clock starts at its current attempt</title>

  <!-- time axis: 0s .. 2000s, mapped to x 120 .. 740 -->
  <line x1="120" y1="260" x2="740" y2="260" stroke="#333" stroke-width="1.5"/>
  <g fill="#333" font-size="11" text-anchor="middle">
    <line x1="120" y1="255" x2="120" y2="265" stroke="#333"/>
    <text x="120" y="280">-1919s</text>
    <line x1="431" y1="255" x2="431" y2="265" stroke="#333"/>
    <text x="431" y="280">previous stream ends</text>
    <line x1="740" y1="255" x2="740" y2="265" stroke="#333"/>
    <text x="740" y="280">now</text>
  </g>

  <!-- attempt 2 bar -->
  <g>
    <text x="120" y="48" fill="#333" font-weight="600">attempt 2 (resume)</text>
    <rect x="734" y="58" width="6" height="22" fill="#2e7d32"/>
    <text x="726" y="74" fill="#2e7d32" font-size="11" text-anchor="end">started 30s ago</text>
  </g>

  <!-- old stream bar -->
  <g>
    <text x="120" y="108" fill="#333" font-weight="600">previous attempt's stream</text>
    <rect x="120" y="118" width="311" height="22" fill="#b0bec5"/>
    <text x="150" y="134" fill="#263238" font-size="11">last record at -1919s, then silent</text>
  </g>

  <!-- now marker -->
  <line x1="740" y1="30" x2="740" y2="260" stroke="#c62828" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="746" y="30" fill="#c62828" font-size="11">now</text>

  <!-- verdict row: old reading -->
  <g>
    <text x="120" y="180" fill="#333" font-weight="600">stream alone (before)</text>
    <rect x="120" y="190" width="620" height="20" fill="#ef9a9a"/>
    <text x="330" y="205" fill="#7f0000" font-size="12">quiet = 1919s &#8811; the 900s window &#8594; stalled</text>
  </g>

  <!-- verdict row: new reading -->
  <g>
    <text x="120" y="230" fill="#333" font-weight="600">attempt floor (after)</text>
    <rect x="120" y="240" width="0" height="0" fill="none"/>
    <line x1="734" y1="250" x2="740" y2="250" stroke="#2e7d32" stroke-width="20"/>
    <text x="330" y="255" fill="#1b5e20" font-size="12">quiet = min(1919, 30) = 30s &#8804; the 900s window &#8594; working</text>
  </g>
</svg>