<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="system-ui, sans-serif" font-size="13">
  <title>How discard decides whether to release a run's worktree</title>
  <rect width="860" height="400" fill="#fbfaf7"/>
  <text x="24" y="32" font-size="16" font-weight="600" fill="#2b2b2b">A discard releases a worktree only when the shared audit says it is safe</text>
  <text x="24" y="54" fill="#555">discard(), after the run's pointer is removed; the same classification crew complete applies on release</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="24" y="80" width="190" height="52" rx="8" fill="#eef2f7" stroke="#8aa0b8"/>
  <text x="119" y="110" text-anchor="middle" fill="#22303f">pointer removed</text>

  <line x1="214" y1="106" x2="270" y2="106" stroke="#666" marker-end="url(#a)"/>

  <rect x="270" y="72" width="300" height="68" rx="8" fill="#fff8e1" stroke="#c9a227"/>
  <text x="420" y="100" text-anchor="middle" fill="#5a4600">classify the run's worktree</text>
  <text x="420" y="120" text-anchor="middle" fill="#5a4600">(dirty, reachable, live claims)</text>

  <line x1="570" y1="106" x2="636" y2="106" stroke="#2e7d32"/>
  <text x="603" y="94" text-anchor="middle" fill="#2e7d32">clean +</text>
  <text x="603" y="132" text-anchor="middle" fill="#2e7d32">integrated</text>

  <rect x="636" y="80" width="200" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="736" y="100" text-anchor="middle" font-weight="600" fill="#1b5e20">released</text>
  <text x="736" y="120" text-anchor="middle" fill="#1b5e20">git worktree remove</text>

  <line x1="420" y1="140" x2="420" y2="192" stroke="#666" marker-end="url(#a)"/>
  <text x="430" y="172" fill="#666">otherwise</text>

  <rect x="250" y="192" width="340" height="60" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="420" y="216" text-anchor="middle" font-weight="600" fill="#7b241c">withheld, the tree survives</text>
  <text x="420" y="236" text-anchor="middle" fill="#7b241c">the audit's reason is named on the discard result</text>

  <rect x="24" y="290" width="210" height="46" rx="8" fill="#f3f4f6" stroke="#9aa5b1"/>
  <text x="129" y="310" text-anchor="middle" fill="#39424e">dirty</text>
  <text x="129" y="328" text-anchor="middle" fill="#6b7480">uncommitted work</text>

  <rect x="248" y="290" width="240" height="46" rx="8" fill="#f3f4f6" stroke="#9aa5b1"/>
  <text x="368" y="310" text-anchor="middle" fill="#39424e">unintegrated</text>
  <text x="368" y="328" text-anchor="middle" fill="#6b7480">head not on the integration branch</text>

  <rect x="502" y="290" width="200" height="46" rx="8" fill="#f3f4f6" stroke="#9aa5b1"/>
  <text x="602" y="310" text-anchor="middle" fill="#39424e">live-referenced</text>
  <text x="602" y="328" text-anchor="middle" fill="#6b7480">a live pointer claims it</text>

  <text x="24" y="372" fill="#555">Releasing the tree lets a redispatch of the same node succeed instead of refusing on an existing worktree path.</text>
</svg>