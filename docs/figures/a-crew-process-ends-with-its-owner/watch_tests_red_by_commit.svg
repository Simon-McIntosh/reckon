<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect width="920" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#111111">Which commit turned each watch/follower id red</text>
  <text x="20" y="50" font-size="12" fill="#555555">Two groups red for two different reasons: one superseded on a branch, one superseded by a renderer change on main.</text>

  <!-- Row A: the eight ids -->
  <text x="20" y="92" font-size="13" font-weight="bold" fill="#111111">Eight ids (watch lifetime, observed sessions, death, unit inventory)</text>
  <line x1="40" y1="130" x2="880" y2="130" stroke="#999999" stroke-width="2"/>
  <circle cx="120" cy="130" r="7" fill="#cc3333"/>
  <circle cx="430" cy="130" r="7" fill="#2e8b57"/>
  <circle cx="760" cy="130" r="7" fill="#2e8b57"/>
  <text x="120" y="118" font-size="11" text-anchor="branch" fill="#333333">80d55621</text>
  <text x="120" y="152" font-size="11" text-anchor="middle" fill="#333333">branch base</text>
  <text x="120" y="166" font-size="11" text-anchor="middle" fill="#cc3333">red</text>
  <text x="430" y="118" font-size="11" text-anchor="middle" fill="#333333">63f40039</text>
  <text x="430" y="152" font-size="11" text-anchor="middle" fill="#333333">test expects new rules</text>
  <text x="430" y="166" font-size="11" text-anchor="middle" fill="#2e8b57">green</text>
  <text x="760" y="118" font-size="11" text-anchor="middle" fill="#333333">0391d7fa (head)</text>
  <text x="760" y="152" font-size="11" text-anchor="middle" fill="#333333">already green</text>
  <text x="760" y="166" font-size="11" text-anchor="middle" fill="#2e8b57">no change</text>

  <!-- Row B: the three ids -->
  <text x="20" y="238" font-size="13" font-weight="bold" fill="#111111">Three ids (a scoped follower's trailing figures)</text>
  <line x1="40" y1="276" x2="880" y2="276" stroke="#999999" stroke-width="2"/>
  <circle cx="120" cy="276" r="7" fill="#2e8b57"/>
  <circle cx="390" cy="276" r="7" fill="#2e8b57"/>
  <circle cx="600" cy="276" r="7" fill="#cc3333"/>
  <circle cx="800" cy="276" r="7" fill="#2e8b57"/>
  <text x="120" y="264" font-size="11" text-anchor="middle" fill="#333333">9853fb35</text>
  <text x="120" y="298" font-size="11" text-anchor="middle" fill="#2e8b57">green</text>
  <text x="120" y="312" font-size="11" text-anchor="middle" fill="#333333">triple, dot-separated</text>
  <text x="390" y="264" font-size="11" text-anchor="middle" fill="#333333">4cec02e2</text>
  <text x="390" y="298" font-size="11" text-anchor="middle" fill="#2e8b57">green</text>
  <text x="390" y="312" font-size="11" text-anchor="middle" fill="#333333">every bucket always</text>
  <text x="600" y="264" font-size="11" text-anchor="middle" fill="#333333">5ef9ee49</text>
  <text x="600" y="298" font-size="11" text-anchor="middle" fill="#cc3333">red</text>
  <text x="600" y="312" font-size="11" text-anchor="middle" fill="#333333">separator dropped</text>
  <text x="800" y="264" font-size="11" text-anchor="middle" fill="#333333">this node</text>
  <text x="800" y="298" font-size="11" text-anchor="middle" fill="#2e8b57">green</text>
  <text x="800" y="312" font-size="11" text-anchor="middle" fill="#333333">test matches block</text>

  <!-- Legend -->
  <circle cx="40" cy="392" r="6" fill="#cc3333"/>
  <text x="54" y="396" font-size="12" fill="#333333">id fails here</text>
  <circle cx="200" cy="392" r="6" fill="#2e8b57"/>
  <text x="214" y="396" font-size="12" fill="#333333">id passes here</text>
  <text x="380" y="396" font-size="12" fill="#333333">Eight ids reddened only relative to a branch that predated the main-line fix at 63f40039; they are green at the base this node measured.</text>
</svg>