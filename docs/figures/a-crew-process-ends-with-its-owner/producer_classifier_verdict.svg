<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
<title id="title">One classifier observation feeds every producer verdict</title>
<desc id="desc">Pointer, worker record, manifest and stream enter classify_pointer. Its lifecycle and fleet verdict are returned to MCP readers and copied by the producer into transition events. Producers do not probe evidence again.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#186466"/></marker></defs>
<g font-family="sans-serif" font-size="18" fill="#172b35">
<text x="20" y="88">Pointer + worker.json</text><text x="20" y="118">Manifest + stream</text>
<path d="M 215 105 H 290" stroke="#186466" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="305" y="55" width="270" height="100" rx="4" fill="#edf7f5" stroke="#186466"/>
<text x="325" y="86">classify_pointer</text><text x="325" y="116" font-size="16">Lifecycle + liveness</text><text x="325" y="140" font-size="16">fleet_verdict</text>
<path d="M 575 85 H 675" stroke="#186466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="690" y="92">MCP readers</text>
<path d="M 575 130 H 630 V 195 H 675" fill="none" stroke="#186466" stroke-width="2" marker-end="url(#arrow)"/>
<text x="690" y="185">Producer snapshot</text><text x="690" y="215">→ fleet transition</text>
<text x="305" y="238" font-size="16">Evidence is classified once; the producer carries the result.</text>
</g></svg>
