<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400"
     font-family="system-ui, sans-serif" font-size="13">
  <title>A departure is promoted only when the ledger records a promotion</title>
  <rect x="0" y="0" width="860" height="400" fill="#fafafa"/>

  <!-- departure box -->
  <rect x="250" y="24" width="360" height="58" rx="8" fill="#eceff1" stroke="#546e7a"/>
  <text x="430" y="48" text-anchor="middle" fill="#263238" font-weight="600">a run in known is absent from current</text>
  <text x="430" y="68" text-anchor="middle" fill="#455a64" font-size="11">its pointer left the fleet</text>

  <!-- decision diamond -->
  <polygon points="430,110 610,170 430,230 250,170" fill="#fff8e1" stroke="#f9a825"/>
  <text x="430" y="164" text-anchor="middle" fill="#5d4037">is the run id in the project</text>
  <text x="430" y="182" text-anchor="middle" fill="#5d4037">ledger's recorded run ids?</text>

  <!-- yes branch -->
  <line x1="430" y1="82" x2="430" y2="110" stroke="#546e7a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="610" y1="170" x2="720" y2="170" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="660" y="160" text-anchor="middle" fill="#2e7d32" font-size="11">yes</text>
  <rect x="724" y="142" width="120" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="784" y="166" text-anchor="middle" fill="#1b5e20" font-weight="600">promoted</text>
  <text x="784" y="184" text-anchor="middle" fill="#2e7d32" font-size="11">nothing to recover</text>

  <!-- no branch -->
  <line x1="250" y1="170" x2="140" y2="170" stroke="#c62828" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="196" y="160" text-anchor="middle" fill="#c62828" font-size="11">no</text>
  <rect x="16" y="142" width="120" height="56" rx="8" fill="#ffebee" stroke="#c62828"/>
  <text x="76" y="166" text-anchor="middle" fill="#b71c1c" font-weight="600">withdrawn</text>
  <text x="76" y="184" text-anchor="middle" fill="#c62828" font-size="11">needs recovering</text>

  <!-- unresolvable fall-through -->
  <line x1="430" y1="230" x2="430" y2="272" stroke="#6d4c41" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="452" y="256" fill="#6d4c41" font-size="11">ledger unresolvable (no reader, no project)</text>
  <rect x="290" y="276" width="280" height="72" rx="8" fill="#efebe9" stroke="#6d4c41"/>
  <text x="430" y="300" text-anchor="middle" fill="#4e342e" font-weight="600">unknown -&gt; withdrawn</text>
  <text x="430" y="320" text-anchor="middle" fill="#6d4c41" font-size="11">a promotion no reader established</text>
  <text x="430" y="336" text-anchor="middle" fill="#6d4c41" font-size="11">is never asserted</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#546e7a"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2e7d32"/>
    </marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#c62828"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#6d4c41"/>
    </marker>
  </defs>
</svg>