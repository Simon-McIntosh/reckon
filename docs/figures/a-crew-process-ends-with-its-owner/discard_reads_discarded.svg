<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="system-ui, sans-serif" font-size="13">
  <title>How a departing run's word is resolved</title>
  <rect width="820" height="430" fill="#fbfaf7"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#2b2b2b">A departure is resolved from what survives behind it</text>
  <text x="24" y="56" fill="#555">fleet_transitions, on each run id present in the last observation and absent from this one</text>

  <rect x="24" y="82" width="230" height="52" rx="8" fill="#eef2f7" stroke="#8aa0b8"/>
  <text x="139" y="112" text-anchor="middle" fill="#22303f">pointer gone</text>

  <line x1="254" y1="108" x2="320" y2="108" stroke="#666" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="320" y="76" width="250" height="64" rx="8" fill="#fff8e1" stroke="#c9a227"/>
  <text x="445" y="102" text-anchor="middle" fill="#5a4600">does the project ledger</text>
  <text x="445" y="122" text-anchor="middle" fill="#5a4600">record a promotion of this run?</text>

  <line x1="570" y1="108" x2="640" y2="108" stroke="#2e7d32"/>
  <text x="605" y="100" text-anchor="middle" fill="#2e7d32">yes</text>
  <rect x="640" y="82" width="156" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="718" y="113" text-anchor="middle" font-weight="600" fill="#1b5e20">promoted</text>

  <line x1="445" y1="140" x2="445" y2="190" stroke="#666" marker-end="url(#a)"/>
  <text x="455" y="170" fill="#666">no</text>

  <rect x="300" y="190" width="290" height="64" rx="8" fill="#fff8e1" stroke="#c9a227"/>
  <text x="445" y="216" text-anchor="middle" fill="#5a4600">does the run directory hold</text>
  <text x="445" y="236" text-anchor="middle" fill="#5a4600">a marker a discard wrote?</text>

  <line x1="590" y1="222" x2="640" y2="222" stroke="#8a6d3b"/>
  <text x="615" y="214" text-anchor="middle" fill="#8a6d3b">yes</text>
  <rect x="640" y="196" width="156" height="52" rx="8" fill="#f3ecff" stroke="#7e57c2"/>
  <text x="718" y="227" text-anchor="middle" font-weight="600" fill="#4527a0">discarded</text>

  <line x1="445" y1="254" x2="445" y2="304" stroke="#666" marker-end="url(#a)"/>
  <text x="455" y="284" fill="#666">no</text>

  <rect x="330" y="304" width="230" height="52" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="445" y="335" text-anchor="middle" font-weight="600" fill="#37474f">withdrawn</text>

  <text x="24" y="392" fill="#555">Promotion has first claim: a recorded row is the fleet's evidence that work landed, whatever the run directory holds.</text>
  <text x="24" y="412" fill="#555">Neither trail leaves the bare withdrawal a reaped or hand-removed pointer earns.</text>
</svg>