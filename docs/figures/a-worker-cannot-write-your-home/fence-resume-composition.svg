<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="title">
  <title id="title">A fenced dispatch runs; a resumed fenced run composes the fence binary as its harness</title>
  <rect x="0" y="0" width="880" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">A resumed fenced run composes the fence binary as its harness</text>
  <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#444">Measured 2026-09-25 at head edc04cc5; the dispatch argv is the one the run launched with, the resume argv is crew resume --print-only.</text>

  <text x="20" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">dispatch: the argv the run launched with</text>
  <rect x="20" y="100" width="640" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="30" y="130" width="46" height="16" rx="3" fill="#bbf7d0"/>
  <text x="34" y="122" font-family="monospace" font-size="12" fill="#111">bwrap --dev-bind / / --ro-bind [13 protected paths] --</text>
  <text x="34" y="141" font-family="monospace" font-size="12" fill="#111">clive -p --output-format stream-json --verbose --model [model]</text>
  <text x="672" y="128" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">runs</text>
  <text x="672" y="146" font-family="sans-serif" font-size="11" fill="#555">the harness is named</text>

  <text x="20" y="196" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7f1d1d">resume: the argv a resume composes</text>
  <rect x="20" y="204" width="640" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="30" y="234" width="112" height="16" rx="3" fill="#fecaca"/>
  <text x="34" y="226" font-family="monospace" font-size="12" fill="#111">bwrap --dev-bind / / --ro-bind [13 protected paths] --</text>
  <text x="34" y="245" font-family="monospace" font-size="12" fill="#111">/usr/bin/bwrap -p --output-format stream-json --verbose</text>
  <text x="34" y="264" font-family="monospace" font-size="12" fill="#111">--resume [session id] --add-dir [worktree]</text>
  <text x="672" y="236" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">no turn</text>
  <text x="672" y="254" font-family="sans-serif" font-size="11" fill="#555">0-byte turn log</text>

  <text x="20" y="304" font-family="monospace" font-size="12" fill="#7f1d1d">bwrap: Unknown option -p</text>
  <text x="20" y="330" font-family="sans-serif" font-size="11" fill="#444">The fence prefix is identical in both rows; only the command after the separator differs.</text>
  <text x="20" y="346" font-family="sans-serif" font-size="11" fill="#444">The run record's command field holds the composed argv[0], so a resume builds the fence around the fence binary.</text>
</svg>