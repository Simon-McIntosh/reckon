<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="720" fill="#ffffff"/>

  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b2733">
    Where a plan write lands: the run scope in edit_plan
  </text>
  <text x="480" y="56" text-anchor="middle" font-size="12.5" fill="#5b6b7a">
    One decision point. A run-scoped write resolves to its own worktree; every other path is unchanged.
  </text>

  <!-- entry -->
  <rect x="330" y="78" width="300" height="54" rx="7"
        fill="#eef3f8" stroke="#3b6ea5" stroke-width="1.6"/>
  <text x="480" y="100" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b2733">
    edit_plan(project, slug, checkout_path=None)
  </text>
  <text x="480" y="118" text-anchor="middle" font-size="11.5" fill="#5b6b7a">
    called on reckon's MCP server
  </text>

  <line x1="480" y1="132" x2="480" y2="160" stroke="#7a8a99" stroke-width="1.6"/>
  <polygon points="480,168 476,158 484,158" fill="#7a8a99"/>

  <!-- decision 1: explicit checkout_path -->
  <polygon points="480,170 665,218 480,266 295,218"
           fill="#fdf6e3" stroke="#b8860f" stroke-width="1.6"/>
  <text x="480" y="212" text-anchor="middle" font-size="12.5" fill="#4a3b0a">
    checkout_path given?
  </text>
  <text x="480" y="232" text-anchor="middle" font-size="11.5" fill="#6b5410">
    (the caller named its target)
  </text>

  <!-- right: yes -->
  <line x1="665" y1="218" x2="760" y2="218" stroke="#7a8a99" stroke-width="1.6"/>
  <polygon points="768,218 758,214 758,222" fill="#7a8a99"/>
  <text x="700" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c6a35">yes</text>
  <rect x="770" y="186" width="176" height="64" rx="7"
        fill="#eaf6ec" stroke="#2c6a35" stroke-width="1.6"/>
  <text x="858" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e4d26">
    write to that checkout
  </text>
  <text x="858" y="232" text-anchor="middle" font-size="11.5" fill="#2c6a35">
    today's behaviour, kept
  </text>

  <!-- down: no -->
  <line x1="480" y1="266" x2="480" y2="296" stroke="#7a8a99" stroke-width="1.6"/>
  <polygon points="480,304 476,294 484,294" fill="#7a8a99"/>
  <text x="500" y="290" font-size="11.5" font-weight="bold" fill="#8a2d2d">no</text>

  <!-- decision 2: RECKON_RUN_ID -->
  <polygon points="480,306 665,354 480,402 295,354"
           fill="#fdf6e3" stroke="#b8860f" stroke-width="1.6"/>
  <text x="480" y="348" text-anchor="middle" font-size="12.5" fill="#4a3b0a">
    RECKON_RUN_ID set?
  </text>
  <text x="480" y="368" text-anchor="middle" font-size="11.5" fill="#6b5410">
    (exported into every crew worker)
  </text>

  <!-- right: no -> main checkout -->
  <line x1="665" y1="354" x2="760" y2="354" stroke="#7a8a99" stroke-width="1.6"/>
  <polygon points="768,354 758,350 758,358" fill="#7a8a99"/>
  <text x="700" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c6a35">no</text>
  <rect x="770" y="322" width="176" height="64" rx="7"
        fill="#eaf6ec" stroke="#2c6a35" stroke-width="1.6"/>
  <text x="858" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e4d26">
    mounted main checkout
  </text>
  <text x="858" y="368" text-anchor="middle" font-size="11.5" fill="#2c6a35">
    coordinator unaffected
  </text>

  <!-- down: yes -->
  <line x1="480" y1="402" x2="480" y2="432" stroke="#7a8a99" stroke-width="1.6"/>
  <polygon points="480,440 476,430 484,430" fill="#7a8a99"/>
  <text x="500" y="426" font-size="11.5" font-weight="bold" fill="#2c6a35">yes</text>

  <!-- read pointer -->
  <rect x="320" y="442" width="320" height="52" rx="7"
        fill="#eef3f8" stroke="#3b6ea5" stroke-width="1.6"/>
  <text x="480" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b2733">
    read the run's live pointer
  </text>
  <text x="480" y="482" text-anchor="middle" font-size="11.5" fill="#5b6b7a">
    worktree, project
  </text>

  <line x1="480" y1="494" x2="480" y2="522" stroke="#7a8a99" stroke-width="1.6"/>
  <polygon points="480,530 476,520 484,520" fill="#7a8a99"/>

  <!-- three outcomes -->
  <line x1="480" y1="530" x2="150" y2="564" stroke="#c0653f" stroke-width="1.6"/>
  <line x1="480" y1="530" x2="480" y2="564" stroke="#c0653f" stroke-width="1.6"/>
  <line x1="480" y1="530" x2="810" y2="564" stroke="#2c6a35" stroke-width="1.6"/>

  <!-- left: no worktree -->
  <rect x="30" y="566" width="240" height="118" rx="7"
        fill="#fdecea" stroke="#8a2d2d" stroke-width="1.6"/>
  <text x="150" y="590" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a1f1f">
    REFUSED
  </text>
  <text x="150" y="610" text-anchor="middle" font-size="11" fill="#7a1f1f">
    run has no worktree
  </text>
  <text x="150" y="628" text-anchor="middle" font-size="11" fill="#7a1f1f">
    (pointer unreadable is
  </text>
  <text x="150" y="643" text-anchor="middle" font-size="11" fill="#7a1f1f">
    treated as no worktree)
  </text>
  <text x="150" y="666" text-anchor="middle" font-size="10.5" fill="#8a4a4a">
    message names run + target
  </text>

  <!-- middle: other project -->
  <rect x="360" y="566" width="240" height="118" rx="7"
        fill="#fdecea" stroke="#8a2d2d" stroke-width="1.6"/>
  <text x="480" y="590" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a1f1f">
    REFUSED
  </text>
  <text x="480" y="610" text-anchor="middle" font-size="11" fill="#7a1f1f">
    plan belongs to another project
  </text>
  <text x="480" y="628" text-anchor="middle" font-size="11" fill="#7a1f1f">
    (run is scoped to X, not Y)
  </text>
  <text x="480" y="666" text-anchor="middle" font-size="10.5" fill="#8a4a4a">
    the main checkout is never reached
  </text>

  <!-- right: own project -->
  <rect x="690" y="566" width="240" height="118" rx="7"
        fill="#eaf6ec" stroke="#2c6a35" stroke-width="1.6"/>
  <text x="810" y="590" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e4d26">
    WRITTEN
  </text>
  <text x="810" y="610" text-anchor="middle" font-size="11" fill="#1e4d26">
    the run's own worktree
  </text>
  <text x="810" y="628" text-anchor="middle" font-size="11" fill="#1e4d26">
    (the plan this run owns)
  </text>
  <text x="810" y="666" text-anchor="middle" font-size="10.5" fill="#3d6b45">
    main checkout byte-identical
  </text>

  <text x="480" y="706" text-anchor="middle" font-size="10.5" fill="#7a8a99">
    A refusal is a structured result, not an exception: error "run_scoped_write", with run_id, project and would_write.
  </text>
</svg>