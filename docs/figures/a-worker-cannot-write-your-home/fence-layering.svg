<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#111" font-family="ui-sans-serif, system-ui, sans-serif">How launch_plan seals the operator&#8217;s home</text>
  <text x="24" y="56" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#555">bubblewrap applies its mounts in argv order, so a later bind over an earlier read-only overlay is what re-opens a granted subtree.</text>

  <!-- Panel A: argv sequence -->
  <text x="24" y="92" font-size="14" font-weight="bold" fill="#111" font-family="ui-sans-serif, system-ui, sans-serif">A &#8212; the composed argv, in order</text>

  <g>
    <rect x="24" y="106" width="196" height="46" rx="6" fill="#111"/>
    <text x="40" y="126" fill="#fff" font-size="12">bwrap --dev-bind / /</text>
    <text x="40" y="142" fill="#bbb" font-size="11">whole filesystem writable</text>
  </g>
  <text x="234" y="134" font-size="20" fill="#888">&#8594;</text>

  <g>
    <rect x="258" y="106" width="212" height="46" rx="6" fill="#b3261e"/>
    <text x="274" y="126" fill="#fff" font-size="12">--ro-bind P P   &#215;N</text>
    <text x="274" y="142" fill="#ffd9d6" font-size="11">one per existing protected path</text>
  </g>
  <text x="484" y="134" font-size="20" fill="#888">&#8594;</text>

  <g>
    <rect x="508" y="106" width="212" height="46" rx="6" fill="#1e7f3d"/>
    <text x="524" y="126" fill="#fff" font-size="12">--bind R R   &#215;M</text>
    <text x="524" y="142" fill="#d6f5e0" font-size="11">re-opens granted roots inside P</text>
  </g>
  <text x="734" y="134" font-size="20" fill="#888">&#8594;</text>

  <g>
    <rect x="758" y="106" width="198" height="46" rx="6" fill="#f2f2f2" stroke="#bbb"/>
    <text x="774" y="126" fill="#111" font-size="12">-- harness argv</text>
    <text x="774" y="142" fill="#555" font-size="11">claude | codex | clive</text>
  </g>

  <!-- Panel B: filesystem after the fence -->
  <text x="24" y="196" font-size="14" font-weight="bold" fill="#111" font-family="ui-sans-serif, system-ui, sans-serif">B &#8212; the home as the worker sees it</text>

  <!-- .claude -->
  <text x="24" y="228" font-size="12" fill="#333">~/.claude</text>
  <rect x="24" y="236" width="286" height="34" rx="5" fill="#b3261e"/>
  <text x="38" y="258" fill="#fff" font-size="12">read-only &#8212; memory, transcripts, settings</text>

  <!-- .config/reckon with granted windows -->
  <text x="360" y="228" font-size="12" fill="#333">~/.config/reckon</text>
  <rect x="360" y="236" width="596" height="34" rx="5" fill="#b3261e"/>
  <text x="374" y="258" fill="#fff" font-size="12">read-only &#8212; live pointers, ledger, flight layer</text>

  <rect x="360" y="282" width="150" height="30" rx="5" fill="#1e7f3d"/>
  <text x="372" y="302" fill="#fff" font-size="11">crew/runs/&lt;run&gt;: rw</text>
  <rect x="522" y="282" width="150" height="30" rx="5" fill="#1e7f3d"/>
  <text x="534" y="302" fill="#fff" font-size="11">crew/reports: rw</text>
  <rect x="684" y="282" width="170" height="30" rx="5" fill="#1e7f3d"/>
  <text x="696" y="302" fill="#fff" font-size="11">manifest dir: rw</text>
  <rect x="866" y="282" width="90" height="30" rx="5" fill="#b3261e"/>
  <text x="880" y="302" fill="#fff" font-size="11">flight.toml</text>
  <text x="360" y="330" font-size="11" fill="#666">A granted root is re-bound writable; a sibling file under the same protected root stays sealed.</text>

  <!-- worktree under a protected checkout -->
  <text x="24" y="368" font-size="12" fill="#333">~/Code/dotfiles (a main checkout)</text>
  <rect x="24" y="376" width="932" height="34" rx="5" fill="#b3261e"/>
  <text x="38" y="398" fill="#fff" font-size="12">read-only &#8212; a worker writing a main checkout goes live for every session through the editable install</text>
  <rect x="612" y="376" width="200" height="34" rx="5" fill="#1e7f3d"/>
  <text x="624" y="398" fill="#fff" font-size="11">.worktrees/wt: rw (its own tree)</text>

  <!-- legend -->
  <rect x="24" y="440" width="14" height="14" fill="#b3261e"/>
  <text x="46" y="452" font-size="12" fill="#333">sealed read-only</text>
  <rect x="196" y="440" width="14" height="14" fill="#1e7f3d"/>
  <text x="218" y="452" font-size="12" fill="#333">writable through a re-bind</text>
  <rect x="410" y="440" width="14" height="14" fill="#111"/>
  <text x="432" y="452" font-size="12" fill="#333">fence binary, default</text>

  <!-- verdict strip -->
  <text x="24" y="500" font-size="14" font-weight="bold" fill="#111" font-family="ui-sans-serif, system-ui, sans-serif">C &#8212; what the two tests assert</text>
  <rect x="24" y="514" width="452" height="76" rx="6" fill="#f6fff9" stroke="#1e7f3d"/>
  <text x="38" y="536" font-size="12" fill="#1e7f3d" font-weight="bold">fenced run: the fence holds</text>
  <text x="38" y="556" font-size="11" fill="#333">rm -rf of every protected sentinel fails; the sentinel survives.</text>
  <text x="38" y="572" font-size="11" fill="#333">every granted root and the worktree are writable.</text>

  <rect x="504" y="514" width="452" height="76" rx="6" fill="#fff6f5" stroke="#b3261e"/>
  <text x="518" y="536" font-size="12" fill="#b3261e" font-weight="bold">negative control: drop the ~/.claude overlay</text>
  <text x="518" y="556" font-size="11" fill="#333">the same stub then deletes the ~/.claude sentinel.</text>
  <text x="518" y="572" font-size="11" fill="#333">unfenced, all 15 sentinels are deleted &#8212; so survival is not vacuous.</text>
</svg>