<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="DejaVu Sans, Helix, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="24" y="38" font-size="22" font-weight="bold" fill="#111111">The dispatch path composes the fence again (FENCE_WORKERS = True)</text>
  <text x="24" y="62" font-size="14" fill="#444444">One launch through crew.dispatch for a clive backend, read from the plan the launcher receives. Left: head; right: the declared control.</text>

  <!-- Head panel -->
  <rect x="24" y="86" width="460" height="250" rx="8" fill="#f5faf5" stroke="#2e7d32" stroke-width="2"/>
  <text x="44" y="114" font-size="17" font-weight="bold" fill="#1b5e20">head d7ba7433 — fenced</text>

  <text x="44" y="146" font-size="13" fill="#111111">argv[0]</text>
  <rect x="44" y="154" width="420" height="28" rx="4" fill="#dcedc8" stroke="#7cb342"/>
  <text x="56" y="173" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#1b5e20">/usr/bin/bwrap   (the fence binary)</text>

  <text x="44" y="206" font-size="13" fill="#111111">binds composed</text>
  <rect x="44" y="214" width="420" height="28" rx="4" fill="#ffffff" stroke="#c5e1a5"/>
  <text x="56" y="233" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#333333">--dev-bind / /   --ro-bind ~/.claude ~/.claude</text>
  <rect x="44" y="246" width="420" height="28" rx="4" fill="#ffffff" stroke="#c5e1a5"/>
  <text x="56" y="265" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#333333">--bind &lt;worktree&gt;/.git  --bind &lt;objects&gt;</text>

  <text x="44" y="300" font-size="13" fill="#111111">CLAUDE_CONFIG_DIR</text>
  <rect x="44" y="308" width="420" height="24" rx="4" fill="#dcedc8" stroke="#7cb342"/>
  <text x="56" y="325" font-size="12" font-family="DejaVu Sans Mono, monospace" fill="#1b5e20">&lt;run&gt;/harness   hooks + CLAUDE.md seeded</text>

  <!-- Control panel -->
  <rect x="516" y="86" width="460" height="250" rx="8" fill="#fdf3f3" stroke="#c62828" stroke-width="2"/>
  <text x="536" y="114" font-size="17" font-weight="bold" fill="#8e0000">control — FENCE_WORKERS False (declared)</text>

  <text x="536" y="146" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#111111">argv[0]</text>
  <rect x="536" y="154" width="420" height="28" rx="4" fill="#ffcdd2" stroke="#e57373"/>
  <text x="548" y="173" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#8e0000">/work/projects/imas_gpu/agents/clive</text>

  <text x="536" y="206" font-size="13" fill="#111111">fence element present</text>
  <rect x="536" y="214" width="420" height="28" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="548" y="233" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#8e0000">no — the harness itself is argv[0]</text>

  <text x="536" y="266" font-size="13" fill="#111111">CLAUDE_CONFIG_DIR</text>
  <rect x="536" y="274" width="420" height="28" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="548" y="293" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#8e0000">unset — no run harness home</text>

  <text x="536" y="320" font-size="13" font-weight="bold" fill="#8e0000">outcome: the fenced case FAILED as declared</text>

  <!-- Gate strip -->
  <rect x="24" y="360" width="952" height="96" rx="8" fill="#f6f6f8" stroke="#9aa0a6"/>
  <text x="44" y="388" font-size="16" font-weight="bold" fill="#111111">Gate — seven files, base vs head</text>
  <text x="44" y="416" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#333333">base b11cf190 : 39 passed</text>
  <text x="44" y="438" font-size="13" font-family="DejaVu Sans Mono, monospace" fill="#1b5e20">head d7ba7433 : 41 passed   (39 + the two new tests)</text>
  <text x="420" y="416" font-size="13" fill="#333333">added failures: 0</text>
  <text x="420" y="438" font-size="13" fill="#333333">the six pre-existing files are byte-identical at base and head</text>

  <!-- Sealing note -->
  <rect x="24" y="474" width="952" height="120" rx="8" fill="#eef4fb" stroke="#4a7ebb"/>
  <text x="44" y="502" font-size="15" font-weight="bold" fill="#1a3e6e">What the fence guarantees, in the comment now above the flag</text>
  <text x="44" y="528" font-size="13.5" fill="#1a3e6e">The operator's dot directories, project state and the plan store are sealed read-only, so a worker cannot write the coordinator's home.</text>
  <text x="44" y="550" font-size="13.5" fill="#1a3e6e">The run's own write roots are re-bound writable over that seal — a linked worktree's git directory and its shared object store —</text>
  <text x="44" y="572" font-size="13.5" fill="#1a3e6e">so a fenced worker can still commit, and each run adopts its own harness home seeded with the operator's hooks and instruction files.</text>
</svg>