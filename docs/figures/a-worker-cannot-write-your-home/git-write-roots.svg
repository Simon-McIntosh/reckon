<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="Mount order that lets a fenced worker commit in its own worktree while the main checkout stays sealed">
  <style>
    text { font-family: "DejaVu Sans", Verdana, sans-serif; fill: #1b2733; }
    .title { font-size: 19px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .body { font-size: 12.5px; }
    .mono { font-family: "DejaVu Sans Mono", Menlo, monospace; font-size: 12px; }
    .cap { font-size: 12.5px; fill: #45535f; }
    .box { fill: #f5f8fb; stroke: #8fa3b5; stroke-width: 1.2; rx: 6; }
    .rw { fill: #e6f5ea; stroke: #2f8f4d; stroke-width: 1.4; rx: 6; }
    .ro { fill: #fdeaea; stroke: #c0392b; stroke-width: 1.4; rx: 6; }
    .grant { fill: #eaf2fd; stroke: #2f6fbf; stroke-width: 1.4; rx: 6; }
    .arrow { stroke: #6b7a88; stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .sealedlink { stroke: #c0392b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .grantlink { stroke: #2f8f4d; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a88"/>
    </marker>
  </defs>

  <text class="title" x="30" y="34">Fence mount order: the worktree git metadata is re-opened, the main checkout stays sealed</text>

  <text class="h" x="30" y="70">argv order (bubblewrap applies each mount over the last)</text>

  <rect class="box" x="30" y="84" width="420" height="46"/>
  <text class="mono" x="44" y="112">--dev-bind / /</text>
  <text class="body" x="240" y="112">whole filesystem writable</text>

  <rect class="ro" x="30" y="140" width="420" height="46"/>
  <text class="mono" x="44" y="168">--ro-bind Code/reckon Code/reckon</text>
  <text class="body" x="322" y="168">main checkout sealed</text>

  <rect class="rw" x="30" y="196" width="420" height="46"/>
  <text class="mono" x="44" y="224">--bind .git/worktrees/NAME</text>
  <text class="body" x="296" y="224">HEAD, index, reflog writable</text>

  <rect class="rw" x="30" y="252" width="420" height="46"/>
  <text class="mono" x="44" y="280">--bind .git/objects</text>
  <text class="body" x="240" y="280">shared store writable</text>

  <rect class="grant" x="30" y="308" width="420" height="46"/>
  <text class="mono" x="44" y="336">--bind Code/.reckon-worktrees/.../wt</text>
  <text class="body" x="352" y="336">working tree</text>

  <path class="arrow" d="M240 366 L240 384"/>
  <text class="cap" x="252" y="382">then the harness argv</text>

  <text class="h" x="530" y="70">inside the fence</text>

  <rect class="ro" x="530" y="140" width="380" height="70"/>
  <text class="body" x="546" y="166">refused: read-only file system</text>
  <text class="mono" x="546" y="188">.git/index &#183; .git/refs/heads &#183; main working tree</text>

  <rect class="rw" x="530" y="196" width="380" height="100"/>
  <text class="body" x="546" y="222">granted writable</text>
  <text class="mono" x="546" y="244">.git/worktrees/NAME/&#183;index &#183; HEAD &#183; logs/</text>
  <text class="mono" x="546" y="264">.git/objects/</text>
  <text class="mono" x="546" y="284">Code/.reckon-worktrees/.../wt/</text>

  <rect class="grant" x="530" y="308" width="380" height="46"/>
  <text class="body" x="546" y="336">git commit --allow-empty succeeds; the new commit is reachable from the worktree HEAD</text>

  <path class="grantlink" d="M450 219 L522 219"/>
  <path class="grantlink" d="M450 275 L522 269"/>
  <path class="grantlink" d="M450 331 L522 331"/>
  <path class="sealedlink" d="M450 163 L522 169"/>

  <text class="cap" x="530" y="410">Without the two git grants a commit fails on a read-only file system (the declared negative control).</text>
  <text class="cap" x="530" y="430">refs/heads and the main index stay sealed: the object store is content-addressed and append-only,</text>
  <text class="cap" x="530" y="450">so granting it cannot rewrite another tree's history.</text>
</svg>