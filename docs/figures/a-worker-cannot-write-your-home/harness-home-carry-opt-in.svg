<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="monospace" font-size="12">
  <rect width="940" height="420" fill="#fbfbfd"/>
  <text x="20" y="28" font-size="16" font-weight="bold">The carry cases opt into the fence they depend on</text>

  <rect x="20" y="52" width="250" height="64" rx="6" fill="#eef2ff" stroke="#5566aa"/>
  <text x="34" y="76">_launch(home, run, backend,</text>
  <text x="34" y="94">        fence=True|False)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
  <line x1="270" y1="70" x2="350" y2="120" stroke="#333" marker-end="url(#a)"/>
  <line x1="270" y1="98" x2="350" y2="270" stroke="#333" marker-end="url(#a)"/>

  <rect x="350" y="86" width="330" height="78" rx="6" fill="#eaf7ea" stroke="#4a8a4a"/>
  <text x="364" y="108" font-weight="bold">fence=True: a run home is adopted</text>
  <text x="364" y="128">seed_harness_home; CLAUDE_CONFIG_DIR</text>
  <text x="364" y="146">= &lt;run_dir&gt;/harness</text>

  <rect x="700" y="86" width="222" height="78" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="712" y="108">carry cases (5 named</text>
  <text x="712" y="126">ids + no-overwrite)</text>
  <text x="712" y="144">now pass</text>

  <rect x="350" y="236" width="330" height="78" rx="6" fill="#fdf0f0" stroke="#aa4444"/>
  <text x="364" y="258" font-weight="bold">fence=False: no run home invented</text>
  <text x="364" y="278">operator home kept</text>
  <text x="364" y="296">no CLAUDE_CONFIG_DIR, argv[0] is not bwrap</text>

  <rect x="700" y="236" width="222" height="78" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="712" y="258">asserted by the new</text>
  <text x="712" y="276">unfenced case, and the</text>
  <text x="712" y="294">held expectation at base</text>

  <rect x="20" y="336" width="902" height="62" rx="6" fill="#fff8e6" stroke="#aa8800"/>
  <text x="34" y="358">At base 4b0ccd34 five carry cases ran unfenced and expected a run home: four failed with</text>
  <text x="34" y="378">KeyError 'CLAUDE_CONFIG_DIR' and the never-read-or-written case with FileNotFoundError on the</text>
  <text x="34" y="396">run home that was never created. One cause: the fence opt-in the cases were written under.</text>
</svg>