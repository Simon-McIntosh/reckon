<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="title">
  <title id="title">A fenced resume names the harness after the fence separator, not the fence binary</title>
  <rect x="0" y="0" width="900" height="430" fill="#ffffff"/>
  <text x="20" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111">The command after the fence separator, three ways</text>
  <text x="20" y="52" font-family="sans-serif" font-size="12" fill="#444">Measured 2026-09-25 at 18a89e6f (base) and 49ecff80 (head), clive lane, session sess-fenced-repro.</text>

  <text x="20" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">dispatch: the argv the run launched with</text>
  <rect x="20" y="100" width="700" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="34" y="120" font-family="monospace" font-size="12" fill="#111">bwrap --dev-bind / / --ro-bind [protected paths] --</text>
  <text x="34" y="137" font-family="monospace" font-size="12" fill="#14532d">clive -p --output-format stream-json ...</text>
  <text x="736" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">runs</text>

  <text x="20" y="184" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7f1d1d">resume at base: the record's command field is read as the harness</text>
  <rect x="20" y="192" width="700" height="62" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="34" y="212" font-family="monospace" font-size="12" fill="#111">bwrap --dev-bind / / --ro-bind [protected paths] --</text>
  <text x="34" y="229" font-family="monospace" font-size="12" fill="#7f1d1d">bwrap -p --output-format stream-json ... --resume sess-fenced-repro</text>
  <text x="34" y="246" font-family="monospace" font-size="12" fill="#7f1d1d">bwrap: Unknown option -p</text>
  <text x="736" y="212" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">no turn</text>
  <text x="736" y="230" font-family="sans-serif" font-size="11" fill="#555">0-byte log</text>

  <text x="20" y="292" font-family="sans-serif" font-size="13" font-weight="bold" fill="#14532d">resume at head: the harness is recovered from the run’s own argv</text>
  <rect x="20" y="300" width="700" height="62" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="34" y="320" font-family="monospace" font-size="12" fill="#111">bwrap --dev-bind / / --ro-bind [protected paths] --</text>
  <text x="34" y="337" font-family="monospace" font-size="12" fill="#14532d">clive -p --output-format stream-json ... --resume sess-fenced-repro</text>
  <text x="34" y="354" font-family="monospace" font-size="12" fill="#14532d">CLAUDE_CONFIG_DIR: the run’s own harness home, under the fence</text>
  <text x="736" y="320" font-family="sans-serif" font-size="14" font-weight="bold" fill="#16a34a">runs</text>
  <text x="736" y="338" font-family="sans-serif" font-size="11" fill="#555">same fence</text>

  <text x="20" y="398" font-family="sans-serif" font-size="11" fill="#444">The fence prefix is identical in all three rows; only the command after the separator differs.</text>
  <text x="20" y="416" font-family="sans-serif" font-size="11" fill="#444">One fence element at head, two at base: the defect was a fence composed around the fence binary.</text>
</svg>
