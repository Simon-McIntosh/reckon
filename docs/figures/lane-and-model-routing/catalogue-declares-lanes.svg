<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="520" fill="#ffffff"/>

  <!-- Column headers -->
  <text x="60" y="46" font-size="22" fill="#333">lane</text>
  <text x="520" y="46" font-size="22" fill="#333">models declared in the catalogue</text>
  <text x="1050" y="46" font-size="22" fill="#333">aliases resolve to (lane, model_key)</text>

  <!-- claude lane -->
  <rect x="60" y="70" width="360" height="120" rx="6" fill="none" stroke="#3b6ea5" stroke-width="2.6"/>
  <text x="80" y="108" font-size="24" fill="#3b6ea5">claude</text>
  <text x="80" y="140" font-size="18" fill="#666">default: sonnet</text>
  <text x="80" y="168" font-size="18" fill="#666">models: sonnet, opus, haiku</text>

  <rect x="520" y="70" width="470" height="120" rx="6" fill="none" stroke="#bbb" stroke-width="1.2"/>
  <text x="540" y="104" font-size="20" fill="#222">sonnet &#8594; claude-sonnet-5-5 (medium)</text>
  <text x="540" y="132" font-size="20" fill="#222">opus &#8594; claude-opus-5-5 (high)</text>
  <text x="540" y="160" font-size="20" fill="#222">haiku &#8594; claude-haiku-4-5 (high)</text>

  <line x1="420" y1="130" x2="520" y2="130" stroke="#bbb" stroke-width="1.2"/>
  <line x1="990" y1="130" x2="1050" y2="130" stroke="#bbb" stroke-width="1.2"/>

  <text x="1050" y="104" font-size="20" fill="#222">claude-opus &#8594; (claude, opus)</text>
  <text x="1050" y="132" font-size="20" fill="#222">claude-haiku &#8594; (claude, haiku)</text>

  <!-- codex lane -->
  <rect x="60" y="230" width="360" height="120" rx="6" fill="none" stroke="#7a7a2a" stroke-width="2.6"/>
  <text x="80" y="268" font-size="24" fill="#7a7a2a">codex</text>
  <text x="80" y="300" font-size="18" fill="#666">default: sol</text>
  <text x="80" y="328" font-size="18" fill="#666">models: sol, astra, luna</text>

  <rect x="520" y="230" width="470" height="120" rx="6" fill="none" stroke="#bbb" stroke-width="1.2"/>
  <text x="540" y="264" font-size="20" fill="#222">sol &#8594; gpt-6-sol (high)</text>
  <text x="540" y="292" font-size="20" fill="#222">astra &#8594; gpt-6-astra (xhigh)</text>
  <text x="540" y="320" font-size="20" fill="#222">luna &#8594; gpt-6-luna (xhigh)</text>

  <line x1="420" y1="290" x2="520" y2="290" stroke="#bbb" stroke-width="1.2"/>
  <line x1="990" y1="290" x2="1050" y2="290" stroke="#bbb" stroke-width="1.2"/>

  <text x="1050" y="264" font-size="20" fill="#222">codex-astra &#8594; (codex, astra)</text>
  <text x="1050" y="292" font-size="20" fill="#222">codex-luna &#8594; (codex, luna)</text>
  <text x="1050" y="320" font-size="20" fill="#a33">codex-terra &#8594; (codex, terra) &#8212; retired</text>

  <!-- clive lane -->
  <rect x="60" y="390" width="360" height="100" rx="6" fill="none" stroke="#6a6a6a" stroke-width="2.6"/>
  <text x="80" y="428" font-size="24" fill="#6a6a6a">clive</text>
  <text x="80" y="460" font-size="18" fill="#666">default: flash &#183; models: flash</text>

  <rect x="520" y="390" width="470" height="100" rx="6" fill="none" stroke="#bbb" stroke-width="1.2"/>
  <text x="540" y="424" font-size="20" fill="#222">flash &#8594; deepseek-v4.1-flash (xhigh)</text>

  <line x1="420" y1="440" x2="520" y2="440" stroke="#bbb" stroke-width="1.2"/>
  <line x1="990" y1="440" x2="1050" y2="440" stroke="#bbb" stroke-width="1.2"/>
  <text x="1050" y="424" font-size="20" fill="#a33">clive-glm &#8594; (clive, glm) &#8212; retired</text>

  <text x="1050" y="500" font-size="18" fill="#666">retired names keep a pair so a stored row normalises; no model behind them</text>
</svg>