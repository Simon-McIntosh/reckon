<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b93a1"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#0f1118"/>
  <text x="24" y="34" fill="#e6e6e6" font-size="18">A declared write path leaves one of three branches</text>
  <text x="24" y="58" fill="#8b93a1" font-size="13">Base: one sentence was emitted for both refusals below, so the third branch read as the second.</text>
  <text x="24" y="76" fill="#8b93a1" font-size="13">Head: each branch names the list its own check was made against.</text>

  <!-- the declared path -->
  <rect x="330" y="104" width="240" height="44" rx="6" fill="#1b2430" stroke="#4f9dff"/>
  <text x="450" y="124" fill="#e6e6e6" font-size="14" text-anchor="middle">declared write path, per role</text>
  <text x="450" y="141" fill="#8b93a1" font-size="12" text-anchor="middle">absolute or relative, in write_paths</text>

  <!-- branch arrows -->
  <line x1="450" y1="148" x2="170" y2="216" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="148" x2="450" y2="216" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="148" x2="730" y2="216" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch 1: admitted -->
  <rect x="30" y="216" width="280" height="150" rx="6" fill="#12202a" stroke="#3fb27f"/>
  <text x="46" y="240" fill="#3fb27f" font-size="13">check 1: under a delivery root</text>
  <text x="46" y="264" fill="#e6e6e6" font-size="13">admitted, no refusal</text>
  <text x="46" y="290" fill="#8b93a1" font-size="12">runs_dir(), reports_dir(),</text>
  <text x="46" y="306" fill="#8b93a1" font-size="12">and the node's own manifest path</text>
  <text x="46" y="332" fill="#8b93a1" font-size="12">none of the three, or all three,</text>
  <text x="46" y="348" fill="#8b93a1" font-size="12">leaves nothing to refuse</text>

  <!-- branch 2: inside the repository -->
  <rect x="330" y="216" width="240" height="150" rx="6" fill="#241a1a" stroke="#e0685f"/>
  <text x="346" y="240" fill="#e0685f" font-size="13">check 2: inside the repo</text>
  <text x="346" y="266" fill="#e6e6e6" font-size="13">…resolve(s) inside the</text>
  <text x="346" y="283" fill="#e6e6e6" font-size="13">repository &lt;R&gt;</text>
  <text x="346" y="310" fill="#8b93a1" font-size="12">correction: dispatch an</text>
  <text x="346" y="326" fill="#8b93a1" font-size="12">implement node for the</text>
  <text x="346" y="342" fill="#8b93a1" font-size="12">source edits</text>

  <!-- branch 3: outside both -->
  <rect x="590" y="216" width="280" height="150" rx="6" fill="#241a1a" stroke="#e0685f"/>
  <text x="606" y="240" fill="#e0685f" font-size="13">neither, so outside both</text>
  <text x="606" y="266" fill="#e6e6e6" font-size="13">…is outside the repository</text>
  <text x="606" y="283" fill="#e6e6e6" font-size="13">&lt;R&gt; and outside every delivery</text>
  <text x="606" y="300" fill="#e6e6e6" font-size="13">root this role may write (&lt;roots&gt;)</text>
  <text x="606" y="326" fill="#8b93a1" font-size="12">correction: declare the path</text>
  <text x="606" y="342" fill="#8b93a1" font-size="12">under one of those roots</text>

  <!-- what the base sentence did -->
  <text x="450" y="388" fill="#c9a227" font-size="13" text-anchor="middle">base: a path in the right-hand branch was reported with the middle branch's sentence</text>
</svg>