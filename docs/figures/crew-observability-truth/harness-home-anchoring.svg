<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="600" fill="#111827">Where a fenced resume's harness home lands when the pointer's manifest path is null</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#9ca3af"/></marker></defs>

  <text x="24" y="66" font-size="13" font-weight="600" fill="#991b1b">at base — the caller hands over an empty manifest path</text>
  <g font-size="12">
    <rect x="24" y="78" width="150" height="46" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="99" y="98" text-anchor="middle" fill="#7f1d1d">record carries no</text>
    <text x="99" y="114" text-anchor="middle" fill="#7f1d1d">manifest_path ("" )</text>

    <rect x="206" y="78" width="170" height="46" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="291" y="98" text-anchor="middle" fill="#7f1d1d">launch_plan: parent of</text>
    <text x="291" y="114" text-anchor="middle" fill="#7f1d1d">"" is the process cwd</text>

    <rect x="408" y="78" width="170" height="46" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="493" y="98" text-anchor="middle" fill="#7f1d1d">harness_home returns</text>
    <text x="493" y="114" text-anchor="middle" fill="#7f1d1d">the relative "harness"</text>

    <rect x="610" y="78" width="266" height="46" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="743" y="98" text-anchor="middle" fill="#7f1d1d">variable = "harness", seeded beside</text>
    <text x="743" y="114" text-anchor="middle" fill="#7f1d1d">the composing process</text>

    <rect x="206" y="150" width="372" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="392" y="169" text-anchor="middle" fill="#78350f">the worker stands in its worktree, so the harness resolves</text>
    <text x="392" y="185" text-anchor="middle" fill="#78350f">"harness" against it and writes its state there</text>

    <rect x="610" y="150" width="266" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="743" y="169" text-anchor="middle" fill="#78350f">&lt;worktree&gt;/harness/</text>
    <text x="743" y="185" text-anchor="middle" fill="#78350f">untracked — gc reads the tree as dirty</text>
  </g>
  <path d="M174 101 H206 M376 101 H408 M578 101 H610 M743 124 V150 M578 172 H610" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <text x="24" y="244" font-size="13" font-weight="600" fill="#92400e">at the guard — a path that names no location anchors nothing</text>
  <g font-size="12">
    <rect x="24" y="256" width="220" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="134" y="276" text-anchor="middle" fill="#78350f">a relative run directory</text>
    <text x="134" y="292" text-anchor="middle" fill="#78350f">anchors nothing: no home is seeded</text>

    <rect x="276" y="256" width="240" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="396" y="276" text-anchor="middle" fill="#78350f">no variable is invented, no directory</text>
    <text x="396" y="292" text-anchor="middle" fill="#78350f">created — the worktree stays empty</text>

    <rect x="548" y="256" width="328" height="46" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="712" y="276" text-anchor="middle" fill="#7f1d1d">but a fenced resume of such a run has no home at</text>
    <text x="712" y="292" text-anchor="middle" fill="#7f1d1d">all — the harness falls back to the operator's ~/.codex</text>
  </g>
  <path d="M244 279 H276 M516 279 H548" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="712" y="322" font-size="12" text-anchor="middle" fill="#7f1d1d">the run exits "Read-only file system"</text>

  <text x="24" y="368" font-size="13" font-weight="600" fill="#166534">at the resolution — the resume reads the run's own manifest path</text>
  <g font-size="12">
    <rect x="24" y="380" width="180" height="46" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="114" y="400" text-anchor="middle" fill="#14532d">live pointer: top-level</text>
    <text x="114" y="416" text-anchor="middle" fill="#14532d">manifest_path is null</text>

    <rect x="236" y="380" width="300" height="46" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="386" y="400" text-anchor="middle" fill="#14532d">read node.manifest_path, then the run</text>
    <text x="386" y="416" text-anchor="middle" fill="#14532d">directory's worker record, then its manifest</text>

    <rect x="568" y="380" width="308" height="46" rx="6" fill="#dcfce7" stroke="#22c55e"/>
    <text x="722" y="400" text-anchor="middle" fill="#14532d">home = &lt;run-dir&gt;/harness, absolute —</text>
    <text x="722" y="416" text-anchor="middle" fill="#14532d">the same home the dispatch composed</text>
  </g>
  <path d="M204 403 H236 M536 403 H568" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="24" y="466" font-size="12" fill="#4b5563">The resolution applies at all three sites that rebuild a launch or its runtime environment from a live pointer:</text>
  <text x="24" y="484" font-size="12" fill="#4b5563">resume_plan, change_lane and the supervisor spawn path. A live run's manifest path is absolute, so its home</text>
  <text x="24" y="502" font-size="12" fill="#4b5563">resolves under the run directory in every revision; only the unanchored shape moved, and it now lands there too.</text>
  <text x="24" y="532" font-size="12" fill="#4b5563">Evidence: logs/baseline-gate-resume.log, logs/after-gate-resume.log, logs/negative-control-resume.log under the run directory.</text>
</svg>