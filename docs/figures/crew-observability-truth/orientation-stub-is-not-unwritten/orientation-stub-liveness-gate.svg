<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="A live worker whose manifest holds only its orientation write: the phase derivation reads its newest stream and calls it working, and the liveness gate reads the recovery word from the same evidence so it also reads running, where the unconditional word read unwritten.">
  <style>
    .box { fill: #ffffff; stroke: #3b4a5a; stroke-width: 1.5; }
    .run { fill: #eef3f8; stroke: #3b4a5a; stroke-width: 1.5; }
    .good { fill: #eaf6ec; stroke: #2f6b3a; stroke-width: 1.5; }
    .bad { fill: #fdeeee; stroke: #8a2f2f; stroke-width: 1.5; }
    .gate { fill: #fff7e6; stroke: #8a6a1f; stroke-width: 1.5; }
    text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #1c2530; }
    .t { font-size: 15px; }
    .h { font-size: 16px; font-weight: bold; }
    .s { font-size: 13px; fill: #46586c; }
    .c { font-size: 13px; font-family: "DejaVu Sans Mono", monospace; }
    .arrow { stroke: #46586c; stroke-width: 1.5; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46586c"/>
    </marker>
  </defs>

  <text class="t" x="24" y="30">One run, two readings: the phase and the recovery word</text>

  <rect class="run" x="24" y="60" width="250" height="150" rx="8"/>
  <text class="t" x="40" y="86">the run</text>
  <text class="s" x="40" y="110">worker process: alive</text>
  <text class="s" x="40" y="132">manifest: orientation_worktree,</text>
  <text class="s" x="40" y="150">orientation_base_sha,</text>
  <text class="s" x="40" y="168">orientation_write_paths — no status</text>
  <text class="s" x="40" y="192">newest stream: one assistant record</text>

  <path class="arrow" d="M 274 110 L 356 110"/>
  <text class="s" x="286" y="100">phase derivation</text>

  <rect class="good" x="360" y="78" width="180" height="64" rx="8"/>
  <text class="h" x="376" y="106">phase: working</text>
  <text class="s" x="376" y="128">read from the stream</text>

  <path class="arrow" d="M 274 180 L 356 180"/>
  <text class="s" x="286" y="170">recovery word</text>

  <rect class="gate" x="360" y="150" width="200" height="60" rx="8"/>
  <text class="h" x="376" y="176">liveness gate</text>
  <text class="s" x="376" y="197">alive and in motion?</text>

  <path class="arrow" d="M 560 164 L 648 128"/>
  <text class="s" x="566" y="140">yes</text>
  <rect class="good" x="652" y="96" width="244" height="64" rx="8"/>
  <text class="h" x="668" y="122">recovery: running</text>
  <text class="s" x="668" y="144">verb observe — matches the phase</text>

  <path class="arrow" d="M 560 196 L 648 232"/>
  <text class="s" x="566" y="224">no</text>
  <rect class="bad" x="652" y="200" width="244" height="64" rx="8"/>
  <text class="h" x="668" y="226">recovery: unwritten</text>
  <text class="s" x="668" y="248">verb resume — worker gone, or</text>
  <text class="s" x="668" y="264">no stream evidence of the turn</text>

  <rect class="box" x="360" y="300" width="536" height="130" rx="8"/>
  <text class="t" x="380" y="328">What the gate reads</text>
  <text class="s" x="380" y="354">alive is True — the pointer pid, or the run directory's worker record,</text>
  <text class="s" x="380" y="374">already folded into one liveness answer before the gate is reached</text>
  <text class="s" x="380" y="400">worker_alive is True (a worker record naming a pid)</text>
  <text class="s" x="380" y="420">or _newest_stream_shows_work — the same evidence the phase derivation reads</text>

  <text class="s" x="24" y="340">Before the gate the cause was assigned</text>
  <text class="s" x="24" y="360">unconditionally for every unwritten</text>
  <text class="s" x="24" y="380">manifest, so the row read</text>
  <text class="s" x="24" y="400">unwritten beside phase working and the</text>
  <text class="s" x="24" y="420">ticker drew a run in flight as one to resume.</text>
</svg>