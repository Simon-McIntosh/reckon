<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="980" height="480" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#111">Where a promotion escapes the review gate, and how each escape is closed</text>
  <text x="24" y="56" font-size="14" fill="#555">A run reaches a refusal only if every condition on the left holds. A missed condition is not an error — it is a promotion with no waiver and no trace.</text>

  <text x="46" y="92" font-size="14" font-weight="700" fill="#8a3b3b">§2 as landed</text>
  <text x="556" y="92" font-size="14" font-weight="700" fill="#2f6b45">§2f as landed</text>

  <rect x="30" y="104" width="450" height="346" rx="8" fill="#fdf7f7" stroke="#e4c9c9"/>
  <rect x="520" y="104" width="430" height="346" rx="8" fill="#f5fbf7" stroke="#c9e0d1"/>

  <text x="48" y="130" font-size="13" font-weight="600" fill="#333">Conditions, in order</text>
  <text x="538" y="130" font-size="13" font-weight="600" fill="#333">Conditions, in order</text>

  <g font-size="13" fill="#222">
    <rect x="48" y="142" width="270" height="30" rx="5" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="60" y="162">verdict == "passed"</text>
  </g>

  <rect x="48" y="142" width="0" height="0"/>

  <g font-size="13" fill="#222">
    <rect x="48" y="180" width="270" height="44" rx="5" fill="#fdecec" stroke="#d2443c" stroke-width="1.6"/>
    <text x="60" y="200" font-weight="700" fill="#a02a22">role == "implement"</text>
    <text x="60" y="216" font-size="12" fill="#a02a22">the wide hole — 4 runs, no waiver</text>

    <rect x="48" y="232" width="270" height="44" rx="5" fill="#fdecec" stroke="#d2443c" stroke-width="1.6"/>
    <text x="60" y="252" font-weight="700" fill="#a02a22">classification == "scoring"</text>
    <text x="60" y="268" font-size="12" fill="#a02a22">reached only when status is exactly "complete"</text>

    <rect x="48" y="284" width="270" height="30" rx="5" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="60" y="304">no parsed review stored</text>
  </g>

  <g stroke="#d2443c" stroke-width="2" fill="none">
    <path d="M318 200 C 360 200, 364 168, 396 168"/>
    <path d="M318 254 C 380 254, 372 320, 396 320"/>
  </g>
  <path d="M318 158 C 344 158, 352 226, 396 226" stroke="#2f6b45" stroke-width="2" fill="none"/>

  <g font-size="12">
    <rect x="396" y="152" width="70" height="34" rx="4" fill="#ffffff" stroke="#d2443c"/>
    <text x="404" y="167" fill="#a02a22">promotes</text>
    <text x="404" y="180" fill="#a02a22">unreviewed</text>

    <rect x="396" y="210" width="70" height="34" rx="4" fill="#ffffff" stroke="#2f6b45"/>
    <text x="404" y="226" fill="#276b41" font-weight="700">refused</text>
    <text x="404" y="239" fill="#666">the one</text>

    <rect x="396" y="304" width="70" height="34" rx="4" fill="#ffffff" stroke="#d2443c"/>
    <text x="404" y="319" fill="#a02a22">classified</text>
    <text x="404" y="332" fill="#a02a22">"unreadable"</text>
  </g>

  <text x="48" y="352" font-size="12" fill="#a02a22">↑ a plausible synonym for "complete" exempts the run</text>
  <text x="48" y="368" font-size="12" fill="#a02a22">&#160;&#160;without its own writer knowing</text>
  <text x="48" y="398" font-size="12" fill="#555">Measured over every run fleet-wide in the three hours after §2 landed.</text>
  <text x="48" y="418" font-size="12" fill="#555">One refusal, the coordinator's own. Sixteen promoted past it.</text>
  <text x="48" y="438" font-size="12" fill="#555">No waiver recorded anywhere.</text>

  <g font-size="13" fill="#222">
    <rect x="538" y="142" width="300" height="30" rx="5" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="550" y="162">verdict == "passed"</text>

    <rect x="538" y="180" width="300" height="30" rx="5" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="550" y="200">classification == "scoring"</text>

    <rect x="538" y="218" width="300" height="30" rx="5" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="550" y="238">role != "review"</text>

    <rect x="538" y="256" width="300" height="46" rx="5" fill="#eaf6ee" stroke="#2f6b45" stroke-width="1.6"/>
    <text x="550" y="276" font-weight="700" fill="#276b41">role == "implement" OR changed a tracked path</text>
    <text x="550" y="293" font-size="12" fill="#276b41">the property is the writing, not the role name</text>

    <rect x="538" y="310" width="300" height="30" rx="5" fill="#ffffff" stroke="#c9c9c9"/>
    <text x="550" y="330" fill="#222">no parsed review stored</text>
  </g>

  <rect x="538" y="356" width="300" height="52" rx="5" fill="#eaf6ee" stroke="#2f6b45" stroke-width="1.6"/>
  <text x="550" y="376" font-size="13" font-weight="700" fill="#276b41">an unrecognised status is refused by name,</text>
  <text x="550" y="393" font-size="12" fill="#276b41">naming the observed word and the accepted vocabulary</text>

  <text x="538" y="428" font-size="12" fill="#555">That refusal runs before the classification is consulted,</text>
  <text x="538" y="444" font-size="12" fill="#555">so no synonym can declassify a run out of review.</text>
</svg>