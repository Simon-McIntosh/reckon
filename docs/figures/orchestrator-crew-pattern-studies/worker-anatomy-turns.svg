<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="20" y="26" font-size="16" font-weight="600" fill="#111827">Worker anatomy: turns to first edit, and what edits are spent on</text>
  <text x="20" y="44" font-size="11" fill="#4b5563">Study window 2026-09-12Z..2026-09-26T10:00Z; medians per lane/role cell (n above each group); edit mix is pooled over the cell.</text>

  <text x="20" y="76" font-size="12" font-weight="600" fill="#111827">Assistant turns vs turn of first file edit (median)</text>
  <rect x="20" y="86" width="10" height="10" fill="#9ca3af"/>
  <text x="36" y="95" font-size="10" fill="#374151">all turns</text>
  <rect x="86" y="86" width="10" height="10" fill="#111827"/>
  <text x="102" y="95" font-size="10" fill="#374151">turn of first edit</text>

  <g font-size="10" fill="#374151">
    <text x="20" y="128">clive/implement n=889</text>
    <rect x="150" y="116" width="193.6" height="12" fill="#9ca3af"/>
    <text x="349" y="126">88</text>
    <rect x="150" y="130" width="66" height="12" fill="#111827"/>
    <text x="221" y="140">30</text>

    <text x="20" y="172">clive/review n=772</text>
    <rect x="150" y="160" width="101.2" height="12" fill="#9ca3af"/>
    <text x="257" y="170">46</text>
    <rect x="150" y="174" width="79.2" height="12" fill="#111827"/>
    <text x="234" y="184">36</text>

    <text x="20" y="216">codex/implement n=232</text>
    <rect x="150" y="204" width="30.8" height="12" fill="#9ca3af"/>
    <text x="186" y="214">14</text>
    <rect x="150" y="218" width="4.4" height="12" fill="#111827"/>
    <text x="160" y="228">2</text>

    <text x="20" y="260">codex/review n=94</text>
    <rect x="150" y="248" width="11" height="12" fill="#9ca3af"/>
    <text x="167" y="258">5</text>
    <rect x="150" y="262" width="4.4" height="12" fill="#111827"/>
    <text x="160" y="272">2</text>
  </g>
  <text x="20" y="296" font-size="10" fill="#6b7280">Bars scale to 100 turns. Codex-dialect runs edit from their second turn on; clive-dialect runs read first.</text>

  <text x="470" y="76" font-size="12" font-weight="600" fill="#111827">Edits: product code vs record-keeping (pooled)</text>
  <rect x="470" y="86" width="10" height="10" fill="#2563eb"/>
  <text x="486" y="95" font-size="10" fill="#374151">source + tests</text>
  <rect x="580" y="86" width="10" height="10" fill="#d97706"/>
  <text x="596" y="95" font-size="10" fill="#374151">record-keeping</text>

  <g font-size="10" fill="#374151">
    <text x="470" y="128">clive/implement 6343 edits</text>
    <rect x="470" y="134" width="171" height="14" fill="#2563eb"/>
    <rect x="641" y="134" width="88.7" height="14" fill="#d97706"/>
    <text x="470" y="162">34% record-keeping (996 plan/evidence HTML, 959 manifest/reports, 210 figures)</text>
    <text x="470" y="176">66% product (2675 source, 1503 tests)</text>

    <text x="470" y="228">codex/implement 4053 edits</text>
    <rect x="470" y="234" width="125" height="14" fill="#2563eb"/>
    <rect x="595" y="234" width="135" height="14" fill="#d97706"/>
    <text x="470" y="262">52% record-keeping (1389 manifest/reports, 527 plan/evidence HTML, 189 figures)</text>
    <text x="470" y="276">48% product (1368 source, 580 tests)</text>
  </g>
  <text x="470" y="300" font-size="10" fill="#6b7280">Record-keeping reads (plan/evidence/research HTML, AGENTS.md, skills, manifests): 10.6% of clive/implement tool calls, 16.0% of codex/implement.</text>
</svg>