<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">A malformed section-dependency mapping: silently absent, or carried to a named refusal</title>
  <desc id="d">Two panels over the same authored defect — an invalid-JSON or non-object value in the
  plan-section-depends-on meta. Above: the reader returns None, which is also how it says no
  declaration exists, so every wait the author wrote disappears with no finding. Below: the reader
  carries the defect under one key that is not a section identity; section_dependency_refusals refuses
  it as invalid-section-dependency with a message naming the meta and the malformation, edge builders
  skip the key so no phantom section enters a readiness set, and the plan keeps its whole-plan
  behaviour.</desc>
  <defs>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2b2b"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6b36"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#1b1b1b">One malformed mapping, and where the defect goes</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#5b5b66">same authored value, same declared wait — only the reader's handling of a value it cannot parse differs</text>

  <!-- panel 1: the silent path -->
  <g>
    <rect x="24" y="70" width="852" height="132" rx="10" fill="#fdf2f2" stroke="#e0b4b4"/>
    <text x="44" y="94" font-size="14.5" font-weight="600" fill="#8a2b2b">before — the whole value reads as no declaration</text>
    <rect x="44" y="106" width="212" height="80" rx="8" fill="#ffffff" stroke="#c9c9d1"/>
    <text x="58" y="126" font-size="11.5" fill="#33333a" font-family="ui-monospace, monospace">plan-section-depends-on</text>
    <text x="58" y="144" font-size="11.5" fill="#8a2b2b" font-family="ui-monospace, monospace">{"s5": ["plan-b#s3",]}</text>
    <text x="58" y="162" font-size="11.5" fill="#8a2b2b" font-family="ui-monospace, monospace">["plan-b#s3"]</text>
    <text x="58" y="178" font-size="10.5" fill="#5b5b66">invalid JSON, or JSON that is not an object</text>
    <line x1="260" y1="146" x2="326" y2="146" stroke="#8a2b2b" stroke-width="2" marker-end="url(#red)"/>
    <rect x="332" y="118" width="168" height="56" rx="8" fill="#ffffff" stroke="#c9c9d1"/>
    <text x="416" y="142" text-anchor="middle" font-size="12" fill="#33333a" font-family="ui-monospace, monospace">section_depends_on</text>
    <text x="416" y="160" text-anchor="middle" font-size="12" fill="#8a2b2b" font-family="ui-monospace, monospace">returns None</text>
    <line x1="504" y1="146" x2="570" y2="146" stroke="#8a2b2b" stroke-width="2" marker-end="url(#red)"/>
    <rect x="576" y="112" width="284" height="68" rx="8" fill="#ffffff" stroke="#e0b4b4"/>
    <text x="590" y="134" font-size="11.5" fill="#8a2b2b">no edges, no findings — and None is also how</text>
    <text x="590" y="152" font-size="11.5" fill="#8a2b2b">"this plan declares no edge" reads: every</text>
    <text x="590" y="170" font-size="11.5" fill="#8a2b2b">declared wait is gone with nothing reported</text>
  </g>

  <!-- panel 2: the carried path -->
  <g>
    <rect x="24" y="216" width="852" height="164" rx="10" fill="#f4f8f4" stroke="#b4d0b6"/>
    <text x="44" y="240" font-size="14.5" font-weight="600" fill="#2f6b36">after — the defect is carried, and refused by name</text>
    <rect x="44" y="252" width="212" height="80" rx="8" fill="#ffffff" stroke="#c9c9d1"/>
    <text x="58" y="272" font-size="11.5" fill="#33333a" font-family="ui-monospace, monospace">plan-section-depends-on</text>
    <text x="58" y="290" font-size="11.5" fill="#8a2b2b" font-family="ui-monospace, monospace">{"s5": ["plan-b#s3",]}</text>
    <text x="58" y="308" font-size="11.5" fill="#8a2b2b" font-family="ui-monospace, monospace">["plan-b#s3"]</text>
    <text x="58" y="324" font-size="10.5" fill="#5b5b66">the same two authored values</text>
    <line x1="260" y1="292" x2="326" y2="292" stroke="#2f6b36" stroke-width="2" marker-end="url(#green)"/>
    <rect x="332" y="258" width="168" height="68" rx="8" fill="#ffffff" stroke="#b4d0b6"/>
    <text x="416" y="278" text-anchor="middle" font-size="11.5" fill="#33333a" font-family="ui-monospace, monospace">mapping carries one</text>
    <text x="416" y="295" text-anchor="middle" font-size="11.5" fill="#2f6b36" font-family="ui-monospace, monospace">entry: &lt;plan-section-</text>
    <text x="416" y="312" text-anchor="middle" font-size="11.5" fill="#2f6b36" font-family="ui-monospace, monospace">depends-on&gt; — no section</text>
    <line x1="504" y1="292" x2="570" y2="292" stroke="#2f6b36" stroke-width="2" marker-end="url(#green)"/>
    <rect x="576" y="250" width="284" height="90" rx="8" fill="#ffffff" stroke="#b4d0b6"/>
    <text x="590" y="270" font-size="11.5" fill="#2f6b36" font-family="ui-monospace, monospace">invalid-section-dependency</text>
    <text x="590" y="288" font-size="11.5" fill="#33333a">message names the meta and the malformation</text>
    <text x="590" y="306" font-size="11.5" fill="#33333a">roadmap wiring findings report it; edge builders</text>
    <text x="590" y="324" font-size="11.5" fill="#33333a">skip the key, so no phantom section is invented</text>
  </g>
  <text x="450" y="398" text-anchor="middle" font-size="11.5" fill="#5b5b66">a value that declares nothing — no meta, or an empty one — still reads as no declaration in both</text>
</svg>