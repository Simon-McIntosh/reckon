<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" role="img" aria-labelledby="title desc">
<title id="title">One execution/closure split, three readers agreeing</title>
<desc id="desc">A plan-terminal gate and a decision-lockable gate both leave the execution blocker set through execution_gates, so the roadmap ready set, the served payload and the MCP blocking projection all report the plan as ready with no gate blocker, while the closure and the gated decision stay reported beside them. An open decision with no transition edge still blocks, which is the boundary the split must not cross.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#245878"/></marker>
<marker id="arrow-held" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#8a5a00"/></marker>
</defs>
<g font-family="sans-serif" font-size="16" fill="#172d3d">
<text x="20" y="30" font-size="19" font-weight="bold">A transition gate holds closure or a choice — never execution</text>

<g>
<rect x="20" y="56" width="250" height="58" rx="6" fill="#f4f8fb" stroke="#245878"/>
<text x="145" y="80" text-anchor="middle" font-weight="bold">plan-terminal gate</text>
<text x="145" y="101" text-anchor="middle" font-size="14">closure pending</text>
</g>
<g>
<rect x="20" y="128" width="250" height="58" rx="6" fill="#f4f8fb" stroke="#245878"/>
<text x="145" y="152" text-anchor="middle" font-weight="bold">decision-lockable gate</text>
<text x="145" y="173" text-anchor="middle" font-size="14">holds one choice</text>
</g>
<g>
<rect x="330" y="88" width="250" height="100" rx="6" fill="#e7f1f8" stroke="#245878" stroke-width="2"/>
<text x="455" y="118" text-anchor="middle" font-weight="bold">execution_gates(plan)</text>
<text x="455" y="144" text-anchor="middle" font-size="14">transition gates leave</text>
<text x="455" y="164" text-anchor="middle" font-size="14">the blocker set</text>
</g>
<path d="M270 85 C 300 85, 300 118, 330 118" fill="none" stroke="#245878" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M270 157 C 300 157, 300 158, 330 158" fill="none" stroke="#245878" stroke-width="2" marker-end="url(#arrow)"/>

<g>
<rect x="640" y="56" width="240" height="58" rx="6" fill="#f4f8fb" stroke="#245878"/>
<text x="760" y="80" text-anchor="middle" font-weight="bold">roadmap ready_now</text>
<text x="760" y="101" text-anchor="middle" font-size="14">closure held beside it</text>
</g>
<g>
<rect x="640" y="128" width="240" height="58" rx="6" fill="#f4f8fb" stroke="#245878"/>
<text x="760" y="152" text-anchor="middle" font-weight="bold">served payload</text>
<text x="760" y="173" text-anchor="middle" font-size="14">blocking empty</text>
</g>
<g>
<rect x="640" y="200" width="240" height="58" rx="6" fill="#f4f8fb" stroke="#245878"/>
<text x="760" y="224" text-anchor="middle" font-weight="bold">MCP blocking</text>
<text x="760" y="245" text-anchor="middle" font-size="14">blocking empty</text>
</g>
<path d="M580 120 C 610 120, 610 85, 640 85" fill="none" stroke="#245878" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580 138 H 640" fill="none" stroke="#245878" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580 156 C 610 156, 610 229, 640 229" fill="none" stroke="#245878" stroke-width="2" marker-end="url(#arrow)"/>

<g>
<rect x="20" y="286" width="250" height="58" rx="6" fill="#fdf6e8" stroke="#8a5a00"/>
<text x="145" y="310" text-anchor="middle" font-weight="bold">open decision</text>
<text x="145" y="331" text-anchor="middle" font-size="14">no transition edge</text>
</g>
<g>
<rect x="330" y="286" width="250" height="58" rx="6" fill="#fdf6e8" stroke="#8a5a00"/>
<text x="455" y="310" text-anchor="middle" font-weight="bold">open decisions (strict)</text>
<text x="455" y="331" text-anchor="middle" font-size="14">still withhold readiness</text>
</g>
<g>
<rect x="640" y="286" width="240" height="58" rx="6" fill="#fdf6e8" stroke="#8a5a00"/>
<text x="760" y="310" text-anchor="middle" font-weight="bold">plan stays blocked</text>
<text x="760" y="331" text-anchor="middle" font-size="14">scope control</text>
</g>
<path d="M270 315 H 330" fill="none" stroke="#8a5a00" stroke-width="2" marker-end="url(#arrow-held)"/>
<path d="M580 315 H 640" fill="none" stroke="#8a5a00" stroke-width="2" marker-end="url(#arrow-held)"/>
<text x="20" y="378" font-size="14">Reproduced at base: the served payload carried the closure gate as a blocker,</text>
<text x="20" y="398" font-size="14">and the decision-held plan was absent from the ready set.</text>
</g>
</svg>