<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
<title id="title">Execution proceeds while closure awaits a verdict</title>
<desc id="desc">An open transition gate allows execution. A terminal write is refused until an explicit passed or failed verdict is recorded. A decision gate then permits a human choice without selecting it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#245878"/></marker></defs>
<g font-family="sans-serif" font-size="17" fill="#172d3d">
<text x="25" y="32" font-weight="bold">Execution remains ready</text>
<path d="M25 75 H855" stroke="#245878" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="105">implement</text><text x="315" y="105">verify</text><text x="700" y="105">continue work</text>
<text x="25" y="155" font-weight="bold">Transition waits for an outcome</text>
<rect x="25" y="177" width="200" height="64" rx="4" fill="#f9f2df" stroke="#9b7825"/>
<text x="45" y="204">No verdict</text><text x="45" y="226">terminal write refused</text>
<path d="M232 209 H325" stroke="#245878" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="335" y="177" width="230" height="64" rx="4" fill="#eef6fa" stroke="#245878"/>
<text x="355" y="204">Record foreign outcome</text><text x="355" y="226">passed or failed</text>
<path d="M575 209 H660" stroke="#245878" stroke-width="2" marker-end="url(#arrow)"/>
<text x="675" y="195">Terminal write permitted</text><text x="675" y="223">Decision may be chosen</text><text x="675" y="249" font-size="14">Other closure checks still apply</text>
</g></svg>
