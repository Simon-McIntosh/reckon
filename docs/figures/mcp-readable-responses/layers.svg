<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Progressive MCP response layers</title>
  <desc id="desc">A small default summary expands into detail and raw schema layers only when requested.</desc>
  <g font-family="system-ui" fill="#111827">
    <rect x="45" y="38" width="810" height="76" rx="6" fill="#f8fafc" stroke="#2563eb"/>
    <text x="68" y="69" font-size="17" font-weight="700">Default · summary</text>
    <text x="68" y="96" font-size="14">title · current state · blockers/open decisions · next action · version</text>
    <rect x="115" y="134" width="670" height="64" rx="6" fill="#fff" stroke="#334155"/>
    <text x="138" y="162" font-size="16" font-weight="700">detail</text>
    <text x="238" y="162" font-size="14">current sections · requirements · unresolved followups</text>
    <text x="138" y="185" font-size="13" fill="#475569">requested explicitly</text>
    <rect x="185" y="218" width="530" height="50" rx="6" fill="#fff" stroke="#64748b"/>
    <text x="208" y="249" font-size="15" font-weight="700">raw · schema · history</text>
    <text x="430" y="249" font-size="13" fill="#475569">lossless diagnostic views</text>
  </g>
</svg>
