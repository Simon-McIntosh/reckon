<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="1020" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1a1a1a">Where a cited gate log lives, and where the copy lives</text>
  <text x="20" y="48" font-size="12" fill="#555">Promotion copies the cited log into the run directory before the ledger row is built, so the row cites a path that outlives the worktree and the reaper.</text>

  <!-- Left: the transient citation -->
  <rect x="20" y="70" width="270" height="180" rx="8" fill="#f6f6f6" stroke="#c9c9c9"/>
  <text x="36" y="92" font-weight="700" fill="#1a1a1a">The worker's gate log</text>
  <rect x="36" y="104" width="238" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="48" y="124" font-family="ui-monospace, monospace" font-size="12" fill="#333">/tmp/gate.log</text>
  <text x="48" y="144" font-size="11" fill="#a33">reaped — gone within hours</text>
  <rect x="36" y="166" width="238" height="52" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="48" y="186" font-family="ui-monospace, monospace" font-size="12" fill="#333">&lt;worktree&gt;/output/gate.log</text>
  <text x="48" y="206" font-size="11" fill="#a33">released with the worktree</text>
  <text x="36" y="238" font-size="11" fill="#555">cited by <tspan font-family="ui-monospace, monospace">--gate-log-path</tspan>; <tspan font-weight="700">not</tspan> copied before this change</text>

  <!-- Arrow: citation into promotion -->
  <line x1="292" y1="160" x2="372" y2="160" stroke="#666" stroke-width="1.5"/>
  <polygon points="372,160 362,155 362,165" fill="#666"/>
  <text x="300" y="150" font-size="11" fill="#555">the row cites</text>
  <text x="300" y="178" font-size="11" fill="#555">this path</text>

  <!-- Middle: promotion -->
  <rect x="376" y="70" width="230" height="180" rx="8" fill="#eef4fb" stroke="#8aa9cc"/>
  <text x="392" y="92" font-weight="700" fill="#1a1a1a">promotion (complete)</text>
  <text x="392" y="116" font-size="12" fill="#333">1. resolve the cited path</text>
  <text x="392" y="138" font-size="12" fill="#333">2. copy into the run directory</text>
  <text x="392" y="160" font-size="12" fill="#333">3. hand the row the copy's path</text>
  <text x="392" y="190" font-size="11" fill="#555">already inside the run directory?</text>
  <text x="392" y="206" font-size="11" fill="#2a6">→ carried through, no second copy</text>
  <text x="392" y="232" font-size="11" fill="#555">best-effort and verdict-neutral: the copy</text>
  <text x="392" y="246" font-size="11" fill="#555">reads no verdict and refuses nothing</text>

  <!-- Arrow: copy to run dir -->
  <line x1="608" y1="160" x2="688" y2="160" stroke="#666" stroke-width="1.5"/>
  <polygon points="688,160 678,155 678,165" fill="#666"/>
  <text x="616" y="150" font-size="11" fill="#555">copy + record</text>

  <!-- Right: run directory, durable -->
  <rect x="692" y="70" width="308" height="180" rx="8" fill="#eefaf1" stroke="#7dbb92"/>
  <text x="708" y="92" font-weight="700" fill="#1a1a1a">the run directory (durable)</text>
  <text x="708" y="112" font-family="ui-monospace, monospace" font-size="11" fill="#333">~/.config/reckon/crew/runs/&lt;run_id&gt;/</text>
  <rect x="708" y="120" width="196" height="40" rx="6" fill="#ffffff" stroke="#7dbb92"/>
  <text x="720" y="138" font-family="ui-monospace, monospace" font-size="12" fill="#333">gate.log</text>
  <text x="720" y="153" font-size="11" fill="#2a6">the copy, byte-identical</text>
  <text x="708" y="180" font-size="11" fill="#356">outlives the worktree; pruned only by</text>
  <text x="708" y="196" font-size="11" fill="#356"><tspan font-family="ui-monospace, monospace">crew gc</tspan> on a retention window</text>
  <rect x="708" y="208" width="276" height="34" rx="6" fill="#ffffff" stroke="#7dbb92"/>
  <text x="716" y="229" font-size="11" fill="#333">ledger row: <tspan font-family="ui-monospace, monospace">gate_check.log_path = &lt;run&gt;/gate.log</tspan></text>

  <!-- Lifecycle bar: relative lifetimes -->
  <text x="20" y="288" font-weight="700" fill="#1a1a1a">Relative lifetimes, which is the whole point of the copy</text>
  <line x1="20" y1="330" x2="1000" y2="330" stroke="#bbb"/>
  <rect x="24" y="302" width="150" height="20" rx="4" fill="#f0d6d6" stroke="#c98d8d"/>
  <text x="32" y="317" font-size="11" fill="#7a2b2b">cited original: /tmp</text>
  <rect x="24" y="340" width="300" height="20" rx="4" fill="#f3e3cd" stroke="#c9a86a"/>
  <text x="32" y="355" font-size="11" fill="#6b4a12">cited original: worktree output/</text>
  <rect x="24" y="378" width="976" height="20" rx="4" fill="#d9efe0" stroke="#7dbb92"/>
  <text x="32" y="393" font-size="11" fill="#20543a">run directory + roster/ledger: until crew gc — the row's citation outlives both originals</text>

  <!-- Best-effort lane -->
  <rect x="20" y="412" width="980" height="46" rx="8" fill="#fdf7ee" stroke="#d9bd8f"/>
  <text x="34" y="432" font-weight="700" fill="#7a4a12">Left exactly as given, never refused:</text>
  <text x="34" y="450" font-size="12" fill="#6b4a12">a citation that does not resolve on this machine, and a copy that cannot be written, both hand the check on unchanged. Preservation reads no verdict and changes no exit status.</text>
</svg>