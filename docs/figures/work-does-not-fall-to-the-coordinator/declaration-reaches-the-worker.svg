<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="980" height="540" fill="#fbfbfc"/>

  <text x="24" y="30" font-size="16" font-weight="600" fill="#1b1f24">
    The prompt carries the declaration it demands be repeated
  </text>
  <text x="24" y="50" fill="#5a6472">
    Promotion matches the node's declared mutation against the delivered red log's own text. The prompt stated the requirement and never the string.
  </text>

  <!-- Before panel -->
  <rect x="24" y="70" width="444" height="272" rx="8" fill="#fff5f5" stroke="#f0c2c2"/>
  <text x="40" y="94" font-weight="600" fill="#8c2c2c">Before — the requirement, without the string</text>

  <rect x="40" y="106" width="412" height="150" rx="5" fill="#ffffff" stroke="#e6b8b8"/>
  <text x="52" y="128" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">MANIFEST (write exactly these keys; ...)</text>
  <text x="52" y="148" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">  negative_control_log: &lt;the path alone, ...&gt;</text>
  <text x="68" y="166" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">The log's first line repeats the declared</text>
  <text x="68" y="182" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">mutation verbatim, so a log that failed</text>
  <text x="68" y="198" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">for any other reason is refused</text>
  <text x="52" y="228" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a94a3">the declaration: interpolated nowhere</text>
  <text x="52" y="246" font-family="ui-monospace, monospace" font-size="11.5" fill="#8a94a3">prompt.txt grep for it: zero</text>

  <text x="40" y="280" fill="#5a6472">The worker has never seen the string it is required to write.</text>

  <rect x="40" y="292" width="412" height="34" rx="5" fill="#ffffff" stroke="#e6b8b8"/>
  <text x="52" y="314" fill="#1b1f24">writes an honest paraphrase, naming file and symbol</text>

  <text x="40" y="336" font-weight="600" fill="#c0392b">REFUSED — the log does not name the declaration; only the coordinator can answer.</text>

  <!-- After panel -->
  <rect x="512" y="70" width="444" height="272" rx="8" fill="#f4fbf6" stroke="#bfe3cb"/>
  <text x="528" y="94" font-weight="600" fill="#1e6b3f">After — the declaration, copyable</text>

  <rect x="528" y="106" width="412" height="150" rx="5" fill="#ffffff" stroke="#c6e3d0"/>
  <text x="540" y="128" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">CONTRACT — THE NEGATIVE CONTROL THIS NODE DECLARES</text>
  <text x="540" y="148" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">  ... your red log's first line must repeat,</text>
  <text x="540" y="164" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">  verbatim ...</text>
  <text x="540" y="184" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">  Declared string:</text>
  <text x="552" y="202" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">  remove the interpolation so ...</text>
  <text x="540" y="226" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">MANIFEST (write exactly these keys; ...)</text>
  <text x="540" y="246" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">  negative_control_log: &lt;the path alone, ...&gt;</text>

  <text x="528" y="280" fill="#5a6472">The block sits beside the requirement it answers; the string is copied, not invented.</text>

  <rect x="528" y="292" width="412" height="34" rx="5" fill="#ffffff" stroke="#c6e3d0"/>
  <text x="540" y="314" fill="#1b1f24">the log's first line repeats the declaration verbatim</text>

  <text x="528" y="336" font-weight="600" fill="#1e8449">MATCHED — no waiver, resume or edit; the decision stays with the worker.</text>

  <!-- Contract strip -->
  <rect x="24" y="358" width="932" height="158" rx="8" fill="#ffffff" stroke="#d5dae1"/>
  <text x="40" y="382" font-weight="600" fill="#1b1f24">One substitution, and the three shapes the block must keep apart</text>

  <rect x="40" y="396" width="292" height="102" rx="5" fill="#f2f5f9" stroke="#d5dae1"/>
  <text x="52" y="418" font-weight="600" fill="#1b1f24">a declared mutation</text>
  <text x="52" y="440" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">compose_prompt renders the</text>
  <text x="52" y="456" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">declaration as written, never</text>
  <text x="52" y="472" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">reflowed or re-indented</text>
  <text x="52" y="492" font-size="11.5" fill="#8a94a3">quotes and newlines survive</text>

  <rect x="344" y="396" width="292" height="102" rx="5" fill="#f2f5f9" stroke="#d5dae1"/>
  <text x="356" y="418" font-weight="600" fill="#1b1f24">declared <tspan font-family="ui-monospace, monospace">none: &lt;reason&gt;</tspan></text>
  <text x="356" y="440" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">states that no mutation</text>
  <text x="356" y="456" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">applies, so no red log is</text>
  <text x="356" y="472" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">required of the worker</text>
  <text x="356" y="492" font-size="11.5" fill="#8a94a3">the reason is carried; a bare none is refused</text>

  <rect x="648" y="396" width="292" height="102" rx="5" fill="#f2f5f9" stroke="#d5dae1"/>
  <text x="660" y="418" font-weight="600" fill="#1b1f24">no declaration</text>
  <text x="660" y="440" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">the block says plainly that</text>
  <text x="660" y="456" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">none was declared, rather</text>
  <text x="660" y="472" font-family="ui-monospace, monospace" font-size="11.5" fill="#5a6472">than dropping the subject</text>
  <text x="660" y="492" font-size="11.5" fill="#8a94a3">an omission reads as not applicable</text>
</svg>