<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="980" height="470" fill="#fbfbfc"/>

  <text x="24" y="30" font-size="16" font-weight="600" fill="#1b1f24">
    The declared-control branch is selected on the predicate promotion applies
  </text>
  <text x="24" y="50" fill="#5a6472">
    Promotion discharges a declared mutation only for a node whose write paths reach a test path; the prompt now
    selects its branch on that same predicate.
  </text>

  <!-- The declaration -->
  <rect x="24" y="76" width="196" height="66" rx="8" fill="#ffffff" stroke="#cfd6df"/>
  <text x="36" y="100" font-weight="600" fill="#1b1f24">node.negative_control</text>
  <text x="36" y="120" fill="#5a6472">the node's declaration,</text>
  <text x="36" y="136" fill="#5a6472">rendered as written</text>

  <!-- First fork: declaration shape -->
  <line x1="220" y1="109" x2="268" y2="109" stroke="#8a94a3"/>
  <text x="228" y="104" font-size="11" fill="#8a94a3">shape</text>

  <!-- empty -->
  <rect x="268" y="76" width="196" height="34" rx="5" fill="#ffffff" stroke="#cfd6df"/>
  <text x="280" y="98" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">empty</text>
  <line x1="464" y1="93" x2="512" y2="93" stroke="#8a94a3"/>
  <rect x="512" y="76" width="444" height="34" rx="5" fill="#eef4ff" stroke="#bcd0f0"/>
  <text x="524" y="98" fill="#26456f">undeclared branch — told none was declared (unchanged)</text>

  <!-- none -->
  <rect x="268" y="122" width="196" height="34" rx="5" fill="#ffffff" stroke="#cfd6df"/>
  <text x="280" y="144" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">none: &lt;reason&gt;</text>
  <line x1="464" y1="139" x2="512" y2="139" stroke="#8a94a3"/>
  <rect x="512" y="122" width="444" height="34" rx="5" fill="#eef4ff" stroke="#bcd0f0"/>
  <text x="524" y="144" fill="#26456f">none branch — no mutation applies, no log required (unchanged)</text>

  <!-- mutation -->
  <rect x="268" y="168" width="196" height="34" rx="5" fill="#ffffff" stroke="#cfd6df"/>
  <text x="280" y="190" font-family="ui-monospace, monospace" font-size="11.5" fill="#1b1f24">a mutation string</text>
  <line x1="464" y1="185" x2="512" y2="185" stroke="#8a94a3"/>

  <!-- predicate -->
  <rect x="512" y="164" width="444" height="42" rx="5" fill="#fff8e6" stroke="#e8cf8a"/>
  <text x="524" y="181" fill="#7a5a12" font-weight="600">the predicate promotion applies</text>
  <text x="524" y="199" font-family="ui-monospace, monospace" font-size="11.5" fill="#7a5a12">any(is_test_path(p) for p in node.write_paths)</text>

  <!-- predicate outcomes -->
  <line x1="640" y1="206" x2="640" y2="240" stroke="#8a94a3"/>
  <text x="648" y="228" font-size="11" fill="#2f7d4f">yes</text>
  <rect x="512" y="240" width="444" height="56" rx="5" fill="#eefaf1" stroke="#b9e0c8"/>
  <text x="524" y="262" fill="#1f5c3a" font-weight="600">declared rule — the check-writing node</text>
  <text x="524" y="282" fill="#1f5c3a">states it writes a check and asks for the red log's path</text>

  <line x1="700" y1="206" x2="700" y2="320" stroke="#8a94a3"/>
  <text x="708" y="300" font-size="11" fill="#8c2c2c">no</text>
  <rect x="512" y="320" width="444" height="56" rx="5" fill="#fff5f5" stroke="#f0c2c2"/>
  <text x="524" y="342" fill="#8c2c2c" font-weight="600">declared-no-check rule — the repaired shape</text>
  <text x="524" y="362" fill="#8c2c2c">states the declaration is recorded; no log is required</text>

  <!-- Footnote strip -->
  <rect x="24" y="404" width="932" height="46" rx="6" fill="#ffffff" stroke="#e2e6ec"/>
  <text x="36" y="423" fill="#5a6472">Before: the branch was chosen on the declaration form alone, so a declared mutation on a node whose write</text>
  <text x="36" y="441" fill="#5a6472">paths reach no test path was still told it writes a check — a property promotion exempts with node-writes-no-test-path.</text>
</svg>