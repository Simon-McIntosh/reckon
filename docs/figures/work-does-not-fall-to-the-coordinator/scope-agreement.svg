<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .box  { fill: #f7f8fa; stroke: #b9c0cc; stroke-width: 1.2; rx: 6; }
    .node { fill: #ffffff; stroke: #8d96a6; stroke-width: 1.2; rx: 5; }
    .bad  { fill: #fdecec; stroke: #c0392b; stroke-width: 1.4; rx: 5; }
    .good { fill: #ecf7ee; stroke: #1e8449; stroke-width: 1.4; rx: 5; }
    .lbl  { fill: #2b3140; }
    .mut  { fill: #6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
    .hd   { font-weight: 600; }
  </style>

  <text x="24" y="32" class="lbl hd" font-size="16">One declared write scope, two tests, and where they disagreed</text>
  <text x="24" y="52" class="mut">A dispatch granted a directory; a worker changed a file beneath it.</text>

  <!-- The declared scope -->
  <rect class="box" x="24" y="72" width="892" height="96"/>
  <text x="40" y="94" class="lbl hd">Declared write paths (node.write_paths)</text>
  <rect class="node" x="40" y="104" width="400" height="24"/>
  <text x="50" y="120" class="mono lbl">docs/figures/work-does-not-fall-to-the-coordinator</text>
  <text x="450" y="121" class="mut">a directory, not a file</text>
  <rect class="node" x="40" y="134" width="400" height="24"/>
  <text x="50" y="150" class="mono lbl">reckon/crew/reports.py</text>
  <text x="450" y="151" class="mut">a file</text>

  <!-- The changed path -->
  <rect class="node" x="40" y="196" width="860" height="30"/>
  <text x="50" y="215" class="mono lbl">changed: docs/figures/work-does-not-fall-to-the-coordinator/scope-agreement.svg</text>

  <!-- BEFORE -->
  <text x="24" y="264" class="lbl hd" font-size="14">Before — exact membership vs root containment</text>

  <rect class="bad" x="40" y="280" width="410" height="86"/>
  <text x="56" y="302" class="lbl hd">write-time audit · reports.audit_manifest</text>
  <text x="56" y="322" class="mono mut">path not in set(node.write_paths)</text>
  <text x="56" y="348" class="mono" fill="#c0392b">stray — the worker is refused</text>

  <rect class="good" x="474" y="280" width="426" height="86"/>
  <text x="490" y="302" class="lbl hd">promotion · _outside_declared_scope</text>
  <text x="490" y="322" class="mono mut">path == root or path.is_relative_to(root)</text>
  <text x="490" y="348" class="mono" fill="#1e8449">in scope — nothing outside</text>

  <line x1="450" y1="323" x2="474" y2="323" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="24" y="392" class="mut">The two read the same declaration differently. The early refusal sends a worker to repair a manifest promotion would have accepted,</text>
  <text x="24" y="408" class="mut">so the check moved earlier carried a stricter contract than the one it was moved from.</text>

  <!-- AFTER -->
  <text x="24" y="452" class="lbl hd" font-size="14">After — one containment rule at both surfaces</text>

  <rect class="box" x="230" y="466" width="480" height="46"/>
  <text x="248" y="487" class="mono lbl">target == root   or   root in target.parents</text>
  <text x="248" y="504" class="mut">a file declaration and a directory declaration both honoured</text>

  <line x1="360" y1="512" x2="330" y2="546" stroke="#8d96a6" stroke-width="1.2"/>
  <line x1="580" y1="512" x2="610" y2="546" stroke="#8d96a6" stroke-width="1.2"/>

  <rect class="good" x="180" y="546" width="300" height="34"/>
  <text x="200" y="568" class="lbl">write-time audit: accepted</text>
  <rect class="good" x="510" y="546" width="320" height="34"/>
  <text x="530" y="568" class="lbl">promotion: accepted</text>

  <text x="24" y="606" class="mut">Falsified by restoring exact membership: 4 failed, 6 passed — the directory cases and the <tspan class="mono">tests/</tspan> prefix case go red,</text>
  <text x="24" y="620" class="mut">the file-vs-file and out-of-scope cases stay green.</text>
</svg>