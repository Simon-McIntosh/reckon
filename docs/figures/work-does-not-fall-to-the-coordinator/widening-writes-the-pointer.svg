<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" font-family="sans-serif" font-size="13">
  <rect width="980" height="570" fill="#fbfbfc"/>
  <text x="24" y="30" font-size="16" font-weight="600" fill="#1b1f24">The widening command writes the pointer promotion reads</text>
  <text x="24" y="50" fill="#5a6472">One blocked run, one command, one field that moves: node.write_paths. Every other field is carried through.</text>

  <rect x="24" y="74" width="276" height="230" rx="8" fill="#fff5f5" stroke="#f0c2c2"/>
  <text x="40" y="98" font-weight="600" fill="#8c2c2c">Before - blocked, fence too narrow</text>
  <text x="40" y="124" fill="#8a94a3">phase</text>
  <text x="40" y="142" font-family="monospace" fill="#1b1f24">blocked</text>
  <text x="40" y="168" fill="#8a94a3">session_id</text>
  <text x="40" y="186" font-family="monospace" fill="#1b1f24">s19-codex-20260916</text>
  <text x="40" y="212" fill="#8a94a3">commits</text>
  <text x="40" y="230" font-family="monospace" fill="#1b1f24">1a2b3c4d5e6f</text>
  <text x="40" y="256" fill="#8a94a3">node.write_paths</text>
  <rect x="40" y="266" width="244" height="28" rx="5" fill="#ffffff" stroke="#e6b8b8"/>
  <text x="52" y="285" font-family="monospace" fill="#1b1f24">reckon/crew/runs.py</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#5a6472"/>
    </marker>
  </defs>
  <path d="M312,180 H456" fill="none" stroke="#5a6472" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="300" y="158" font-weight="600" fill="#1b1f24">crew widen</text>
  <text x="300" y="206" fill="#5a6472">--write-path</text>
  <text x="300" y="222" font-family="monospace" fill="#5a6472">reckon/crew/node.py</text>
  <rect x="470" y="74" width="286" height="230" rx="8" fill="#f4fbf6" stroke="#bfe3cb"/>
  <text x="486" y="98" font-weight="600" fill="#1e6b3f">After - blocked, fence widened</text>
  <text x="486" y="124" fill="#8a94a3">phase</text>
  <text x="486" y="142" font-family="monospace" fill="#1b1f24">blocked</text>
  <text x="740" y="142" text-anchor="end" fill="#8a94a3">unchanged</text>
  <text x="486" y="168" fill="#8a94a3">session_id</text>
  <text x="486" y="186" font-family="monospace" fill="#1b1f24">s19-codex-20260916</text>
  <text x="740" y="186" text-anchor="end" fill="#8a94a3">unchanged</text>
  <text x="486" y="212" fill="#8a94a3">commits</text>
  <text x="486" y="230" font-family="monospace" fill="#1b1f24">1a2b3c4d5e6f</text>
  <text x="740" y="230" text-anchor="end" fill="#8a94a3">unchanged</text>
  <text x="486" y="256" fill="#8a94a3">node.write_paths</text>
  <text x="486" y="285" font-family="monospace" fill="#5a6472">reckon/crew/runs.py,</text>
  <text x="486" y="301" font-family="monospace" fill="#1e6b3f">reckon/crew/node.py</text>
  <rect x="24" y="326" width="706" height="120" rx="8" fill="#ffffff" stroke="#d5dae1"/>
  <text x="40" y="350" font-weight="600" fill="#1b1f24">A run that is not blocked is refused before anything is written</text>
  <rect x="40" y="362" width="230" height="70" rx="6" fill="#f7f8fa" stroke="#d5dae1"/>
  <text x="52" y="384" fill="#8a94a3">phase</text>
  <text x="52" y="404" font-family="monospace" fill="#1b1f24">working</text>
  <text x="52" y="424" fill="#8a94a3">already writing against it</text>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#c0392b"/>
    </marker>
  </defs>
  <path d="M276,397 H356" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="278" y="384" fill="#8a94a3">crew widen</text>
  <rect x="364" y="362" width="350" height="70" rx="6" fill="#fff5f5" stroke="#f0c2c2"/>
  <text x="376" y="384" fill="#8c2c2c">exit status</text>
  <text x="376" y="406" font-family="monospace" font-weight="600" fill="#c0392b">1</text>
  <text x="376" y="424" fill="#8c2c2c">pointer bytes identical to before</text>

  <rect x="746" y="326" width="210" height="120" rx="8" fill="#ffffff" stroke="#d5dae1"/>
  <text x="762" y="350" font-family="sans-serif" font-weight="600" fill="#1b1f24">Falsified</text>
  <text x="762" y="378" fill="#5a6472">green</text>
  <text x="850" y="378" font-weight="600" fill="#1e8449">6 passed</text>
  <text x="762" y="402" fill="#5a6472">guard removed</text>
  <text x="762" y="424" font-weight="600" fill="#c0392b">1 failed, 5 passed</text>

  <rect x="24" y="462" width="932" height="80" rx="8" fill="#ffffff" stroke="#d5dae1"/>
  <text x="40" y="486" font-family="sans-serif" font-weight="600" fill="#1b1f24">What the mutation uncovers is the boundary, not the plumbing</text>
  <text x="40" y="508" fill="#5a6472">Under it the working run's pointer is rewritten in place: write_paths widens and the command exits 0, so</text>
  <text x="40" y="528" fill="#5a6472">a live process's fence moves while its operator reads a success. The blocked phase is the whole guard.</text>
</svg>