<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="system-ui, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="600" fill="#1a1a1a">Which command verify-gate runs</text>
  <text x="24" y="58" font-size="13" fill="#555">Selection at the read of the run&#8217;s stored gate command; the report records the command executed and its source.</text>

  <!-- entry -->
  <rect x="24" y="86" width="212" height="58" rx="8" fill="#f4f6f8" stroke="#9aa4ae"/>
  <text x="130" y="110" font-size="13" text-anchor="middle" fill="#333">verify-gate called on run R,</text>
  <text x="130" y="128" font-size="13" text-anchor="middle" fill="#333">with optional --command C</text>

  <!-- decision 1 -->
  <polygon points="360,80 470,115 360,150 250,115" fill="#eef3fb" stroke="#3b6fb6"/>
  <text x="360" y="112" font-size="13" text-anchor="middle" fill="#1f3f6b">C supplied</text>
  <text x="360" y="128" font-size="13" text-anchor="middle" fill="#1f3f6b">and non-empty ?</text>
  <line x1="236" y1="115" x2="250" y2="115" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="243" y="107" font-size="11" fill="#555">yes</text>

  <!-- option result -->
  <rect x="530" y="82" width="180" height="66" rx="8" fill="#eaf6ec" stroke="#3d8b4a"/>
  <text x="620" y="106" font-size="13" text-anchor="middle" fill="#1d4d26">run C</text>
  <text x="620" y="126" font-size="12" text-anchor="middle" fill="#1d4d26">gate_command_source = option</text>
  <line x1="470" y1="115" x2="530" y2="115" stroke="#9aa4ae" stroke-width="1.5"/>

  <!-- no branch -->
  <line x1="360" y1="150" x2="360" y2="205" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="368" y="180" font-size="11" fill="#555">no</text>

  <!-- decision 2 -->
  <polygon points="360,205 470,240 360,275 250,240" fill="#eef3fb" stroke="#3b6fb6"/>
  <text x="360" y="237" font-size="13" text-anchor="middle" fill="#1f3f6b">R.gate_check.command</text>
  <text x="360" y="253" font-size="13" text-anchor="middle" fill="#1f3f6b">non-empty ?</text>

  <rect x="530" y="207" width="180" height="66" rx="8" fill="#f4f6f8" stroke="#9aa4ae"/>
  <text x="620" y="231" font-size="13" text-anchor="middle" fill="#333">run the stored command</text>
  <text x="620" y="251" font-size="12" text-anchor="middle" fill="#333">gate_command_source = stored</text>
  <line x1="470" y1="240" x2="530" y2="240" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="478" y="233" font-size="11" fill="#555">yes</text>

  <line x1="360" y1="275" x2="360" y2="330" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="368" y="305" font-size="11" fill="#555">no</text>

  <rect x="250" y="330" width="220" height="66" rx="8" fill="#fbf1ef" stroke="#b6573b"/>
  <text x="360" y="354" font-size="13" text-anchor="middle" fill="#7a3320">not-run, reason</text>
  <text x="360" y="374" font-size="12" text-anchor="middle" fill="#7a3320">&#8220;no gate command is stored to re-run&#8221;</text>

  <!-- case table -->
  <text x="24" y="440" font-size="14" font-weight="600" fill="#1a1a1a">Cases the option introduces</text>
  <text x="24" y="464" font-size="12.5" fill="#333">1. --command given &#8594; C runs, stored command does not, source = option</text>
  <text x="24" y="484" font-size="12.5" fill="#333">2. --command absent &#8594; stored command runs, source = stored (unchanged behaviour)</text>
  <text x="24" y="504" font-size="12.5" fill="#333">3. recorded row names the command that executed, not the stored one, when they differ</text>
  <text x="620" y="464" font-size="12.5" fill="#333">4. --command on a run with no stored gate &#8594; accepted, not refused</text>
</svg>