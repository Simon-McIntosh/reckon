<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#111827">The served loader's source priority</text>
  <text x="24" y="54" fill="#4b5563">One fetch is made. The aggregate is read only when the source before it cannot answer.</text>

  <!-- Page load -->
  <rect x="24" y="84" width="150" height="46" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="99" y="112" text-anchor="middle" fill="#312e81" font-weight="600">page load</text>

  <!-- Discovery -->
  <rect x="240" y="76" width="250" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="365" y="102" text-anchor="middle" fill="#065f46" font-weight="700">1. GET /_discover/&lt;project&gt;</text>
  <text x="365" y="122" text-anchor="middle" fill="#065f46">inventory, sprints, milestones, timeline,</text>
  <text x="365" y="136" text-anchor="middle" fill="#065f46">blockers, active sprint, north stars, versions</text>

  <!-- answer arrow -->
  <line x1="174" y1="107" x2="238" y2="107" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- answered output -->
  <line x1="490" y1="107" x2="640" y2="107" stroke="#059669" stroke-width="2" marker-end="url(#g)"/>
  <rect x="644" y="80" width="292" height="54" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="790" y="102" text-anchor="middle" fill="#065f46" font-weight="700">window.STATE from discovery alone</text>
  <text x="790" y="121" text-anchor="middle" fill="#065f46">no index.json or projection.json requested</text>
  <text x="565" y="100" text-anchor="middle" fill="#047857" font-size="11">2xx</text>

  <!-- Fallback arrow down -->
  <line x1="365" y1="138" x2="365" y2="196" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
  <text x="376" y="176" fill="#92400e" font-size="11.5">network failure or 404</text>

  <!-- Projection -->
  <rect x="240" y="196" width="250" height="58" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="365" y="220" text-anchor="middle" fill="#92400e" font-weight="700">2. GET state/&lt;project&gt;/projection.json</text>
  <text x="365" y="240" text-anchor="middle" fill="#92400e">the distributed static view</text>

  <line x1="490" y1="225" x2="640" y2="225" stroke="#d97706" stroke-width="2" marker-end="url(#o)"/>
  <rect x="644" y="198" width="292" height="54" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="790" y="220" text-anchor="middle" fill="#92400e" font-weight="700">STATE from projection.json</text>
  <text x="790" y="239" text-anchor="middle" fill="#92400e">static build: no served discovery endpoint</text>
  <text x="565" y="218" text-anchor="middle" fill="#b45309" font-size="11">2xx</text>

  <!-- Fallback down -->
  <line x1="365" y1="254" x2="365" y2="312" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>
  <text x="376" y="288" fill="#991b1b" font-size="11.5">also missing</text>

  <!-- Index -->
  <rect x="240" y="312" width="250" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="365" y="336" text-anchor="middle" fill="#991b1b" font-weight="700">3. GET state/&lt;project&gt;/index.json</text>
  <text x="365" y="356" text-anchor="middle" fill="#991b1b">legacy central index, required</text>

  <line x1="490" y1="341" x2="640" y2="341" stroke="#dc2626" stroke-width="2" marker-end="url(#r)"/>
  <rect x="644" y="314" width="292" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="790" y="336" text-anchor="middle" fill="#991b1b" font-weight="700">STATE from index.json</text>
  <text x="790" y="355" text-anchor="middle" fill="#991b1b">the last resort before a rejected load</text>

  <!-- Server failure -->
  <rect x="240" y="410" width="696" height="52" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="264" y="432" fill="#111827" font-weight="700">HTTP failure other than 404 → raise</text>
  <text x="264" y="451" fill="#374151">a live server refusing its own inventory surfaces even when a projection exists: the aggregate never hides it.</text>

  <!-- Legend -->
  <text x="24" y="500" fill="#4b5563" font-weight="600">Measured</text>
  <text x="24" y="520" fill="#4b5563">discovery answers → 4 passed (f6529a51); negative control restoring the aggregate-first order fails case 1</text>
  <text x="24" y="538" fill="#4b5563">with index.json requested.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>