<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="Thirteen crew timestamp readers funnelling onto parse_utc, with the deviations each keeps">
  <style>
    .caller { fill: #f6f7f9; stroke: #4a5568; stroke-width: 1.2; }
    .hub { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; }
    .dev { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    .fix { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .note { fill: #fefce8; stroke: #a16207; stroke-width: 1.2; }
    .t { font: 12px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1a202c; }
    .h { font: 15px/1.3 ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #1a202c; }
    .s { font: 12px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #1a202c; }
    .g { font: 12px/1.3 ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #4a5568; }
    .e { stroke: #4a5568; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .eb { stroke: #4338ca; stroke-width: 2.4; fill: none; marker-end: url(#b); }
    .dash { stroke: #c2410c; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#c); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#4a5568"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#4338ca"/></marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>

  <text x="24" y="30" class="h">Thirteen readers, one parser — and the three places a reader stays itself</text>

  <text x="30" y="66" class="g">batch A callers (reckon/crew/*.py)</text>
  <rect class="caller" x="30" y="78" width="210" height="24" rx="4"/><text x="40" y="95" class="t">hold._as_moment</text>
  <rect class="caller" x="30" y="106" width="210" height="24" rx="4"/><text x="40" y="123" class="t">lane_document._parse_stamp</text>
  <rect class="caller" x="30" y="134" width="210" height="24" rx="4"/><text x="40" y="151" class="t">lane_evidence._moment</text>
  <rect class="caller" x="30" y="162" width="210" height="24" rx="4"/><text x="40" y="179" class="t">obligations._seconds_since</text>
  <rect class="caller" x="30" y="190" width="210" height="24" rx="4"/><text x="40" y="207" class="t">pace_replay._read</text>
  <rect class="caller" x="30" y="218" width="210" height="24" rx="4"/><text x="40" y="235" class="t">paid_lanes._parse_stamp</text>
  <rect class="caller" x="30" y="246" width="210" height="24" rx="4"/><text x="40" y="263" class="t">runs._stream_quiet_seconds</text>
  <rect class="caller" x="30" y="274" width="210" height="24" rx="4"/><text x="40" y="291" class="t">summary._row_moment</text>
  <rect class="caller" x="30" y="302" width="210" height="24" rx="4"/><text x="40" y="319" class="t">routing._parse_utc_timestamp</text>
  <rect class="caller" x="30" y="330" width="210" height="24" rx="4"/><text x="40" y="347" class="t">resumption._parse_stamp</text>
  <rect class="caller" x="30" y="358" width="210" height="24" rx="4"/><text x="40" y="375" class="t">window_reading._parse_stamp</text>
  <rect class="dev" x="30" y="386" width="210" height="24" rx="4"/><text x="40" y="403" class="t">query._normalize_stamp</text>
  <rect class="dev" x="30" y="414" width="210" height="24" rx="4"/><text x="40" y="431" class="t">rollout._parse_timestamp</text>

  <path class="eb" d="M240,255 C300,255 300,255 372,255"/>
  <text x="250" y="246" class="s">11 normalise</text>

  <rect class="hub" x="372" y="212" width="180" height="86" rx="8"/>
  <text x="462" y="240" class="t" text-anchor="middle">reckon._timestamps</text>
  <text x="462" y="262" class="t" text-anchor="middle">parse_utc(value)</text>
  <text x="462" y="284" class="s" text-anchor="middle">&#8594; aware UTC | None</text>

  <text x="600" y="120" class="g">policy kept around the call</text>
  <rect class="dev" x="600" y="132" width="276" height="58" rx="6"/>
  <text x="610" y="152" class="t">query: zoneless stamp</text>
  <text x="610" y="170" class="t">&#8594; (&quot;unknown&quot;), never UTC</text>
  <path class="dash" d="M600,161 C560,161 500,161 462,212"/>

  <rect class="dev" x="600" y="200" width="276" height="58" rx="6"/>
  <text x="610" y="220" class="t">rollout: a naive stamp</text>
  <text x="610" y="238" class="t">&#8594; returned as written, not UTC</text>
  <path class="dash" d="M600,229 C560,229 500,229 470,212"/>

  <rect class="fix" x="600" y="268" width="276" height="72" rx="6"/>
  <text x="610" y="288" class="t">lane_evidence: base raised</text>
  <text x="610" y="306" class="t">AttributeError on a naive stamp</text>
  <text x="610" y="324" class="t">&#8594; repaired to a UTC instant</text>
  <path class="dash" d="M600,304 C540,304 500,304 462,298"/>

  <rect class="note" x="30" y="470" width="846" height="96" rx="6"/>
  <text x="44" y="496" class="s" font-weight="bold">Shared gate every one of the thirteen keeps: a number is never a moment.</text>
  <text x="44" y="518" class="t">parse_utc accepts an epoch (int/float); every caller rejects numeric input instead.</text>
  <text x="44" y="536" class="t">A caller gates emptiness/type first — 0, &quot;&quot;, None, a non-string object &#8594; None / 0 / unmeasured.</text>
  <text x="44" y="554" class="t">query and rollout read a stated zone from the trailing offset designator, so a space separator reads as &quot;T&quot; does.</text>
</svg>