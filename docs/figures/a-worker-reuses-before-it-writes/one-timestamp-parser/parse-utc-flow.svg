<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="parse_utc decision flow">
  <style>
    .box { fill: #f6f7f9; stroke: #4a5568; stroke-width: 1.5; rx: 6; }
    .dec { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .term { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .err { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; }
    .t { font: 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1a202c; }
    .h { font: 14px/1.3 ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #1a202c; }
    .e { stroke: #4a5568; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .lbl { font: 11px/1.2 ui-sans-serif, system-ui, sans-serif; fill: #4a5568; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="20" y="28" class="h">parse_utc(value) &#8594; aware UTC datetime | None</text>

  <rect class="box" x="290" y="48" width="180" height="40" rx="6"/>
  <text x="380" y="73" class="t" text-anchor="middle">value</text>

  <path class="e" d="M380,88 L380,110"/>
  <rect class="dec" x="270" y="110" width="220" height="44" rx="6"/>
  <text x="380" y="137" class="t" text-anchor="middle">None or bool? &#8594; None</text>

  <path class="e" d="M380,154 L380,176"/>
  <rect class="dec" x="250" y="176" width="260" height="44" rx="6"/>
  <text x="380" y="203" class="t" text-anchor="middle">int / float? &#8594; epoch</text>

  <path class="e" d="M380,220 L380,238"/>
  <rect class="dec" x="240" y="238" width="280" height="44" rx="6"/>
  <text x="380" y="265" class="t" text-anchor="middle">abs(v) &#8805; 1e11 ?</text>
  <path class="e" d="M240,260 L110,260 L110,320"/>
  <text x="118" y="252" class="lbl">yes: milliseconds</text>
  <rect class="term" x="40" y="320" width="180" height="52" rx="6"/>
  <text x="130" y="342" class="t" text-anchor="middle">seconds = v / 1000</text>
  <text x="130" y="360" class="t" text-anchor="middle">fromtimestamp(tz=UTC)</text>
  <path class="e" d="M520,260 L650,260 L650,320"/>
  <text x="560" y="252" class="lbl">no: seconds</text>
  <rect class="term" x="560" y="320" width="180" height="52" rx="6"/>
  <text x="650" y="342" class="t" text-anchor="middle">seconds = v</text>
  <text x="650" y="360" class="t" text-anchor="middle">fromtimestamp(tz=UTC)</text>

  <path class="e" d="M380,282 L380,406"/>
  <rect class="dec" x="230" y="406" width="300" height="44" rx="6"/>
  <text x="380" y="433" class="t" text-anchor="middle">str? &#8594; fromisoformat</text>
  <path class="e" d="M230,428 L120,428 L120,470"/>
  <rect class="term" x="30" y="470" width="220" height="60" rx="6"/>
  <text x="140" y="492" class="t" text-anchor="middle">Z / offset &#8594; astimezone(UTC)</text>
  <text x="140" y="512" class="t" text-anchor="middle">naive &#8594; replace(tzinfo=UTC)</text>
  <path class="e" d="M530,428 L640,428 L640,470"/>
  <rect class="term" x="540" y="470" width="200" height="60" rx="6"/>
  <text x="640" y="492" class="t" text-anchor="middle">anything else,</text>
  <text x="640" y="512" class="t" text-anchor="middle">or unparseable &#8594; None</text>
</svg>