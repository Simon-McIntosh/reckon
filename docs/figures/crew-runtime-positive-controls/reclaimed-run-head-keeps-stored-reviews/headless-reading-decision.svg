<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Decision tree for reading a stored review when a run's record resolves no head">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1e1e1e">
    <rect x="350" y="20" width="300" height="50" rx="6" fill="#f5f5f5" stroke="#4a4a4a" stroke-width="1.6"/>
    <text x="500" y="52" font-size="21" text-anchor="middle">no resolvable head</text>

    <line x1="470" y1="70" x2="270" y2="118" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="330" y="98" font-size="18" fill="#5a5a5a">worktree reclaimed</text>

    <line x1="530" y1="70" x2="730" y2="118" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="648" y="98" font-size="18" fill="#5a5a5a">otherwise</text>

    <rect x="30" y="120" width="430" height="80" rx="6" fill="#f5f5f5" stroke="#4a4a4a" stroke-width="1.6"/>
    <text x="245" y="152" font-size="20" text-anchor="middle">no reading: the compose path</text>
    <text x="245" y="180" font-size="20" text-anchor="middle">refuses, naming the missing head</text>

    <rect x="540" y="120" width="430" height="80" rx="6" fill="#e8f0f8" stroke="#3b6ea5" stroke-width="2"/>
    <text x="755" y="152" font-size="20" text-anchor="middle" fill="#1f4468">no worktree named, or no head in its</text>
    <text x="755" y="180" font-size="20" text-anchor="middle" fill="#1f4468">tree: read the store&#8217;s newest record</text>

    <line x1="245" y1="200" x2="360" y2="278" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="755" y1="200" x2="640" y2="278" stroke="#4a4a4a" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="290" y="280" width="420" height="76" rx="6" fill="#f5f5f5" stroke="#4a4a4a" stroke-width="1.6"/>
    <text x="500" y="312" font-size="20" text-anchor="middle">the classifier and the obligations</text>
    <text x="500" y="340" font-size="20" text-anchor="middle">duty reader take the same branch</text>
  </g>
</svg>