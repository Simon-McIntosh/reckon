<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="system-ui, sans-serif" font-size="18">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="19" fill="#111">what each reader selects for one run</text>

  <text x="30" y="75" font-size="17" fill="#555">the run's record</text>
  <text x="390" y="75" font-size="17" fill="#555">classifier</text>
  <text x="700" y="75" font-size="17" fill="#555">sub-floor duty reader</text>
  <text x="1000" y="75" font-size="17" fill="#555">disposition command</text>

  <rect x="20" y="90" width="330" height="110" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="125" font-size="17" fill="#111">reclaimed worktree, head cited</text>
  <text x="35" y="150" font-size="17" fill="#111">by a nine-character id</text>
  <text x="35" y="180" font-size="16" fill="#555">the checkout's HEAD is a later commit</text>

  <rect x="370" y="90" width="310" height="110" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="385" y="125" font-size="17" fill="#111">the record keyed to the run's</text>
  <text x="385" y="150" font-size="17" fill="#111">own full id, read from its record</text>

  <rect x="700" y="90" width="280" height="110" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="715" y="125" font-size="17" fill="#111">one duty row from that record</text>

  <rect x="1000" y="90" width="220" height="110" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="1015" y="125" font-size="17" fill="#111">that record's path</text>

  <line x1="350" y1="145" x2="368" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="680" y1="145" x2="698" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="980" y1="145" x2="998" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="700" y="225" font-size="16" fill="#555">both agree</text>
  <text x="1000" y="225" font-size="16" fill="#555">both agree</text>

  <rect x="20" y="250" width="330" height="130" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="285" font-size="17" fill="#111">reclaimed worktree, the record</text>
  <text x="35" y="310" font-size="17" fill="#111">names no head</text>
  <text x="35" y="345" font-size="16" fill="#555">no revision exists to select by</text>

  <rect x="370" y="250" width="310" height="130" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="385" y="300" font-size="17" fill="#111">no record</text>

  <rect x="700" y="250" width="280" height="130" fill="#f2b8a2" fill-opacity="0.55" stroke="#8a3a1e" stroke-width="2"/>
  <text x="715" y="285" font-size="17" fill="#111">no record, so no duty row</text>
  <text x="715" y="320" font-size="16" fill="#8a3a1e">was: the store's newest record</text>
  <text x="715" y="345" font-size="16" fill="#8a3a1e">the classifier does not accept</text>

  <rect x="1000" y="250" width="220" height="130" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="1015" y="300" font-size="17" fill="#111">refuses: no head</text>
  <text x="1015" y="325" font-size="17" fill="#111">to select by</text>

  <line x1="350" y1="315" x2="368" y2="315" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="680" y1="315" x2="698" y2="315" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="980" y1="315" x2="998" y2="315" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1000" y="405" font-size="16" fill="#555">both agree</text>

  <rect x="20" y="430" width="330" height="130" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="35" y="465" font-size="17" fill="#111">no worktree named, or its tree</text>
  <text x="35" y="490" font-size="17" fill="#111">resolves no head</text>
  <text x="35" y="525" font-size="16" fill="#555">the record is not reclaimed</text>

  <rect x="370" y="430" width="310" height="130" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="385" y="465" font-size="17" fill="#111">reclaimed → refuse; otherwise</text>
  <text x="385" y="490" font-size="17" fill="#111">the store's newest record</text>

  <rect x="700" y="430" width="280" height="130" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="715" y="465" font-size="17" fill="#111">the same reading, taken</text>
  <text x="715" y="490" font-size="17" fill="#111">through the classifier's</text>
  <text x="715" y="515" font-size="17" fill="#111">own helper</text>

  <rect x="1000" y="430" width="220" height="130" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="1015" y="475" font-size="17" fill="#111">the newest</text>
  <text x="1015" y="500" font-size="17" fill="#111">record's path</text>

  <line x1="350" y1="495" x2="368" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="680" y1="495" x2="698" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="980" y1="495" x2="998" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="1000" y="585" font-size="16" fill="#555">both agree</text>
</svg>