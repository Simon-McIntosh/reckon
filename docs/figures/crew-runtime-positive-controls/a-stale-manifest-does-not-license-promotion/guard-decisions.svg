<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="372" viewBox="0 0 1060 372" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <text x="0" y="22" font-size="16" font-weight="bold" fill="#111111">The live-run guard: four shapes, and what each revision does with them</text>
  <text x="0" y="40" font-size="11" fill="#444444">Green = the guard reaches the intended verdict for that shape. Red = it reaches the other one.</text>

  <text x="0" y="76" font-size="11" font-weight="bold" fill="#111111">the shape the run is in</text>
  <text x="480" y="76" font-size="11" font-weight="bold" fill="#111111">base cf729cc7d</text>
  <text x="615" y="76" font-size="11" font-weight="bold" fill="#111111">first landing 94ed8d38d</text>
  <text x="750" y="76" font-size="11" font-weight="bold" fill="#111111">head 4467cf004</text>
  <text x="885" y="76" font-size="11" font-weight="bold" fill="#111111">declared control</text>

  <text x="0" y="103" font-size="11" fill="#111111">1. this attempt's own terminal manifest, written after its launch</text>
  <text x="0" y="118" font-size="10" fill="#666666">intended: promote</text>
  <rect x="476" y="90" width="130" height="34" fill="#d7f0dd"/>
  <text x="541" y="112" font-size="12" text-anchor="middle" fill="#155724">promotes</text>
  <rect x="611" y="90" width="130" height="34" fill="#d7f0dd"/>
  <text x="676" y="112" font-size="12" text-anchor="middle" fill="#155724">promotes</text>
  <rect x="746" y="90" width="130" height="34" fill="#d7f0dd"/>
  <text x="811" y="112" font-size="12" text-anchor="middle" fill="#155724">promotes</text>
  <rect x="881" y="90" width="160" height="34" fill="#f8d7da"/>
  <text x="961" y="112" font-size="12" text-anchor="middle" fill="#7a1c14">refused</text>

  <text x="0" y="163" font-size="11" fill="#111111">2. a terminal manifest written before this attempt was launched</text>
  <text x="0" y="178" font-size="10" fill="#666666">intended: refuse</text>
  <rect x="476" y="150" width="130" height="34" fill="#f8d7da"/>
  <text x="541" y="172" font-size="12" text-anchor="middle" fill="#7a1c14">promotes</text>
  <rect x="611" y="150" width="130" height="34" fill="#d7f0dd"/>
  <text x="676" y="172" font-size="12" text-anchor="middle" fill="#155724">refused</text>
  <rect x="746" y="150" width="130" height="34" fill="#d7f0dd"/>
  <text x="811" y="172" font-size="12" text-anchor="middle" fill="#155724">refused</text>
  <rect x="881" y="150" width="160" height="34" fill="#d7f0dd"/>
  <text x="961" y="172" font-size="12" text-anchor="middle" fill="#155724">refused</text>

  <text x="0" y="223" font-size="11" fill="#111111">3. no manifest for this attempt: a live worker before its first delivery</text>
  <text x="0" y="238" font-size="10" fill="#666666">intended: refuse</text>
  <rect x="476" y="210" width="130" height="34" fill="#f8d7da"/>
  <text x="541" y="232" font-size="12" text-anchor="middle" fill="#7a1c14">promotes</text>
  <rect x="611" y="210" width="130" height="34" fill="#f8d7da"/>
  <text x="676" y="232" font-size="12" text-anchor="middle" fill="#7a1c14">promotes</text>
  <rect x="746" y="210" width="130" height="34" fill="#d7f0dd"/>
  <text x="811" y="232" font-size="12" text-anchor="middle" fill="#155724">refused</text>
  <rect x="881" y="210" width="160" height="34" fill="#f8d7da"/>
  <text x="961" y="232" font-size="12" text-anchor="middle" fill="#7a1c14">promotes</text>

  <text x="0" y="283" font-size="11" fill="#111111">4. a resumed attempt: inherited manifest, baseline set to its own mtime</text>
  <text x="0" y="298" font-size="10" fill="#666666">intended: refuse</text>
  <rect x="476" y="270" width="130" height="34" fill="#f8d7da"/>
  <text x="541" y="292" font-size="12" text-anchor="middle" fill="#7a1c14">promotes</text>
  <rect x="611" y="270" width="130" height="34" fill="#f8d7da"/>
  <text x="676" y="292" font-size="12" text-anchor="middle" fill="#7a1c14">promotes</text>
  <rect x="746" y="270" width="130" height="34" fill="#d7f0dd"/>
  <text x="811" y="292" font-size="12" text-anchor="middle" fill="#155724">refused</text>
  <rect x="881" y="270" width="160" height="34" fill="#f8d7da"/>
  <text x="961" y="292" font-size="12" text-anchor="middle" fill="#7a1c14">promotes</text>

  <text x="0" y="336" font-size="10" fill="#444444">base: manifest present and non-terminal. first landing: + a terminal status that predates the launch is superseded.</text>
  <text x="0" y="352" font-size="10" fill="#444444">head: + no manifest for this attempt. declared control: the terminal-manifest-only admission restored, which loses row 1.</text>
</svg>