<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" font-family="sans-serif">
<title>The two residues a refused landing may not leave, and the repair for each</title>

<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
</marker>
</defs>

<rect x="30" y="40" width="300" height="120" fill="none" stroke="#444444" stroke-width="2"/>
<text x="180" y="72" font-size="20" text-anchor="middle" fill="#222222">the landing's writes</text>
<text x="180" y="104" font-size="20" text-anchor="middle" fill="#222222">plan comment + version, ledger file,</text>
<text x="180" y="132" font-size="20" text-anchor="middle" fill="#222222">store row</text>

<line x1="330" y1="100" x2="430" y2="100" stroke="#444444" stroke-width="2" marker-end="url(#tip)"/>

<rect x="430" y="40" width="330" height="120" fill="none" stroke="#444444" stroke-width="2"/>
<text x="595" y="72" font-size="20" text-anchor="middle" fill="#222222">commit refused:</text>
<text x="595" y="104" font-size="20" text-anchor="middle" fill="#222222">.git/index.lock held</text>
<text x="595" y="132" font-size="20" text-anchor="middle" fill="#222222">by a peer run</text>

<line x1="760" y1="70" x2="880" y2="70" stroke="#444444" stroke-width="2" marker-end="url(#tip)"/>
<line x1="760" y1="140" x2="880" y2="290" stroke="#444444" stroke-width="2" marker-end="url(#tip)"/>

<text x="820" y="52" font-size="20" text-anchor="middle" fill="#222222">once: git restore</text>
<text x="820" y="98" font-size="20" text-anchor="middle" fill="#8a5a00">refused by the same lock</text>

<rect x="880" y="30" width="490" height="110" fill="none" stroke="#8a5a00" stroke-width="2"/>
<text x="1125" y="60" font-size="20" text-anchor="middle" fill="#8a5a00">before the repair</text>
<text x="1125" y="90" font-size="20" text-anchor="middle" fill="#222222">created path unlinked although its entry stayed staged;</text>
<text x="1125" y="120" font-size="20" text-anchor="middle" fill="#222222">store row kept, retry collides silently</text>

<text x="1125" y="222" font-size="20" text-anchor="middle" fill="#1f6f4a">after the repair</text>
<rect x="880" y="240" width="490" height="80" fill="none" stroke="#1f6f4a" stroke-width="2"/>
<text x="1125" y="272" font-size="20" text-anchor="middle" fill="#222222">entry dropped first, file removed only once it is gone &#8212;</text>
<text x="1125" y="302" font-size="20" text-anchor="middle" fill="#222222">a refused drop leaves the file and reports it</text>
<rect x="880" y="330" width="490" height="80" fill="none" stroke="#1f6f4a" stroke-width="2"/>
<text x="1125" y="360" font-size="20" text-anchor="middle" fill="#222222">the store row the attempt inserted is removed, so the</text>
<text x="1125" y="390" font-size="20" text-anchor="middle" fill="#222222">retry records the landed attempt</text>

<text x="30" y="200" font-size="20" fill="#222222">The plan file keeps its working-tree write:</text>
<text x="30" y="230" font-size="20" fill="#222222">the retry commits it, and four existing tests pin that.</text>
</svg>