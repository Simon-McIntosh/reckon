<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" role="img" aria-labelledby="title desc">
  <title id="title">Research plan evidence provenance</title>
  <desc id="desc">Research feeds a plan, implementation follows the plan, and evidence verifies the plan.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
  <g font-family="system-ui" fill="#0f172a">
    <rect x="25" y="75" width="190" height="90" rx="4" fill="#fff" stroke="#0f766e"/><text x="120" y="108" text-anchor="middle" font-size="17">Research</text><text x="120" y="137" text-anchor="middle" font-size="13">informs · no %</text>
    <rect x="280" y="55" width="190" height="130" rx="4" fill="#fff" stroke="#2563eb"/><text x="375" y="92" text-anchor="middle" font-size="17">Plan</text><text x="375" y="122" text-anchor="middle" font-size="13">authorizes work</text><text x="375" y="151" text-anchor="middle" font-size="14" fill="#2563eb">42% complete</text>
    <rect x="535" y="75" width="190" height="90" rx="4" fill="#fff" stroke="#64748b"/><text x="630" y="108" text-anchor="middle" font-size="17">Implementation</text><text x="630" y="137" text-anchor="middle" font-size="13">code · data · operations</text>
    <rect x="790" y="75" width="165" height="90" rx="4" fill="#fff" stroke="#c2410c"/><text x="872" y="108" text-anchor="middle" font-size="17">Evidence</text><text x="872" y="137" text-anchor="middle" font-size="13">verifies · no %</text>
  </g>
  <line x1="215" y1="120" x2="275" y2="120" stroke="#334155" marker-end="url(#a)"/><line x1="470" y1="120" x2="530" y2="120" stroke="#334155" marker-end="url(#a)"/><line x1="725" y1="120" x2="785" y2="120" stroke="#334155" marker-end="url(#a)"/>
</svg>
