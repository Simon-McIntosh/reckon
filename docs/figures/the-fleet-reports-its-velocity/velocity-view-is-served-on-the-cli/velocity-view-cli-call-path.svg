<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1a1a1a">One composition serves both surfaces</text>
  <text x="24" y="56" font-size="13" fill="#555555">crew velocity and crew(view="velocity") call velocity.view, so the two cannot disagree about a window.</text>

  <!-- surfaces -->
  <rect x="40" y="86" width="250" height="64" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="58" y="112" font-size="14" font-weight="600" fill="#1a1a1a">reckon crew velocity</text>
  <text x="58" y="132" font-size="12" fill="#555555">reckon/cli.py</text>

  <rect x="570" y="86" width="250" height="64" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="588" y="112" font-size="14" font-weight="600" fill="#1a1a1a">crew(view="velocity")</text>
  <text x="588" y="132" font-size="12" fill="#555555">reckon/mcp.py (thin call)</text>

  <!-- arrows into view -->
  <line x1="165" y1="150" x2="165" y2="196" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="0" y1="0" x2="0" y2="0"/>
  <line x1="695" y1="150" x2="695" y2="196" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="165" y1="196" x2="695" y2="196" stroke="#4a6fa5" stroke-width="1.5"/>
  <line x1="430" y1="196" x2="430" y2="222" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- view box -->
  <rect x="200" y="224" width="460" height="150" rx="10" fill="#f3f7f0" stroke="#4d7c3f" stroke-width="1.5"/>
  <text x="222" y="250" font-size="14" font-weight="700" fill="#2f4d23">velocity.view(project, since, until, checkout_path, fields, limit, cursor)</text>
  <text x="222" y="276" font-size="12.5" fill="#333333">1. parse the window &#8212; since required, refused by name when absent</text>
  <text x="222" y="298" font-size="12.5" fill="#333333">2. resolve mounts &#8212; one project, or * for every mounted checkout</text>
  <text x="222" y="320" font-size="12.5" fill="#333333">3. compose the default summary &#8212; the three aggregate tables</text>
  <text x="222" y="342" font-size="12.5" fill="#333333">4. page the project-lane-day cells by limit and cursor</text>
  <text x="222" y="362" font-size="12" fill="#666666">a refusal is a payload with ok:false and a detail naming the reason</text>

  <!-- report layer -->
  <line x1="430" y1="374" x2="430" y2="404" stroke="#4d7c3f" stroke-width="1.5" marker-end="url(#b)"/>
  <rect x="200" y="406" width="460" height="72" rx="10" fill="#fbf6ec" stroke="#a5793a" stroke-width="1.5"/>
  <text x="222" y="432" font-size="13" font-weight="700" fill="#6b4c19">velocity.report &#8594; capture_project, recover_ledger_clocks, measure, compact_summary</text>
  <text x="222" y="454" font-size="12" fill="#555555">the measurement layers, unchanged; the path classifier is imported, not copied</text>
  <text x="222" y="470" font-size="12" fill="#555555">progress narration goes to stderr, so stdout carries the JSON alone</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a6fa5"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4d7c3f"/></marker>
  </defs>
</svg>