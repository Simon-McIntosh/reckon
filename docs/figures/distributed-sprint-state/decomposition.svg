<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" role="img" aria-labelledby="title desc">
  <title id="title">Project state decomposition</title>
  <desc id="desc">The current index JSON containing all project state is split into independently versioned sprint, milestone, blocker, timeline, and project resources.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker>
  </defs>
  <g font-family="system-ui" fill="#111827">
    <rect x="30" y="58" width="280" height="220" rx="6" fill="#fff" stroke="#b91c1c"/>
    <text x="50" y="90" font-size="17" font-weight="700">index.json · version 10</text>
    <text x="50" y="126" font-size="14">active sprint pointer</text>
    <text x="50" y="152" font-size="14">all sprint definitions</text>
    <text x="50" y="178" font-size="14">milestones · blockers</text>
    <text x="50" y="204" font-size="14">timeline · rollups</text>
    <text x="50" y="242" font-size="14" fill="#991b1b">one payload · one lock</text>
    <line x1="310" y1="168" x2="400" y2="168" stroke="#334155" marker-end="url(#arrow)"/>
    <text x="334" y="148" font-size="13">migrate</text>
    <g font-size="14">
      <rect x="410" y="30" width="245" height="64" rx="5" fill="#f8fafc" stroke="#2563eb"/><text x="428" y="58" font-weight="700">sprints/S5.html</text><text x="428" y="80">versioned membership</text>
      <rect x="410" y="112" width="245" height="64" rx="5" fill="#fff" stroke="#334155"/><text x="428" y="140" font-weight="700">milestones/M1.html</text><text x="428" y="162">independent target</text>
      <rect x="410" y="194" width="245" height="64" rx="5" fill="#fff" stroke="#334155"/><text x="428" y="222" font-weight="700">blockers/B1.html</text><text x="428" y="244">owner + next action</text>
      <rect x="410" y="276" width="245" height="44" rx="5" fill="#fff" stroke="#334155"/><text x="428" y="304" font-weight="700">timeline/events</text>
      <rect x="700" y="112" width="245" height="96" rx="5" fill="#f8fafc" stroke="#2563eb"/><text x="718" y="142" font-weight="700">project manifest</text><text x="718" y="168">identity + settings only</text><text x="718" y="190">no computed rollups</text>
    </g>
  </g>
</svg>
