<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
  <rect width="900" height="520" fill="#ffffff"/>

  <text x="24" y="32" font-size="18" font-weight="600">A watcher a test arms is ended by the session that armed it</text>
  <text x="24" y="54" fill="#555">pids are read from the seat record the producer wrote into its own RECKON_HOME, never from a command-line pattern</text>

  <!-- lanes -->
  <line x1="150" y1="80" x2="150" y2="470" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="470" y1="80" x2="470" y2="470" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="780" y1="80" x2="780" y2="470" stroke="#bbb" stroke-dasharray="4 4"/>
  <text x="150" y="100" text-anchor="middle" font-weight="600">parent pytest</text>
  <text x="470" y="100" text-anchor="middle" font-weight="600">child pytest</text>
  <text x="780" y="100" text-anchor="middle" font-weight="600">watch producer</text>

  <!-- 1 spawn child -->
  <line x1="150" y1="140" x2="462" y2="140" stroke="#333" marker-end="url(#a)"/>
  <text x="300" y="132" text-anchor="middle">spawn subprocess pytest (own --basetemp)</text>

  <!-- 2 arm detached -->
  <line x1="470" y1="190" x2="772" y2="190" stroke="#333" marker-end="url(#a)"/>
  <text x="620" y="182" text-anchor="middle">dispatch arms producer, detached</text>

  <!-- 3 claims seat -->
  <rect x="700" y="208" width="160" height="44" rx="6" fill="#eef6ff" stroke="#7ba7d7"/>
  <text x="780" y="227" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">crew/watch/&lt;proj</text>
  <text x="780" y="243" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">&#8209;&lt;dig&gt;.lock: pid</text>

  <!-- 4 child session ends, teardown -->
  <line x1="470" y1="300" x2="470" y2="320" stroke="#333"/>
  <rect x="330" y="320" width="280" height="46" rx="6" fill="#eef7ee" stroke="#79b079"/>
  <text x="470" y="340" text-anchor="middle">session teardown: enumerate records under</text>
  <text x="470" y="358" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12">--basetemp, keep pid whose env names that home</text>

  <!-- 5 signal -->
  <line x1="610" y1="343" x2="772" y2="343" stroke="#333" marker-end="url(#a)"/>
  <text x="690" y="335" text-anchor="middle">SIGTERM that pid</text>
  <text x="780" y="380" text-anchor="middle" fill="#2a6">producer + supervisor gone</text>

  <!-- 6 parent asserts -->
  <line x1="470" y1="410" x2="158" y2="410" stroke="#333" marker-end="url(#a)"/>
  <text x="315" y="402" text-anchor="middle">child exits 0</text>
  <rect x="24" y="420" width="270" height="46" rx="6" fill="#eef7ee" stroke="#79b079"/>
  <text x="159" y="439" text-anchor="middle">after 1 s: no watch process names</text>
  <text x="159" y="457" text-anchor="middle">that child home &#8594; pass</text>

  <!-- refusal note -->
  <line x1="24" y1="486" x2="876" y2="486" stroke="#ddd"/>
  <text x="24" y="508" fill="#a33" font-weight="600">Refused:</text>
  <text x="100" y="508" fill="#a33">a recorded pid whose environment now names another home (pid reuse) &#8212; never signalled. Supervisors and peers' watchers are untouched by the pattern the old scan matched.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>