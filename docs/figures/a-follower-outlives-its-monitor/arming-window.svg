<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" font-family="system-ui, sans-serif">
  <rect width="960" height="260" fill="#0f1116"/>
  <text x="24" y="36" fill="#e8ecf1" font-size="17" font-weight="600">One arming window on this host</text>
  <text x="24" y="58" fill="#9aa4b2" font-size="12">The follower ends first, so the last line a reader sees is the actionable one.</text>
  <line x1="60" y1="160" x2="900" y2="160" stroke="#4a5568" stroke-width="2"/>
  <path d="M 866 122 C 866 92 300 92 150 122" fill="none" stroke="#68d391" stroke-width="2"/>
  <text x="24" y="224" fill="#9aa4b2" font-size="12">timeout_ms caps at 1,800,000 milliseconds - thirty minutes.</text>
  <text x="24" y="242" fill="#9aa4b2" font-size="12">An agent reader gets escape sequences, not hue: the state word must carry the state alone.</text>
  <text x="500" y="86" text-anchor="middle" fill="#68d391" font-size="12">re-arm on this line</text>
  <circle cx="60" cy="160" r="6" fill="#63b3ed"/>
  <text x="60" y="128" fill="#e8ecf1" font-size="12">t = 0 - arm: absolute attach line + --lifetime 29m</text>
  <circle cx="872" cy="160" r="6" fill="#f6ad55"/>
  <text x="872" y="128" text-anchor="end" fill="#e8ecf1" font-size="12">29m - follower's final line: the attach line and the runs needing you</text>
  <circle cx="900" cy="160" r="5" fill="#fc8181"/>
  <text x="900" y="188" text-anchor="end" fill="#fc8181" font-size="12">30m - host: Monitor expired after 30m with N events delivered</text>
</svg>