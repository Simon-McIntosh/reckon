<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"
     font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="420" fill="#fbfbfd"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#14161c">Startup: bind before arming the fleet change watch</text>
  <text x="24" y="52" fill="#4a4f5c">Three mounted trees, watch construction patched to 5 s per tree. Time runs left to right; the port answers from the marker.</text>

  <!-- time axis -->
  <g stroke="#c7ccd6">
    <line x1="180" y1="86" x2="920" y2="86"/>
  </g>
  <g fill="#6b7180" text-anchor="middle">
    <line x1="180" y1="82" x2="180" y2="90" stroke="#c7ccd6"/><text x="180" y="106">0 s</text>
    <line x1="365" y1="82" x2="365" y2="90" stroke="#c7ccd6"/><text x="365" y="106">5 s</text>
    <line x1="550" y1="82" x2="550" y2="90" stroke="#c7ccd6"/><text x="550" y="106">10 s</text>
    <line x1="735" y1="82" x2="735" y2="90" stroke="#c7ccd6"/><text x="735" y="106">15 s</text>
    <line x1="920" y1="82" x2="920" y2="90" stroke="#c7ccd6"/><text x="920" y="106">20 s</text>
  </g>

  <!-- BEFORE -->
  <text x="24" y="150" font-weight="700" fill="#8a2f2f">Before — watch built before serve_forever</text>
  <g>
    <rect x="180" y="160" width="185" height="30" rx="4" fill="#f3d6d6" stroke="#c98b8b"/>
    <text x="272" y="180" text-anchor="middle" fill="#6d2323">walk tree 1</text>
    <rect x="365" y="160" width="185" height="30" rx="4" fill="#f3d6d6" stroke="#c98b8b"/>
    <text x="457" y="180" text-anchor="middle" fill="#6d2323">walk tree 2</text>
    <rect x="550" y="160" width="185" height="30" rx="4" fill="#f3d6d6" stroke="#c98b8b"/>
    <text x="642" y="180" text-anchor="middle" fill="#6d2323">walk tree 3</text>
    <rect x="735" y="160" width="185" height="30" rx="4" fill="#e8ebf0" stroke="#aab0bd"/>
    <text x="827" y="180" text-anchor="middle" fill="#3c414c">bind + serve (port answers)</text>
  </g>
  <line x1="180" y1="205" x2="920" y2="205" stroke="#c98b8b" stroke-dasharray="4 4"/>
  <text x="186" y="222" fill="#8a2f2f">port refuses every connection for the whole 15 s of walking</text>

  <!-- AFTER -->
  <text x="24" y="272" font-weight="700" fill="#1c6b3a">After — port binds first, watch arms on its own thread</text>
  <g>
    <rect x="180" y="282" width="740" height="26" rx="4" fill="#dcecdc" stroke="#7cab8a"/>
    <text x="200" y="300" fill="#184a2b">port bound and serving — /_projects/mounts.json answers</text>
  </g>
  <g>
    <rect x="196" y="316" width="150" height="24" rx="4" fill="#e6e9f2" stroke="#96a0c0"/>
    <text x="271" y="333" text-anchor="middle" fill="#33405e">arm tree 1</text>
    <rect x="356" y="316" width="150" height="24" rx="4" fill="#e6e9f2" stroke="#96a0fc"/>
    <text x="431" y="333" fill="#33405e">arm tree 2</text>
    <rect x="516" y="316" width="150" height="24" rx="4" fill="#e6e9f2" stroke="#96a0c0"/>
    <text x="591" y="333" text-anchor="middle" fill="#33405e">arm tree 3</text>
  </g>
  <text x="180" y="360" fill="#4a4f5c">arming runs one tree at a time on the reader thread; each unarmed tree stays covered by the discovery reuse window</text>
  <g fill="#6b7180" font-size="12">
    <text x="180" y="70">answer marker</text>
  </g>
  <line x1="252" y1="70" x2="252" y2="86" stroke="#1c6b3a" stroke-width="2"/>
  <circle cx="252" cy="86" r="4" fill="#1c6b3a"/>
  <text x="258" y="70" fill="#1c6b3a">mounts.json 200 at &lt; 2 s (after); never within 2 s (before)</text>

  <text x="24" y="392" fill="#6b7180" font-size="12">Done-when: mounts.json answers 200 within 2 s of launch and every tree is armed within 20 s. Negative control: with the watch built before serve_forever, the 2 s assertion fails.</text>
</svg>