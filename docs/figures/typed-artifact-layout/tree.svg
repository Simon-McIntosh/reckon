<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Typed artifact directory tree</title>
  <desc id="desc">The docs directory contains separate plans, research, evidence, and sprints roots plus infrastructure directories.</desc>
  <g font-family="system-ui" fill="#111827">
    <text x="28" y="38" font-size="17" font-weight="700">docs/</text>
    <line x1="55" y1="52" x2="55" y2="296" stroke="#64748b"/>
    <g font-size="15">
      <line x1="55" y1="78" x2="92" y2="78" stroke="#64748b"/><text x="104" y="84" font-weight="700">plans/</text><text x="250" y="84">actionable lifecycle documents</text>
      <line x1="55" y1="120" x2="92" y2="120" stroke="#64748b"/><text x="104" y="126" font-weight="700">research/</text><text x="250" y="126">inputs that inform plans</text>
      <line x1="55" y1="162" x2="92" y2="162" stroke="#64748b"/><text x="104" y="168" font-weight="700">evidence/</text><text x="250" y="168">records that verify outcomes</text>
      <line x1="55" y1="204" x2="92" y2="204" stroke="#64748b"/><text x="104" y="210" font-weight="700">sprints/</text><text x="250" y="210">one project-state document per sprint</text>
      <line x1="55" y1="246" x2="92" y2="246" stroke="#64748b"/><text x="104" y="252">figures/</text><text x="250" y="252">shared visual assets</text>
      <line x1="55" y1="288" x2="92" y2="288" stroke="#64748b"/><text x="104" y="294">_shared/ · ui/</text><text x="250" y="294">managed runtime assets</text>
    </g>
    <rect x="650" y="67" width="220" height="158" rx="6" fill="#f8fafc" stroke="#2563eb"/>
    <text x="670" y="98" font-size="16" font-weight="700">One resolver</text>
    <text x="670" y="128" font-size="14">server · MCP · build</text>
    <text x="670" y="154" font-size="14">audit · SPA · skills</text>
    <text x="670" y="190" font-size="14">stable typed identity</text>
  </g>
</svg>
