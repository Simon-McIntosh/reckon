<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Recorded stream liveness read with bounded fallback</title>
  <desc id="desc">A live pointer joins to its plan sprint. The latest recorded watch state is read first; an unrecorded pointer uses a bounded manifest status and stream age check.</desc>
  <rect width="960" height="300" fill="#fffdf8"/>
  <g font-family="system-ui, sans-serif" fill="#17212b">
    <text x="44" y="42" font-size="23" font-weight="700">Sprint liveness read path</text>
    <text x="44" y="70" font-size="15" fill="#43515c">One stream pass supplies recorded states; only unseen runs use the bounded fallback.</text>
    <g stroke="#253746" stroke-width="2" fill="#f4f7f8">
      <rect x="44" y="120" width="150" height="76" rx="8"/>
      <rect x="242" y="120" width="150" height="76" rx="8"/>
      <rect x="440" y="104" width="190" height="52" rx="8" fill="#e5f2ed" stroke="#13795b"/>
      <rect x="440" y="172" width="190" height="52" rx="8" fill="#fff0d8" stroke="#a15c00"/>
      <rect x="696" y="120" width="220" height="76" rx="8" fill="#e5f2ed" stroke="#13795b"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="119" y="151">live pointer</text>
      <text x="119" y="176" font-size="14" fill="#43515c">run + plan</text>
      <text x="317" y="151">plan-sprint</text>
      <text x="317" y="176" font-size="14" fill="#43515c">join</text>
      <text x="535" y="136" font-size="15">recorded to_state</text>
      <text x="535" y="154" font-size="14" fill="#13795b">latest per run</text>
      <text x="535" y="204" font-size="15">unrecorded fallback</text>
      <text x="535" y="222" font-size="13" fill="#a15c00">status line + stream age</text>
      <text x="806" y="151">sprint row</text>
      <text x="806" y="176" font-size="14" fill="#13795b">live / held / idle</text>
    </g>
    <g fill="none" stroke="#253746" stroke-width="2">
      <path d="M194 158h48"/><path d="M392 158h48"/>
      <path d="M630 130h66"/><path d="M630 198h66"/>
      <path d="M238 158l-9-6m9 6l-9 6M436 158l-9-6m9 6l-9 6M692 130l-9-6m9 6l-9 6M692 198l-9-6m9 6l-9 6"/>
    </g>
    <text x="44" y="265" font-size="14" fill="#43515c">No sprint resource is written, and no per-pointer classifier runs on the recorded path.</text>
  </g>
</svg>
