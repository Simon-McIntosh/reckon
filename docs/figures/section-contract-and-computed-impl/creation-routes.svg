<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title description">
  <title id="title">Every section-creation route validates its typed record</title>
  <desc id="description">Three routes can create a section: the state append sections target, the state insert_section op and a text edit that introduces a numbered heading. All three reach one SectionRecord validation, which either writes the heading with its record or refuses before writing, naming the field and showing a worked append example. A text edit that introduces no new section stays on the ordinary prose path.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#334155"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#172b3a">
    <text x="24" y="42" font-size="21" font-weight="600">One validation, reached by every route that creates a section</text>
    <text x="24" y="90">append sections</text>
    <text x="24" y="150">insert_section op</text>
    <text x="24" y="210">text edit adding an h2</text>
    <path d="M243 84H330" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <path d="M243 144H330" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <path d="M243 204H330" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="338" y="64" width="238" height="156" rx="4" fill="#eff8f7" stroke="#16736d"/>
    <text x="457" y="128" text-anchor="middle">Validate SectionRecord</text>
    <text x="457" y="149" text-anchor="middle" font-size="14">effort · capability · links</text>
    <text x="457" y="170" text-anchor="middle" font-size="14">refused at queue time, before any bytes</text>
    <path d="M576 108H706" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <text x="640" y="95" font-size="14">valid</text>
    <text x="722" y="106">Write heading + body + record</text>
    <text x="722" y="130" font-size="14">one versioned, atomic write</text>
    <path d="M576 176H706" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <text x="640" y="163" font-size="14">invalid</text>
    <rect x="714" y="152" width="302" height="82" rx="4" fill="#fff5ed" stroke="#9a4b14"/>
    <text x="729" y="176" font-weight="600">Refuse before writing</text>
    <text x="729" y="199" font-size="14">Name the field + show a valid append</text>
    <text x="729" y="220" font-size="14">Nothing reaches the plan file</text>
    <path d="M243 288H330" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <text x="24" y="294">text edit, no new section</text>
    <text x="352" y="292" font-size="14">no numbered heading introduced</text>
    <rect x="338" y="312" width="678" height="52" rx="4" fill="#f4f6f8" stroke="#8b97a3"/>
    <text x="353" y="336">Existing unrecorded plans stay editable: prose edits, renames and untyped legacy sections</text>
    <text x="353" y="356" font-size="14">reach the ordinary edit path and are never converted behind the author's back</text>
  </g>
</svg>