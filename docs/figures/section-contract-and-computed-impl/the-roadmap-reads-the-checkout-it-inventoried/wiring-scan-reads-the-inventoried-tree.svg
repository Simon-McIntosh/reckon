<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">The wiring scan reads the tree the callers inventoried</title>
  <desc id="desc">Above: five callers inventory a worktree whose plan declares plan-standalone, but the roadmap's wiring scan resolves the declaration through the registered mount, so the plan is reported unwired. Below: each caller passes its own docs dir, so the scan reads the same tree that produced the rows and reports no finding.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowGood" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#047857"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .tree { fill: #f1f5f9; stroke: #475569; stroke-width: 1.5; }
      .declares { fill: #ecfdf5; stroke: #047857; stroke-width: 1.8; }
      .silent { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.8; }
      .scan { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; }
      .line { stroke: #334155; stroke-width: 1.5; marker-end: url(#arrow); }
      .bad { stroke: #b91c1c; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#arrowBad); }
      .good { stroke: #047857; stroke-width: 2; marker-end: url(#arrowGood); }
      text { font-family: system-ui, sans-serif; fill: #0f172a; font-size: 13px; }
      .work { font-size: 12px; fill: #475569; }
      .label { font-size: 11.5px; fill: #475569; }
      .badlabel { font-size: 11.5px; fill: #b91c1c; font-weight: 600; }
      .goodlabel { font-size: 11.5px; fill: #047857; font-weight: 600; }
      .heading { font-weight: 700; font-size: 15px; }
      .caller { font-size: 12px; }
    </style>
  </defs>

  <text x="28" y="30" class="heading">Before: the rows come from one tree, the declaration from another</text>
  <text x="28" y="50" class="label">plan-standalone is what decides an unwired-plan finding; both trees hold the same plan.</text>

  <rect x="28" y="66" width="196" height="150" class="box"/>
  <text x="126" y="90" text-anchor="middle" class="heading">five callers</text>
  <text x="126" y="112" text-anchor="middle" class="caller">serve · flight · roadmap</text>
  <text x="126" y="130" text-anchor="middle" class="caller">audit · graph resolver</text>
  <text x="126" y="158" text-anchor="middle" class="work">each inventories</text>
  <text x="126" y="175" text-anchor="middle" class="work">its own checkout</text>
  <text x="126" y="198" text-anchor="middle" class="work">build_roadmap(…)</text>

  <rect x="300" y="66" width="240" height="150" class="tree"/>
  <text x="420" y="90" text-anchor="middle" class="heading">worktree docs/</text>
  <text x="420" y="112" text-anchor="middle" class="work">alone.html</text>
  <rect x="318" y="124" width="204" height="34" class="declares"/>
  <text x="420" y="146" text-anchor="middle" class="goodlabel">plan-standalone = …</text>
  <text x="420" y="178" text-anchor="middle" class="work">inventoried for the report</text>
  <text x="420" y="196" text-anchor="middle" class="work">not consulted for the scan</text>

  <rect x="640" y="66" width="312" height="150" class="box"/>
  <text x="796" y="90" text-anchor="middle" class="heading">the roadmap's wiring scan</text>
  <text x="796" y="112" text-anchor="middle" class="work">_standalone_reason(docs_dir=None)</text>
  <text x="796" y="132" text-anchor="middle" class="work">falls back to the registered mount</text>
  <rect x="658" y="144" width="276" height="34" class="silent"/>
  <text x="796" y="166" text-anchor="middle" class="badlabel">unwired-plan reported</text>
  <text x="796" y="198" text-anchor="middle" class="work">for a plan that declares it is not</text>

  <line x1="224" y1="120" x2="300" y2="120" class="line"/>
  <line x1="540" y1="120" x2="640" y2="120" class="line"/>

  <rect x="300" y="240" width="240" height="118" class="tree"/>
  <text x="420" y="264" text-anchor="middle" class="heading">registered mount docs/</text>
  <text x="420" y="286" text-anchor="middle" class="work">alone.html</text>
  <rect x="318" y="298" width="204" height="34" class="silent"/>
  <text x="420" y="320" text-anchor="middle" class="badlabel">no plan-standalone</text>
  <text x="420" y="344" text-anchor="middle" class="work">read by the scan instead</text>

  <path d="M760,216 L760,262 L540,299" class="bad" fill="none"/>
  <text x="700" y="242" class="badlabel">fallback</text>

  <line x1="28" y1="384" x2="952" y2="384" stroke="#cbd5e1" stroke-width="1.4"/>

  <text x="28" y="412" class="heading">After: the scan reads the tree the rows came from</text>
  <text x="28" y="434" class="label">each caller passes docs_dir — serve threads it, flight names its discovered tree, roadmap and audit resolve it from their checkout_path,</text>
  <text x="28" y="450" class="label">graph reads it from the per-project state the MCP graph branch now sets.</text>

  <rect x="700" y="396" width="252" height="62" class="scan"/>
  <text x="826" y="420" text-anchor="middle" class="heading">wiring findings: none</text>
  <text x="826" y="442" text-anchor="middle" class="work">the declaration is read where the plan is</text>
</svg>