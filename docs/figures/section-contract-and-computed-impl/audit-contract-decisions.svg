<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title description">
  <title id="title">What the audit reports, and the severity it reports at</title>
  <desc id="description">Two independent arms. An implementable section with no typed record is an error once the plan already carries a typed record to compare against, and a warning while the plan still predates the contract, so pre-contract plans are surfaced without stopping the fleet. An open followup whose body enumerates more than one deliverable is a warning that the work belongs in a section; a followup with one deliverable or none stays silent, because one remainder is followup-sized. Only errors move the audit's exit code.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#334155"/></marker>
  </defs>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#172b3a">
    <text x="24" y="42" font-size="21" font-weight="600">Two arms, one rule: work outside a section is reported, never fatal</text>

    <text x="24" y="119">implementable section</text>
    <text x="24" y="141" font-size="14">no typed record</text>
    <path d="M212 113H286" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="294" y="84" width="286" height="58" rx="4" fill="#eff8f7" stroke="#16736d"/>
    <text x="437" y="108" text-anchor="middle">Plan already carries</text>
    <text x="437" y="130" text-anchor="middle">a typed record?</text>

    <path d="M580 100H690" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <text x="612" y="88" font-size="14">yes</text>
    <rect x="698" y="72" width="358" height="58" rx="4" fill="#fdecec" stroke="#9b1c1c"/>
    <text x="714" y="96" font-weight="600" fill="#9b1c1c">ERROR — the plan holds the contract</text>
    <text x="714" y="118" font-size="14">names the section id + the worked append example</text>

    <path d="M437 142V208H690" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <text x="450" y="180" font-size="14">no</text>
    <rect x="698" y="180" width="358" height="58" rx="4" fill="#fff5ed" stroke="#9a4b14"/>
    <text x="714" y="204" font-weight="600" fill="#9a4b14">WARN — pre-contract plan</text>
    <text x="714" y="226" font-size="14">same finding, so the fleet does not stop on day one</text>

    <text x="24" y="303">open followup</text>
    <text x="24" y="325" font-size="14">body states enumerated</text>
    <text x="24" y="344" font-size="14">deliverables</text>
    <path d="M212 297H286" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="294" y="268" width="286" height="58" rx="4" fill="#eff8f7" stroke="#16736d"/>
    <text x="437" y="292" text-anchor="middle">More than one</text>
    <text x="437" y="314" text-anchor="middle">deliverable?</text>

    <path d="M580 284H690" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <text x="610" y="272" font-size="14">yes</text>
    <rect x="698" y="256" width="358" height="58" rx="4" fill="#fff5ed" stroke="#9a4b14"/>
    <text x="714" y="280" font-weight="600" fill="#9a4b14">WARN — section-sized work</text>
    <text x="714" y="302" font-size="14">names the followup id; author it as a section</text>

    <path d="M437 326V390H690" fill="none" stroke="#334155" marker-end="url(#arrow)"/>
    <text x="448" y="364" font-size="14">no</text>
    <text x="706" y="395">Silent — one remainder is followup-sized</text>

    <line x1="24" y1="236" x2="1056" y2="236" stroke="#d7dee6" stroke-dasharray="4 4"/>
    <text x="24" y="418" font-size="14">Only ERROR moves the audit's exit code; WARN is reported and the run continues at exit 0.</text>
  </g>
</svg>