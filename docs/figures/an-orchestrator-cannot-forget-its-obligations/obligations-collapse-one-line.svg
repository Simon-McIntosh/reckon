<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Twenty-seven derived obligations become six rendered lines: the twenty-five worktree-held items share one gc command and collapse into a single counted line, while the two blocked runs keep a line each with their run id.">
  <style>
    .box { fill: #f7f7f5; stroke: #555; stroke-width: 1.5; }
    .lbl { font: 13px sans-serif; fill: #222; }
    .mono { font: 12px monospace; fill: #222; }
    .row { font: 12px monospace; fill: #222; }
    .cap { font: 11px sans-serif; fill: #666; }
    .edge { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .hot { fill: #eef4fb; stroke: #2a6bbf; stroke-width: 2; }
    .hotrow { font: 12px monospace; fill: #164a86; font-weight: bold; }
    .shared { fill: #fdf6e3; stroke: #b58900; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" preserveAspectRatio="xMidYMid meet" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text class="lbl" x="20" y="26">derived obligations: 27 items</text>
  <rect class="box" x="20" y="40" width="330" height="330" rx="8"/>

  <rect class="shared" x="30" y="52" width="310" height="150" rx="6"/>
  <text class="row" x="42" y="74">[worktree-held] held-run-00</text>
  <text class="row" x="42" y="92">[worktree-held] held-run-01</text>
  <text class="row" x="42" y="110">[worktree-held] held-run-02</text>
  <text class="row" x="42" y="128">[worktree-held] ... 22 more</text>
  <text class="cap" x="42" y="150">every one carries the same command:</text>
  <text class="mono" x="42" y="168" style="font-size:10px">reckon crew gc --repo R --project P --apply</text>
  <text class="cap" x="42" y="190">25 items, one remedy, ages 49m0s down to 25m0s</text>

  <text class="row" x="42" y="222">[blocked] run-hook-alpha (hook-alpha-node)</text>
  <text class="row" x="42" y="240">[blocked] run-hook-beta (hook-beta-node)</text>
  <text class="cap" x="42" y="264">two remedies, each naming its own manifest</text>
  <text class="cap" x="42" y="286">so neither collapses: a command naming a run</text>
  <text class="cap" x="42" y="304">is not the same work as another run's</text>
  <text class="cap" x="42" y="338">kind + next command decides sameness;</text>
  <text class="cap" x="42" y="356">run identity alone decides nothing</text>

  <path class="edge" d="M350,205 L460,205"/>
  <text class="cap" x="356" y="196">render</text>

  <text class="lbl" x="470" y="26">rendered checklist: 6 lines, under 2000 characters</text>
  <rect class="box" x="470" y="40" width="270" height="330" rx="8"/>
  <text class="row" x="482" y="66">reckon obligations for session</text>
  <text class="row" x="482" y="84">  S (project P): 27 outstanding,</text>
  <text class="row" x="482" y="102">  oldest 49m0s</text>

  <rect class="hot" x="478" y="120" width="254" height="40" rx="5"/>
  <text class="hotrow" x="486" y="138">[worktree-held] 25 items</text>
  <text class="hotrow" x="486" y="154">(oldest 49m0s old): reckon crew gc</text>

  <text class="row" x="482" y="184">[blocked] run-hook-alpha (hook-</text>
  <text class="row" x="482" y="202">  alpha-node, 2s old): read ...</text>
  <text class="row" x="482" y="228">[blocked] run-hook-beta (hook-</text>
  <text class="row" x="482" y="246">  beta-node, 2s old): read ...</text>

  <text class="row" x="482" y="286">unreconciled runs: 1; work the</text>
  <text class="row" x="482" y="304">  list to empty before ending</text>
  <text class="row" x="482" y="322">  the turn.</text>
  <text class="row" x="482" y="346">mirror these into your task list;</text>
  <text class="row" x="482" y="364">  reckon's list is the authority</text>
</svg>