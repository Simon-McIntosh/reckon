<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title description">
  <title id="title">Independent run files, followed by an index update</title>
  <desc id="description">Two concurrent appends scan the legacy aggregate for their own id, exclusively create separate run files, then attempt one index insert each. A failed index insert leaves the file intact and increases index lag.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245b74"/></marker>
  </defs>
  <rect width="1000" height="390" fill="#fff"/>
  <g font-family="sans-serif" font-size="18" fill="#172f3c">
    <text x="26" y="32" font-size="23" font-weight="bold">Each append owns one file; the index follows</text>
    <g fill="#f5f9fb" stroke="#708995" stroke-width="1">
      <rect x="26" y="74" width="166" height="56" rx="4"/>
      <rect x="26" y="182" width="166" height="56" rx="4"/>
      <rect x="246" y="74" width="245" height="164" rx="4"/>
      <rect x="548" y="74" width="221" height="56" rx="4"/>
      <rect x="548" y="182" width="221" height="56" rx="4"/>
      <rect x="826" y="116" width="145" height="80" rx="4"/>
    </g>
    <text x="47" y="109">Append alpha</text>
    <text x="47" y="217">Append beta</text>
    <text x="267" y="110">crew.json: byte scan</text>
    <text x="267" y="145" font-size="16">Parse only an id hit.</text>
    <text x="267" y="175" font-size="16">Refuse a matching row.</text>
    <text x="267" y="209" font-weight="bold">Bytes stay unchanged</text>
    <text x="569" y="108">runs/r-alpha.json</text>
    <text x="569" y="216">runs/r-beta.json</text>
    <text x="846" y="148">SQLite index</text>
    <text x="842" y="176" font-size="15">One insert per run</text>
    <g fill="none" stroke="#245b74" stroke-width="2" marker-end="url(#arrow)">
      <path d="M192 102 H240"/>
      <path d="M192 210 H240"/>
      <path d="M491 102 H542"/>
      <path d="M491 210 H542"/>
      <path d="M769 102 H798 V138 H820"/>
      <path d="M769 210 H798 V176 H820"/>
    </g>
    <text x="548" y="269" font-size="16">Exclusive creation refuses reused ids.</text>
    <path d="M897 196 V312 H770" fill="none" stroke="#245b74" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="26" y="318" font-size="18" font-weight="bold">Index failure: the run file survives; lag rises by one.</text>
    <text x="26" y="354" font-size="16">Lag reads filenames and existing index ids. Observation never rebuilds the index.</text>
  </g>
</svg>
