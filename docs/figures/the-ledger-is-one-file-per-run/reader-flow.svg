<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Committed records feed every reader</title>
<desc id="desc">Aggregate rows and individual run files form one union. Identical duplicates count once; conflicting copies refuse the read. Index readers compare run ids, query a matching cache, or answer from the union and rebuild a missing or mismatched cache.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#285e71"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172e38" font-size="17">
<text x="35" y="55">crew.json: remaining rows</text>
<text x="35" y="125">runs/&lt;run_id&gt;.json</text>
<path d="M260 50 H295 V88 H330 M245 120 H295 V88" fill="none" stroke="#285e71" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="335" y="58" width="200" height="60" rx="4" fill="#edf5f7" stroke="#285e71"/>
<text x="435" y="84" text-anchor="middle">ledger.load</text><text x="435" y="105" text-anchor="middle" font-size="14">one complete union</text>
<path d="M535 88 H635" fill="none" stroke="#285e71" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="650" y="85">Ledger readers</text><text x="650" y="109" font-size="14">runs · records · summaries · MCP</text>
<path d="M435 119 V158" fill="none" stroke="#a74836" stroke-width="1.5"/>
<text x="435" y="183" text-anchor="middle" font-size="15">identical copies → count once</text>
<text x="435" y="207" text-anchor="middle" font-size="15" fill="#843726">differing copies → refuse, naming both paths</text>
<text x="35" y="284">Index reader</text>
<path d="M142 279 H225" fill="none" stroke="#285e71" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240" y="275">Run ids agree?</text><text x="240" y="298" font-size="14">cache vs. committed sources</text>
<path d="M452 279 H595 V252 H655" fill="none" stroke="#285e71" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515" y="266" font-size="14">yes</text><text x="670" y="256">Query the index</text>
<path d="M452 279 H550 V343 H655" fill="none" stroke="#285e71" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="562" y="321" font-size="14">missing / unequal</text>
<text x="670" y="344">Read the union; rebuild cache</text>
<text x="670" y="369" font-size="14">Cache write fails? Still return the file answer.</text>
<text x="35" y="382" font-size="14">Census tools use this same index reader.</text>
</g></svg>