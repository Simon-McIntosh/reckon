<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="DejaVu Sans, Helvetica, sans-serif" font-size="13">
  <rect x="0" y="0" width="860" height="470" fill="#fbfbfa"/>
  <text x="24" y="30" font-size="17" font-weight="bold">Which citations a promotion accepts</text>
  <text x="24" y="50" fill="#555">A run's row records what the run made beyond the base it was dispatched against.</text>

  <line x1="60" y1="120" x2="800" y2="120" stroke="#333" stroke-width="2"/>
  <circle cx="110" cy="120" r="9" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" font-weight="bold">c1</text>
  <text x="110" y="166" text-anchor="middle" fill="#666">earlier commit</text>

  <circle cx="290" cy="120" r="10" fill="#1f4e79" stroke="#12314d" stroke-width="2"/>
  <text x="290" y="150" text-anchor="middle" font-weight="bold">base</text>
  <text x="290" y="166" text-anchor="middle" fill="#666">run dispatched here</text>
  <line x1="290" y1="96" x2="290" y2="106" stroke="#12314d" stroke-width="2"/>
  <text x="290" y="90" text-anchor="middle" fill="#12314d" font-weight="bold">dispatch</text>

  <circle cx="530" cy="120" r="9" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="530" y="150" text-anchor="middle" font-weight="bold">r1</text>
  <circle cx="700" cy="120" r="9" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <text x="700" y="150" text-anchor="middle" font-weight="bold">r2</text>
  <text x="700" y="166" text-anchor="middle" fill="#666">the run's tip</text>
  <path d="M290 120 L700 120" stroke="#333" stroke-width="2"/>
  <path d="M120 120 L280 120" stroke="#333" stroke-width="2"/>
  <text x="470" y="112" text-anchor="middle" fill="#555">the run's own commits</text>

  <path d="M290 250 L290 140" stroke="#b00000" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="180" y="250" width="220" height="58" rx="6" fill="#fdecec" stroke="#b00000" stroke-width="1.5"/>
  <text x="290" y="272" text-anchor="middle" font-weight="bold" fill="#8c0000">refused: it is the base</text>
  <text x="290" y="292" text-anchor="middle" fill="#8c0000">a citation of the base reads as</text>
  <text x="290" y="306" text-anchor="middle" fill="#8c0000">landed work that predates the run</text>

  <path d="M110 250 L110 140" stroke="#b00000" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="20" y="250" width="150" height="58" rx="6" fill="#fdecec" stroke="#b00000" stroke-width="1.5"/>
  <text x="95" y="272" text-anchor="middle" font-weight="bold" fill="#8c0000">refused: behind</text>
  <text x="95" y="292" text-anchor="middle" fill="#8c0000">the base already carries it,</text>
  <text x="95" y="306" text-anchor="middle" fill="#8c0000">so it is not this run's work</text>

  <path d="M700 250 L700 140" stroke="#2e7d32" stroke-width="2"/>
  <rect x="560" y="250" width="250" height="58" rx="6" fill="#eaf5ea" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="685" y="272" text-anchor="middle" font-weight="bold" fill="#1b5e20">accepted: beyond the base</text>
  <text x="685" y="292" text-anchor="middle" fill="#1b5e20">the row records this commit as the</text>
  <text x="685" y="306" text-anchor="middle" fill="#1b5e20">run's own, and promoted_revision is it</text>

  <rect x="20" y="342" width="820" height="110" rx="8" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <text x="36" y="366" font-weight="bold">No commit cited, and the tree still holds the run's declared work</text>
  <text x="36" y="388" fill="#8c0000">refused, naming the uncommitted paths: a promotion would record the run as landed with that work in no commit, and the release step takes the worktree with it.</text>
  <text x="36" y="412" fill="#1b5e20">A path the run never declared is not charged to it: a shared checkout and a fleet worktree carry other sessions' uncommitted work,</text>
  <text x="36" y="430" fill="#1b5e20">and the release step withholds a tree it cannot take cleanly.</text>
</svg>