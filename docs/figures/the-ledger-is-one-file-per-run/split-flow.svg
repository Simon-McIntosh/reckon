<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="The split's per-project decision path">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111111">The split, once per mounted project</text>

  <rect x="30" y="70" width="200" height="86" rx="8" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/>
  <text x="130" y="100" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">Classify the rows of</text>
  <text x="130" y="119" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">crew.json's runs list</text>
  <text x="130" y="142" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444444">missing / identical / differing</text>

  <line x1="230" y1="113" x2="286" y2="113" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="70" width="210" height="86" rx="8" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/>
  <text x="395" y="100" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">Any listed row's file</text>
  <text x="395" y="119" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">already differing?</text>
  <text x="395" y="142" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444444">bytes vs serialize_run(row)</text>

  <line x1="500" y1="113" x2="556" y2="113" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="528" y="103" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1c6b3a">no</text>

  <rect x="560" y="70" width="200" height="86" rx="8" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/>
  <text x="660" y="96" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">Write each row to</text>
  <text x="660" y="115" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#111111">runs/&lt;run_id&gt;.json</text>
  <text x="660" y="138" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444444">store_write carried</text>

  <line x1="760" y1="113" x2="816" y2="113" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="70" width="150" height="86" rx="8" fill="#e8f5ec" stroke="#2c6e49" stroke-width="1.5"/>
  <text x="895" y="98" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">Drop the runs key;</text>
  <text x="895" y="117" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">members and holds</text>
  <text x="895" y="136" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">stay &#8212; one commit</text>

  <line x1="395" y1="156" x2="395" y2="216" stroke="#8a2b2b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="408" y="196" font-family="sans-serif" font-size="12" fill="#8a2b2b">yes: this project stops here</text>

  <rect x="240" y="220" width="420" height="86" rx="8" fill="#fbeeee" stroke="#8a2b2b" stroke-width="1.5"/>
  <text x="610" y="248" font-family="sans-serif" font-size="13" text-anchor="end" fill="#111111">no file written, runs key stays, no commit;</text>
  <text x="610" y="268" font-family="sans-serif" font-size="13" text-anchor="end" fill="#111111">the report names each differing file</text>
  <text x="610" y="292" font-family="sans-serif" font-size="12" text-anchor="end" fill="#555555">sibling projects migrate in the same run</text>

  <rect x="30" y="340" width="470" height="100" rx="8" fill="#f6f6f6" stroke="#777777" stroke-width="1.2"/>
  <text x="48" y="366" font-family="sans-serif" font-size="13" fill="#111111">A run file whose id no listed row names is a promotion</text>
  <text x="48" y="385" font-family="sans-serif" font-size="13" fill="#111111">that landed beside the list: never opened, so neither</text>
  <text x="48" y="404" font-family="sans-serif" font-size="13" fill="#111111">counted nor disturbed. Projects with no crew.json or no</text>
  <text x="48" y="423" font-family="sans-serif" font-size="13" fill="#111111">runs key are reported as skipped.</text>

  <rect x="520" y="340" width="450" height="100" rx="8" fill="#f6f6f6" stroke="#777777" stroke-width="1.2"/>
  <text x="538" y="366" font-family="sans-serif" font-size="13" fill="#111111">--dry-run stops before the write and prints, per project,</text>
  <text x="538" y="385" font-family="sans-serif" font-size="13" fill="#111111">rows, missing, identical and differing, naming the files</text>
  <text x="538" y="404" font-family="sans-serif" font-size="13" fill="#111111">the real run would refuse. A second invocation finds no</text>
  <text x="538" y="423" font-family="sans-serif" font-size="13" fill="#111111">runs key and writes nothing.</text>
</svg>