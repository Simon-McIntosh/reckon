<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="The help census compares the registered crew verbs against an expected row set, and the three measurement arms that pin it">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" aria-hidden="true"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111111">One registered verb, one expected census row</text>

  <rect x="30" y="64" width="250" height="150" rx="8" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/>
  <text x="155" y="90" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">Leaves of the crew group</text>
  <text x="155" y="108" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444444">walked from cli.crew.commands</text>
  <text x="46" y="132" font-family="monospace" font-size="12" fill="#444444">attach · dispatch · ledger</text>
  <text x="46" y="151" font-family="monospace" font-size="12" fill="#444444">resume · shadow · stop ...</text>
  <rect x="40" y="162" width="230" height="24" rx="5" fill="#fde9d0" stroke="#a8641a" stroke-width="1.2"/>
  <text x="155" y="179" font-family="monospace" font-size="13" text-anchor="middle" fill="#7a3f06">split-runs  (29th leaf)</text>
  <text x="155" y="204" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">registered since 98ac4ced</text>

  <line x1="280" y1="139" x2="336" y2="139" stroke="#333333" stroke-width="1.5"/>
  <polygon points="336,133 348,139 336,145" fill="#333333"/>

  <rect x="350" y="64" width="290" height="150" rx="8" fill="#f6f2e8" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="495" y="90" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">Exact-set comparison</text>
  <text x="495" y="114" font-family="monospace" font-size="12" text-anchor="middle" fill="#333333">set(leaves) == set(STATE_PHRASES)</text>
  <text x="495" y="134" font-family="monospace" font-size="12" text-anchor="middle" fill="#333333">len(leaves) == 29</text>
  <text x="495" y="162" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">a subset check would pass with the verb</text>
  <text x="495" y="179" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">uncovered, so the two sets are compared</text>
  <text x="495" y="196" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">for equality, and the row carries a phrase</text>

  <line x1="640" y1="139" x2="696" y2="139" stroke="#333333" stroke-width="1.5"/>
  <polygon points="696,133 708,139 696,145" fill="#333333"/>

  <rect x="710" y="64" width="260" height="150" rx="8" fill="#eef3fb" stroke="#33507a" stroke-width="1.5"/>
  <text x="840" y="90" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#111111">The phrase is read back</text>
  <text x="840" y="110" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444444">every row's phrase must appear in</text>
  <text x="840" y="127" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444444">that verb's own help first line, so</text>
  <text x="840" y="144" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444444">"aggregate run rows" is checked</text>
  <text x="840" y="161" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#444444">against `crew split-runs --help`</text>
  <text x="840" y="188" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">Move each mounted project's aggregate</text>
  <text x="840" y="205" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">run rows into their own files.</text>

  <text x="30" y="256" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">Arms, in order</text>

  <rect x="30" y="272" width="300" height="172" rx="8" fill="#fdeaea" stroke="#a83232" stroke-width="1.5"/>
  <text x="180" y="296" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#7a1a1a">Base arm — 5665e64b</text>
  <text x="180" y="318" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">red: 1 failed, 3 passed</text>
  <text x="180" y="344" font-family="monospace" font-size="11" text-anchor="middle" fill="#333333">Extra items in the left set:</text>
  <text x="180" y="360" font-family="monospace" font-size="11" text-anchor="middle" fill="#333333">('split-runs',)</text>
  <text x="180" y="388" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">the verb is registered while the</text>
  <text x="180" y="404" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">census still holds no row for it</text>
  <text x="180" y="430" font-family="monospace" font-size="10" text-anchor="middle" fill="#444444">base-arm-5665e64b.log</text>

  <rect x="350" y="272" width="300" height="172" rx="8" fill="#eaf6ee" stroke="#1c6b3a" stroke-width="1.5"/>
  <text x="500" y="296" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#144d2a">Head arm — 78b229df</text>
  <text x="500" y="318" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">green: 4 passed, exit 0</text>
  <text x="500" y="344" font-family="monospace" font-size="11" text-anchor="middle" fill="#333333">the row added, the count to 29</text>
  <text x="500" y="360" font-family="monospace" font-size="11" text-anchor="middle" fill="#333333">phrase checked against the help</text>
  <text x="500" y="388" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">the census covers the verb and</text>
  <text x="500" y="404" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">its phrase reaches the help text</text>
  <text x="500" y="430" font-family="monospace" font-size="10" text-anchor="middle" fill="#444444">gate-head-78b229df.log</text>

  <rect x="670" y="272" height="172" width="300" rx="8" fill="#fdeaea" stroke="#a83232" stroke-width="1.5"/>
  <text x="820" y="296" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#7a1a1a">Negative control — scratch copy</text>
  <text x="820" y="318" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333333">red, naming the mutation first</text>
  <text x="820" y="344" font-family="monospace" font-size="11" text-anchor="middle" fill="#333333">row removed from expected set</text>
  <text x="820" y="360" font-family="monospace" font-size="11" text-anchor="middle" fill="#333333">('split-runs',) extra again</text>
  <text x="820" y="388" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">the census fails wherever it stops</text>
  <text x="820" y="404" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444444">covering a verb the CLI registers</text>
  <text x="820" y="430" font-family="monospace" font-size="10" text-anchor="middle" fill="#444444">negative-control.log</text>
</svg>