<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" role="img" aria-labelledby="title description">
  <title id="title">Promotion and release commit the same run file</title>
  <desc id="description">Two promotions follow independent file paths. Each append creates its own run file, the landing commits that path, and release amends the same file in that commit. The second promotion preserves the first run and crew.json.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#16736a" stroke-width="1.4"/>
    </marker>
  </defs>
  <g font-family="system-ui,sans-serif" fill="#162a35">
    <text x="22" y="30" font-size="18" font-weight="600">One file from append through the release receipt</text>
    <g font-size="15">
      <text x="22" y="90">Run alpha</text>
      <text x="170" y="75">append_run</text>
      <text x="170" y="100">runs/alpha.json</text>
      <text x="400" y="75">Commit returned path</text>
      <text x="400" y="100">Release worktree safely</text>
      <text x="730" y="75">Amend same file</text>
      <text x="730" y="100">Durable release receipt</text>
      <text x="22" y="165">Run beta</text>
      <text x="170" y="150">append_run</text>
      <text x="170" y="175">runs/beta.json</text>
      <text x="400" y="150">Commit returned path</text>
      <text x="400" y="175">Release worktree safely</text>
      <text x="730" y="150">Amend same file</text>
      <text x="730" y="175">Durable release receipt</text>
    </g>
    <g fill="none" stroke="#16736a" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M300 88H378"/><path d="M600 88H708"/>
      <path d="M300 163H378"/><path d="M600 163H708"/>
    </g>
    <path d="M22 207H947" fill="none" stroke="#9faeb3" stroke-width="1"/>
    <text x="22" y="237" font-size="15">Each promotion changes one run file. The other run and crew.json keep their bytes.</text>
    <text x="22" y="262" font-size="14">Release still follows the first commit; a cleanup failure cannot erase the promotion record.</text>
  </g>
</svg>
