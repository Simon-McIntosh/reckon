<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="13.5cm" viewBox="0 0 1400 600" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1400" height="600" fill="#ffffff"/>
<text x="45" y="46" font-size="20" fill="#222222">what a landing writes, and in which order</text>
<text x="45" y="100" font-size="17" fill="#222222">base revision</text>
<rect x="45" y="122" width="290" height="62" rx="4" fill="none" stroke="#929292" stroke-width="1.6"/>
<text x="190" y="158" font-size="15" fill="#222222" text-anchor="middle">gate replay</text>
<rect x="385" y="122" width="290" height="62" rx="4" fill="none" stroke="#929292" stroke-width="1.6"/>
<text x="530" y="148" font-size="15" fill="#222222" text-anchor="middle">close comment,</text>
<text x="530" y="168" font-size="15" fill="#222222" text-anchor="middle">section declaration</text>
<rect x="725" y="122" width="290" height="62" rx="4" fill="none" stroke="#929292" stroke-width="1.6"/>
<text x="870" y="158" font-size="15" fill="#222222" text-anchor="middle">pointer released</text>
<rect x="1065" y="122" width="290" height="62" rx="4" fill="none" stroke="#b8327e" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="1210" y="148" font-size="15" fill="#222222" text-anchor="middle">ledger row</text>
<text x="1210" y="168" font-size="15" fill="#222222" text-anchor="middle">(may never be written)</text>
<line x1="335" y1="153" x2="385" y2="153" stroke="#929292" stroke-width="1.6"/>
<polygon points="385,153 345,148 345,158" fill="#929292"/>
<line x1="675" y1="153" x2="725" y2="153" stroke="#929292" stroke-width="1.6"/>
<polygon points="725,153 685,148 685,158" fill="#929292"/>
<line x1="1015" y1="153" x2="1065" y2="153" stroke="#929292" stroke-width="1.6" stroke-dasharray="6 5"/>
<polygon points="1065,153 1025,148 1025,158" fill="#929292"/>
<text x="45" y="212" font-size="14" fill="#b8327e">a refused replay still closes the section and retires the pointer, so nothing records what did not land</text>
<text x="45" y="276" font-size="17" fill="#222222">head revision</text>
<rect x="45" y="300" width="290" height="62" rx="4" fill="none" stroke="#929292" stroke-width="1.6"/>
<text x="190" y="336" font-size="15" fill="#222222" text-anchor="middle">gate replay</text>
<rect x="385" y="300" width="290" height="62" rx="4" fill="none" stroke="#2e8b57" stroke-width="1.6"/>
<text x="530" y="326" font-size="15" fill="#222222" text-anchor="middle">ledger row,</text>
<text x="530" y="346" font-size="15" fill="#222222" text-anchor="middle">read or written</text>
<rect x="725" y="300" width="290" height="62" rx="4" fill="none" stroke="#2e8b57" stroke-width="1.6"/>
<text x="870" y="326" font-size="15" fill="#222222" text-anchor="middle">close comment,</text>
<text x="870" y="346" font-size="15" fill="#222222" text-anchor="middle">section declaration</text>
<rect x="1065" y="300" width="290" height="62" rx="4" fill="none" stroke="#2e8b57" stroke-width="1.6"/>
<text x="1210" y="336" font-size="15" fill="#222222" text-anchor="middle">pointer released</text>
<line x1="335" y1="331" x2="385" y2="331" stroke="#929292" stroke-width="1.6"/>
<polygon points="385,331 345,326 345,336" fill="#929292"/>
<line x1="675" y1="331" x2="725" y2="331" stroke="#929292" stroke-width="1.6"/>
<polygon points="725,331 685,326 685,336" fill="#929292"/>
<line x1="1015" y1="331" x2="1065" y2="331" stroke="#929292" stroke-width="1.6"/>
<polygon points="1065,331 1025,326 1025,336" fill="#929292"/>
<text x="45" y="388" font-size="14" fill="#222222">every write asks first: is the run's head on the branch, and is there a row</text>
<rect x="45" y="430" width="620" height="120" rx="4" fill="none" stroke="#929292" stroke-width="1.6"/>
<text x="65" y="462" font-size="15" fill="#222222">a delivery the primary branch already carries, with no row:</text>
<text x="65" y="490" font-size="15" fill="#222222">write the row naming the commit that carries the run's head,</text>
<text x="65" y="518" font-size="15" fill="#222222">then publish and retire as in the head row above</text>
<text x="705" y="462" font-size="15" fill="#222222">the row's promoted revision is that primary commit,</text>
<text x="705" y="490" font-size="15" fill="#222222">so the branch and the run's record agree,</text>
<text x="705" y="518" font-size="15" fill="#222222">and a later complete still finds what landed</text>
</svg>
