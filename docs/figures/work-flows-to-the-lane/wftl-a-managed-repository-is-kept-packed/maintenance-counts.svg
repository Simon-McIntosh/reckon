<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="16cm"
     viewBox="0 0 1244 640" role="img"
     aria-label="Loose objects and pack count in the reckon checkout before and after one scheduled maintenance pass">
  <rect width="1244" height="640" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#333333">
    <!-- one legend for the figure, above both panels -->
    <rect x="432" y="24" width="22" height="14" fill="#929292"/>
    <text x="464" y="37" font-size="19">before the pass</text>
    <rect x="642" y="24" width="22" height="14" fill="#2e8b57"/>
    <text x="674" y="37" font-size="19">after the pass</text>

    <!-- loose objects -->
    <text x="370" y="96" font-size="21" text-anchor="middle">loose objects</text>
    <g font-size="19" text-anchor="end">
      <text x="100" y="526">0</text>
      <text x="100" y="426">2,000</text>
      <text x="100" y="326">4,000</text>
      <text x="100" y="226">6,000</text>
      <text x="100" y="126">8,000</text>
    </g>
    <line x1="110" y1="520" x2="630" y2="520" stroke="#333333" stroke-width="1.5"/>
    <rect x="170" y="184" width="100" height="336" fill="#929292"/>
    <line x1="380" y1="518" x2="480" y2="518" stroke="#2e8b57" stroke-width="4"/>
    <text x="220" y="174" font-size="19" text-anchor="middle" fill="#6f6f6f">6,737</text>
    <text x="430" y="506" font-size="19" text-anchor="middle" fill="#2e8b57">0</text>
    <line x1="110" y1="185" x2="630" y2="185" stroke="#929292" stroke-width="1.5" stroke-dasharray="3 5"/>
    <text x="624" y="177" font-size="19" text-anchor="end" fill="#6f6f6f">gc.auto 6,700</text>
    <g font-size="19" text-anchor="middle" fill="#333333">
      <text x="220" y="552">before</text>
      <text x="430" y="552">after</text>
    </g>

    <!-- packs -->
    <text x="940" y="96" font-size="21" text-anchor="middle">packs</text>
    <g font-size="19" text-anchor="end">
      <text x="720" y="526">0</text>
      <text x="720" y="366">2</text>
      <text x="720" y="206">4</text>
    </g>
    <line x1="730" y1="520" x2="1150" y2="520" stroke="#333333" stroke-width="1.5"/>
    <rect x="790" y="200" width="100" height="320" fill="#929292"/>
    <rect x="1000" y="360" width="100" height="160" fill="#2e8b57"/>
    <text x="840" y="190" font-size="19" text-anchor="middle" fill="#6f6f6f">4</text>
    <text x="1050" y="350" font-size="19" text-anchor="middle" fill="#2e8b57">2</text>
    <g font-size="19" text-anchor="middle" fill="#333333">
      <text x="840" y="552">before</text>
      <text x="1050" y="552">after</text>
    </g>
  </g>
</svg>