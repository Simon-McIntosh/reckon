<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="system-ui, sans-serif" font-size="13" fill="#22303c">
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600">What the scheduler answers decides the launch — and only an answer releases the reservation</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <!-- the record -->
  <rect x="330" y="52" width="300" height="60" rx="6" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="346" y="74" font-weight="600">published reservation (per project)</text>
  <text x="346" y="94" fill="#3c4a58">crew state: job_id 1274051</text>

  <path d="M480,112 L480,148" stroke="#5a6b7b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- the question -->
  <rect x="300" y="150" width="360" height="58" rx="6" fill="#f7f9fc" stroke="#3b4a63" stroke-width="1.5"/>
  <text x="316" y="172" font-weight="600">ask the scheduler about that job</text>
  <text x="316" y="192" font-family="ui-monospace, monospace" fill="#3c4a58">squeue -h -j 1274051 -o %T</text>

  <!-- three branches -->
  <path d="M330,208 L200,236 L200,262" stroke="#5a6b7b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M480,208 L480,262" stroke="#5a6b7b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,208 L760,236 L760,262" stroke="#5a6b7b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- left: answered held -->
  <rect x="30" y="266" width="300" height="132" rx="6" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="46" y="288" font-weight="600">answered — the job is in the system</text>
  <text x="46" y="310" font-family="ui-monospace, monospace" fill="#3c4a58">srun --overlap --jobid=1274051</text>
  <text x="46" y="334" fill="#3c4a58">every worker of the placement becomes a</text>
  <text x="46" y="352" fill="#3c4a58">step inside the one allocation; the steps</text>
  <text x="46" y="370" fill="#3c4a58">never queue, and the roster is the cap.</text>

  <!-- middle: answered left -->
  <rect x="330" y="266" width="300" height="132" rx="6" fill="#fdf6e8" stroke="#9a7b2f" stroke-width="1.5"/>
  <text x="346" y="288" font-weight="600">answered — no such job</text>
  <text x="346" y="310" font-family="ui-monospace, monospace" fill="#3c4a58">srun --partition=all …</text>
  <text x="346" y="334" fill="#3c4a58">the reservation has left the queue, so the</text>
  <text x="346" y="352" fill="#3c4a58">declared wrapping stands and this worker</text>
  <text x="346" y="370" fill="#3c4a58">takes a fresh allocation of its own.</text>

  <!-- right: unanswerable -->
  <rect x="630" y="266" width="300" height="132" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="646" y="288" font-weight="600">could not be asked</text>
  <text x="646" y="308" fill="#5a6b7b">no client on the PATH · non-zero exit ·</text>
  <text x="646" y="326" fill="#5a6b7b">controller silent inside the query's bound</text>
  <text x="646" y="350" fill="#3c4a58">the record stands and the worker still</text>
  <text x="646" y="368" fill="#3c4a58">takes the step: a question that never ran</text>
  <text x="646" y="386" fill="#3c4a58">has said nothing about the job.</text>

  <!-- the former defect -->
  <path d="M700,406 L560,406" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text x="24" y="412" fill="#c0392b">until now an unanswerable query was read as the middle branch (dashed):</text>
  <text x="24" y="428" fill="#c0392b">one allocation per worker, silently, for as long as the query stays unanswerable.</text>
</svg>