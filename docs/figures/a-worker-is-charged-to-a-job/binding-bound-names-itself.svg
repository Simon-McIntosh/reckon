<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 692" width="960" height="692" font-family="system-ui, sans-serif" font-size="13" fill="#22303c">
  <rect x="0" y="0" width="960" height="692" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600">Three candidate bounds are measured; the one that binds names itself in the refusal</text>
  <text x="24" y="48" font-size="12" fill="#5a6b7b">the admission check at the dispatch entry point — each figure shown is the measured value a refusal carries</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L0,6.4 L8,3.2 z" fill="#5a6b7b"/>
    </marker>
  </defs>

  <!-- panel A: the candidates, the binding choice, its two outcomes -->
  <rect x="24" y="76" width="288" height="112" rx="6" fill="#f7f9fc" stroke="#3b4a63" stroke-width="1.5"/>
  <text x="40" y="98" font-weight="600">roster bound</text>
  <text x="40" y="120" font-size="12" fill="#3c4a58">occupancy 2 live runs on the lane</text>
  <text x="40" y="140" font-size="12" fill="#3c4a58">capacity max_concurrent_runs 2</text>
  <text x="40" y="166" font-size="12" font-family="ui-monospace, monospace" fill="#c0392b">2 live runs of 2 max</text>

  <rect x="336" y="76" width="288" height="112" rx="6" fill="#f7f9fc" stroke="#3b4a63" stroke-width="1.5"/>
  <text x="352" y="98" font-weight="600">partition-cores bound</text>
  <text x="352" y="120" font-size="12" fill="#3c4a58">placement --cpus=3, 3 occupants</text>
  <text x="352" y="140" font-size="12" fill="#3c4a58">share --cpus-per-task=1</text>
  <text x="352" y="166" font-size="12" font-family="ui-monospace, monospace" fill="#c0392b">3 of 3 cores admitted (1 per worker)</text>

  <rect x="648" y="76" width="288" height="112" rx="6" fill="#f7f9fc" stroke="#3b4a63" stroke-width="1.5"/>
  <text x="664" y="98" font-weight="600">login-memory bound</text>
  <text x="664" y="120" font-size="12" fill="#3c4a58">memory.current 8.0 GiB</text>
  <text x="664" y="140" font-size="12" fill="#3c4a58">memory.max 64.0 GiB</text>
  <text x="664" y="166" font-size="12" font-family="ui-monospace, monospace" fill="#3c4a58">8.0 GiB of 64.0 GiB resident</text>

  <path d="M168,188 V204" stroke="#5a6b7b" stroke-width="1.4" fill="none"/>
  <path d="M480,188 V204" stroke="#5a6b7b" stroke-width="1.4" fill="none"/>
  <path d="M792,188 V204" stroke="#5a6b7b" stroke-width="1.4" fill="none"/>
  <path d="M168,204 H792" stroke="#5a6b7b" stroke-width="1.4" fill="none"/>
  <path d="M480,204 V214" stroke="#5a6b7b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="210" y="216" width="540" height="66" rx="6" fill="#f7f9fc" stroke="#3b4a63" stroke-width="1.5"/>
  <text x="226" y="238" font-weight="600">binding bound — one reading decides the dispatch</text>
  <text x="226" y="258" font-size="12" fill="#3c4a58">a bound that would refuse the next worker is binding before one that would admit</text>
  <text x="226" y="274" font-size="12" fill="#3c4a58">it; among equals the most nearly spent wins; an unreadable bound never refuses</text>

  <path d="M330,282 V300 H240 V310" stroke="#5a6b7b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,282 V300 H720 V310" stroke="#5a6b7b" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="312" width="380" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="76" y="334" font-weight="600" fill="#c0392b">refused — the node is not dispatchable</text>
  <text x="76" y="354" font-size="12" fill="#3c4a58">the sentence names the bound and its measured value</text>

  <rect x="520" y="312" width="380" height="60" rx="6" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="536" y="334" font-weight="600" fill="#2f6b34">admitted — no refusal</text>
  <text x="536" y="354" font-size="12" fill="#3c4a58">every readable bound has room, so the dispatch proceeds</text>

  <!-- panel B: the utilisation each bound is measured at, per case -->
  <text x="24" y="400" font-weight="600" fill="#3c4a58">the three cases: each bound's measured utilisation, and which one the refusal names</text>

  <line x1="24" y1="440" x2="790" y2="440" stroke="#c0392b" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="796" y="444" font-size="10.5" fill="#c0392b">utilisation 1.0 — spent</text>
  <line x1="24" y1="604" x2="790" y2="604" stroke="#8695a4" stroke-width="1.2"/>

  <!-- case 1: the roster is spent, the placement declares nothing -->
  <rect x="60" y="440" width="30" height="164" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="106" y="440" width="30" height="164" rx="3" fill="#ffffff" stroke="#8695a4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="112" y="526" font-size="12" fill="#8695a4">none</text>
  <rect x="152" y="584" width="30" height="20" rx="3" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="60" y="616" font-size="11" fill="#3c4a58">roster</text>
  <text x="106" y="616" font-size="11" fill="#5a6b7b">cores</text>
  <text x="152" y="616" font-size="11" fill="#3c4a58">memory</text>
  <text x="60" y="634" font-size="11" fill="#3c4a58">ceiling 2, no placement, slice 8 of 64 GiB</text>
  <text x="60" y="650" font-size="11" fill="#c0392b">refuses, naming the roster (2 of 2)</text>

  <!-- case 2: the admitted cores are spent, no ceiling declared -->
  <rect x="360" y="440" width="30" height="164" rx="3" fill="#ffffff" stroke="#8695a4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="366" y="526" font-size="12" fill="#8695a4">none</text>
  <rect x="406" y="440" width="30" height="164" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="452" y="584" width="30" height="20" rx="3" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="360" y="616" font-size="11" fill="#5a6b7b">roster</text>
  <text x="406" y="616" font-size="11" fill="#3c4a58">cores</text>
  <text x="452" y="616" font-size="11" fill="#3c4a58">memory</text>
  <text x="360" y="634" font-size="11" fill="#3c4a58">no ceiling, --cpus=3 --cpus-per-task=1</text>
  <text x="360" y="650" font-size="11" fill="#c0392b">refuses, naming the admitted cores (3 of 3)</text>

  <!-- case 3: every readable bound has room -->
  <rect x="660" y="563" width="30" height="41" rx="3" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <rect x="706" y="563" width="30" height="41" rx="3" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <rect x="752" y="584" width="30" height="20" rx="3" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="660" y="616" font-size="11" fill="#3c4a58">roster</text>
  <text x="706" y="616" font-size="11" fill="#3c4a58">cores</text>
  <text x="752" y="616" font-size="11" fill="#3c4a58">memory</text>
  <text x="660" y="634" font-size="11" fill="#3c4a58">ceiling 4, --cpus=8 --cpus-per-task=2</text>
  <text x="660" y="650" font-size="11" fill="#2f6b34">admitted — no refusal</text>

  <!-- legend -->
  <rect x="24" y="662" width="12" height="12" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="44" y="673" font-size="11" fill="#3c4a58">spent — the bound the refusal names</text>
  <rect x="300" y="662" width="12" height="12" rx="2" fill="#eef7ee" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="320" y="673" font-size="11" fill="#3c4a58">room for one more worker</text>
  <rect x="540" y="662" width="12" height="12" rx="2" fill="#ffffff" stroke="#8695a4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="560" y="673" font-size="11" fill="#3c4a58">no reading — unbounded, unknown or unreadable; never a refusal</text>
</svg>