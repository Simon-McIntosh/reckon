<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title description">
  <title id="title">Consumer-verbs implementation order</title>
  <desc id="description">Sections 2 through 6 land in sequence. The session-capture section also waits for new-work-gets-a-new-worker section 3.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1d3557"/>
    </marker>
  </defs>
  <rect width="1120" height="330" fill="#ffffff"/>
  <text x="48" y="44" font-family="system-ui, sans-serif" font-size="23" font-weight="700" fill="#172033">One owner per surface; one delivery order</text>
  <text x="48" y="73" font-family="system-ui, sans-serif" font-size="15" fill="#334155">The schema is last because it consumes, but does not rename, every earlier interface.</text>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <rect x="48" y="120" width="172" height="82" rx="6" fill="#e8f1fb" stroke="#1d3557" stroke-width="2"/>
    <text x="68" y="151" font-size="18" font-weight="700">§2 · path</text>
    <text x="68" y="178" font-size="14">first</text>

    <rect x="266" y="120" width="172" height="82" rx="6" fill="#e8f1fb" stroke="#1d3557" stroke-width="2"/>
    <text x="286" y="151" font-size="18" font-weight="700">§3 · read verbs</text>
    <text x="286" y="178" font-size="14">owns fields</text>

    <rect x="484" y="120" width="172" height="82" rx="6" fill="#e8f1fb" stroke="#1d3557" stroke-width="2"/>
    <text x="504" y="151" font-size="18" font-weight="700">§4 · repair verbs</text>
    <text x="504" y="178" font-size="14">after §3</text>

    <rect x="702" y="120" width="172" height="82" rx="6" fill="#e8f1fb" stroke="#1d3557" stroke-width="2"/>
    <text x="722" y="151" font-size="18" font-weight="700">§5 · captures</text>
    <text x="722" y="178" font-size="14">after §4</text>

    <rect x="920" y="120" width="152" height="82" rx="6" fill="#fff4d6" stroke="#9a6700" stroke-width="2"/>
    <text x="940" y="151" font-size="18" font-weight="700">§6 · schema</text>
    <text x="940" y="178" font-size="14">last</text>
  </g>
  <g stroke="#1d3557" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M220 161 H259"/>
    <path d="M438 161 H477"/>
    <path d="M656 161 H695"/>
    <path d="M874 161 H913"/>
  </g>
  <rect x="702" y="256" width="172" height="42" rx="6" fill="#f4f0ff" stroke="#6246a8" stroke-width="2"/>
  <text x="717" y="283" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#172033">new-work §3 owns capture</text>
  <path d="M788 256 V211" stroke="#6246a8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="890" y="281" font-family="system-ui, sans-serif" font-size="13" fill="#334155">§5 removes roster writes only</text>
</svg>
