<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Capability matching flow</title>
  <desc id="desc">Task requirements are matched to runtime workers, producing a selected worker without persisting a provider model name.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker>
  </defs>
  <rect x="20" y="48" width="235" height="150" rx="6" fill="#fff" stroke="#334155"/>
  <text x="38" y="78" font-family="system-ui" font-size="16" font-weight="700" fill="#111827">Persisted task request</text>
  <text x="38" y="110" font-family="system-ui" font-size="14" fill="#111827">class: advanced</text>
  <text x="38" y="136" font-family="system-ui" font-size="14" fill="#111827">risk: reversible</text>
  <text x="38" y="162" font-family="system-ui" font-size="14" fill="#111827">verification: full suite</text>
  <line x1="255" y1="123" x2="330" y2="123" stroke="#334155" marker-end="url(#arrow)"/>
  <rect x="332" y="48" width="235" height="150" rx="6" fill="#f8fafc" stroke="#2563eb"/>
  <text x="350" y="78" font-family="system-ui" font-size="16" font-weight="700" fill="#111827">Runtime matcher</text>
  <text x="350" y="110" font-family="system-ui" font-size="14" fill="#111827">advertised capabilities</text>
  <text x="350" y="136" font-family="system-ui" font-size="14" fill="#111827">availability + cost</text>
  <text x="350" y="162" font-family="system-ui" font-size="14" fill="#111827">risk escalation rules</text>
  <line x1="567" y1="123" x2="642" y2="123" stroke="#334155" marker-end="url(#arrow)"/>
  <rect x="644" y="48" width="235" height="150" rx="6" fill="#fff" stroke="#334155"/>
  <text x="662" y="78" font-family="system-ui" font-size="16" font-weight="700" fill="#111827">Selected worker</text>
  <text x="662" y="110" font-family="system-ui" font-size="14" fill="#111827">concrete runtime model</text>
  <text x="662" y="136" font-family="system-ui" font-size="14" fill="#111827">resolved at dispatch</text>
  <text x="662" y="162" font-family="system-ui" font-size="14" fill="#111827">never stored as policy</text>
</svg>
