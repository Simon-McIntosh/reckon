<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="16cm"
     viewBox="0 0 1400 720" font-family="sans-serif" font-size="22">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="430" y="30" width="540" height="60" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/>
  <text x="700" y="58" text-anchor="middle" fill="#222">a live pointer with a promotion mark</text>
  <text x="700" y="82" text-anchor="middle" fill="#222">or a promoted ledger row</text>

  <line x1="700" y1="90" x2="700" y2="126" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gates -->
  <g fill="#f7f7f7" stroke="#6b6b6b" stroke-width="2">
    <rect x="430" y="130" width="540" height="70" rx="6"/>
    <rect x="430" y="240" width="540" height="70" rx="6"/>
    <rect x="430" y="350" width="540" height="70" rx="6"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="700" y="160">workspace on disk, or an</text>
    <text x="700" y="186">unfinished landing journal?</text>
    <text x="700" y="270">worker alive on the host</text>
    <text x="700" y="296">that issued its pid?</text>
    <text x="700" y="380">proved dead, or launched on a</text>
    <text x="700" y="406">node that is not the fleet's?</text>
  </g>

  <line x1="700" y1="200" x2="700" y2="236" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="310" x2="700" y2="346" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- held exits -->
  <g fill="#ffffff" stroke="#929292" stroke-width="2">
    <rect x="1030" y="130" width="340" height="70" rx="6"/>
    <rect x="1030" y="240" width="340" height="70" rx="6"/>
    <rect x="1030" y="350" width="340" height="70" rx="6"/>
    <rect x="1030" y="460" width="340" height="70" rx="6"/>
  </g>
  <g fill="#555" text-anchor="middle" font-size="20">
    <text x="1200" y="160">held: the landing paths</text>
    <text x="1200" y="184">decide the work</text>
    <text x="1200" y="270">held: the worker</text>
    <text x="1200" y="294">is alive</text>
    <text x="1200" y="380">held: nothing here</text>
    <text x="1200" y="404">can read its worker</text>
    <text x="1200" y="490">held: a turn is in</text>
    <text x="1200" y="514">progress</text>
  </g>

  <g stroke="#555" stroke-width="2" marker-end="url(#arrow)">
    <line x1="970" y1="165" x2="1026" y2="165"/>
    <line x1="970" y1="275" x2="1026" y2="275"/>
    <line x1="970" y1="385" x2="1026" y2="385"/>
    <line x1="970" y1="495" x2="1026" y2="495"/>
  </g>
  <g fill="#555" font-size="20" text-anchor="middle">
    <text x="998" y="156">yes</text>
    <text x="998" y="266">yes</text>
    <text x="998" y="376">no</text>
    <text x="998" y="486">yes</text>
  </g>

  <!-- fourth gate, reached when the run is dead or foreign -->
  <line x1="700" y1="420" x2="700" y2="456" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="444" fill="#555" font-size="20">yes</text>
  <rect x="430" y="460" width="540" height="70" rx="6" fill="#f7f7f7" stroke="#6b6b6b" stroke-width="2"/>
  <text x="700" y="490" text-anchor="middle" fill="#222">assistant turn inside the silence</text>
  <text x="700" y="516" text-anchor="middle" fill="#222">window of its newest stream?</text>

  <line x1="700" y1="530" x2="700" y2="576" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="560" fill="#555" font-size="20">no</text>

  <rect x="360" y="580" width="680" height="100" rx="6" fill="#e9f3ec" stroke="#2e8b57" stroke-width="2"/>
  <g fill="#1f6b43" text-anchor="middle">
    <text x="700" y="614">retired: the claim is released and the work is untouched</text>
    <text x="700" y="642" fill="#333">worktree, commits and run records stay on disk,</text>
    <text x="700" y="668" fill="#333">and a later pass finds no pointer to restore</text>
  </g>
</svg>