<svg xmlns="http://www.w3.org/2000/svg" width="31.1cm" height="16cm"
     viewBox="0 0 1400 720" font-family="sans-serif" font-size="22">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- start -->
  <rect x="430" y="30" width="540" height="60" rx="6" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="2"/>
  <text x="700" y="58" text-anchor="middle" fill="#222">a live pointer with a promotion mark</text>
  <text x="700" y="82" text-anchor="middle" fill="#222">or a promoted ledger row</text>

  <line x1="700" y1="90" x2="700" y2="126" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gate 1: the landing paths decide the work -->
  <rect x="430" y="130" width="540" height="70" rx="6" fill="#f7f7f7" stroke="#6b6b6b" stroke-width="2"/>
  <text x="700" y="160" text-anchor="middle" fill="#222">workspace on disk, or an</text>
  <text x="700" y="186" text-anchor="middle" fill="#222">unfinished landing journal?</text>
  <rect x="1030" y="130" width="340" height="70" rx="6" fill="#ffffff" stroke="#929292" stroke-width="2"/>
  <text x="1200" y="160" text-anchor="middle" fill="#555" font-size="20">held: the landing paths</text>
  <text x="1200" y="184" text-anchor="middle" fill="#555" font-size="20">decide the work</text>
  <line x1="970" y1="165" x2="1026" y2="165" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="998" y="156" text-anchor="middle" fill="#555" font-size="20">yes</text>

  <line x1="700" y1="200" x2="700" y2="236" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- gate 2: the host -->
  <rect x="430" y="240" width="540" height="70" rx="6" fill="#f7f7f7" stroke="#6b6b6b" stroke-width="2"/>
  <text x="700" y="270" text-anchor="middle" fill="#222">launched on a node</text>
  <text x="700" y="296" text-anchor="middle" fill="#222">the fleet has left?</text>

  <!-- bypass: a foreign record never consults this host's process table -->
  <path d="M430,275 L370,275 L370,495" fill="none" stroke="#2e8b57" stroke-width="2"/>
  <path d="M370,495 L426,495" fill="none" stroke="#2e8b57" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="250" text-anchor="end" fill="#2e8b57" font-size="20">yes</text>
  <g fill="#2e8b57" font-size="19" text-anchor="middle">
    <text x="200" y="360">its pid answers</text>
    <text x="200" y="384">only there, so this</text>
    <text x="200" y="408">host's table is</text>
    <text x="200" y="432">never asked</text>
  </g>

  <line x1="700" y1="310" x2="700" y2="346" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="334" fill="#555" font-size="20">no</text>

  <!-- gate 3: the local process table -->
  <rect x="430" y="350" width="540" height="70" rx="6" fill="#f7f7f7" stroke="#6b6b6b" stroke-width="2"/>
  <text x="700" y="380" text-anchor="middle" fill="#222">worker alive here, or</text>
  <text x="700" y="406" text-anchor="middle" fill="#222">not proved dead?</text>
  <rect x="1030" y="350" width="340" height="70" rx="6" fill="#ffffff" stroke="#929292" stroke-width="2"/>
  <text x="1200" y="380" text-anchor="middle" fill="#555" font-size="20">held: working, or</text>
  <text x="1200" y="404" text-anchor="middle" fill="#555" font-size="20">unreadable</text>
  <line x1="970" y1="385" x2="1026" y2="385" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="998" y="376" text-anchor="middle" fill="#555" font-size="20">yes</text>

  <line x1="700" y1="420" x2="700" y2="456" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="444" fill="#555" font-size="20">no</text>

  <!-- gate 4: the stream, which is all a foreign worker leaves -->
  <rect x="430" y="460" width="540" height="70" rx="6" fill="#f7f7f7" stroke="#6b6b6b" stroke-width="2"/>
  <text x="700" y="490" text-anchor="middle" fill="#222">assistant turn inside the silence</text>
  <text x="700" y="516" text-anchor="middle" fill="#222">window of its newest stream?</text>
  <rect x="1030" y="460" width="340" height="70" rx="6" fill="#ffffff" stroke="#929292" stroke-width="2"/>
  <text x="1200" y="490" text-anchor="middle" fill="#555" font-size="20">held: a turn is in</text>
  <text x="1200" y="514" text-anchor="middle" fill="#555" font-size="20">progress</text>
  <line x1="970" y1="495" x2="1026" y2="495" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="998" y="486" text-anchor="middle" fill="#555" font-size="20">yes</text>

  <line x1="700" y1="530" x2="700" y2="576" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="560" fill="#555" font-size="20">no</text>

  <rect x="360" y="580" width="680" height="100" rx="6" fill="#e9f3ec" stroke="#2e8b57" stroke-width="2"/>
  <g fill="#1f6b43" text-anchor="middle">
    <text x="700" y="614">retired: the claim is released and the work is untouched</text>
    <text x="700" y="642" fill="#333">worktree, commits and run records stay on disk,</text>
    <text x="700" y="668" fill="#333">and a later pass finds no pointer to restore</text>
  </g>
</svg>