<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#4b5b6b"/></marker></defs>
<rect width="940" height="470" fill="#0f1720"/>
<text x="24" y="34" fill="#e6edf3" font-weight="600" font-size="18">Where a run&#x27;s session id is captured &#x2014; or why it was not</text>
<rect x="40" y="80" width="210" height="96" rx="8" fill="#1b2733" stroke="#4b5b6b"/>
<text x="145" y="106" fill="#e6edf3" text-anchor="middle" font-weight="600">1. dispatch</text>
<text x="145" y="128" fill="#93a1b1" text-anchor="middle" font-size="12">reuse a stored session for</text>
<text x="145" y="145" fill="#93a1b1" text-anchor="middle" font-size="12">this configuration</text>
<rect x="40" y="230" width="210" height="96" rx="8" fill="#1b2733" stroke="#4b5b6b"/>
<text x="145" y="256" fill="#e6edf3" text-anchor="middle" font-weight="600">2. observation</text>
<text x="145" y="278" fill="#93a1b1" text-anchor="middle" font-size="12">fold the run's own stream</text>
<text x="145" y="295" fill="#93a1b1" text-anchor="middle" font-size="12">into its pointer</text>
<rect x="360" y="80" width="230" height="96" rx="8" fill="#2f9e6b" stroke="#2f9e6b"/>
<text x="475" y="106" fill="#e6edf3" text-anchor="middle" font-weight="600">session_id recorded</text>
<text x="475" y="128" fill="#93a1b1" text-anchor="middle" font-size="12">resume is reachable</text>
<rect x="360" y="230" width="230" height="96" rx="8" fill="#b5762a" stroke="#b5762a"/>
<text x="475" y="256" fill="#e6edf3" text-anchor="middle" font-weight="600">session_id_absent</text>
<text x="475" y="278" fill="#93a1b1" text-anchor="middle" font-size="12">point + reason, not a null</text>
<rect x="680" y="80" width="220" height="96" rx="8" fill="#1b2733" stroke="#4b5b6b"/>
<text x="790" y="106" fill="#e6edf3" text-anchor="middle" font-weight="600">resume</text>
<text x="790" y="128" fill="#93a1b1" text-anchor="middle" font-size="12">the session survives everywhere</text>
<rect x="680" y="230" width="220" height="96" rx="8" fill="#1b2733" stroke="#4b5b6b"/>
<text x="790" y="256" fill="#e6edf3" text-anchor="middle" font-weight="600">redispatch remainder</text>
<text x="790" y="278" fill="#93a1b1" text-anchor="middle" font-size="12">after worktree inspection</text>
<rect x="680" y="366" width="220" height="84" rx="8" fill="#1b2733" stroke="#4b5b6b"/>
<text x="790" y="392" fill="#e6edf3" text-anchor="middle" font-weight="600">harness launch or</text>
<text x="790" y="414" fill="#93a1b1" text-anchor="middle" font-size="12">unreadable stream:</text>
<text x="790" y="431" fill="#93a1b1" text-anchor="middle" font-size="12">point named</text>
<path d="M 250 128 L 360 128" stroke="#4b5b6b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 250 278 L 360 278" stroke="#4b5b6b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 590 128 L 680 128" stroke="#4b5b6b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 475 176 L 475 230" stroke="#4b5b6b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 590 278 L 680 278" stroke="#4b5b6b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 790 326 L 790 366" stroke="#4b5b6b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="24" y="454" fill="#93a1b1" font-size="12">measured 2026-09-23: 44 of 50 live pointers carried no recorded id; 43 of them had a session id already present in the run&#x27;s own stream</text>
</svg>