<svg xmlns="http://www.w3.org/2000/svg" width="35.56cm" height="18.29cm" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">A due request is replayed after the active sweep</title>
  <desc id="desc">The second request arrives during the first sweep. The second sweep begins immediately after the first finishes and opens the repair and review.</desc>
  <g fill="#20272b" font-family="sans-serif" font-size="27">
    <text x="175" y="145">06:15:39</text><text x="1240" y="145" text-anchor="end">06:15:55 UTC</text>
    <text x="175" y="245">request 1</text><text x="245" y="310">request 2</text>
    <text x="105" y="410">first sweep</text><text x="105" y="535">next sweep</text>
    <text x="730" y="630" text-anchor="middle">repair resumed</text><text x="1200" y="630" text-anchor="middle">review dispatched</text>
  </g>
  <g stroke="#929292" stroke-width="2">
    <path d="M175 175H1240"/>
    <path d="M175 165V185M1240 165V185"/>
  </g>
  <g fill="#2e8b57" stroke="#2e8b57">
    <circle cx="210" cy="175" r="6"/><circle cx="280" cy="175" r="6"/>
