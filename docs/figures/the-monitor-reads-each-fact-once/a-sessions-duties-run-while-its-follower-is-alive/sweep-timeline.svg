    <circle cx="730" cy="525" r="8"/><circle cx="1200" cy="525" r="8"/>
  </g>
  <g fill="#20272b" font-family="sans-serif" font-size="23">
    <text x="260" y="375">40.156–41.639</text><text x="365" y="500">41.639–54.760</text>
  </g>
</svg>
