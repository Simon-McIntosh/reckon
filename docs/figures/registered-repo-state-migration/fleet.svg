<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">Registered repository migration pipeline</title>
  <desc id="desc">The host mount registry is discovered, each repository is preflighted and migrated independently, then verified with evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker>
  </defs>
  <g font-family="system-ui" fill="#111827">
    <rect x="24" y="72" width="185" height="150" rx="6" fill="#fff" stroke="#334155"/>
    <text x="43" y="103" font-size="16" font-weight="700">Mount registry</text>
    <text x="43" y="135" font-size="14">discover at runtime</text>
    <text x="43" y="161" font-size="14">resolve repo roots</text>
    <text x="43" y="187" font-size="14">no fixed allow-list</text>
    <line x1="209" y1="147" x2="273" y2="147" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="275" y="52" width="210" height="190" rx="6" fill="#f8fafc" stroke="#2563eb"/>
    <text x="294" y="83" font-size="16" font-weight="700">Per-repo preflight</text>
    <text x="294" y="115" font-size="14">branch · commit · dirty paths</text>
    <text x="294" y="141" font-size="14">layout · schema · decisions</text>
    <text x="294" y="167" font-size="14">before snapshot</text>
    <text x="294" y="211" font-size="14" fill="#1d4ed8">pass or explicit defer</text>
    <line x1="485" y1="147" x2="549" y2="147" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="551" y="52" width="210" height="190" rx="6" fill="#fff" stroke="#334155"/>
    <text x="570" y="83" font-size="16" font-weight="700">Atomic migration</text>
    <text x="570" y="115" font-size="14">typed resources</text>
    <text x="570" y="141" font-size="14">distributed state</text>
    <text x="570" y="167" font-size="14">capability conversion</text>
    <text x="570" y="193" font-size="14">reference rewrite</text>
    <line x1="761" y1="147" x2="825" y2="147" stroke="#334155" marker-end="url(#arrow)"/>
    <rect x="827" y="52" width="190" height="190" rx="6" fill="#f8fafc" stroke="#2563eb"/>
    <text x="846" y="83" font-size="16" font-weight="700">Verify + evidence</text>
    <text x="846" y="115" font-size="14">fresh audits</text>
    <text x="846" y="141" font-size="14">static build · tests</text>
    <text x="846" y="167" font-size="14">relationship parity</text>
    <text x="846" y="211" font-size="14" fill="#1d4ed8">ledger terminal state</text>
  </g>
</svg>
