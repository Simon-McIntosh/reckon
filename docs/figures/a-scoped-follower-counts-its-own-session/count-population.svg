<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
  <rect width="760" height="380" fill="#0f1117"/>
  <text x="24" y="34" fill="#e6e6e6" font-size="17" font-weight="600">crew follow --session: the trailing figures over a two-session fixture</text>

  <!-- Fixture -->
  <text x="24" y="70" fill="#9aa4b2" font-size="13">fixture — three live pointers, two sessions</text>

  <rect x="24" y="84" width="330" height="96" rx="8" fill="#161a23" stroke="#2b3240"/>
  <text x="40" y="108" fill="#8fd3ff" font-size="13">session "mine"</text>
  <rect x="40" y="118" width="298" height="24" rx="4" fill="#1d2431"/>
  <text x="52" y="135" fill="#e6e6e6" font-size="12">r-own-work · working</text>
  <text x="300" y="135" fill="#7ddc9b" font-size="12">1w</text>

  <rect x="374" y="84" width="362" height="96" rx="8" fill="#161a23" stroke="#2b3240"/>
  <text x="390" y="108" fill="#ffcf8f" font-size="13">session "peers"</text>
  <rect x="390" y="118" width="330" height="24" rx="4" fill="#1d2431"/>
  <text x="402" y="135" fill="#e6e6e6" font-size="12">r-peer-work · working</text>
  <text x="690" y="135" fill="#7ddc9b" font-size="12">1w</text>
  <rect x="390" y="146" width="330" height="24" rx="4" fill="#1d2431"/>
  <text x="402" y="163" fill="#e6e6e6" font-size="12">r-peer-block · blocked</text>
  <text x="690" y="163" fill="#ff8f8f" font-size="12">1b</text>

  <!-- Before -->
  <text x="24" y="218" fill="#9aa4b2" font-size="13">before the call-site fix — crew follow ignores the session for its counters</text>

  <rect x="24" y="232" width="352" height="52" rx="8" fill="#241a1a" stroke="#5a2f2f"/>
  <text x="40" y="256" fill="#e6e6e6" font-size="13">--session mine</text>
  <text x="40" y="274" fill="#ff8f8f" font-size="12">trailing: 2w · 1b · 0u  (the fleet's)</text>

  <rect x="392" y="232" width="344" height="52" rx="8" fill="#161a23" stroke="#2b3240"/>
  <text x="408" y="256" fill="#e6e6e6" font-size="13">no session</text>
  <text x="408" y="274" fill="#9aa4b2" font-size="12">trailing: 2w · 1b · 0u</text>

  <!-- After -->
  <text x="24" y="322" fill="#9aa4b2" font-size="13">after — the scoped follower re-derives from the same pointers</text>

  <rect x="24" y="336" width="352" height="30" rx="8" fill="#15231a" stroke="#2f5a3a"/>
  <text x="40" y="356" fill="#e6e6e6" font-size="13">--session mine</text>
  <text x="196" y="356" fill="#7ddc9b" font-size="13">1w · 0b · 0u</text>

  <rect x="392" y="336" width="344" height="30" rx="8" fill="#161a23" stroke="#2b3240"/>
  <text x="408" y="356" fill="#e6e6e6" font-size="13">no session → unchanged</text>
  <text x="588" y="356" fill="#9aa4b2" font-size="13">2w · 1b · 0u</text>
</svg>