<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="system-ui, sans-serif" font-size="13">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600">A wallet's pace, bar and reserve resolve once per wallet</text>
  <text x="24" y="52" fill="#555">Four lanes on one wallet hold one allowance, so a figure computed per lane divides it four ways and reports each share as the whole.</text>

  <rect x="24" y="88" width="300" height="150" rx="8" fill="#eef3fb" stroke="#5b7fc0"/>
  <text x="40" y="114" font-size="15" font-weight="600">codex-sub</text>
  <text x="40" y="136" fill="#555">four lanes, one wallet</text>
  <text x="40" y="162" fill="#555">codex, codex-astra,</text>
  <text x="40" y="180" fill="#555">codex-terra, codex-luna</text>
  <line x1="40" y1="194" x2="308" y2="194" stroke="#b9c6dd"/>
  <text x="40" y="214" fill="#333">freshest member: codex-astra (age 0 s)</text>
  <text x="40" y="232" fill="#333">5 h 14% · 7 d 31% · resets in 124 h</text>

  <text x="336" y="150" fill="#555" font-size="12">group_figures("codex-sub")</text>
  <line x1="328" y1="166" x2="378" y2="166" stroke="#7a8291" stroke-width="1.4"/>
  <path d="M378 166 l-8 -4 l0 8 z" fill="#7a8291"/>

  <rect x="392" y="88" width="156" height="150" rx="8" fill="#f6f7f9" stroke="#c8ccd4"/>
  <text x="406" y="114" font-weight="600">pace target</text>
  <text x="406" y="140" fill="#555" font-size="12">utilisation 0.31</text>
  <text x="406" y="158" fill="#555" font-size="12">elapsed 44 h</text>
  <text x="406" y="186" fill="#333" font-size="12">the allowance the</text>
  <text x="406" y="202" fill="#333" font-size="12">wallet may spend in</text>
  <text x="406" y="218" fill="#333" font-size="12">its next window</text>

  <rect x="560" y="88" width="156" height="150" rx="8" fill="#f6f7f9" stroke="#c8ccd4"/>
  <text x="574" y="114" font-weight="600">bar</text>
  <text x="574" y="140" fill="#555" font-size="12">fill 0.14</text>
  <text x="574" y="158" fill="#555" font-size="12">from the 5 h clock</text>
  <text x="574" y="186" fill="#333" font-size="12">0.055 — the</text>
  <text x="574" y="202" fill="#333" font-size="12">threshold a node's</text>
  <text x="574" y="218" fill="#333" font-size="12">score clears</text>

  <rect x="728" y="88" width="148" height="150" rx="8" fill="#f6f7f9" stroke="#c8ccd4"/>
  <text x="742" y="114" font-weight="600">reserve</text>
  <text x="742" y="140" fill="#555" font-size="12">20% of the window</text>
  <text x="742" y="186" fill="#333" font-size="12">withheld before</text>
  <text x="742" y="202" fill="#333" font-size="12">any work, so it</text>
  <text x="742" y="218" fill="#333" font-size="12">holds whatever</text>

  <rect x="24" y="262" width="436" height="68" rx="8" fill="#fbf1f1" stroke="#c06060" stroke-dasharray="5 4"/>
  <text x="40" y="284" fill="#a33" font-weight="600">group_figures("codex-luna") refuses</text>
  <text x="40" y="304" fill="#a33" font-size="12">ValueError: 'codex-luna' is not a declared</text>
  <text x="40" y="320" fill="#a33" font-size="12">budget group — a lane is not a wallet</text>

  <rect x="480" y="262" width="196" height="68" rx="8" fill="#f6f7f9" stroke="#c8ccd4" stroke-dasharray="4 3"/>
  <text x="494" y="284" fill="#555" font-weight="600">codex-orphan</text>
  <text x="494" y="304" fill="#555" font-size="12">no wallet, no figures</text>

  <rect x="692" y="262" width="184" height="68" rx="8" fill="#eef7ee" stroke="#4f8a4f"/>
  <text x="706" y="284" fill="#2f6f2f" font-weight="600">spark-sub</text>
  <text x="706" y="304" fill="#2f6f2f" font-size="12">own clocks, own figures</text>

  <text x="24" y="360" fill="#555" font-size="12">An unread figure is absent rather than zero: a zero fill would read as an empty window.</text>
  <text x="24" y="378" fill="#555" font-size="12">An unobserved wallet reports no fill, bar or pace, and its reserve all the same.</text>
</svg>