<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="system-ui, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>

  <!-- The session lift -->
  <rect x="30" y="185" width="250" height="90" rx="0" fill="none" stroke="#2f5f8a" stroke-width="2.4"/>
  <text x="155" y="220" text-anchor="middle" font-size="20" fill="#2f5f8a">session lift</text>
  <text x="155" y="246" text-anchor="middle" font-size="18" fill="#2f5f8a">codex-sub · s1</text>
  <text x="155" y="268" text-anchor="middle" font-size="18" fill="#2f5f8a">multiple 1.8</text>

  <!-- reader 1: pace row -->
  <rect x="520" y="30" width="450" height="86" rx="0" fill="none" stroke="#2f5f8a" stroke-width="2"/>
  <text x="545" y="62" font-size="20" fill="#1c1c1c">budget.pace_row</text>
  <text x="545" y="88" font-size="18" fill="#404040">records pace.session, pace.lift_id,</text>
  <text x="545" y="108" font-size="18" fill="#404040">and the lifted pace.policy.pace_multiple</text>

  <!-- reader 2: bookend refusal -->
  <rect x="520" y="140" width="450" height="86" rx="0" fill="none" stroke="#2f5f8a" stroke-width="2"/>
  <text x="545" y="172" font-size="20" fill="#1c1c1c">bookend refusal</text>
  <text x="545" y="198" font-size="18" fill="#404040">reads the session off the</text>
  <text x="545" y="218" font-size="18" fill="#404040">pace row it is already handed</text>

  <!-- reader 3: routing verdict -->
  <rect x="520" y="250" width="450" height="86" rx="0" fill="none" stroke="#2f5f8a" stroke-width="2"/>
  <text x="545" y="282" font-size="20" fill="#1c1c1c">routing verdict</text>
  <text x="545" y="308" font-size="18" fill="#404040">judged on the row's clocks;</text>
  <text x="545" y="328" font-size="18" fill="#404040">a moved seven-day reset ends it</text>

  <!-- reader 4: another session's pre-flight -->
  <rect x="520" y="360" width="450" height="74" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="545" y="392" font-size="20" fill="#5a5a5a">another session's pre-flight</text>
  <text x="545" y="418" font-size="18" fill="#5a5a5a">names session_lift, does not apply it</text>

  <!-- arrows -->
  <line x1="280" y1="230" x2="520" y2="73"  stroke="#2f5f8a" stroke-width="2.4"/>
  <line x1="280" y1="230" x2="520" y2="183" stroke="#2f5f8a" stroke-width="2.4"/>
  <line x1="280" y1="230" x2="520" y2="293" stroke="#2f5f8a" stroke-width="2.4"/>
  <line x1="280" y1="230" x2="520" y2="397" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="5 4"/>
</svg>