<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="ui-sans-serif, system-ui, sans-serif" role="img" aria-label="The composed launch argv before and after the fence default turns on, showing that resolution targets the backend binary before the change and the fence binary after it, with the backend command left bare.">
  <rect width="900" height="430" fill="#fbfbfd"/>
  <text x="24" y="34" font-size="19" font-weight="600" fill="#1b1b22">What launch resolution resolves</text>
  <text x="24" y="56" font-size="13" fill="#55555f">The plan's argv[0] is resolved to an absolute path, or the launch refuses before writing anything. The fence makes argv[0] the fence binary.</text>

  <!-- base row -->
  <text x="24" y="104" font-size="14" font-weight="600" fill="#1b1b22">b18b6ce7 &#8212; fence off</text>
  <rect x="24" y="116" width="120" height="30" rx="5" fill="#e8f1ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="40" y="136" font-size="14" font-family="ui-monospace, monospace" fill="#123a6b">codex</text>
  <text x="152" y="136" font-size="13" font-family="ui-monospace, monospace" fill="#55555f">exec --json &#8230;</text>
  <text x="24" y="170" font-size="12.5" fill="#2f6fd0">&#8593; resolved against the launch PATH</text>
  <text x="24" y="194" font-size="12.5" fill="#2f6fd0">backend present &#8594; ACCEPTED, absolute path</text>
  <text x="24" y="212" font-size="12.5" fill="#8a1f1f">backend absent &#8594; REFUSED, naming codex</text>

  <line x1="24" y1="236" x2="876" y2="236" stroke="#d7d7e0"/>

  <!-- integrated row -->
  <text x="24" y="266" font-size="14" font-weight="600" fill="#1b1b22">4dcfb73a &#8212; fence on (d7ba7433)</text>
  <rect x="24" y="278" width="120" height="30" rx="5" fill="#fdf0d8" stroke="#b8791a" stroke-width="2"/>
  <text x="38" y="298" font-size="14" font-family="ui-monospace, monospace" fill="#6b4508">bwrap</text>
  <text x="152" y="298" font-size="13" font-family="ui-monospace, monospace" fill="#55555f">--dev-bind / / &#8230; --</text>
  <rect x="330" y="278" width="120" height="30" rx="5" fill="#f4f4f7" stroke="#9a9aa6" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="344" y="298" font-size="13" fill="#55555f" font-family="ui-monospace, monospace">codex</text>
  <text x="462" y="298" font-size="13" font-family="ui-monospace, monospace" fill="#55555f">exec --json &#8230;</text>
  <text x="24" y="332" font-size="12.5" fill="#6b4508">&#8593; resolved against the launch PATH</text>
  <text x="330" y="332" font-size="12.5" fill="#55555f">&#8593; appended bare, never resolved</text>
  <text x="24" y="358" font-size="12.5" fill="#6b4508">fence binary absent &#8594; REFUSED, naming bwrap as the backend command</text>
  <text x="24" y="376" font-size="12.5" fill="#8a1f1f">backend absent, fence present &#8594; ACCEPTED &#8212; exec-die stream returns</text>

  <text x="330" y="404" font-size="12" fill="#55555f">Measured by a two-probe matrix over PATH overlays, both revisions, probe-launch-path-guard.log</text>
</svg>