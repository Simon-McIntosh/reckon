<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Committed pace rows replay into independent tuning evidence</title>
  <desc id="desc">Committed run files feed the pace derivation and row-held evidence. The report emits the allowance curve, work-class lane split, and hold decisions without opening a stream.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#315c72"/>
    </marker>
    <style>
      .box { fill: #f7fbfc; stroke: #315c72; stroke-width: 2; }
      .accent { fill: #e8f2f4; stroke: #315c72; stroke-width: 2; }
      .output { fill: #fff8e8; stroke: #9a6b16; stroke-width: 2; }
      .label { fill: #173042; font: 600 17px sans-serif; }
      .small { fill: #315c72; font: 14px sans-serif; }
      .line { fill: none; stroke: #315c72; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>

  <rect class="box" x="32" y="46" width="210" height="104" rx="5"/>
  <text class="label" x="52" y="78">Committed run files</text>
  <text class="small" x="52" y="104">docs/state/&lt;project&gt;/runs/</text>
  <text class="small" x="52" y="127">one pace row per completed run</text>

  <rect class="accent" x="302" y="28" width="250" height="140" rx="5"/>
  <text class="label" x="322" y="61">Replay inputs</text>
  <text class="small" x="322" y="88">weekly clock + recorded instant</text>
  <text class="small" x="322" y="111">policy + score + lane + role</text>
  <text class="small" x="322" y="134">hold evidence, if present</text>

  <rect class="accent" x="612" y="28" width="300" height="140" rx="5"/>
  <text class="label" x="632" y="61">Owned recomputation</text>
  <text class="small" x="632" y="88">pace.allowance_for_group()</text>
  <text class="small" x="632" y="111">row evidence validates the hold</text>
  <text class="small" x="632" y="134">no stream or receipt read</text>

  <path class="line" d="M242 98 L302 98"/>
  <path class="line" d="M552 98 L612 98"/>

  <path class="line" d="M762 168 L762 222"/>
  <path class="line" d="M762 222 L180 222 L180 260"/>
  <path class="line" d="M762 222 L480 222 L480 260"/>
  <path class="line" d="M762 222 L780 222 L780 260"/>

  <rect class="output" x="40" y="260" width="280" height="70" rx="5"/>
  <text class="label" x="60" y="290">Allowance curve</text>
  <text class="small" x="60" y="313">every recorded value checked</text>

  <rect class="output" x="340" y="260" width="280" height="70" rx="5"/>
  <text class="label" x="360" y="290">Class split</text>
  <text class="small" x="360" y="313">local versus metered by role</text>

  <rect class="output" x="640" y="260" width="280" height="70" rx="5"/>
  <text class="label" x="660" y="290">Hold decisions</text>
  <text class="small" x="660" y="313">each refusal and its evidence</text>
</svg>
