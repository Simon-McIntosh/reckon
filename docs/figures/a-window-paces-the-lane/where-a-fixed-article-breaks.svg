<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="The five roles the reserve composes a text for, placed on an alphabet strip at their first letter. The vowel cells a, e, i, o and u are shaded: a fixed article in front of a role composes &quot;a implement dispatch is refused&quot; there, and both roles that begin with a vowel, implement and investigate, sit at i and are marked broken. The consonant-initial roles review, verify and test are marked as reading correctly by agreement rather than by construction. A panel below states the fix: every site in reserve.py names the role as the role's role behind a definite article, correct at any letter, and a parametrised case asserts per role that the composed text names its role and puts no a before a vowel-initial one." style="max-width:100%;height:auto">
  <text x="60" y="26" font-size="14" font-weight="bold" fill="#243447">One fixed article agreed with three roles and broke two</text>
  <text x="60" y="46" font-size="11" fill="#55606e">The reserve composes a refusal around the dispatched role. The five roles it names, placed at their first letter:</text>

