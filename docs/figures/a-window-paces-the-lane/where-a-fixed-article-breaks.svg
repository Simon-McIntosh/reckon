  <text x="167" y="114" text-anchor="middle" font-size="12" fill="#7a3527">e</text>
  <rect x="180" y="96" width="22" height="26" fill="#eef1f4" stroke="#c3ccd6"></rect>
  <text x="191" y="114" text-anchor="middle" font-size="12" fill="#243447">f</text>
  <rect x="204" y="96" width="22" height="26" fill="#eef1f4" stroke="#c3ccd6"></rect>
  <text x="215" y="114" text-anchor="middle" font-size="12" fill="#243447">g</text>
