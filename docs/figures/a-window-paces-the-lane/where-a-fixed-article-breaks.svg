  <line x1="263" y1="96" x2="263" y2="88" stroke="#7a3527"></line>
  <line x1="240" y1="88" x2="286" y2="88" stroke="#7a3527"></line>
  <line x1="240" y1="88" x2="240" y2="84" stroke="#7a3527"></line>
  <line x1="286" y1="88" x2="286" y2="84" stroke="#7a3527"></line>
  <text x="236" y="80" text-anchor="end" font-size="12" fill="#7a3527">implement &#10007;</text>
  <text x="290" y="80" font-size="12" fill="#7a3527">&#10007; investigate</text>
  <line x1="479" y1="96" x2="479" y2="84" stroke="#243447"></line>
  <text x="479" y="80" text-anchor="middle" font-size="12" fill="#243447">review</text>
  <line x1="527" y1="96" x2="527" y2="84" stroke="#243447"></line>
  <text x="527" y="80" text-anchor="middle" font-size="12" fill="#243447">test</text>
  <line x1="575" y1="96" x2="575" y2="84" stroke="#243447"></line>
  <text x="575" y="80" text-anchor="middle" font-size="12" fill="#243447">verify</text>

  <text x="60" y="146" font-size="11" fill="#7a3527">&#10007; Both roles that begin with a vowel were broken: a fixed &#8220;a&#8221; composes &#8220;a implement dispatch is refused&#8221;.</text>
  <text x="60" y="162" font-size="11" fill="#243447">&#10003; Three roles read correctly by agreement, not by construction: review, verify and test are consonant-initial, so the same article happened to fit.</text>

  <rect x="60" y="180" width="660" height="92" rx="6" fill="#fbf3ee" stroke="#c07a6b"></rect>
  <text x="76" y="202" font-size="12" font-weight="bold" fill="#7a3527">The fix removes the dependence rather than the instance.</text>
  <text x="76" y="222" font-size="11" fill="#7a3527">All four sites in reckon/crew/reserve.py now name the role as &#8220;the &lt;role&gt; role&#8221; &#8212; a definite article, correct at every letter,</text>
  <text x="76" y="238" font-size="11" fill="#7a3527">so no role&#8217;s initial decides the grammar. A parametrised case asserts it per role: the text names its role,</text>
  <text x="76" y="254" font-size="11" fill="#7a3527">and no vowel-initial role is preceded by &#8220;a&#8221;. It fails at the base revision for implement and investigate.</text>
</svg>