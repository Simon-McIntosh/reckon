  <text x="431" y="114" text-anchor="middle" font-size="12" fill="#243447">p</text>
  <rect x="444" y="96" width="22" height="26" fill="#eef1f4" stroke="#c3ccd6"></rect>
  <text x="455" y="114" text-anchor="middle" font-size="12" fill="#243447">q</text>
  <rect x="468" y="96" width="22" height="26" fill="#eef1f4" stroke="#c3ccd6"></rect>
  <text x="479" y="114" text-anchor="middle" fill="#243447" font-size="12">r</text>
