<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="system-ui, sans-serif" font-size="13">
  <rect width="920" height="600" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="600">Where a node's pace score is read decides which lane it draws</text>
  <text x="24" y="54" fill="#555">The score is the node's declared scope, read through the prescription verdict. A dispatch grants three shared landing paths to every node on a plan;</text>
  <text x="24" y="72" fill="#555">judged after that grant, the plan's own figure topic counts as a second artifact, and a fully prescribed node leaves the band its bar is defined by.</text>

  <text x="24" y="112" font-weight="600">1 · A score lands in one of two regions, and the region picks the decision</text>
  <rect x="84" y="158" width="185" height="36" rx="4" fill="#eef7ee" stroke="#4f8a4f"/>
  <rect x="269" y="158" width="555" height="36" rx="4" fill="#eef3fb" stroke="#5b7fc0"/>
  <text x="94" y="180" fill="#2f5f2f">prescribed band — send-local at every fill, decided before the bar is read</text>
  <text x="814" y="180" fill="#3a5b93" text-anchor="end">above the band — the window's fill and bar decide</text>

  <line x1="84" y1="212" x2="824" y2="212" stroke="#7a8291" stroke-width="1.4"/>
  <g stroke="#7a8291" stroke-width="1.4">
    <line x1="84" y1="212" x2="84" y2="219"/>
    <line x1="269" y1="212" x2="269" y2="219"/>
    <line x1="454" y1="212" x2="454" y2="219"/>
    <line x1="639" y1="212" x2="639" y2="219"/>
    <line x1="824" y1="212" x2="824" y2="219"/>
  </g>
  <g fill="#555" text-anchor="middle">
    <text x="84" y="234">0.00</text>
    <text x="269" y="234">0.25</text>
    <text x="454" y="234">0.50</text>
    <text x="639" y="234">0.75</text>
    <text x="824" y="234">1.00</text>
  </g>
  <text x="454" y="252" fill="#555" text-anchor="middle">open-endedness score — 0.00 is fully prescribed, 1.00 leaves everything to invent</text>

  <circle cx="84" cy="200" r="5" fill="#4f8a4f"/>
  <line x1="84" y1="200" x2="84" y2="158" stroke="#4f8a4f" stroke-width="1.2"/>
  <text x="84" y="140" fill="#2f5f2f" font-weight="600">0.00 — the node's declared scope</text>
  <text x="84" y="126" fill="#555">one artifact, a fence, a gate, a control</text>

  <circle cx="324.5" cy="200" r="5" fill="#c06060"/>
  <line x1="324.5" y1="200" x2="324.5" y2="158" stroke="#c06060" stroke-width="1.2"/>
  <text x="324.5" y="140" fill="#a33" font-weight="600">0.325 — the same node after the shared grant</text>
  <text x="324.5" y="126" fill="#555">the plan's figure topic is counted as a second artifact</text>

  <circle cx="768.5" cy="200" r="5" fill="#5b7fc0"/>
  <line x1="768.5" y1="200" x2="768.5" y2="158" stroke="#5b7fc0" stroke-width="1.2"/>
  <text x="824" y="140" fill="#3a5b93" font-weight="600" text-anchor="end">0.925 — a node four properties short</text>
  <text x="824" y="126" fill="#555" text-anchor="end">nothing here is prescribed, whatever its scope</text>
  <text x="24" y="282" font-weight="600">2 · The bar rises with the window fill, and each score is held against it</text>
  <g stroke="#e2e5ea" stroke-width="1">
    <line x1="84" y1="397.5" x2="824" y2="397.5"/>
    <line x1="84" y1="365.0" x2="824" y2="365.0"/>
    <line x1="84" y1="332.5" x2="824" y2="332.5"/>
  </g>
  <line x1="84" y1="430" x2="824" y2="430" stroke="#7a8291" stroke-width="1.4"/>
  <line x1="84" y1="430" x2="84" y2="300" stroke="#7a8291" stroke-width="1.4"/>
  <path d="M 84.0 430.0 L 121.0 429.1 L 158.0 426.4 L 195.0 422.1 L 232.0 416.5 L 269.0 409.7 L 306.0 401.9 L 343.0 393.4 L 380.0 384.2 L 417.0 374.7 L 454.0 365.0 L 491.0 355.3 L 528.0 345.8 L 565.0 336.6 L 602.0 328.1 L 639.0 320.3 L 676.0 313.5 L 713.0 307.9 L 750.0 303.6 L 787.0 300.9 L 824.0 300.0" fill="none" stroke="#4a5568" stroke-width="2"/>
  <line x1="84" y1="397.5" x2="824" y2="397.5" stroke="#4f8a4f" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="818" y="411" fill="#4f8a4f" text-anchor="end">band top 0.25 — a score at or under this is decided by prescription, never by the bar</text>
  <line x1="84" y1="387.8" x2="824" y2="387.8" stroke="#c06060" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="818" y="384" fill="#a33" text-anchor="end">0.325 after the shared grant — held, and sent to a metered lane</text>
  <line x1="84" y1="430" x2="824" y2="430" stroke="#4f8a4f" stroke-width="2.4"/>
  <text x="700" y="425" fill="#2f5f2f" text-anchor="end">0.00 declared — the bar is never consulted for this node</text>
  <line x1="246.8" y1="286" x2="246.8" y2="430" stroke="#7a8291" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="252" y="296" fill="#555">22% five-hour fill — the case the gate measures</text>
  <text x="400" y="330" fill="#4a5568">bar = fill² (3 − 2 × fill): 0.124 at this fill</text>
  <g fill="#555" text-anchor="end">
    <text x="78" y="434">0.00</text>
    <text x="78" y="401">0.25</text>
    <text x="78" y="369">0.50</text>
    <text x="78" y="336">0.75</text>
    <text x="78" y="304">1.00</text>
  </g>
  <g fill="#555" text-anchor="middle">
    <text x="84" y="446">0.0</text>
    <text x="269" y="446">0.25</text>
    <text x="454" y="446">0.50</text>
    <text x="639" y="446">0.75</text>
    <text x="824" y="446">1.0</text>
  </g>
  <text x="454" y="462" fill="#555" text-anchor="middle">window fill — the five-hour position the held lane's own runs reported</text>
  <text x="24" y="492" font-weight="600">3 · Every figure in the row is a reader's output, written once, so the row replays without a stream</text>
  <rect x="24" y="506" width="276" height="72" rx="4" fill="#f6f8fa" stroke="#7a8291"/>
  <text x="36" y="524" font-weight="600">budget.recorded_windows</text>
  <text x="36" y="541" fill="#555">the recorded window readings, from a lane</text>
  <text x="36" y="556" fill="#555">receipt, a rate-limit record or a stream,</text>
  <text x="36" y="571" fill="#555">each carrying its own observation age</text>
  <line x1="300" y1="542" x2="316" y2="542" stroke="#7a8291" stroke-width="1.4"/>
  <polygon points="316,538 322,542 316,546" fill="#7a8291"/>
  <rect x="322" y="506" width="276" height="72" rx="4" fill="#f6f8fa" stroke="#7a8291"/>
  <text x="334" y="524" font-weight="600">budget.group_pace → crew.pace, crew.bar</text>
  <text x="334" y="541" fill="#555">the group's clocks, its allowance with the</text>
  <text x="334" y="556" fill="#555">pace multiple in force, and the bar's own</text>
  <text x="334" y="571" fill="#555">verdict for this node's score and the fill</text>
  <line x1="598" y1="542" x2="614" y2="542" stroke="#7a8291" stroke-width="1.4"/>
  <polygon points="614,538 620,542 614,546" fill="#7a8291"/>
  <rect x="620" y="506" width="276" height="72" rx="4" fill="#f6f8fa" stroke="#7a8291"/>
  <text x="632" y="524" font-weight="600">budget.pace_row</text>
  <text x="632" y="541" fill="#555">the lane, the node, its declared-scope score,</text>
  <text x="632" y="556" fill="#555">the policy, and the hold with the evidence</text>
  <text x="632" y="571" fill="#555">that fired it, and the instant the row was written</text>
</svg>