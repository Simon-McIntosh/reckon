<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="980" height="490" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="600" fill="#111827">Every pace-row field passes through one guarded door</text>
  <text x="24" y="54" fill="#374151">A value the reader cannot use costs its row, never the week: the row reads unmeasured with a reason and the report still returns.</text>

  <!-- left panel: the class -->
  <rect x="24" y="80" width="446" height="272" rx="8" fill="#fffbfb" stroke="#fecaca"/>
  <text x="44" y="106" fill="#991b1b" font-weight="600">before &#8212; the bare conversion (d4eee48b:290)</text>

  <rect x="44" y="120" width="406" height="48" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="247" y="150" text-anchor="middle" font-family="ui-monospace, monospace" fill="#111827">utilisation = float(week["utilisation"])</text>

  <line x1="247" y1="168" x2="247" y2="192" stroke="#9ca3af" marker-end="url(#a)"/>
  <text x="470" y="184" text-anchor="end" fill="#6b7280" font-size="11">None, blank or not a number</text>

  <rect x="44" y="192" width="406" height="52" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="247" y="212" text-anchor="middle" font-family="ui-monospace, monospace" fill="#991b1b">TypeError: float() argument must be a string or a</text>
  <text x="247" y="230" text-anchor="middle" font-family="ui-monospace, monospace" fill="#991b1b">"real number, not 'NoneType'"</text>

  <line x1="247" y1="244" x2="247" y2="268" stroke="#9ca3af" marker-end="url(#a)"/>

  <rect x="44" y="268" width="406" height="60" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="247" y="290" text-anchor="middle" fill="#991b1b" font-weight="600">replay() raises</text>
  <text x="247" y="308" text-anchor="middle" fill="#991b1b">the whole week's report is lost, every healthy row with it</text>

  <!-- right panel: the door -->
  <rect x="510" y="80" width="446" height="272" rx="8" fill="#f7fdfa" stroke="#a7f3d0"/>
  <text x="530" y="106" fill="#065f46" font-weight="600">after &#8212; one reader, two exits</text>

  <rect x="530" y="120" width="406" height="64" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="733" y="142" text-anchor="middle" font-family="ui-monospace, monospace" fill="#111827">_read(row, ("clocks", period, name), _NUMBER,</text>
  <text x="733" y="160" text-anchor="middle" font-family="ui-monospace, monospace" fill="#111827">label=…, missing=…)</text>

  <line x1="733" y1="184" x2="733" y2="206" stroke="#9ca3af"/>
  <line x1="637" y1="206" x2="829" y2="206" stroke="#9ca3af"/>
  <line x1="637" y1="206" x2="637" y2="228" stroke="#9ca3af" marker-end="url(#a)"/>
  <line x1="829" y1="206" x2="829" y2="228" stroke="#9ca3af" marker-end="url(#a)"/>

  <rect x="530" y="228" width="200" height="72" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="630" y="250" text-anchor="middle" fill="#065f46" font-weight="600">a value the kind admits</text>
  <text x="630" y="268" text-anchor="middle" fill="#4b5563">measured; the row replays</text>
  <text x="630" y="284" text-anchor="middle" fill="#4b5563">exactly as recorded</text>

  <rect x="746" y="228" width="190" height="72" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="841" y="250" text-anchor="middle" font-family="ui-monospace, monospace" fill="#92400e" font-size="12">_UnmeasuredAllowance</text>
  <text x="841" y="268" text-anchor="middle" fill="#92400e" font-size="12">"the seven-day clock</text>
  <text x="841" y="284" text-anchor="middle" fill="#92400e" font-size="12">has no utilisation"</text>

  <text x="733" y="328" text-anchor="middle" fill="#065f46">replay() returns: that row is marked unmeasured with its reason,</text>
  <text x="733" y="344" text-anchor="middle" fill="#065f46">and the rows nobody touched still match</text>

  <!-- footer strip -->
  <rect x="24" y="372" width="932" height="90" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="44" y="398" fill="#111827" font-weight="600">The sweep drives the class, not one site: one field damaged at a time on a producer-written row</text>
  <text x="44" y="420" fill="#4b5563">30 row paths &#215; 5 candidates (None &#183; "x" &#183; [] &#183; {} &#183; &#8722;1), minus two skips = 148 cases; the field list comes from the row's own keys.</text>
  <text x="44" y="442" fill="#4b5563">float() and datetime.fromisoformat() occur twice in the module, both inside _read; nothing else converts a row value.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>