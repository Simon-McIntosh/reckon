<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, sans-serif" font-size="13">
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="600">A quota position is read once per declared group</text>
  <text x="24" y="52" fill="#555">Six lanes, two declared wallets. Every connector is a declaration: four codex lanes into one wallet, one lane onto its own, and one lane joining no wallet at all.</text>

  <text x="24" y="92" font-weight="600">Lanes (as read)</text>
  <text x="330" y="92" font-weight="600">Declared group</text>
  <text x="600" y="92" font-weight="600">Group position</text>

  <g stroke="#c8ccd4" stroke-width="1">
    <rect x="24" y="104" width="200" height="30" rx="4" fill="#f6f7f9"/>
    <rect x="24" y="140" width="200" height="30" rx="4" fill="#f6f7f9"/>
    <rect x="24" y="176" width="200" height="30" rx="4" fill="#f6f7f9"/>
    <rect x="24" y="212" width="200" height="30" rx="4" fill="#f6f7f9"/>
    <rect x="24" y="248" width="200" height="30" rx="4" fill="#f6f7f9"/>
    <rect x="24" y="284" width="200" height="30" rx="4" fill="#fbf1f1" stroke="#c06060" stroke-dasharray="4 3"/>
  </g>

  <text x="36" y="124" font-weight="600">codex</text>
  <text x="120" y="124" fill="#555">13% · age 2.4 h</text>
  <text x="36" y="160" font-weight="600">codex-astra</text>
  <text x="150" y="160" fill="#555">14% · age 0 s</text>
  <text x="36" y="196" font-weight="600">codex-terra</text>
  <text x="148" y="196" fill="#555">14% · age 5 min</text>
  <text x="36" y="232" font-weight="600">codex-luna</text>
  <text x="130" y="232" fill="#555">7% · age 6 min</text>
  <text x="36" y="268" font-weight="600">codex-spark</text>
  <text x="130" y="268" fill="#555">88% · age 6.7 d</text>
  <text x="36" y="304" font-weight="600">codex-orphan</text>
  <text x="150" y="304" fill="#a33">undeclared</text>

  <g stroke="#7a8291" stroke-width="1.4" fill="none">
    <path d="M224 119 C 300 119, 330 146, 400 146"/>
    <path d="M224 155 C 300 155, 340 148, 400 150"/>
    <path d="M224 191 C 300 191, 340 152, 400 153"/>
    <path d="M224 227 C 300 227, 340 156, 400 156"/>
    <path d="M224 263 C 300 263, 340 268, 400 268"/>
  </g>
  <path d="M224 299 C 300 299, 340 315, 400 315" stroke="#c06060" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>

  <rect x="400" y="125" width="180" height="46" rx="6" fill="#eef3fb" stroke="#5b7fc0"/>
  <text x="412" y="145" font-weight="600">codex-main</text>
  <text x="412" y="169" fill="#555">four lanes, one wallet</text>

  <rect x="400" y="245" width="180" height="46" rx="6" fill="#eef7ee" stroke="#4f8a4f"/>
  <text x="412" y="265" font-weight="600">spark</text>
  <text x="412" y="282" fill="#555">its own two windows</text>

  <rect x="400" y="298" width="180" height="34" rx="6" fill="#fbf1f1" stroke="#c06060" stroke-dasharray="4 3"/>
  <text x="412" y="320" fill="#a33">ungrouped — joins no wallet</text>

  <g stroke-width="1.6" fill="none">
    <path d="M580 148 L 632 122" stroke="#5b7fc0"/>
    <path d="M580 268 L 632 248" stroke="#4f8a4f"/>
  </g>
  <path d="M580 315 L 632 318" stroke="#c06060" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>

  <rect x="632" y="96" width="244" height="52" rx="6" fill="#ffffff" stroke="#5b7fc0"/>
  <text x="644" y="116" font-weight="600">codex-main position</text>
  <text x="644" y="134" fill="#555">14% from codex-astra, age 0 s — freshest,</text>
  <text x="644" y="148" fill="#555">not the first lane declared</text>

  <rect x="632" y="222" width="244" height="52" rx="6" fill="#ffffff" stroke="#4f8a4f"/>
  <text x="644" y="242" font-weight="600">spark position</text>
  <text x="644" y="260" fill="#555">88%, age 6.7 d — carried with its age,</text>
  <text x="644" y="274" fill="#555">not presented as current</text>

  <rect x="632" y="292" width="244" height="44" rx="6" fill="#ffffff" stroke="#c06060" stroke-dasharray="4 3"/>
  <text x="644" y="310" font-weight="600">no position</text>
  <text x="644" y="326" fill="#555">a lane with no declared wallet has no</text>
  <text x="644" y="338" fill="#555">wallet figure to take a position from</text>

  <text x="24" y="362" font-weight="600">What the position is not</text>
  <text x="24" y="384" fill="#555">No entry point takes a backend name: group_position refuses a lane, so one lane's quarter allowance cannot be reported as the wallet's whole.</text>
  <text x="24" y="404" fill="#555">A group with no ageable reading reports unobserved with no age, never a zero that would read as an instant-fresh figure.</text>

  <g font-size="12" fill="#6b7280">
    <text x="24" y="436">Source: reckon/crew/budget_group.py · tests/test_budget_group.py</text>
  </g>
</svg>