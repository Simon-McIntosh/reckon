<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="600" fill="#111827">Why the composer calls the probe reader for one backend</text>
  <text x="24" y="54" fill="#374151">crew_lanes_view asks _declared_probe_command(settings) per backend; only a non-None command is keyed</text>
  <text x="24" y="72" fill="#374151">by calling _cached_probe_reading(reader=read_probe) — the site that enters the reader seam.</text>

  <!-- decision column -->
  <rect x="24" y="96" width="300" height="46" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="174" y="118" text-anchor="middle" fill="#111827" font-weight="600">command = settings["command"]</text>
  <text x="174" y="134" text-anchor="middle" fill="#4b5563">e.g. codex · claude · clive · ollama</text>

  <line x1="174" y1="142" x2="174" y2="164" stroke="#9ca3af" marker-end="url(#a)"/>
  <rect x="24" y="164" width="300" height="44" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="174" y="184" text-anchor="middle" fill="#111827">empty?</text>
  <text x="174" y="200" text-anchor="middle" fill="#4b5563">→ (None, "backend declares no probe command")</text>

  <line x1="174" y1="208" x2="174" y2="230" stroke="#9ca3af" marker-end="url(#a)"/>
  <rect x="24" y="230" width="300" height="44" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="174" y="250" text-anchor="middle" fill="#111827">dialect_for(command) resolves?</text>
  <text x="174" y="266" text-anchor="middle" fill="#4b5563">no → (None, "dialect declares no quota probe …")</text>

  <line x1="174" y1="274" x2="174" y2="296" stroke="#9ca3af" marker-end="url(#a)"/>
  <rect x="24" y="296" width="300" height="44" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="174" y="316" text-anchor="middle" fill="#111827">dialect owns account surface?</text>
  <text x="174" y="332" text-anchor="middle" fill="#4b5563">read_account_surface overridden</text>

  <!-- branches -->
  <line x1="324" y1="318" x2="386" y2="318" stroke="#9ca3af"/>
  <line x1="386" y1="150" x2="386" y2="390" stroke="#9ca3af"/>
  <line x1="386" y1="150" x2="440" y2="150" stroke="#9ca3af" marker-end="url(#a)"/>
  <line x1="386" y1="270" x2="440" y2="270" stroke="#9ca3af" marker-end="url(#a)"/>
  <line x1="386" y1="390" x2="440" y2="390" stroke="#9ca3af" marker-end="url(#a)"/>

  <!-- branch labels on the left of each arrow -->
  <text x="332" y="142" fill="#6b7280" font-size="11">no</text>
  <text x="332" y="264" fill="#6b7280" font-size="11">no</text>
  <text x="332" y="386" fill="#6b7280" font-size="11">yes</text>

  <!-- outcomes -->
  <rect x="440" y="120" width="516" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="456" y="142" fill="#111827" font-weight="600">(None, "… no quota probe")  →  not keyed</text>
  <text x="456" y="162" fill="#4b5563">the reader seam is NOT entered · probe_status "not_declared"</text>
  <text x="456" y="176" fill="#4b5563" font-size="11">This is the repaired fixture: command "ollama" names no dialect.</text>

  <rect x="440" y="240" width="516" height="60" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="456" y="262" fill="#111827" font-weight="600">probe exchange declared (codex)</text>
  <text x="456" y="282" fill="#4b5563">command keyed → _cached_probe_reading → probe_reader entered</text>

  <rect x="440" y="360" width="516" height="88" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="456" y="382" fill="#111827" font-weight="600">account surface owned (claude · clive)  →  keyed</text>
  <text x="456" y="402" fill="#4b5563">command keyed → _cached_probe_reading → probe_reader entered</text>
  <text x="456" y="422" fill="#991b1b" font-weight="600">This is where the fixture fired: "claude" became a probe carrier</text>
  <text x="456" y="438" fill="#991b1b">when fab092da gave the claude dialect read_account_surface (2026-09-14).</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>