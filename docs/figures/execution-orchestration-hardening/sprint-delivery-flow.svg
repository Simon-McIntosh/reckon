<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Sprint delivery orchestration flow</title>
  <desc id="desc">A sprint is expanded into a dependency graph, routed into isolated worktree workers, integrated by the orchestrator, evidenced, and conservatively cleaned up.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .node { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 16; }
      .gate { fill: #3f1d2e; stroke: #f472b6; stroke-width: 2; rx: 16; }
      .result { fill: #12372a; stroke: #4ade80; stroke-width: 2; rx: 16; }
      .title { fill: #f8fafc; font: 700 20px system-ui, sans-serif; }
      .text { fill: #cbd5e1; font: 15px system-ui, sans-serif; }
      .small { fill: #94a3b8; font: 13px system-ui, sans-serif; }
      .line { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="420" rx="24"/>

  <rect class="node" x="35" y="140" width="190" height="120"/>
  <text class="title" x="130" y="175" text-anchor="middle">Sprint handle</text>
  <text class="text" x="130" y="205" text-anchor="middle">project:S1</text>
  <text class="small" x="130" y="232" text-anchor="middle">plans + dependencies</text>

  <path class="line" d="M225 200 H285"/>
  <rect class="node" x="285" y="110" width="220" height="180"/>
  <text class="title" x="395" y="148" text-anchor="middle">Knowledge DAG</text>
  <text class="text" x="395" y="180" text-anchor="middle">research before</text>
  <text class="text" x="395" y="207" text-anchor="middle">evidence baseline</text>
  <text class="text" x="395" y="234" text-anchor="middle">topological waves</text>
  <text class="small" x="395" y="263" text-anchor="middle">cycles become blockers</text>

  <path class="line" d="M505 200 H565"/>
  <rect class="gate" x="565" y="35" width="235" height="100"/>
  <text class="title" x="682" y="70" text-anchor="middle">Worker A</text>
  <text class="text" x="682" y="99" text-anchor="middle">one-below · worktree</text>
  <rect class="gate" x="565" y="160" width="235" height="100"/>
  <text class="title" x="682" y="195" text-anchor="middle">Worker B</text>
  <text class="text" x="682" y="224" text-anchor="middle">one-below · worktree</text>
  <rect class="gate" x="565" y="285" width="235" height="100"/>
  <text class="title" x="682" y="320" text-anchor="middle">High-risk node</text>
  <text class="text" x="682" y="349" text-anchor="middle">orchestrator capability</text>
  <path class="line" d="M505 180 C535 180 535 85 565 85"/>
  <path class="line" d="M505 200 H565"/>
  <path class="line" d="M505 220 C535 220 535 335 565 335"/>

  <path class="line" d="M800 85 C835 85 835 175 870 175"/>
  <path class="line" d="M800 210 H870"/>
  <path class="line" d="M800 335 C835 335 835 245 870 245"/>
  <rect class="result" x="870" y="120" width="215" height="190"/>
  <text class="title" x="977" y="158" text-anchor="middle">Orchestrator</text>
  <text class="text" x="977" y="190" text-anchor="middle">verify + integrate</text>
  <text class="text" x="977" y="217" text-anchor="middle">resolve conflicts</text>
  <text class="text" x="977" y="244" text-anchor="middle">write evidence/state</text>
  <text class="text" x="977" y="271" text-anchor="middle">prove reachability</text>
  <text class="small" x="977" y="295" text-anchor="middle">then clean worktrees</text>
</svg>
