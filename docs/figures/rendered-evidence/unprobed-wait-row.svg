<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="298" viewBox="0 0 1000 298" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
<rect width="100%" height="100%" fill="#fbfaf6"/>
<text x="18" y="34" font-size="15" fill="#26211c">A row renders what it is given: an unprobed wait is not a slow one</text>
<text x="18" y="56" font-size="11.5" fill="#6d6459">the same three facts reach the row; only the verdict separates a wait nothing is testing</text>
<text x="18" y="114" font-size="13" fill="#8a8073">probe has run, terminal not met</text>
<text x="340" y="140" font-size="13" fill="#33302b">...                          → waiting                        0w· 0b· 0u· 1q       –    –  wait: waiting 0s on scheduler job 42        </text>
<text x="18" y="176" font-size="13" fill="#8a8073">declares a wait nothing can probe</text>
<rect x="938.6" y="187" width="13.2" height="19" fill="#f6d9a8"/>
<text x="910.6" y="215" font-size="11" fill="#9a5b00">unprobed →</text>
<text x="340" y="202" font-size="13" fill="#33302b">...                          → working                        0w· 0b· 0u· 1q       –    –  – observe:                                  </text>
<text x="18" y="238" font-size="13" fill="#8a8073">declares no wait</text>
<text x="340" y="264" font-size="13" fill="#33302b">...                          → working                        0w· 0b· 0u· 1q       –    –                                              </text>
</svg>
