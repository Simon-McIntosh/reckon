<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Warm audit latency and plan parses before and after routing the validation loop through the file memo</title>
  <desc id="desc">Top panel: warm audit median latency is 5.519 seconds before and 0.914 seconds after, with a dashed line at the five-second bound. Bottom panel: from_html parses per warm audit falls from 182 before to 0 after, because each unchanged plan is parsed once and reused.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="130" y="30" font-size="19" font-weight="650">Warm audit after routing the validation loop through the memo</text>

    <text x="130" y="60" font-size="13" font-weight="600" fill="#465269">Median warm latency (seconds), three interleaved runs each arm</text>
    <g font-size="12" fill="#465269">
      <text x="126" y="196">0</text>
      <text x="236" y="196">1</text>
      <text x="346" y="196">2</text>
      <text x="456" y="196">3</text>
      <text x="566" y="196">4</text>
      <text x="676" y="196">5</text>
      <text x="786" y="196">6</text>
    </g>
    <g stroke="#e2e7ef" stroke-width="1">
      <line x1="130" y1="72" x2="130" y2="184"/>
      <line x1="240" y1="72" x2="240" y2="184"/>
      <line x1="350" y1="72" x2="350" y2="184"/>
      <line x1="460" y1="72" x2="460" y2="184"/>
      <line x1="570" y1="72" x2="570" y2="184"/>
      <line x1="680" y1="72" x2="680" y2="184"/>
      <line x1="790" y1="72" x2="790" y2="184"/>
    </g>
    <line x1="680" y1="72" x2="680" y2="184" stroke="#c23b3b" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="686" y="86" font-size="12" fill="#8f2929">5 s bound</text>

    <g font-size="14" font-weight="600">
      <text x="20" y="102">base</text>
      <text x="20" y="148">head</text>
    </g>
    <rect x="130" y="80" width="607" height="26" rx="3" fill="#d9e1ec"/>
    <rect x="130" y="126" width="101" height="26" rx="3" fill="#176b87"/>
    <g font-size="13">
      <text x="745" y="99">base 5.519 (5.33-5.78)</text>
      <text x="239" y="145">head 0.914 (0.83-1.08)</text>
    </g>

    <text x="130" y="252" font-size="13" font-weight="600" fill="#465269">from_html parses per warm audit</text>
    <g font-size="12" fill="#465269">
      <text x="126" y="352">0</text>
      <text x="301" y="352">50</text>
      <text x="476" y="352">100</text>
      <text x="651" y="352">150</text>
      <text x="826" y="352">200</text>
    </g>
    <g stroke="#e2e7ef" stroke-width="1">
      <line x1="130" y1="264" x2="130" y2="340"/>
      <line x1="305" y1="264" x2="305" y2="340"/>
      <line x1="480" y1="264" x2="480" y2="340"/>
      <line x1="655" y1="264" x2="655" y2="340"/>
      <line x1="830" y1="264" x2="830" y2="340"/>
    </g>
    <g font-size="14" font-weight="600">
      <text x="20" y="294">base</text>
      <text x="20" y="336">head</text>
    </g>
    <rect x="130" y="272" width="637" height="26" rx="3" fill="#d9e1ec"/>
    <rect x="130" y="314" width="0" height="26" rx="3" fill="#176b87"/>
    <line x1="130" y1="314" x2="132" y2="340" stroke="#176b87" stroke-width="3"/>
    <g font-size="13">
      <text x="775" y="291">base 182</text>
      <text x="140" y="333">head 0</text>
    </g>

    <g font-size="12">
      <rect x="640" y="18" width="14" height="14" fill="#d9e1ec"/>
      <text x="661" y="30">base 311bfc62</text>
      <rect x="782" y="18" width="14" height="14" fill="#176b87"/>
      <text x="803" y="30">head e2045fc6</text>
    </g>
    <text x="130" y="410" font-size="12" fill="#465269">155 audit findings, identical as sorted sets across all six interleaved runs.</text>
  </g>
</svg>