<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Warm read profile time and memo-hit residual</title>
  <desc id="desc">Horizontal bars compare cProfile cumulative seconds with the estimated residual after reusing existing file and discovery memos. Audit falls from 88.6 to about 4 seconds, roadmap from 19.9 to about 1.2 seconds, and discovery from 27.5 to about 1.5 seconds. A dashed line marks five seconds.</desc>

  <g font-family="system-ui, sans-serif" fill="#172033">
    <line x1="170" y1="270" x2="810" y2="270" stroke="#526071" stroke-width="1"/>
    <g font-size="12" text-anchor="middle">
      <text x="170" y="291">0</text>
      <text x="277" y="291">15</text>
      <text x="383" y="291">30</text>
      <text x="490" y="291">45</text>
      <text x="597" y="291">60</text>
      <text x="703" y="291">75</text>
      <text x="810" y="291">90 s</text>
    </g>
    <text x="490" y="318" font-size="13" text-anchor="middle">cProfile cumulative seconds; nested call times are not additive</text>

    <line x1="206" y1="38" x2="206" y2="270" stroke="#a63828" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="212" y="31" font-size="12" fill="#7f2d22">5 s bound</text>

    <g font-size="15">
      <text x="150" y="82" text-anchor="end">audit</text>
      <text x="150" y="157" text-anchor="end">roadmap summary</text>
      <text x="150" y="232" text-anchor="end">discovery</text>
    </g>

    <g fill="#dce3ea" stroke="#526071" stroke-width="0.8">
      <rect x="170" y="58" width="630" height="34"/>
      <rect x="170" y="133" width="141" height="34"/>
      <rect x="170" y="208" width="196" height="34"/>
    </g>
    <g fill="#1f6f8b">
      <rect x="170" y="58" width="28" height="34"/>
      <rect x="170" y="133" width="9" height="34"/>
      <rect x="170" y="208" width="11" height="34"/>
    </g>

    <g font-size="13">
      <text x="807" y="80">88.6 s profiled</text>
      <text x="318" y="155">19.9 s profiled</text>
      <text x="373" y="230">27.5 s profiled</text>
      <text x="218" y="104" fill="#15566c">memo-hit residual ≈ 4.0 s</text>
      <text x="218" y="179" fill="#15566c">memo-hit residual ≈ 1.2 s</text>
      <text x="218" y="254" fill="#15566c">memo-hit residual ≈ 1.5 s</text>
    </g>
  </g>
</svg>
