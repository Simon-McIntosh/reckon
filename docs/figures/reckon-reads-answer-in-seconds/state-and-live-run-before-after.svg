<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title description">
  <title id="title">Warm audit and roadmap latency before and after state and live-run reuse</title>
  <desc id="description">Paired points show the median of three warmed calls. Audit falls from 15.03 seconds to 8.01 seconds but remains above the five-second bound. Roadmap summary falls from 7.86 seconds to 1.33 seconds and crosses the bound.</desc>
  <rect width="920" height="380" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="92" y="38" font-size="22" font-weight="650">Warm read latency</text>
    <text x="92" y="62" font-size="14">Median of three calls on fleet allocation 1277272</text>
    <line x1="190" y1="305" x2="850" y2="305" stroke="#172033" stroke-width="1"/>
    <g font-size="13" text-anchor="middle">
      <text x="190" y="330">0</text>
      <text x="396" y="330">5</text>
      <text x="603" y="330">10</text>
      <text x="809" y="330">15 s</text>
    </g>
    <g stroke="#d7dde8" stroke-width="1">
      <line x1="190" y1="82" x2="190" y2="305"/>
      <line x1="396" y1="82" x2="396" y2="305"/>
      <line x1="603" y1="82" x2="603" y2="305"/>
      <line x1="809" y1="82" x2="809" y2="305"/>
    </g>
    <line x1="396" y1="82" x2="396" y2="305" stroke="#b5483f" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="406" y="98" font-size="13" fill="#8f302b">5 s bound</text>
    <g font-size="16" font-weight="600">
      <text x="174" y="153" text-anchor="end">Audit</text>
      <text x="174" y="249" text-anchor="end">Roadmap summary</text>
    </g>
    <g stroke="#76839a" stroke-width="3">
      <line x1="520" y1="148" x2="810" y2="148"/>
      <line x1="245" y1="244" x2="514" y2="244"/>
    </g>
    <g fill="#46546d">
      <circle cx="810" cy="148" r="8"/>
      <circle cx="514" cy="244" r="8"/>
    </g>
    <g fill="#087f73">
      <circle cx="520" cy="148" r="9"/>
      <circle cx="245" cy="244" r="9"/>
    </g>
    <g font-size="14">
      <text x="820" y="140" fill="#46546d">before 15.03 s</text>
      <text x="530" y="174" fill="#087f73">after 8.01 s — above bound</text>
      <text x="524" y="236" fill="#46546d">before 7.86 s</text>
      <text x="255" y="270" fill="#087f73">after 1.33 s</text>
    </g>
    <g font-size="13">
      <circle cx="668" cy="350" r="6" fill="#46546d"/>
      <text x="680" y="355">before</text>
      <circle cx="752" cy="350" r="6" fill="#087f73"/>
      <text x="764" y="355">after</text>
    </g>
  </g>
</svg>
