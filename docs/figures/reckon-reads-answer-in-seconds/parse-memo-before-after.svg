<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Warm read latency before and after parse memoization</title>
  <desc id="desc">Audit, roadmap summary and discovery median latencies from three warm calls. Before values are 35.39, 11.82 and 9.71 seconds. After values are 14.58, 7.81 and 0.98 seconds. A line marks five seconds.</desc>
  <rect width="900" height="410" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="110" y="34" font-size="20" font-weight="650">Median warm latency (seconds)</text>
    <g font-size="12" fill="#465269">
      <text x="110" y="382">0</text>
      <text x="290" y="382">10</text>
      <text x="470" y="382">20</text>
      <text x="650" y="382">30</text>
      <text x="830" y="382">40</text>
    </g>
    <g stroke="#d8dee9" stroke-width="1">
      <line x1="110" y1="52" x2="110" y2="360"/>
      <line x1="290" y1="52" x2="290" y2="360"/>
      <line x1="470" y1="52" x2="470" y2="360"/>
      <line x1="650" y1="52" x2="650" y2="360"/>
      <line x1="830" y1="52" x2="830" y2="360"/>
    </g>
    <line x1="200" y1="52" x2="200" y2="360" stroke="#c23b3b" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="206" y="68" font-size="12" fill="#8f2929">5 s</text>

    <g font-size="14" font-weight="600">
      <text x="16" y="113">Audit</text>
      <text x="16" y="213">Roadmap</text>
      <text x="16" y="313">Discovery</text>
    </g>

    <g fill="#d9e1ec">
      <rect x="110" y="82" width="637" height="24" rx="3"/>
      <rect x="110" y="182" width="213" height="24" rx="3"/>
      <rect x="110" y="282" width="175" height="24" rx="3"/>
    </g>
    <g fill="#176b87">
      <rect x="110" y="112" width="262" height="24" rx="3"/>
      <rect x="110" y="212" width="141" height="24" rx="3"/>
      <rect x="110" y="312" width="18" height="24" rx="3"/>
    </g>
    <g font-size="13">
      <text x="754" y="100">before 35.39</text>
      <text x="380" y="130">after 14.58</text>
      <text x="331" y="200">before 11.82</text>
      <text x="259" y="230">after 7.81</text>
      <text x="293" y="300">before 9.71</text>
      <text x="136" y="330">after 0.98</text>
    </g>
    <g font-size="12">
      <rect x="628" y="18" width="14" height="14" fill="#d9e1ec"/>
      <text x="649" y="30">before</text>
      <rect x="720" y="18" width="14" height="14" fill="#176b87"/>
      <text x="741" y="30">after</text>
    </g>
  </g>
</svg>
