<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PROJECT}} — questions</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/state.js"></script>
</head>
<body>

<header class="site-header">
  <div class="logo"><a href="index.html">⚗ {{PROJECT}}</a></div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="sprints.html">Sprints</a>
    <a href="milestones.html">Milestones</a>
    <a href="blockers.html">Blockers</a>
    <a href="questions.html">Questions</a>
    <a href="inventory.html">Inventory</a>
  </nav>
</header>

<main class="wrap wide">

<h1>Open questions</h1>
<div class="meta">
  <span>{{PROJECT}} / questions</span>
  <span> · </span>
  <span>Design questions surfaced by plan audits; resolve on the owning plan.</span>
</div>

<div id="questions-out"><div class="loading">Loading…</div></div>

</main>

<script defer>
(async function () {
  const blob = await loadIndexState();
  const data = blob.data || {};
  if (!data.questions) {
    document.getElementById('questions-out').innerHTML = '<div class="loading">no questions list yet.</div>';
    return;
  }
  function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const out = document.getElementById('questions-out');
  out.innerHTML = data.questions.map(q => {
    const optsHtml = (q.options || []).map(o => `<li>${escapeHtml(o)}</li>`).join('');
    return `<div class="sprint-card">
      <h3>${escapeHtml(q.question)}</h3>
      <div class="sub">${escapeHtml(q.context || '')}</div>
      ${optsHtml ? `<ul>${optsHtml}</ul>` : ''}
      <div class="path">origin: ${escapeHtml(q.origin_path || '')}</div>
    </div>`;
  }).join('');
})();
</script>
</body>
</html>
