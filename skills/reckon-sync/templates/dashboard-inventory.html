<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PROJECT}} — plan inventory</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/state.js"></script>
</head>
<body>

<header class="site-header">
  <div class="logo"><a href="index.html">⚗ {{PROJECT}}</a></div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="sprints.html">Sprints</a>
    <a href="milestones.html">Milestones</a>
    <a href="blockers.html">Blockers</a>
    <a href="questions.html">Questions</a>
    <a href="inventory.html">Inventory</a>
  </nav>
</header>

<main class="wrap wide">

<h1>Inventory</h1>
<div class="meta">
  <span>{{PROJECT}} / inventory</span>
  <span> · </span>
  <span>Every plan with filters by status / milestone / ROI / model tier.</span>
</div>

<div class="filter-row">
  <input id="filter-text" type="search" placeholder="filter by title / slug / summary">
  <label>status <select id="filter-status"><option value="">(all)</option></select></label>
  <label>milestone <select id="filter-ms"><option value="">(all)</option></select></label>
  <label>roi <select id="filter-roi"><option value="">(all)</option></select></label>
  <label>model <select id="filter-mt"><option value="">(all)</option></select></label>
  <button id="filter-clear">clear</button>
  <span class="match-count" id="match-count"></span>
</div>

<table id="inv-table" class="dense">
  <thead><tr>
    <th>Title</th><th>Status</th><th>Milestone</th>
    <th>ROI</th><th>Effort</th><th>Model</th><th>Last touched</th>
  </tr></thead>
  <tbody id="inv-tbody"><tr><td colspan="7" class="loading">Loading…</td></tr></tbody>
</table>

</main>

<script defer>
(async function () {
  const blob = await loadIndexState();
  const data = blob.data || {};
  const plans = data.plans || [];
  function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const tbody = document.getElementById('inv-tbody');
  const tx = document.getElementById('filter-text');
  const stSel = document.getElementById('filter-status');
  const msSel = document.getElementById('filter-ms');
  const roSel = document.getElementById('filter-roi');
  const mtSel = document.getElementById('filter-mt');
  const matchCount = document.getElementById('match-count');

  function populate(sel, key, order) {
    const set = new Set(plans.map(p => p[key]).filter(Boolean));
    const items = order ? order.filter(o => set.has(o)) : [...set].sort();
    for (const v of items) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    }
  }
  populate(stSel, 'status', ['active','pending','blocked','shipped','superseded','abandoned','historical']);
  populate(msSel, 'milestone');
  populate(roSel, 'roi', ['high','mid','low']);
  populate(mtSel, 'model_tier', ['opus','sonnet','haiku']);

  function applyHash() {
    const params = new URLSearchParams(window.location.hash.slice(1));
    if (params.has('status')) stSel.value = params.get('status');
    if (params.has('milestone')) msSel.value = params.get('milestone');
    if (params.has('roi')) roSel.value = params.get('roi');
    if (params.has('mt')) mtSel.value = params.get('mt');
  }
  applyHash();

  function render() {
    const q = (tx.value || '').toLowerCase();
    const filtered = plans.filter(p =>
      (!q || (p.title || '').toLowerCase().includes(q) || (p.slug || '').toLowerCase().includes(q) || (p.summary || '').toLowerCase().includes(q)) &&
      (!stSel.value || p.status === stSel.value) &&
      (!msSel.value || (p.milestone || '').startsWith(msSel.value)) &&
      (!roSel.value || p.roi === roSel.value) &&
      (!mtSel.value || p.model_tier === mtSel.value)
    );
    filtered.sort((a, b) => (b.last_modified || '').localeCompare(a.last_modified || ''));
    matchCount.textContent = `${filtered.length} / ${plans.length}`;
    tbody.innerHTML = filtered.length === 0
      ? '<tr><td colspan="7" class="loading">no plans match the filter.</td></tr>'
      : filtered.map(p => {
        const href = p.curated_slug ? `curated/${encodeURIComponent(p.curated_slug)}.html` : `${encodeURIComponent(p.slug || '')}.html`;
        return `<tr>
          <td><a href="${href}">${escapeHtml(p.title || p.slug || '')}</a><br><span class="path">${escapeHtml(p.summary || '')}</span></td>
          <td><span class="pill s-${p.status}">${p.status}</span></td>
          <td>${p.milestone ? `<span class="pill ms-${escapeHtml(p.milestone)}">${escapeHtml(p.milestone)}</span>` : ''}</td>
          <td>${p.roi ? `<span class="pill r-${p.roi}">${p.roi}</span>` : ''}</td>
          <td>${p.effort ? `<span class="pill e-${p.effort}">${p.effort}</span>` : ''}</td>
          <td>${p.model_tier ? `<span class="pill m-${p.model_tier}">${p.model_tier}</span>` : ''}</td>
          <td class="path">${escapeHtml(p.last_modified || '')}</td>
        </tr>`;
      }).join('');
  }

  tx.addEventListener('input', render);
  for (const sel of [stSel, msSel, roSel, mtSel]) sel.addEventListener('change', render);
  document.getElementById('filter-clear').addEventListener('click', () => {
    tx.value = ''; stSel.value = ''; msSel.value = ''; roSel.value = ''; mtSel.value = '';
    render();
  });
  window.addEventListener('hashchange', () => { applyHash(); render(); });
  render();
})();
</script>
</body>
</html>
