<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="logo"><a href="index.html">⚗ {{PROJECT}}</a></div>
  <nav>
    <a href="index.html">Index</a>
  </nav>
</header>

<main class="wrap">

<h1>{{TITLE}}</h1>
<div class="meta">{{PROJECT}} / explainer · Updated {{DATE}}</div>

<h2>TL;DR</h2>
<p>One paragraph.</p>

<h2>How it works</h2>
<details open>
  <summary>Step 1 — short label</summary>
  <p>Detail.</p>
</details>
<details>
  <summary>Step 2 — short label</summary>

</details>

<h2>Diagram</h2>
<svg viewBox="0 0 600 200" width="100%" style="background:var(--bg-alt);border:1px solid var(--border);border-radius:6px">
  <!-- replace with the actual diagram -->
  <rect x="40"  y="60" width="120" height="80" rx="6" fill="none" stroke="currentColor"/>
  <rect x="240" y="60" width="120" height="80" rx="6" fill="none" stroke="currentColor"/>
  <rect x="440" y="60" width="120" height="80" rx="6" fill="none" stroke="currentColor"/>
  <line x1="160" y1="100" x2="240" y2="100" stroke="currentColor" marker-end="url(#a)"/>
  <line x1="360" y1="100" x2="440" y2="100" stroke="currentColor" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text x="100" y="105" text-anchor="middle">input</text>
  <text x="300" y="105" text-anchor="middle">process</text>
  <text x="500" y="105" text-anchor="middle">output</text>
</svg>

<details><summary>Question two</summary><p>Answer.</p></details>
