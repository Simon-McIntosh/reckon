<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PROJECT}} — milestones</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/state.js"></script>
</head>
<body>

<header class="site-header">
  <div class="logo"><a href="index.html">⚗ {{PROJECT}}</a></div>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="sprints.html">Sprints</a>
    <a href="milestones.html">Milestones</a>
    <a href="blockers.html">Blockers</a>
    <a href="questions.html">Questions</a>
    <a href="inventory.html">Inventory</a>
  </nav>
</header>

<main class="wrap wide">

<h1>Milestones</h1>
<div class="meta">
  <span>{{PROJECT}} / milestones</span>
  <span> · </span>
  <span>Each milestone bundles a phase of the project; evidence cites commits.</span>
</div>

<div id="milestones-out"><div class="loading">Loading milestone state…</div></div>

</main>

<script defer>
(async function () {
  const blob = await loadIndexState();
  const data = blob.data || {};
  if (!data.milestones) {
    document.getElementById('milestones-out').innerHTML = '<div class="loading">No milestones defined yet.</div>';
    return;
  }
  function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Group plans by milestone
  const plans = data.plans || [];
  const byMs = {};
  for (const p of plans) {
    const m = (p.milestone || '').trim();
    if (!m || m === 'N/A') continue;
    const tok = m.match(/M\d+/);
    const key = tok ? tok[0] : m;
    (byMs[key] = byMs[key] || []).push(p);
  }

  const out = document.getElementById('milestones-out');
  out.innerHTML = data.milestones.map(ms => {
    const items = byMs[ms.id] || [];
    items.sort((a, b) => (b.last_modified||'').localeCompare(a.last_modified||''));
    const top = items.slice(0, 12);
    const statusPill = `<span class="pill s-${ms.status}">${escapeHtml(ms.status)}</span>`;
    const evidenceHtml = Array.isArray(ms.evidence)
      ? ms.evidence.map(e => `<li><code>${escapeHtml(e)}</code></li>`).join('')
      : (ms.evidence ? `<li><code>${escapeHtml(ms.evidence)}</code></li>` : '');
    const depHtml = Array.isArray(ms.depends_on) && ms.depends_on.length
      ? `<div class="sub">depends on: ${ms.depends_on.map(escapeHtml).join(', ')}</div>`
      : '';
    return `<div class="sprint-card" id="${escapeHtml(ms.id)}">
      <h3>${escapeHtml(ms.id)} — ${escapeHtml(ms.name)} ${statusPill}</h3>
      ${depHtml}
      <div class="sub">${escapeHtml(ms.description || '')}</div>
      ${evidenceHtml ? `<details><summary>Evidence (${Array.isArray(ms.evidence) ? ms.evidence.length : 1})</summary><ul>${evidenceHtml}</ul></details>` : ''}
      <p>${items.length} plan(s) tagged for this milestone.</p>
      ${top.length === 0 ? '' : `<table class="dense"><thead><tr>
        <th>Plan</th><th>Status</th><th>ROI</th><th>Last touched</th>
      </tr></thead><tbody>${top.map(p => {
        const href = p.curated_slug ? `curated/${encodeURIComponent(p.curated_slug)}.html` : `${encodeURIComponent(p.slug || '')}.html`;
        return `<tr>
          <td><a href="${href}">${escapeHtml(p.title || p.path)}</a></td>
          <td><span class="pill s-${p.status}">${p.status}</span></td>
          <td>${p.roi ? `<span class="pill r-${p.roi}">${p.roi}</span>` : ''}</td>
          <td class="path">${escapeHtml(p.last_modified||'')}</td>
        </tr>`;
      }).join('')}</tbody></table>${items.length > 12 ? `<p><a href="inventory.html#milestone=${encodeURIComponent(ms.id)}">… +${items.length - 12} more</a></p>` : ''}`}
    </div>`;
  }).join('');
})();
</script>
</body>
</html>
