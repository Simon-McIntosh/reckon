# Shipped flight-control defaults — the bottom resolution layer.
#
# Ships in the wheel so a fresh install works with no configuration at all.
# Validated against flight.yaml like every other layer, and reported as the
# `shipped` origin in `reckon flight` provenance.
#
# Deliberately names no provider, no command and no model. The only backend
# defined here is the calling harness itself, which needs none of those; a
# host or project layer adds external backends as its own data.

version: 1
default_backend: native

routing:
  # Dispatch is routed by the picker selection by default. A project layer may
  # set `shadow` to opt out, recording each selection without acting on it, and
  # a single dispatch opts out with `--route deterministic`.
  picker: route

backends:
  native:
    launch: in-harness
    sandbox: worktree-full
    session_reuse: false

# Per-backend rates are deliberately absent here. They are moving provider data,
# so the host layer that declares a concrete backend also declares its rates.

# The operator-home files a dialect's harness reads at startup, so a run's own
# harness home carries the operator's hooks, instruction files and harness
# configuration rather than a bare directory. Keyed by dialect because what a
# worker loads is decided by its harness, not its model: the claude-shaped
# harness reads CLAUDE.md and a settings.json holding its hooks, while a codex
# harness reads AGENTS.md, its config.toml and its rules/ directory and never
# CLAUDE.md. Each entry names a path relative to the operator's harness home
# (``~/.claude`` for claude, ``~/.codex`` for codex) and an optional ``keys``
# filter keeping only those top-level JSON keys. The files are read from the
# operator's home at seed time and are never embedded here. A backend's own
# ``harness_home_files`` entry replaces its dialect's default.
harness_home_files:
  claude:
    - path: settings.json
      keys: [hooks]
    - path: CLAUDE.md
  codex:
    - path: AGENTS.md
    - path: config.toml
    - path: rules

# Files carried into a run's harness home from the operator's HOME DIRECTORY
# rather than from the harness config directory above. ``~/.claude.json`` sits
# in the home directory, not inside ``~/.claude``, and its top-level
# ``mcpServers`` holds the operator's user-scope MCP server declarations; a
# fenced worker whose run harness home lacks it starts with no ``mcp__`` tools.
# The harness writes this file itself, so a run home that already holds one
# keeps its own keys and only the declared keys are merged in.
harness_home_adjacent_files:
  claude:
    - path: .claude.json
      keys: [mcpServers]

roles:
  # Committed ledger p75: 457s across 79 usable implement runs, rounded up.
  implement:
    execution_capable: true
    sandbox: worktree-full
    time_budget: 8m
  # Only two usable cleanup runs exist (p75 906.5s), so retain the conservative
  # fallback until the role has enough observations to derive a stable default.
  cleanup:
    execution_capable: true
    sandbox: worktree-full
    time_budget: 25m
  review:
    execution_capable: false
    sandbox: read-only
    # Committed ledger p75: 189.25s across 10 usable review runs, rounded up.
    time_budget: 4m
  investigate:
    execution_capable: false
    # Repository writes stay withheld; Reckon's run, report and temporary
    # delivery roots remain writable so an investigation can return evidence.
    sandbox: read-only
    # No usable investigate sample yet; use the measured review-class fallback.
    time_budget: 4m
  test:
    execution_capable: true
    sandbox: worktree-full
    # Sized for two runs at the measured 700-900s suite ceiling on this
    # machine: an attribution pass against base plus one against candidate.
    time_budget: 30m
    # "." names this run's own durable report-and-log directory in full (see
    # write_paths in flight.yaml) — never the repository under test — so a
    # test node that declares no write_paths of its own lands its manifest
    # and any log it writes, and nothing else, by contract rather than by
    # orchestrator discipline.
    write_paths:
      - "."
  documentation:
    execution_capable: true
    sandbox: worktree-full

gates:
  enforce: strict
  require_evidence: true
  on_fail: hold
  # A review dimension at or below half its scale is the shape the measured
  # pair took — totals of 79 and 78 each carrying a durability of 5 against
  # 17-to-20 on every other dimension — so half the scale is the floor a fresh
  # install reads a stored score against. Averaging is what made that 5
  # disappear inside a passing total; these floors are what keeps a later one
  # visible as a finding that needs a disposition. A host or project layer
  # retunes any dimension's floor, and omitting a dimension leaves it with no
  # floor at all.
  dimension_floors:
    goal_fidelity: 10
    evidence: 10
    scope_discipline: 10
    durability: 10
    fit: 10
    reuse: 10

# A run is sized to its risk at completion. Source changes earn a review; a
# small source diff whose spec level fixes the done-when earns a light one; a
# node that changes no runtime source is checked by the merged-head gate re-run
# instead. Fifty lines is the ceiling that keeps a light review to a single
# read, and ten minutes is the budget a light review is granted before it
# escalates to a full one.
review:
  tiers:
    light_changed_lines: 50
    light_time_budget: 10m
  # The share of a unit's words an authored plan edit may change and still be
  # covered by the review that read it. A unit that existed in the newest stored
  # review of the plan and whose prose changed by less than this fraction of its
  # own words stays covered; a new section, a changed done-when, a section that
  # became implementable, and a decision or gate change are never covered
  # whatever their size. Reckon-owned: the generated schema does not carry it,
  # and the flight module's own validator checks its shape.
  plan_change_threshold: 0.30

# The plan-review gate ships advisory, whatever every other gate here does: a
# repository adopting reckon carries no stored plan reviews, and an enforced
# gate would refuse its first build before its authors had composed one with
# `reckon crew review-plan`. In report mode a missing or unanswered review is
# recorded on the dispatch result as a warning and the dispatch proceeds;
# `enforce` refuses exactly as the gate's own refusal describes. A host or
# project layer sets `enforce` once its authors review plans as they write them.
plan_review_gate: report

# The ceiling sits at full utilisation, so only a backend that actually reported
# being spent holds a wave; the reserves are what stop a dispatch spending the
# last of a quota and leaving no way to answer a worker that asks for help.
budget:
  utilisation_ceiling_pct: 100
  # Headroom for the stuck-worker escape hatch: a fresh dispatch stops at the
  # ceiling less this, a resume may spend it.
  resume_reserve_pct: 5
  # Headroom for the coordinator that must survive the wave to audit manifests,
  # merge commits and record outcomes. The reported account position already
  # counts coordinator traffic, but reckon cannot see the total, so a wave sized
  # to fill the remaining headroom would crowd the coordinator out and strand
  # every worker's output. Declared, not measured: no coordinator burn rate is
  # recorded on this machine, and a cadence of account-surface readings is what
  # calibrates this later.
  coordinator_reserve_pct: 3
  exhausted_statuses: []
  # The pace derivation's two tunables, applied per declared budget group: the
  # lead time before the weekly reset the group's budget should be gone, and the
  # lean above the linear share. Twelve hours leaves the last window open for
  # the work still queued at the deadline rather than ending the week mid-window;
  # 1.1 is the deliberate bias above linear that keeps a group slightly ahead of
  # its claim on the week. Both are operator data: a host or project layer
  # retunes the curve without a code change.
  drain_lead_hours: 12.0
  pace_multiple: 1.1

fences:
  # A role's time_budget is its default; this is the independent hard ceiling.
  time_budget: 60m
  needs_help_after_failures: 2
  manifest_required: true
  enforce_budget_watchdog: false
  budget_grace_multiple: 1.5
  # Three fleets measure a two-to-six minute promotion beat, and the grace has
  # to outlast the coordinator's own merge, verification at the merged head and
  # promotion rather than fire in the middle of it.
  unreconciled_run_grace: 15m

# A section that has cost three attempts has outgrown the lane its declared
# capability picked, so the node resolves at the raised class instead and the
# dispatch summary says which count caused it. Upward only, so a section whose
# declared capability already sits at or above this level is unchanged.
capability_raise:
  attempts_threshold: 3
  raised_class: orchestrator
  raised_reasoning: deep
  raised_verification: strict

worktree:
  cleanup: conservative
  scratch_min_free_bytes: 5368709120
  scratch_min_free_pct: 10

summary:
  reflex: what-why-how-when
  at: [dispatch, completion, micro-plan, hold]

# The pane's memory of what it rendered. A reader tracking a fleet across
# re-arms wants the rows it just saw, in one dim burst, not an empty pane; the
# caps bound how much of a long session returns with it.
ticker:
  history_rows: 100
  history_window: 4h
