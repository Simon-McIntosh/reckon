id: https://reckon/schema/flight
name: reckon-flight
title: Reckon Flight Control
description: >-
  The tunable surface for worker routing, gate strictness and worker fences.

  This schema constrains the SHAPE of a flight configuration only. Backend
  names, commands, model identifiers and effort levels are user data supplied
  by a configuration file's values; the schema never enumerates them, so no
  concrete model identifier, provider name or relative hierarchy is baked into
  reckon or its generated artifacts.

  Every slot is optional and carries no default, because this one model
  validates a whole resolved configuration and each partial layer that
  contributes to it. Values a fresh install starts from are a data layer of
  their own — `flight-defaults.yaml`, validated against this schema and shipped
  in the wheel — so that resolution can report which layer supplied each key.
  A default living in the model instead would be indistinguishable from a key
  nobody ever set.

license: MIT
default_prefix: flight
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  flight: https://reckon/schema/flight/

imports:
  - linkml:types

# ── Enumerations ────────────────────────────────────────────────────────────
# Only structural vocabulary is closed. Anything naming a provider, a model or
# an effort ladder stays an open string.

enums:
  LaunchMode:
    description: How a worker process for a backend is started.
    permissible_values:
      cli:
        description: Spawned as an external command resolved on PATH.
      in-harness:
        description: Run inside the calling harness; no process is spawned.

  SandboxMode:
    description: The filesystem blast radius granted to a worker.
    permissible_values:
      read-only:
        description: No writes beyond the worker's own manifest file.
      workspace-write:
        description: >-
          Writable workspace. Inherited by child processes, so it breaks test
          runners, builds and anything spawning subprocesses.
      worktree-full:
        description: >-
          Full access, bounded by a detached worktree. The worktree, not the
          sandbox, is the blast-radius boundary.

  GateEnforcement:
    description: How strictly evidence gates are applied.
    permissible_values:
      strict:
        description: A gate without its evidence stops the work it guards.
      advisory:
        description: A missing gate is reported but does not stop work.
      disabled:
        description: >-
          Gates are not evaluated. Spelled out rather than `off`, which YAML
          reads as the boolean false in both this schema and the config files
          it validates.

  GateFailureAction:
    description: What happens to downstream work when a gate fails.
    permissible_values:
      hold:
        description: Downstream work stays visibly closed.
      warn:
        description: Downstream work proceeds with a recorded warning.
      continue:
        description: The failure is recorded and otherwise ignored.

  WorktreeCleanup:
    description: How aggressively finished worktrees are removed.
    permissible_values:
      conservative:
        description: Remove only a clean worktree whose commit is reachable.
      force:
        description: Remove regardless of dirty or unmerged state.
      never:
        description: Leave every worktree in place for manual triage.

  SummaryOccasion:
    description: A point in a worker's life at which it reports.
    permissible_values:
      dispatch:
      completion:
      micro-plan:
      hold:
        description: >-
          A wave that was held before it opened. It reports like a dispatched
          one, because a hold that looks like silence is indistinguishable from
          a crashed orchestrator.

  InputModality:
    description: >-
      A kind of input a backend's model actually receives beside the prompt.
      Closed structural vocabulary: a value names an input channel, never a
      provider, a model or an effort level.
    permissible_values:
      text:
        description: >-
          The prompt and any text the running harness reads for itself. Every
          backend accepts this, so a lane that declares nothing is still
          usable for work that asks only for text.
      image:
        description: >-
          A raster image attached to the prompt and received by the model
          rather than only accepted by the command line. Declared only where
          the attachment reaches the model: a lane whose launcher accepts an
          image flag but whose dialect never forwards it must not declare
          this, because a review composed there answers from the filename and
          the diff and returns a well-formed verdict it could not have formed.

# ── Slots ───────────────────────────────────────────────────────────────────

slots:
  version:
    description: Schema version of this configuration document.
    range: integer
    minimum_value: 1

  placement:
    description: >-
      Optional scheduler placement for this backend's workers. A declared
      placement wraps the launch in the scheduler invocation rather than
      replacing it, so the resolved command, its environment and its stream
      paths are the ones that run. Absent means the login-node launch, which is
      what keeps every backend that declares none behaving exactly as before.
    range: PlacementConfig

  scheduler:
    description: >-
      Scheduler executable the launch is wrapped in. Resolved against the same
      PATH the launch searches, so an unresolvable wrapper is refused before
      launch rather than dying at exec and leaving an empty stream that reads
      as a worker turn.
    required: true

  options:
    description: >-
      Argument strings passed to the scheduler ahead of the resolved command,
      such as a partition and a resource request. User data; the schema names no
      partition and no site.
    multivalued: true

  job_id_probe:
    description: >-
      Argument vector asked which job the launch became, with `{run}` replaced
      by the run id. Read rather than guessed, and declared per backend because
      reckon knows no scheduler's own vocabulary; a probe that answers no
      identifier records why instead of a fabricated id.
    multivalued: true

  requirements:
    description: >-
      Filesystem paths and network endpoints this placement's workers need
      visible from the node the scheduler places them on. Checked before
      launch, so a placement into a partition that cannot see one is refused
      while naming which, rather than failing later in a way that reads as a
      worker defect. A path on per-node storage is refused by name: it exists
      on the dispatcher and not where the worker runs, so it fails silently.
    range: PlacementRequirement
    multivalued: true
    inlined_as_list: true

  state_query:
    description: >-
      Argument vector that asks the scheduler for one job's state, with `{job}`
      replaced by the job id. Declared beside the wrapper it asks, so which
      reporting verb answers a given scheduler is configuration rather than a
      table in reckon's own code, and a wrapper declared without one is a
      placement reckon cannot follow rather than one it silently cannot query.
    multivalued: true

  reason_query:
    description: >-
      Argument vector that asks the scheduler for one job's own reason string,
      with `{job}` replaced by the job id. A job that never started reports why
      here rather than through an exit status the scheduler client never
      produced.
    multivalued: true

  path:
    description: >-
      A filesystem path this placement's workers must be able to see. User
      data; the schema names no site and fixes no layout.
    range: string

  endpoint:
    description: >-
      A network endpoint, given as host and port, this placement's workers must
      be able to reach — the served model and its router are the intended case.
    range: string

  default_backend:
    description: >-
      Name of the backend used when a role does not select one. Must name a key
      of `backends` once every layer has been merged; a name with no backend
      behind it is a configuration error rather than an implicit fallback.

  local_backend:
    description: >-
      Name of the locally served backend selected by `reckon crew dispatch
      --local`. Must name a key of `backends` once every layer has been merged.
      Absent means this host has no declared local worker route.

  review_excluded_backends:
    description: >-
      Names of backends that review routing must never select, whatever lane
      composes the review and whatever backend has already dropped the
      dispatch. A review fallback walks a list of configured backends, so an
      exclusion it can step around is a note rather than a rule; naming a
      backend here removes it from every composed review lane.
    range: string
    multivalued: true

  backends:
    description: >-
      Available worker backends, keyed by a name chosen by whoever writes the
      configuration. The schema fixes no backend names.
    range: BackendConfig
    multivalued: true
    inlined: true

  roles:
    description: >-
      Per-role routing overlays, keyed by role name. A role overrides only the
      keys it names; everything else falls through to its backend.
    range: RoleConfig
    multivalued: true
    inlined: true

  gates:
    range: GateConfig

  budget:
    range: BudgetConfig

  fences:
    range: FenceConfig

  worktree:
    range: WorktreeConfig

  summary:
    range: SummaryConfig

  ticker:
    description: >-
      The follower pane's own memory of what it has rendered. A reader tracking
      a fleet across re-arms wants the rows it just saw restored rather than an
      empty pane; these bounds decide how much of the view comes back.
    range: TickerConfig

  name:
    description: Map key for an inlined entry.
    identifier: true

  launch:
    description: How this backend's workers are started.
    range: LaunchMode

  command:
    description: >-
      Executable name or path looked up on PATH for a `cli` backend. User data;
      the schema never supplies one.

  auth_check:
    description: >-
      Argument vector run to test whether this backend is authenticated, as an
      exit status. Optional, and user data: it is how a provider-specific
      credential check reaches reckon without reckon knowing any provider.
      Availability probing reports the result and never acts on it.
    multivalued: true

  catalog:
    description: >-
      Optional declaration for asking a backend command which models it serves.
      Availability probing runs the declared argument vector and matches the
      configured model against its output; the declaration remains provider-neutral.
    range: CatalogConfig

  endpoints_document:
    description: >-
      Optional path to a document publishing the endpoints this backend's lane
      is currently serving, as JSON with an `endpoints` list. Availability
      probing reads it to report whether the lane can serve rather than only
      that its launcher exists: a document listing at least one endpoint
      reports serving, one listing none reports not-serving, and an absent
      declaration or an unreadable or unparsable document reports unknown.
      User data naming one host's own publication; the schema supplies no path,
      and the probe never reads it over the network.
    range: string

  lane_document:
    description: >-
      Optional path to a document a serving lane publishes, carrying the lane's
      measured state, its remaining headroom, whether a worker binding was
      observed, the stamp the reading was taken at, and the shelf life the lane
      itself suggests the reading stays fresh for. Availability probing reads it
      to report the lane observation beside the serving verdict: a reading older
      than its own suggested shelf life reports unknown while keeping the figure
      and its age, and an absent, unreadable or unparsable document reports
      unknown with a reason and never raises. User data naming one host's own
      publication; the schema supplies no path, and the probe never reads it
      over the network.
    range: string

  list_command:
    description: >-
      Argument vector that prints the models served by this backend. The vector
      is user data and includes the executable.
    multivalued: true

  model_pattern:
    description: >-
      Regular expression used against each catalog output line. The required
      `{model}` placeholder is replaced by the escaped configured model.

  environment:
    description: >-
      Environment variables added when this backend's worker is spawned,
      keyed by variable name. Values are strings and may reference a variable
      from the dispatcher's environment using `${NAME}`.
    range: EnvironmentVariable
    multivalued: true
    inlined: true

  value:
    description: Value associated with an environment-variable name.

  spelling:
    description: The display suffix rendered for an effort level's word.
    range: string

  model:
    description: >-
      Model identifier passed to this backend. User data; free text so that no
      provider vocabulary is encoded here.

  input_modalities:
    description: >-
      Input modalities this backend's model actually receives. Absent means
      undeclared, never "every modality": a lane that does not say it reads
      images is treated as not reading them, so a profile requiring an image
      is refused by name rather than routed here and answered from the
      filename. User data naming the lane's own measured path to the model;
      the schema supplies no value, and a declaration is a claim about the
      delivered input rather than about what the attachment flag accepts.
    range: InputModality
    multivalued: true

  input_rate_per_million:
    description: >-
      Public input-token price per million tokens for the model this backend
      serves, as published on the backend's `as_of` date. Together with the
      output price it is the basis of a notional per-run cost from measured
      tokens, and of the quota weight comparison. Optional operator data;
      absence leaves this backend explicitly unpriced.
    range: float
    minimum_value: 0

  output_rate_per_million:
    description: >-
      Public output-token price per million tokens for the model this backend
      serves, as published on the backend's `as_of` date. Together with the
      input price it is the basis of a notional per-run cost from measured
      tokens, and of the quota weight comparison. Optional operator data;
      absence leaves this backend explicitly unpriced.
    range: float
    minimum_value: 0

  as_of:
    description: >-
      Date on which this backend's per-million rates were published. A rate is
      priced only when dated: one whose `as_of` is older than the declared
      staleness horizon is returned with its age attached rather than silently
      priced as current. Optional operator data; a backend declaring rates
      without a date stays explicitly unpriced.
    range: date

  alias:
    description: >-
      Display label rendered in the fleet pane in place of this backend's model
      identifier. The spelling belongs beside the model it shortens and is
      decided by whoever writes the configuration; the schema supplies none.
    range: string

  effort:
    description: >-
      Reasoning-effort level passed to this backend. Free text because each
      backend defines its own vocabulary, and because an effort ladder must not
      be fixed by reckon.

  effort_spelling:
    description: >-
      Display suffixes for this backend's effort levels, keyed by the effort
      word. A declared spelling replaces the derived two-character suffix; an
      effort with no entry renders its first two characters lowercased. User
      data; the schema enumerates no effort ladder.
    range: EffortSpelling
    multivalued: true
    inlined: true

  sandbox:
    description: Filesystem blast radius granted to workers of this backend.
    range: SandboxMode

  execution_capable:
    description: >-
      Whether this role runs commands that can write build, test, cache or
      product state inside its detached worktree.
    range: boolean

  session_reuse:
    description: Whether a finished worker session can be resumed rather than respawned.
    range: boolean

  metered:
    description: >-
      Whether using this backend consumes a metered provider allowance.
      Optional operator data; absence leaves the backend's meteredness
      undeclared rather than inferring it from the backend name or another
      routing property.
    range: boolean

  budget_check:
    description: >-
      Whether a pre-flight may read this backend's own account-limit surface
      instead of relying on what earlier runs recorded. Off by default, because
      a read that has to be asked for cannot happen by accident, and because a
      backend exposing no such surface reports unknown rather than a guess. It
      is never a model call and consumes no worker budget.
    range: boolean

  usable_input_window:
    description: >-
      Maximum input tokens this backend can hold after any output reservation
      has already been removed. Dispatch compares this declared window with a
      deterministic estimate of the node's standing instructions and named
      repository files before creating a worktree. Absence means unbounded,
      never zero: an unknown ceiling cannot justify refusing work.
    range: integer
    minimum_value: 1

  max_concurrent_runs:
    description: >-
      Maximum live worker runs this backend may carry at once. Dispatch counts
      the non-terminal live pointers claiming this backend and refuses a new
      dispatch that would exceed the ceiling, naming the backend, the ceiling,
      the current count and the occupying run ids. Absent or null means
      unlimited, the default for every backend that does not declare one.
    range: integer
    minimum_value: 1

  fallback:
    description: >-
      Backend to substitute when this one is held on budget. Declared, never
      inferred: a backend naming no fallback still refuses a held dispatch
      exactly as one would with this key absent. The substitution is recorded
      on the run — the backend asked for, the backend used and the hold that
      caused it — so a calibration slice never attributes a fallback run to
      the backend the caller named. A fallback that is itself held still
      refuses; this key does not chain into a search across backends.

  budget_group:
    description: >-
      Name shared by backends that draw on the same account quota. A pool is
      declared, never inferred: identical probe readings or reset times are
      evidence only that two backends were observed the same way, never that
      they share a budget, so a backend with no declared group stays ungrouped
      however alike its siblings read. Optional operator data naming the
      owner's own pool; the schema supplies none.
    range: string

  utilisation_ceiling_pct:
    description: >-
      Reported utilisation, as a percentage, at or above which a wave will not
      open. A backend reporting no headroom is never held by this: absence of a
      signal is not evidence of exhaustion, and a false hold stalls everything
      while a rejected call is cheap and announces itself.
    range: float
    minimum_value: 0
    maximum_value: 100

  resume_reserve_pct:
    description: >-
      Headroom withheld from new dispatches, in percentage points, so a worker
      that stops and asks for help can still be answered in its own session. A
      fresh dispatch stops at the ceiling less this reserve; answering a stuck
      worker may spend it. Spending the last of a quota on a new dispatch
      strands the wave in its worst state — work in flight and no way to unblock
      it.
    range: float
    minimum_value: 0
    maximum_value: 100

  coordinator_reserve_pct:
    description: >-
      Headroom withheld from new dispatches, in percentage points, so the
      coordinator that must survive a wave keeps headroom of its own. The
      reported account position already counts the coordinator's traffic, but
      reckon cannot see the total; a wave sized to fill the remaining headroom
      leaves nothing for the audit, merge and outcome-recording the coordinator
      does after the workers finish, so it can be refused mid-wave with every
      worker's output stranded in a worktree and nobody left to land it. A
      fresh dispatch stops at the ceiling less both this reserve and the resume
      reserve; a resume may spend either, because answering a stuck worker is
      the expenditure the reserves were withheld for. The figure is declared,
      not measured: there is no coordinator burn-rate record on this machine,
      and reading the account surface on a cadence is what calibrates it later.
    range: float
    minimum_value: 0
    maximum_value: 100

  exhausted_statuses:
    description: >-
      Threshold-status values that count as exhausted whatever the utilisation
      reads — the overage question, answered as data so that the schema
      enumerates no backend's vocabulary. Empty leaves the ceiling as the only
      test.
    multivalued: true

  evidence_shelf_life_minutes:
    description: >-
      Minutes a refusal that names no reset time keeps describing the present
      before it is treated as stale and stops holding the wave on its own. Has
      no effect on a refusal that named a reset, since a stated reset is
      stronger evidence than an age and already carries its own expiry. A
      value at or below zero disables ageing and restores an indefinite hold.
    range: float

  time_budget:
    description: >-
      Wall-clock allowance, written as an integer followed by a unit — `s`, `m`
      or `h`. It remains the ceiling that bounds a hang: a process that has
      stopped producing is only caught by elapsed wall clock, never by a token
      count.
    pattern: "^[0-9]+[smh]$"

  history_rows:
    description: >-
      Most rows a follower re-emits as history when it re-arms. A pane restored
      from a long outage should show recent work rather than the whole session,
      so the cap counts rendered rows and is applied with `history_window`,
      whichever admits fewer.
    range: integer
    minimum_value: 1

  history_window:
    description: >-
      Oldest history row a follower re-emits when it re-arms, written as an
      integer followed by a unit — `s`, `m` or `h`. Trimmed against
      `history_rows`, whichever admits fewer, so a quiet session's short log is
      not replayed in full after a long gap.
    pattern: "^[0-9]+[smh]$"

  token_budget:
    description: >-
      Worker allowance denominated in generated output tokens — the quantity
      the same task needs regardless of what else the lane is doing, so a slow
      lane inside its token budget is not an overrun however long it took.
      Written as a bare integer of output tokens. Cannot bound a hang, so the
      wall-clock `time_budget` ceiling stays under its own name.
    range: integer
    minimum_value: 1

  backend:
    description: Backend this role dispatches to. Absent means `default_backend`.

  write_paths:
    description: >-
      Default write scope granted to a node of this role when it declares no
      write_paths of its own. Entries are relative and are resolved against
      the dispatching run's own durable report-and-log directory — the same
      directory `manifest_path` already defaults into — never against the
      repository being worked on. A shipped or host layer therefore names no
      host-specific location, and a role whose entries all stay under that
      directory grants no reach into repository source.
    multivalued: true

  by_spec_level:
    description: >-
      Routing overlays selected by the specification completeness declared for
      a node. An undeclared level applies no overlay.
    range: SpecificationRouting

  exact:
    description: Routing for a node whose implementation is fully prescribed.
    range: RoutingOverlay

  guided:
    description: Routing for a node whose design is fixed but implementation is derived.
    range: RoutingOverlay

  open:
    description: Routing for a node whose design and implementation remain to the worker.
    range: RoutingOverlay

  enforce:
    range: GateEnforcement

  require_evidence:
    description: Whether a gate must produce recorded evidence to be considered met.
    range: boolean

  on_fail:
    range: GateFailureAction

  suite_command:
    description: >-
      Project test-suite command whose presence arms promotion consequence
      checks. Absent means the project is unarmed; no command is supplied by
      shipped defaults.

  needs_help_after_failures:
    description: >-
      Consecutive failures after which a worker stops retrying and asks for
      help. Zero disables the fence.
    range: integer
    minimum_value: 0

  manifest_required:
    description: >-
      Whether a worker must write its manifest to the orchestrator-named path
      before its node counts as delivered.
    range: boolean

  enforce_budget_watchdog:
    description: >-
      Whether observation stops a live CLI worker after its declared time
      budget multiplied by the configured grace. Off by default; classification
      always reports the overrun without mutating the run.
    range: boolean

  budget_grace_multiple:
    description: >-
      Multiple of a run's declared time budget allowed before opt-in watchdog
      enforcement stops it. Values below one would stop before the declared
      allowance elapsed.
    range: float
    minimum_value: 1

  unreconciled_run_grace:
    description: >-
      How long a complete or blocked worker manifest may remain as a live
      pointer before dispatch refuses more work for that project.
    range: string
    pattern: "^[0-9]+[smh]$"

  cleanup:
    range: WorktreeCleanup

  reflex:
    description: The reporting shape a worker follows when it summarises.

  at:
    description: Occasions on which a worker emits a summary.
    range: SummaryOccasion
    multivalued: true

# ── Classes ─────────────────────────────────────────────────────────────────

classes:
  FlightConfig:
    tree_root: true
    description: A complete flight configuration, or one layer of one.
    slots:
      - version
      - default_backend
      - local_backend
      - review_excluded_backends
      - backends
      - roles
      - gates
      - budget
      - fences
      - worktree
      - summary
      - ticker

  BackendConfig:
    description: One worker backend and the routing knobs that apply to it.
    slots:
      - name
      - launch
      - command
      - auth_check
      - catalog
      - endpoints_document
      - lane_document
      - environment
      - model
      - input_modalities
      - input_rate_per_million
      - output_rate_per_million
      - as_of
      - alias
      - effort
      - effort_spelling
      - sandbox
      - session_reuse
      - metered
      - budget_check
      - usable_input_window
      - max_concurrent_runs
      - fallback
      - budget_group
      - time_budget
      - token_budget
      - placement

  PlacementConfig:
    description: >-
      A scheduler wrapper declared for one backend's workers. It describes how
      the launch is wrapped and never what runs: the resolved command stays the
      backend's own, so a placement moves a worker between hosts without
      changing which lane serves it. It also declares what the worker needs
      visible where it lands, and how to ask the wrapper about a job it started.
    slots:
      - scheduler
      - options
      - job_id_probe
      - requirements
      - state_query
      - reason_query

  PlacementRequirement:
    description: >-
      One filesystem path or network endpoint this placement's workers need
      visible from the node they run on. Exactly one of `path` and `endpoint`
      is declared; a requirement naming both or neither is a configuration
      error rather than a check that quietly passes.
    slots:
      - name
      - path
      - endpoint

  CatalogConfig:
    description: Provider-neutral model catalog probe owned by a backend.
    slots:
      - list_command
      - model_pattern

  EnvironmentVariable:
    description: One environment-variable name and its string value.
    slots:
      - name
      - value

  EffortSpelling:
    description: One effort level and its declared display suffix.
    slots:
      - name
      - spelling

  RoleConfig:
    description: >-
      A routing overlay for one kind of node. Every slot is optional; an unset
      slot inherits from the selected backend.
    slots:
      - name
      - backend
      - model
      - effort
      - execution_capable
      - sandbox
      - session_reuse
      - time_budget
      - token_budget
      - write_paths
      - by_spec_level

  SpecificationRouting:
    description: Routing overlays keyed by the closed specification-level vocabulary.
    slots:
      - exact
      - guided
      - open

  RoutingOverlay:
    description: Settings that replace the selected role and backend routing for one level.
    slots:
      - backend
      - model
      - effort
      - time_budget
      - token_budget

  GateConfig:
    description: How evidence gates are enforced.
    slots:
      - enforce
      - require_evidence
      - on_fail
      - suite_command

  BudgetConfig:
    description: >-
      Thresholds that decide whether a wave opens. They are compared against
      whatever a backend actually reported; a backend that reports nothing is
      never held by them.
    slots:
      - utilisation_ceiling_pct
      - resume_reserve_pct
      - coordinator_reserve_pct
      - exhausted_statuses
      - evidence_shelf_life_minutes

  FenceConfig:
    description: Limits a worker applies to itself before asking for help.
    slots:
      - time_budget
      - token_budget
      - needs_help_after_failures
      - manifest_required
      - enforce_budget_watchdog
      - budget_grace_multiple
      - unreconciled_run_grace

  WorktreeConfig:
    description: Worktree lifecycle policy.
    slots:
      - cleanup

  SummaryConfig:
    description: When and how workers report.
    slots:
      - reflex
      - at

  TickerConfig:
    description: >-
      Bounds on the follower pane's own memory. The follower keeps the rows it
      rendered so a re-arm can restore a reader's view rather than opening
      empty; the caps decide how much of that view comes back.
    slots:
      - history_rows
      - history_window
