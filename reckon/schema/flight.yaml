id: https://reckon/schema/flight
name: reckon-flight
title: Reckon Flight Control
description: >-
  The tunable surface for worker routing, gate strictness and worker fences.

  This schema constrains the SHAPE of a flight configuration only. Backend
  names, commands, model identifiers and effort levels are user data supplied
  by a configuration file's values; the schema never enumerates them, so no
  concrete model identifier, provider name or relative hierarchy is baked into
  reckon or its generated artifacts.

  Every slot is optional and carries no default, because this one model
  validates a whole resolved configuration and each partial layer that
  contributes to it. Values a fresh install starts from are a data layer of
  their own — `flight-defaults.yaml`, validated against this schema and shipped
  in the wheel — so that resolution can report which layer supplied each key.
  A default living in the model instead would be indistinguishable from a key
  nobody ever set.

license: MIT
default_prefix: flight
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  flight: https://reckon/schema/flight/

imports:
  - linkml:types

# ── Enumerations ────────────────────────────────────────────────────────────
# Only structural vocabulary is closed. Anything naming a provider, a model or
# an effort ladder stays an open string.

enums:
  LaunchMode:
    description: How a worker process for a backend is started.
    permissible_values:
      cli:
        description: Spawned as an external command resolved on PATH.
      in-harness:
        description: Run inside the calling harness; no process is spawned.

  SandboxMode:
    description: The filesystem blast radius granted to a worker.
    permissible_values:
      read-only:
        description: No writes beyond the worker's own manifest file.
      workspace-write:
        description: >-
          Writable workspace. Inherited by child processes, so it breaks test
          runners, builds and anything spawning subprocesses.
      worktree-full:
        description: >-
          Full access, bounded by a detached worktree. The worktree, not the
          sandbox, is the blast-radius boundary.

  GateEnforcement:
    description: How strictly evidence gates are applied.
    permissible_values:
      strict:
        description: A gate without its evidence stops the work it guards.
      advisory:
        description: A missing gate is reported but does not stop work.
      disabled:
        description: >-
          Gates are not evaluated. Spelled out rather than `off`, which YAML
          reads as the boolean false in both this schema and the config files
          it validates.

  GateFailureAction:
    description: What happens to downstream work when a gate fails.
    permissible_values:
      hold:
        description: Downstream work stays visibly closed.
      warn:
        description: Downstream work proceeds with a recorded warning.
      continue:
        description: The failure is recorded and otherwise ignored.

  WorktreeCleanup:
    description: How aggressively finished worktrees are removed.
    permissible_values:
      conservative:
        description: Remove only a clean worktree whose commit is reachable.
      force:
        description: Remove regardless of dirty or unmerged state.
      never:
        description: Leave every worktree in place for manual triage.

  SummaryOccasion:
    description: A point in a worker's life at which it reports.
    permissible_values:
      dispatch:
      completion:
      micro-plan:
      hold:
        description: >-
          A wave that was held before it opened. It reports like a dispatched
          one, because a hold that looks like silence is indistinguishable from
          a crashed orchestrator.

# ── Slots ───────────────────────────────────────────────────────────────────

slots:
  version:
    description: Schema version of this configuration document.
    range: integer
    minimum_value: 1

  default_backend:
    description: >-
      Name of the backend used when a role does not select one. Must name a key
      of `backends` once every layer has been merged; a name with no backend
      behind it is a configuration error rather than an implicit fallback.

  local_backend:
    description: >-
      Name of the locally served backend selected by `reckon crew dispatch
      --local`. Must name a key of `backends` once every layer has been merged.
      Absent means this host has no declared local worker route.

  backends:
    description: >-
      Available worker backends, keyed by a name chosen by whoever writes the
      configuration. The schema fixes no backend names.
    range: BackendConfig
    multivalued: true
    inlined: true

  roles:
    description: >-
      Per-role routing overlays, keyed by role name. A role overrides only the
      keys it names; everything else falls through to its backend.
    range: RoleConfig
    multivalued: true
    inlined: true

  gates:
    range: GateConfig

  budget:
    range: BudgetConfig

  fences:
    range: FenceConfig

  worktree:
    range: WorktreeConfig

  summary:
    range: SummaryConfig

  name:
    description: Map key for an inlined entry.
    identifier: true

  launch:
    description: How this backend's workers are started.
    range: LaunchMode

  command:
    description: >-
      Executable name or path looked up on PATH for a `cli` backend. User data;
      the schema never supplies one.

  auth_check:
    description: >-
      Argument vector run to test whether this backend is authenticated, as an
      exit status. Optional, and user data: it is how a provider-specific
      credential check reaches reckon without reckon knowing any provider.
      Availability probing reports the result and never acts on it.
    multivalued: true

  catalog:
    description: >-
      Optional declaration for asking a backend command which models it serves.
      Availability probing runs the declared argument vector and matches the
      configured model against its output; the declaration remains provider-neutral.
    range: CatalogConfig

  list_command:
    description: >-
      Argument vector that prints the models served by this backend. The vector
      is user data and includes the executable.
    multivalued: true

  model_pattern:
    description: >-
      Regular expression used against each catalog output line. The required
      `{model}` placeholder is replaced by the escaped configured model.

  environment:
    description: >-
      Environment variables added when this backend's worker is spawned,
      keyed by variable name. Values are strings and may reference a variable
      from the dispatcher's environment using `${NAME}`.
    range: EnvironmentVariable
    multivalued: true
    inlined: true

  value:
    description: Value associated with an environment-variable name.

  model:
    description: >-
      Model identifier passed to this backend. User data; free text so that no
      provider vocabulary is encoded here.

  effort:
    description: >-
      Reasoning-effort level passed to this backend. Free text because each
      backend defines its own vocabulary, and because an effort ladder must not
      be fixed by reckon.

  sandbox:
    description: Filesystem blast radius granted to workers of this backend.
    range: SandboxMode

  execution_capable:
    description: >-
      Whether this role runs commands that can write build, test, cache or
      product state inside its detached worktree.
    range: boolean

  session_reuse:
    description: Whether a finished worker session can be resumed rather than respawned.
    range: boolean

  budget_check:
    description: >-
      Whether a pre-flight may read this backend's own account-limit surface
      instead of relying on what earlier runs recorded. Off by default, because
      a read that has to be asked for cannot happen by accident, and because a
      backend exposing no such surface reports unknown rather than a guess. It
      is never a model call and consumes no worker budget.
    range: boolean

  fallback:
    description: >-
      Backend to substitute when this one is held on budget. Declared, never
      inferred: a backend naming no fallback still refuses a held dispatch
      exactly as one would with this key absent. The substitution is recorded
      on the run — the backend asked for, the backend used and the hold that
      caused it — so a calibration slice never attributes a fallback run to
      the backend the caller named. A fallback that is itself held still
      refuses; this key does not chain into a search across backends.

  utilisation_ceiling_pct:
    description: >-
      Reported utilisation, as a percentage, at or above which a wave will not
      open. A backend reporting no headroom is never held by this: absence of a
      signal is not evidence of exhaustion, and a false hold stalls everything
      while a rejected call is cheap and announces itself.
    range: float
    minimum_value: 0
    maximum_value: 100

  resume_reserve_pct:
    description: >-
      Headroom withheld from new dispatches, in percentage points, so a worker
      that stops and asks for help can still be answered in its own session. A
      fresh dispatch stops at the ceiling less this reserve; answering a stuck
      worker may spend it. Spending the last of a quota on a new dispatch
      strands the wave in its worst state — work in flight and no way to unblock
      it.
    range: float
    minimum_value: 0
    maximum_value: 100

  exhausted_statuses:
    description: >-
      Threshold-status values that count as exhausted whatever the utilisation
      reads — the overage question, answered as data so that the schema
      enumerates no backend's vocabulary. Empty leaves the ceiling as the only
      test.
    multivalued: true

  time_budget:
    description: >-
      Wall-clock allowance, written as an integer followed by a unit — `s`, `m`
      or `h`.
    pattern: "^[0-9]+[smh]$"

  backend:
    description: Backend this role dispatches to. Absent means `default_backend`.

  write_paths:
    description: >-
      Default write scope granted to a node of this role when it declares no
      write_paths of its own. Entries are relative and are resolved against
      the dispatching run's own durable report-and-log directory — the same
      directory `manifest_path` already defaults into — never against the
      repository being worked on. A shipped or host layer therefore names no
      host-specific location, and a role whose entries all stay under that
      directory grants no reach into repository source.
    multivalued: true

  by_spec_level:
    description: >-
      Routing overlays selected by the specification completeness declared for
      a node. An undeclared level applies no overlay.
    range: SpecificationRouting

  exact:
    description: Routing for a node whose implementation is fully prescribed.
    range: RoutingOverlay

  guided:
    description: Routing for a node whose design is fixed but implementation is derived.
    range: RoutingOverlay

  open:
    description: Routing for a node whose design and implementation remain to the worker.
    range: RoutingOverlay

  enforce:
    range: GateEnforcement

  require_evidence:
    description: Whether a gate must produce recorded evidence to be considered met.
    range: boolean

  on_fail:
    range: GateFailureAction

  suite_command:
    description: >-
      Project test-suite command whose presence arms promotion consequence
      checks. Absent means the project is unarmed; no command is supplied by
      shipped defaults.

  needs_help_after_failures:
    description: >-
      Consecutive failures after which a worker stops retrying and asks for
      help. Zero disables the fence.
    range: integer
    minimum_value: 0

  manifest_required:
    description: >-
      Whether a worker must write its manifest to the orchestrator-named path
      before its node counts as delivered.
    range: boolean

  enforce_budget_watchdog:
    description: >-
      Whether observation stops a live CLI worker after its declared time
      budget multiplied by the configured grace. Off by default; classification
      always reports the overrun without mutating the run.
    range: boolean

  budget_grace_multiple:
    description: >-
      Multiple of a run's declared time budget allowed before opt-in watchdog
      enforcement stops it. Values below one would stop before the declared
      allowance elapsed.
    range: float
    minimum_value: 1

  unreconciled_run_grace:
    description: >-
      How long a complete or blocked worker manifest may remain as a live
      pointer before dispatch refuses more work for that project.
    range: string
    pattern: "^[0-9]+[smh]$"

  cleanup:
    range: WorktreeCleanup

  reflex:
    description: The reporting shape a worker follows when it summarises.

  at:
    description: Occasions on which a worker emits a summary.
    range: SummaryOccasion
    multivalued: true

# ── Classes ─────────────────────────────────────────────────────────────────

classes:
  FlightConfig:
    tree_root: true
    description: A complete flight configuration, or one layer of one.
    slots:
      - version
      - default_backend
      - local_backend
      - backends
      - roles
      - gates
      - budget
      - fences
      - worktree
      - summary

  BackendConfig:
    description: One worker backend and the routing knobs that apply to it.
    slots:
      - name
      - launch
      - command
      - auth_check
      - catalog
      - environment
      - model
      - effort
      - sandbox
      - session_reuse
      - budget_check
      - fallback
      - time_budget

  CatalogConfig:
    description: Provider-neutral model catalog probe owned by a backend.
    slots:
      - list_command
      - model_pattern

  EnvironmentVariable:
    description: One environment-variable name and its string value.
    slots:
      - name
      - value

  RoleConfig:
    description: >-
      A routing overlay for one kind of node. Every slot is optional; an unset
      slot inherits from the selected backend.
    slots:
      - name
      - backend
      - model
      - effort
      - execution_capable
      - sandbox
      - session_reuse
      - time_budget
      - write_paths
      - by_spec_level

  SpecificationRouting:
    description: Routing overlays keyed by the closed specification-level vocabulary.
    slots:
      - exact
      - guided
      - open

  RoutingOverlay:
    description: Settings that replace the selected role and backend routing for one level.
    slots:
      - backend
      - model
      - effort
      - time_budget

  GateConfig:
    description: How evidence gates are enforced.
    slots:
      - enforce
      - require_evidence
      - on_fail
      - suite_command

  BudgetConfig:
    description: >-
      Thresholds that decide whether a wave opens. They are compared against
      whatever a backend actually reported; a backend that reports nothing is
      never held by them.
    slots:
      - utilisation_ceiling_pct
      - resume_reserve_pct
      - exhausted_statuses

  FenceConfig:
    description: Limits a worker applies to itself before asking for help.
    slots:
      - time_budget
      - needs_help_after_failures
      - manifest_required
      - enforce_budget_watchdog
      - budget_grace_multiple
      - unreconciled_run_grace

  WorktreeConfig:
    description: Worktree lifecycle policy.
    slots:
      - cleanup

  SummaryConfig:
    description: When and how workers report.
    slots:
      - reflex
      - at
