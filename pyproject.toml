[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "reckon"
dynamic = ["version"]
description = "Repo-agnostic agile planning system — reckon server, MCP transport, and frontend templates"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }]
license = { text = "MIT" }
keywords = ["planning", "agile", "sprint", "reckon", "mcp"]
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.0.0,<9.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
]

[project.scripts]
reckon = "reckon.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["reckon"]
