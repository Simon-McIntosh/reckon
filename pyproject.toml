[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "reckon-plans"
dynamic = ["version"]
description = "Repo-agnostic agile planning system — reckon server, MCP transport, and frontend templates"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }]
license = { text = "MIT" }
license-files = ["LICENSE"]
keywords = ["planning", "agile", "sprint", "reckon", "mcp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.0.0,<9.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "linkml>=1.9",
    "pytest>=8.0",
]

[project.scripts]
reckon = "reckon.cli:main"

[tool.ruff]
# Generated from reckon/schema/flight.yaml. Linting it would invite hand edits
# that desynchronise it from its source; regenerate instead.
extend-exclude = ["reckon/_flight_schema.py"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["reckon"]

[tool.hatch.build.targets.wheel.force-include]
"docs/ui" = "reckon/_assets/ui"
"docs/_shared" = "reckon/_assets/_shared"
"skills" = "reckon/_skills"
